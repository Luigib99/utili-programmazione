<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramma flusso</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --fe: #3b82f6;
    --fe-bg: #0f2547;
    --be: #facc15;
    --be-bg: #3a3008;
    --lost: #f85149;
    --accent: #ffffff;
    --syn-var: #79c0ff;
    --syn-string: #a5d6ff;
    --syn-number: #ffa657;
    --syn-literal: #ff7b72;
    --syn-function: #d2a8ff;
    --syn-type: #56d4dd;
    --syn-file: #8b949e;
    --chat: #d97757;
    --chat-bg: #3d2219;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    margin: 2px 0 0;
    color: var(--muted);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    color: var(--muted);
    font-size: 12px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 14px;
    height: 14px;
    border: 2px solid;
    border-radius: 3px;
  }

  .swatch-line {
    width: 22px;
    height: 0;
    border-top: 2px solid var(--muted);
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--muted);
  }

  button[aria-pressed="true"] {
    border-color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    height: calc(100vh - 74px);
  }

  #diagram {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    overflow: auto;
    padding: 16px;
  }

  #diagram {
    cursor: grab;
  }

  #diagram.panning {
    cursor: grabbing;
    user-select: none;
  }

  #diagram svg {
    display: block;
    flex: none;
  }

  #tracked {
    position: sticky;
    top: 0;
    display: flex;
    flex: none;
    flex-direction: column;
    gap: 12px;
    width: 330px;
    max-height: calc(100vh - 106px);
    overflow: auto;
  }

  #tracked[hidden] {
    display: none;
  }

  .tracked-card {
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .tracked-card h2 {
    margin: 0;
    font-size: 15px;
  }

  .tracked-card .obj {
    margin-top: 10px;
  }

  .diff-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 0 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 4px;
    border-radius: 2px;
  }

  .mark.added,
  .obj .row.added > span {
    background: rgba(46, 160, 67, .28);
  }

  .mark.changed,
  .obj .row.changed > span {
    background: rgba(210, 153, 34, .3);
  }

  .mark.removed,
  .obj .row.removed > span {
    background: rgba(248, 81, 73, .25);
  }

  .obj .row.removed .code {
    text-decoration: line-through;
  }

  /* Una sola colonna: il commento sta sopra la riga che commenta */
  .obj.stacked {
    grid-template-columns: minmax(max-content, 1fr);
  }

  /* width 0 + min-width 100%: il commento va a capo invece di allargare la colonna */
  .obj .row > .note {
    width: 0;
    min-width: 100%;
    padding: 4px 12px 0;
    color: var(--muted);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11.5px;
    white-space: pre-wrap;
  }

  #panel {
    overflow: auto;
    padding: 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      height: auto;
    }

    #panel {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  svg text {
    font-family: inherit;
  }

  .item {
    cursor: pointer;
    transition: opacity .15s;
  }

  .item.dim {
    opacity: .15;
  }

  .node {
    width: 100%;
    height: 100%;
    padding: 8px 14px;
    border: 2px solid;
    border-radius: 10px;
    overflow: hidden;
  }

  .node.FRONTEND {
    background: var(--fe-bg);
    border-color: var(--fe);
  }

  .node.BACKEND {
    background: var(--be-bg);
    border-color: var(--be);
  }

  .item:hover .node {
    filter: brightness(1.25);
  }

  .item.sel .node {
    border-color: var(--accent);
  }

  .node .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
  }

  .node.FRONTEND .tag {
    color: var(--fe);
  }

  .node.BACKEND .tag {
    color: var(--be);
  }

  /* Funzione e file sulla stessa riga, stesso stile: se non ci stanno la riga finisce con "…" invece di andare a capo */
  .node .title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 14px;
    font-weight: 700;
  }

  .node .sep {
    margin: 0 6px;
    color: var(--muted);
  }

  a.code-link {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }

  a.code-link:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 10;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[hidden] {
    display: none;
  }

  #toast code {
    color: var(--syn-file);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  /* Riquadro chiuso: frase semplice in grigio; aperto: versione tecnica */
  .node .breve {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .node .passi {
    margin: 6px 0 0;
    padding-left: 16px;
    font-size: 12.5px;
    line-height: 1.45;
  }

  .node .passi li {
    margin-bottom: 3px;
  }

  .node .passa {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
  }

  .node .toggle {
    float: right;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0;
  }

  .call-kind {
    display: inline-block;
    padding: 2px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-weight: 600;
  }

  #diagram > svg {
    zoom: var(--zoom, 1);
  }

  .node .action {
    margin-top: 2px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
  }

  .edge-label {
    fill: var(--surface-2);
    stroke: var(--border);
  }

  .item.sel .edge-path {
    stroke: var(--accent);
    stroke-width: 3;
  }

  .panel-tag {
    display: inline-block;
    padding: 1px 8px;
    border: 1px solid;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .panel-tag.FRONTEND {
    color: var(--fe);
    border-color: var(--fe);
  }

  .panel-tag.BACKEND {
    color: var(--be);
    border-color: var(--be);
  }

  #panel h2 {
    margin: 10px 0 4px;
    font-size: 17px;
  }

  #panel h3 {
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .route {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .explanation {
    margin: 0;
  }

  /* Colori del codice nei testi: stessi token dell'oggetto (.obj) */
  code .tk-var {
    color: var(--syn-var);
  }

  code .tk-string {
    color: var(--syn-string);
  }

  code .tk-number {
    color: var(--syn-number);
  }

  code .tk-literal {
    color: var(--syn-literal);
  }

  code .tk-function {
    color: var(--syn-function);
  }

  code .tk-type {
    color: var(--syn-type);
  }

  code .tk-file {
    color: var(--syn-file);
  }

  #panel code,
  .node code {
    padding: 0 4px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .terms {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    margin: 0;
    font-size: 13px;
  }

  .terms dt {
    font-weight: 600;
  }

  .terms dd {
    margin: 0;
    color: var(--muted);
  }

  .obj {
    display: grid;
    grid-template-columns: max-content minmax(120px, 1fr);
    overflow-x: auto;
    margin-top: 10px;
    padding: 12px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace;
  }

  .obj .row {
    display: contents;
  }

  .obj .code {
    padding: 2px 12px;
    white-space: pre;
  }

  .obj .row > .c {
    padding: 2px 12px 2px 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .obj .row:hover > span {
    background: var(--surface-2);
  }

  .obj .k {
    color: var(--syn-var);
  }

  .obj .s {
    color: var(--syn-string);
  }

  .obj .n {
    color: var(--syn-number);
  }

  .obj .b {
    color: var(--syn-literal);
  }

  .obj .c {
    color: #7ee787;
  }

  /* RIEPILOGO nel pannello di destra */
  .files {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
  }

  .files li {
    margin-bottom: 4px;
  }

  .howto {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .howto summary {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }

  /* Azioni sul file della mappa, in fondo al riepilogo */
  .azioni-mappa {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .azioni-mappa .pericolo {
    border-color: #f85149;
    color: #ffa198;
  }

  .eliminata {
    margin: 48px;
    color: var(--muted);
    font-size: 15px;
  }

  /* Sezioni del pannello di destra: il titolo le apre e le chiude */
  .sez > h3 {
    cursor: pointer;
    user-select: none;
  }

  .sez > h3::before {
    content: "▾";
    display: inline-block;
    width: 14px;
    transition: transform .15s;
  }

  .sez.chiusa > h3::before {
    transform: rotate(-90deg);
  }

  .sez.chiusa > :not(h3) {
    display: none;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
  /* CHAT DELLA MAPPA */
  /* Mascotte in pixel art: fluttua, sbatte gli occhi e saltella mentre aspetta la risposta */
  #chat-open {
    position: fixed;
    bottom: 14px;
    left: 18px;
    z-index: 21;
    width: 72px;
    height: 82px;
    padding: 0;
    background: none;
    border: 0;
  }

  #chat-open:hover {
    border: 0;
  }

  #chat-open,
  #chat-open .sprite {
    cursor: grab;
    touch-action: none;
  }

  #chat-open .sprite {
    display: block;
    width: 72px;
    height: 64px;
    margin: 0 auto;
    image-rendering: pixelated;
    shape-rendering: crispEdges;
    filter: drop-shadow(0 0 6px rgba(217, 119, 87, .6));
    animation: chat-float 2.6s ease-in-out infinite;
  }

  #chat-open:hover .sprite {
    animation: chat-float 2.6s ease-in-out infinite, chat-wiggle .4s ease-in-out 2;
  }

  #chat-open.pensa .sprite {
    animation: chat-hop .5s ease-in-out infinite;
  }

  #chat-open::after {
    content: "";
    display: block;
    width: 30px;
    height: 6px;
    margin: 6px auto 0;
    background: rgba(0, 0, 0, .55);
    border-radius: 50%;
    animation: chat-shadow 2.6s ease-in-out infinite;
  }

  #chat-open .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: chat-blink 4.5s infinite;
  }

  @keyframes chat-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes chat-shadow {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50% { transform: scaleX(.7); opacity: .5; }
  }

  @keyframes chat-wiggle {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -8deg; }
    75% { rotate: 8deg; }
  }

  @keyframes chat-hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes chat-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  /* DECORAZIONI DELLE MODALITÀ: si vede solo quella della modalità scelta */
  #chat-open .acc,
  #chat-open .scintille {
    display: none;
  }

  #chat-open[data-modo="insegnante"] .acc-insegnante,
  #chat-open[data-modo="traduttore"] .acc-traduttore,
  #chat-open[data-modo="senior"] .acc-senior,
  #chat-open.cambia .scintille {
    display: inline;
  }

  /* Occhiali e occhiali da sole spariscono quando urla o quando gli occhi girano a spirale */
  #chat-open.dragging .viso,
  #chat-open.pensa .acc-senior .viso {
    display: none;
  }

  #chat-open .occhiali {
    shape-rendering: geometricPrecision;
  }

  /* Cambio di modalità: salto a scatti, come un vecchio videogioco, con le stelline che lampeggiano */
  #chat-open.cambia .sprite {
    animation: chat-cambia .7s steps(7) 1;
  }

  @keyframes chat-cambia {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-14px) scale(1.15, .85); }
    45% { transform: translateY(-16px) scaleX(-1); }
    60% { transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }

  #chat-open.cambia .scintille {
    animation: chat-scintille .35s steps(2) infinite;
  }

  @keyframes chat-scintille {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open.cambia .sprite,
    #chat-open.cambia .scintille {
      animation: none;
    }
  }

  /* Presa in mano: si ingrandisce e trema dalla paura */
  #chat-open.dragging .sprite {
    cursor: grabbing;
    animation: chat-trema .12s linear infinite;
  }

  @keyframes chat-trema {
    0%, 100% { transform: scale(1.15) translate(0, 0) rotate(-4deg); }
    25% { transform: scale(1.15) translate(-1px, 1px) rotate(4deg); }
    50% { transform: scale(1.15) translate(1px, -1px) rotate(-4deg); }
    75% { transform: scale(1.15) translate(-1px, -1px) rotate(4deg); }
  }

  #chat-open.dragging::after {
    animation: none;
    opacity: .3;
  }

  /* Mentre aspetta la risposta gli occhi diventano spirali che girano */
  #chat-open .ipno {
    display: none;
    shape-rendering: geometricPrecision;
  }

  #chat-open.pensa .ipno {
    display: inline;
  }

  #chat-open.pensa .eye {
    display: none;
  }

  #chat-open .spirale {
    transform-box: view-box;
    animation: chat-spin .9s linear infinite;
  }

  @keyframes chat-spin {
    to { rotate: 360deg; }
  }

  /* Faccia che urla mentre la trascini: ha la precedenza anche sugli occhi a spirale */
  #chat-open .paura {
    display: none;
  }

  #chat-open.dragging .paura {
    display: inline;
  }

  #chat-open.dragging .eye,
  #chat-open.dragging .bocca,
  #chat-open.dragging .ipno {
    display: none;
  }

  @keyframes chat-ping {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, .7); }
    50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open .sprite,
    #chat-open::after,
    #chat-open .eye,
    #chat-open .spirale,
    #chat-open .dot {
      animation: none;
    }
  }

  /* Verde: risposta pronta e non ancora vista; rosso: server spento */
  #chat-open .dot {
    position: absolute;
    top: 0;
    right: 2px;
    display: none;
    width: 12px;
    height: 12px;
    border: 2px solid var(--bg);
    border-radius: 50%;
  }

  #chat-open .dot.off {
    display: block;
    background: #f85149;
  }

  #chat-open .dot.pronta {
    display: block;
    background: #3fb950;
    animation: chat-ping 1.2s ease-in-out infinite;
  }

  #chat {
    position: fixed;
    bottom: 84px;
    left: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    width: min(400px, calc(100vw - 40px));
    height: min(480px, calc(100vh - 110px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
    /* Maniglia di ridimensionamento nell'angolo in basso a destra */
    resize: both;
    overflow: hidden;
    min-width: 300px;
    min-height: 260px;
    max-width: calc(100vw - 16px);
    max-height: calc(100vh - 16px);
  }

  #chat[hidden] {
    display: none;
  }

  #chat.big {
    width: min(620px, calc(100vw - 40px));
    height: calc(100vh - 110px);
  }

  #chat .chat-head {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  #chat.dragging .chat-head {
    cursor: grabbing;
  }

  #chat .chat-head b {
    flex: 1;
    font-size: 14px;
  }

  #chat .chat-head button {
    padding: 2px 8px;
    font-size: 13px;
  }

  #chat-log {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    overflow: auto;
    padding: 12px;
  }

  #chat-log:empty::before {
    content: "Fai una domanda";
    margin: auto;
    color: var(--muted);
    font-size: 14px;
  }

  #chat-log .msg {
    max-width: 92%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  #chat-log .msg.utente {
    align-self: flex-end;
    background: var(--chat-bg);
    border: 1px solid var(--chat);
  }

  #chat-log .msg.claude {
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  #chat-log .msg.info {
    align-self: stretch;
    max-width: none;
    color: var(--muted);
    font-size: 12.5px;
  }

  #chat-log .msg.errore {
    align-self: stretch;
    max-width: none;
    border: 1px solid #f85149;
    color: #ffa198;
  }

  #chat-log .msg.suggerimento {
    align-self: stretch;
    max-width: none;
    background: rgba(250, 204, 21, .08);
    border: 1px solid #facc15;
  }

  #chat-log .msg button {
    margin-top: 8px;
    padding: 3px 10px;
    font-size: 12.5px;
  }

  #chat-hint[hidden] {
    display: none;
  }

  /* LUCE DELL'INDIZIO: la zona si illumina, il punto si illumina e pulsa ingrandito */
  .luce {
    filter: drop-shadow(0 0 6px #fde047) drop-shadow(0 0 16px rgba(253, 224, 71, .75));
  }

  .el.luce {
    z-index: 6;
    outline: 3px solid #fde047;
    outline-offset: -3px;
  }

  .luce-zoom {
    transform-box: fill-box;
    transform-origin: center;
    animation: luce-zoom 1.4s ease-in-out infinite;

  body.con-indizio .item:not(.luce) {
    opacity: .3;
  }

  @keyframes luce-zoom {
    0%, 100% { scale: 1.06; }
    50% { scale: 1.14; }
  }

  @media (prefers-reduced-motion: reduce) {
    .luce-zoom {
      animation: none;
      scale: 1.1;
    }
  }

  #chat .chat-head select {
    padding: 3px 6px;

  #chat-log code {

  #chat-log pre code {

  #chat-log .par:last-child {

</style>

<body>
<header>
  <div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="legend">
    <span><i class="swatch" style="border-color: var(--fe); background: var(--fe-bg)"></i>FRONTEND</span>
    <span><i class="swatch" style="border-color: var(--be); background: var(--be-bg)"></i>BACKEND</span>
    <span><i class="swatch-line"></i>passa al passo successivo</span>
    <span><i class="swatch-line" style="border-color: var(--lost); border-top-style: dashed"></i>non arriva</span>
  </div>
  <div class="controls">
    <button id="zoom-out" title="Riduci (Ctrl + rotella)">&minus;</button>
    <button id="zoom-reset" title="Torna al 100%">100%</button>
    <button id="zoom-in" title="Ingrandisci (Ctrl + rotella)">+</button>
    <button id="prev" title="Passo precedente (freccia su)">&uarr;</button>
    <button id="next" title="Passo successivo (freccia giù)">&darr;</button>
    <button id="mode" aria-pressed="false" title="Oscura i passi successivi a quello selezionato">Passo-passo</button>
  </div>
</header>
<main>
  <div id="diagram">
    <section id="tracked" hidden></section>
  </div>
  <aside id="panel"></aside>
  <div id="toast" role="status" hidden></div>
</main>
<button id="chat-open" title="Chiedi sulla mappa (trascinami per spostarmi)"><i class="dot"></i></button>
<section id="chat" hidden>
  <div class="chat-head">
    <b title="Trascina per spostare · angolo in basso a destra per ridimensionare · doppio clic per rimetterla vicino alla mascotte">Chiedi sulla mappa</b>
    <select id="chat-modo" title="Come ti risponde Chattino">
      <option value="normale">Normale</option>
      <option value="insegnante">Insegnante</option>
      <option value="traduttore">Traduttore</option>
      <option value="senior">Senior developer</option>
    </select>
    <button id="chat-hint" title="Indizio: ti mostro dove guardare, mai la soluzione" hidden>&#x1F4A1; Indizio</button>
    <button id="chat-clear" title="Ricomincia la conversazione">Nuova</button>
    <button id="chat-big" title="Alza / abbassa la chat">&#x2922;</button>
    <button id="chat-close" title="Chiudi (la conversazione resta finché la pagina è aperta)">&#x2715;</button>
  </div>
  <div id="chat-log"></div>
  <div class="chat-ctx" id="chat-ctx"></div>
  <form id="chat-form">
    <textarea id="chat-input" rows="2" placeholder="Fai una domanda…"></textarea>
    <button type="submit" id="chat-send">Invia</button>
  </form>
</section>

<!--
  DATI DEL FLUSSO (unica parte da modificare). Il diagramma va dall'alto verso il basso:
  ogni elemento di "nodes" è un riquadro e una freccia lo collega al successivo.
  - side: "FRONTEND" (corsia blu a sinistra) | "BACKEND" (corsia gialla a destra)
  - file, element: dove si trova il codice; action: cosa fa, in una frase breve
  - path, line: percorso assoluto del file e riga dell'element; rendono cliccabili i nomi (aprono VS Code)
  - physical: sezione "Cosa succede fisicamente", la prima del pannello: solo ciò che l'utente vede e fa
  - simple: sezione "Spiegazione semplice", la seconda del pannello
  - short: frase brevissima e semplice (max ~60 caratteri, niente termini tecnici) scritta in grigio nel riquadro chiuso;
    cliccando il riquadro si apre e mostra la versione tecnica a punti
  - steps: (opzionale) 2-5 punti tecnici brevi del riquadro aperto, uno per azione; senza, il template divide does in frasi
  - does / purpose / receives / returns: sezioni "Cosa fa", "A cosa serve", "Riceve", "Restituisce" del pannello
  - terms: { "termine": "significato semplice" } mostrati come glossario del passo
  - nei testi, il codice va tra backtick (`esempio`) e viene mostrato come codice
  - tracked: (opzionale, a livello di FLOW) [{ "id", "name" }] oggetti seguiti passo per passo nella colonna
    a sinistra, un riquadro ciascuno; nei nodi in cui un oggetto cambia, "state": { "<id>": valore completo dopo
    quel passo } (gli oggetti non presenti in "state" restano invariati)
  - section: (opzionale) inizia un nuovo flusso con un titolo, senza freccia dal nodo precedente
  - incoming: (opzionale) "lost" se la freccia dal nodo precedente non arriva (rossa tratteggiata)
  - payloadName / payload / fields: cosa passa al nodo successivo (payload null se nulla)
  - call: (opzionale) cosa succede sulla freccia in uscita, mostrato cliccandola:
    { "kind": "http" | "socket" | "navigation" | "function" | "event" | "storage" | "process", "label": "POST /auth/login", "note": "frase semplice" }
  - fields: { "percorso.del.campo": "spiegazione" }, gli array usano "lista[]", "" è il valore intero
  - per mostrare un valore undefined scrivi "__undefined__"
  - overview: (opzionale) riepilogo nel pannello all'apertura e cliccando fuori:
    { "goal": obiettivo, "problem": problema, "todo": cosa deve fare ora l'utente, "files": [{ "file", "path", "role" }], "notes": [..] }
    senza "files" il pannello elenca da solo i file della mappa
  - indizi: (opzionale) [{ "testo": cosa osservare, "punti": ["D4", "D5"] }, { "testo", "punti": ["D5"] }]
    tasto Indizio della chat: il primo illumina la zona, il secondo il punto; mai la soluzione
  - chat: { "token": contenuto di ~/.claude/chat-mappa-token, "project": percorso assoluto del progetto con "/" }
    attiva la chat in basso a sinistra (server: ~/.claude/shared/chat-mappa-server.js)
  Non inserire la sequenza </script> nel JSON.
-->
<script id="flow-data" type="application/json">
{
  "title": "Titolo del flusso",
  "subtitle": "progetto · data · cosa rappresenta",
  "nodes": [
    {
      "side": "FRONTEND", "file": "Componente.jsx", "element": "handleClick",
      "action": "L'utente preme il pulsante e parte la richiesta",
      "explanation": "Cosa succede in questo passo e perché.",
      "payloadName": "body della richiesta",
      "payload": { "id": 1 },
      "fields": { "id": "a cosa serve questo campo" }
    },
    {
      "side": "BACKEND", "file": "Controller.js", "element": "esempio",
      "action": "Salva il dato e risponde",
      "explanation": "Cosa succede in questo passo e perché.",
      "payloadName": "response.data",
      "payload": { "status": true },
      "fields": {}
    }
  ]
}
</script>

<script>
  const FLOW = JSON.parse(document.getElementById('flow-data').textContent);

  const PAD = 16;
  const LANE_W = 330;
  const LANE_GAP = 40;
  const NODE_W = 290;
  const NODE_MIN_H = 84;
  const ANIM_MS = 260;
  const GAP = 76;
  const SECTION_H = 44;
  const HEADER_H = 46;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XHTML_NS = 'http://www.w3.org/1999/xhtml';

  // Gli attributi SVG non risolvono var(): leggo i token CSS una volta sola
  const cv = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();

  const LANES = {
    FRONTEND: { x: PAD, stroke: cv('fe'), fill: cv('fe-bg') },
    BACKEND: { x: PAD + LANE_W + LANE_GAP, stroke: cv('be'), fill: cv('be-bg') },
  };

  const state = { selected: null, stepMode: false };
  const centerX = (node) => LANES[node.side].x + LANE_W / 2;

  const el = (tag, attrs = {}, parent) => {
    const node = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (parent) parent.appendChild(node);
    return node;
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // EVIDENZIAZIONE CODICE NEI TESTI
  // Gruppi in ordine: stringa, numero, letterale, funzione (seguita da "("), tipo/componente (Maiuscola), variabile
  const TOKEN = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b(true|false|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b|([A-Za-z_$][\w$]*)/g;
  const TOKEN_CLASSES = ['tk-string', 'tk-number', 'tk-literal', 'tk-function', 'tk-type', 'tk-var'];

  const highlight = (code) => {
    if (/^[\w./-]+\.(jsx?|tsx?|json|md)$/.test(code)) return `<span class="tk-file">${esc(code)}</span>`;
    let html = '';
    let last = 0;
    for (const match of code.matchAll(TOKEN)) {
      const group = match.slice(1).findIndex((g) => g !== undefined);
      html += esc(code.slice(last, match.index)) + `<span class="${TOKEN_CLASSES[group]}">${esc(match[0])}</span>`;
      last = match.index + match[0].length;
    }
    return html + esc(code.slice(last));
  };

  const fmt = (s) => (s || '')
    .split(/(`[^`]+`)/)
    .map((part) => (/^`[^`]+`$/.test(part) ? `<code>${highlight(part.slice(1, -1))}</code>` : esc(part)))
    .join('');

  // Link che apre il file in VS Code alla riga indicata (vscode://file/<percorso>:<riga>:<colonna>)
  const codeLink = (node, line, inner) => {
    if (!node.path) return inner;
    const target = `${node.path.replace(/\\/g, '/')}:${line || 1}`;
    const href = encodeURI(`vscode://file/${target}:1`);
    return `<a class="code-link" href="${esc(href)}" data-copy="${esc(target)}" title="Apri in VS Code (nel browser integrato: copia il percorso per Ctrl+P)">${inner}</a>`;
  };

  // COPIA PERCORSO
  // Il browser integrato di VS Code blocca i link vscode:// senza avvisare: il percorso copiato si apre con Ctrl+P
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
      toast.hidden = true;
    }, 4000);
  }

  document.addEventListener('click', async (e) => {
    const link = e.target.closest('a.code-link');
    if (!link) return;
    const copied = await copyText(link.dataset.copy);
    showToast(copied
      ? `Copiato <code>${esc(link.dataset.copy)}</code><br>In VS Code premi <kbd>Ctrl</kbd>+<kbd>P</kbd>, incolla e premi <kbd>Invio</kbd>`
      : 'Copia non riuscita: apri il file in un browser esterno per usare il link diretto');
  });

  // CONTENUTO RIQUADRO
  // Chiuso: solo nome della funzione e una frase semplice in grigio. Aperto: anche il file e i punti tecnici. p va da 0 (chiuso) a 1 (aperto)
  const primaFrase = (testo) => (testo || '').split(/(?<=[.!?])\s/)[0];
  // Una frase per punto: si va a capo dopo . o ; seguiti da una maiuscola o da codice
  const dividiInFrasi = (testo) => (testo || '').split(/(?<=[.;])\s+(?=[A-ZÀ-Ý`])/).map((frase) => frase.trim()).filter(Boolean);

  function contenutoNodo(node, p) {
    const breve = node.short || primaFrase(node.simple) || node.action;
    const punti = node.steps || dividiInFrasi(node.does || node.explanation || node.action);
    const corpo = p > 0
      ? `<div class="tecnico" style="opacity: ${p.toFixed(2)}"><ul class="passi">${punti.map((punto) => `<li>${fmt(punto)}</li>`).join('')}</ul>${node.payloadName ? `<div class="passa">passa: <code>${esc(node.payloadName)}</code></div>` : ''}</div>`
      : `<div class="breve">${fmt(breve)}</div>`;
    return `
      <div class="node ${node.side}${p > 0 ? ' open' : ''}">
        <div class="tag">${node.side}<span class="toggle">${p > 0 ? '&#9652;' : '&#9662;'}</span></div>
        <div class="title">${p > 0
          ? `${codeLink(node, node.line, `<span class="element">${esc(node.element || node.file)}</span>`)}${node.element ? `<span class="sep">·</span>${codeLink(node, 1, `<span class="file">${esc(node.file)}</span>`)}` : ''}`
          : `<span class="element">${esc(node.element || node.file)}</span>`}</div>
        ${corpo}
      </div>`;
  }

  // ALTEZZA RIQUADRI
  // Misura fuori schermo ogni riquadro chiuso e aperto, con la stessa larghezza che ha nel diagramma
  function misuraAltezze() {
    const prova = document.createElement('div');
    prova.style.cssText = `position: absolute; left: -9999px; top: 0; width: ${NODE_W}px; visibility: hidden`;
    document.body.appendChild(prova);
    FLOW.nodes.forEach((node) => {
      [['hClosed', 0], ['hOpen', 1]].forEach(([chiave, p]) => {
        prova.innerHTML = contenutoNodo(node, p);
        const div = prova.firstElementChild;
        div.style.height = 'auto';
        node[chiave] = Math.max(NODE_MIN_H, Math.ceil(div.getBoundingClientRect().height));
      });
      node.p = node.open ? 1 : 0;
      node.h = node.open ? node.hOpen : node.hClosed;
    });
    prova.remove();
  }

  // APERTURA RIQUADRO
  // L'altezza cresce un fotogramma alla volta e i riquadri sotto scorrono giù: è l'effetto di scorrimento
  function apriChiudi(i) {
    const node = FLOW.nodes[i];
    node.open = !node.open;
    const da = node.h;
    const a = node.open ? node.hOpen : node.hClosed;
    const inizio = performance.now();
    const passo = (ora) => {
      const t = Math.min(1, (ora - inizio) / ANIM_MS);
      const e = 1 - (1 - t) ** 3;
      node.h = da + (a - da) * e;
      node.p = node.open ? e : 1 - e;
      renderDiagram();
      if (t < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  // POSIZIONI NODI
  function layout() {
    let y = HEADER_H + 24;
    FLOW.nodes.forEach((node, i) => {
      node.number = i + 1;
      if (node.section) {
        const extra = i === 0 ? 0 : 8;
        node.sectionY = y + extra;
        y += SECTION_H + extra;
      }
      node.y = y;
      y += node.h + GAP;
    });
    return y - GAP + 24;
  }

  // RENDER DIAGRAMMA
  // Ridisegnato da zero a ogni apertura di un riquadro; dopo, la selezione (e la luce degli indizi) si riapplica
  function renderDiagram() {
    document.querySelector('#diagram > svg')?.remove();
    const height = layout();
    const width = PAD * 2 + LANE_W * 2 + LANE_GAP;
    const svg = el('svg', { width, height, viewBox: `0 0 ${width} ${height}` });
    document.getElementById('diagram').appendChild(svg);

    const defs = el('defs', {}, svg);
    [['FRONTEND', cv('fe')], ['BACKEND', cv('be')], ['lost', cv('lost')], ['sel', cv('accent')]].forEach(([id, color]) => {
      const marker = el('marker', { id: `head-${id}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }, marker);
    });

    Object.entries(LANES).forEach(([side, lane]) => {
      el('rect', { x: lane.x, y: 0, width: LANE_W, height, rx: 12, fill: lane.fill, 'fill-opacity': 0.25, stroke: lane.stroke, 'stroke-opacity': 0.35 }, svg);
      el('text', { x: lane.x + LANE_W / 2, y: 30, 'text-anchor': 'middle', fill: lane.stroke, 'font-size': 15, 'font-weight': 800, 'letter-spacing': '.2em' }, svg).textContent = side;
    });

    FLOW.nodes.forEach((node, i) => {
      if (node.section) {
        el('line', { x1: PAD, y1: node.sectionY + 18, x2: width - PAD, y2: node.sectionY + 18, stroke: cv('border'), 'stroke-dasharray': '6 4' }, svg);
        const label = el('text', { x: width / 2, y: node.sectionY + 23, 'text-anchor': 'middle', fill: cv('text'), 'font-size': 13, 'font-weight': 700 }, svg);
        label.textContent = node.section.toUpperCase();
        const box = label.getBBox();
        el('rect', { x: box.x - 12, y: box.y - 4, width: box.width + 24, height: box.height + 8, rx: 6, fill: cv('bg'), stroke: cv('border') }, svg);
        svg.appendChild(label);
      }
      if (i > 0 && !node.section) renderEdge(svg, FLOW.nodes[i - 1], node, i - 1);
    });

    FLOW.nodes.forEach((node, i) => renderNode(svg, node, i));
    applicaSelezione();
    document.dispatchEvent(new Event('mappa-ridisegnata'));
  }

  // RENDER FRECCIA
  function renderEdge(svg, from, to, fromIndex) {
    const lost = to.incoming === 'lost';
    const color = lost ? cv('lost') : LANES[from.side].stroke;
    const marker = lost ? 'lost' : from.side;
    const x1 = centerX(from);
    const y1 = from.y + from.h;
    const x2 = centerX(to);
    const y2 = to.y - 2;
    const mid = (y1 + y2) / 2;
    const straight = x1 === x2;
    const d = straight ? `M${x1},${y1} V${y2}` : `M${x1},${y1} V${mid} H${x2} V${y2}`;

    const g = el('g', { class: 'item edge', 'data-i': fromIndex }, svg);
    g.addEventListener('click', () => select(fromIndex, 'freccia'));
    el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 16 }, g);
    el('path', { class: 'edge-path', d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-dasharray': lost ? '6 4' : '', 'marker-end': `url(#head-${marker})`, 'data-marker': marker }, g);

    const labelX = straight ? x1 : (x1 + x2) / 2;
    const labelY = straight ? mid : mid - 16;

    let labelRight = labelX;
    if (from.payloadName) {
      const text = el('text', { x: labelX, y: labelY + 4, 'text-anchor': 'middle', fill: cv('text'), 'font-size': 12 }, g);
      text.textContent = from.payloadName;
      const box = text.getBBox();
      el('rect', { class: 'edge-label', x: box.x - 8, y: box.y - 3, width: box.width + 16, height: box.height + 6, rx: 10 }, g);
      g.appendChild(text);
      labelRight = box.x + box.width + 8;
    }

    if (lost) {
      const crossX = labelRight + 18;
      el('path', { d: `M${crossX - 7},${labelY - 7} l14,14 M${crossX - 7},${labelY + 7} l14,-14`, stroke: cv('lost'), 'stroke-width': 3 }, g);
    }
  }

  // RENDER NODO
  function renderNode(svg, node, i) {
    const x = centerX(node) - NODE_W / 2;
    const g = el('g', { class: 'item', 'data-i': i }, svg);
    g.addEventListener('click', (e) => {
      if (e.target.closest('a.code-link')) return;
      select(i);
      apriChiudi(i);
    });

    const fo = el('foreignObject', { x, y: node.y, width: NODE_W, height: node.h }, g);
    const wrap = document.createElementNS(XHTML_NS, 'div');
    wrap.style.height = '100%';
    wrap.innerHTML = contenutoNodo(node, node.p);
    fo.appendChild(wrap);

    const color = LANES[node.side].stroke;
    el('circle', { cx: x, cy: node.y, r: 15, fill: cv('bg'), stroke: color, 'stroke-width': 2 }, g);
    el('text', { x, y: node.y + 4, 'text-anchor': 'middle', fill: color, 'font-size': 11, 'font-weight': 700 }, g).textContent = `D${node.number}`;
  }

  const isShortList = (v) => Array.isArray(v) && v.length <= 4 && v.every((item) => item === null || typeof item !== 'object');
  const leafText = (v) => (v === undefined ? 'undefined' : JSON.stringify(v));

  // Larghezza di un carattere del font monospace: serve ad allineare le note (in font normale) al codice
  const MONO_CH = (() => {
    const probe = document.createElement('span');
    probe.style.cssText = 'position: absolute; visibility: hidden; font: 12.5px ui-monospace, Consolas, monospace';
    probe.textContent = '0'.repeat(20);
    document.body.appendChild(probe);
    const width = probe.getBoundingClientRect().width / 20;
    probe.remove();
    return width;
  })();

  // APPIATTIMENTO PER DIFF
  function flatten(raw, path = '', out = {}) {
    const v = raw === '__undefined__' ? undefined : raw;
    if (isShortList(v)) {
      out[path] = JSON.stringify(v);
    } else if (Array.isArray(v)) {
      out[path] = '[]';
      v.forEach((item, i) => flatten(item, `${path}[${i}]`, out));
    } else if (v && typeof v === 'object') {
      out[path] = '{}';
      Object.entries(v).forEach(([k, item]) => flatten(item, path ? `${path}.${k}` : k, out));
    } else {
      out[path] = leafText(v);
    }
    return out;
  }

  // RENDER OGGETTO
  function renderObject(value, fields, prevFlat = null, showNotes = true) {
    const lines = [];
    const diffClass = (diffPath, current) => {
      if (!prevFlat) return '';
      if (!(diffPath in prevFlat)) return 'added';
      return prevFlat[diffPath] !== current ? 'changed' : '';
    };
    const noted = new Set();
    const noteFor = (path) => {
      if (!(path in fields) || noted.has(path)) return '';
      noted.add(path);
      return fields[path];
    };
    const primitive = (v) => {
      if (typeof v === 'string') return `<span class="s">${esc(JSON.stringify(v))}</span>`;
      if (typeof v === 'number') return `<span class="n">${v}</span>`;
      return `<span class="b">${v}</span>`;
    };

    // path: con [] per le note in fields; diffPath: con [indice] per il confronto col passo precedente
    const walk = (raw, path, diffPath, depth, key, comma) => {
      // JSON non può contenere undefined: nei dati si scrive "__undefined__"
      const v = raw === '__undefined__' ? undefined : raw;
      const pad = '  '.repeat(depth);
      const keyHtml = key !== null ? `<span class="k">${esc(key)}</span>: ` : '';
      const tail = comma ? ',' : '';

      if (isShortList(v)) {
        const cls = diffClass(diffPath, JSON.stringify(v));
        lines.push({ html: `${pad}${keyHtml}[${v.map(primitive).join(', ')}]${tail}`, note: noteFor(path), cls, diffPath });
        return;
      }

      if (Array.isArray(v) || (v && typeof v === 'object')) {
        const isArray = Array.isArray(v);
        const entries = isArray ? v.map((item) => [null, item]) : Object.entries(v);
        const cls = diffClass(diffPath, isArray ? '[]' : '{}');
        lines.push({ html: pad + keyHtml + (isArray ? '[' : '{'), note: noteFor(path), cls, diffPath });
        entries.forEach(([k, item], idx) => {
          const childPath = isArray ? `${path}[]` : (path ? `${path}.${k}` : k);
          const childDiffPath = isArray ? `${diffPath}[${idx}]` : (diffPath ? `${diffPath}.${k}` : k);
          walk(item, childPath, childDiffPath, depth + 1, k, idx < entries.length - 1);
        });
        lines.push({ html: pad + (isArray ? ']' : '}') + tail, note: '', cls: cls === 'added' ? 'added' : '' });
        return;
      }

      const cls = diffClass(diffPath, leafText(v));
      lines.push({ html: pad + keyHtml + primitive(v) + tail, note: noteFor(path), cls, diffPath });
    };

    walk(value, '', '', 0, null, false);

    if (prevFlat) {
      const currentFlat = flatten(value);
      const removed = Object.keys(prevFlat).filter((p) => p && !(p in currentFlat));
      removed
        .filter((p) => !removed.some((other) => other !== p && (p.startsWith(`${other}.`) || p.startsWith(`${other}[`))))
        .forEach((p) => lines.push({ html: `${esc(p)}: ${esc(prevFlat[p])}`, note: 'rimosso', cls: 'removed' }));
      lines.forEach((l) => {
        if (l.cls === 'changed' && !l.note) l.note = `prima: ${prevFlat[l.diffPath]}`;
      });
    }

    return lines
      .map((l) => {
        const indent = l.html.match(/^ */)[0];
        const note = showNotes && l.note
          ? `<div class="row"><span class="note" style="padding-left: calc(12px + ${indent.length * MONO_CH}px)">${esc(l.note)}</span></div>`
          : '';
        return `${note}<div class="row ${l.cls || ''}"><span class="code">${l.html}</span></div>`;
      })
      .join('');
  }

  // RENDER OGGETTI TRACCIATI
  function renderTrackedCard(tracked) {
    const header = `<h2>${fmt(tracked.name)}</h2>`;
    if (state.selected === null) return `<div class="tracked-card">${header}</div>`;

    let current;
    let previous;
    let changedAt = -1;
    let hasCurrent = false;
    let hasPrevious = false;
    for (let j = 0; j <= state.selected; j += 1) {
      const states = FLOW.nodes[j].state;
      if (!states || !(tracked.id in states)) continue;
      if (hasCurrent) {
        previous = current;
        hasPrevious = true;
      }
      current = states[tracked.id];
      hasCurrent = true;
      changedAt = j;
    }

    if (!hasCurrent) return `<div class="tracked-card">${header}</div>`;

    const prevFlat = changedAt === state.selected && hasPrevious ? flatten(previous) : null;
    return `
      <div class="tracked-card">
        ${header}
        <div class="obj stacked">${renderObject(current, {}, prevFlat, false)}</div>
      </div>`;
  }

  function renderTracked() {
    const box = document.getElementById('tracked');
    const list = [].concat(FLOW.tracked || []);
    if (!list.length) return;
    box.hidden = false;

    box.innerHTML = `
      <div class="diff-legend"><span><i class="mark added"></i>aggiunto</span><span><i class="mark changed"></i>cambiato</span><span><i class="mark removed"></i>rimosso</span></div>
      ${list.map(renderTrackedCard).join('')}`;
  }

  // RIEPILOGO
  // Si vede all'apertura e cliccando fuori: obiettivo, problema, cosa fare e file coinvolti
  function fileCoinvolti() {
    const perPercorso = new Map();
    FLOW.nodes.forEach((node) => {
      const chiave = node.path || node.file;
      if (!perPercorso.has(chiave)) perPercorso.set(chiave, { file: node.file, path: node.path, punti: [] });
      perPercorso.get(chiave).punti.push(`D${node.number}`);
    });
    return [...perPercorso.values()].map((f) => ({ ...f, role: f.punti.join(', ') }));
  }

  function riepilogoHtml() {
    const o = FLOW.overview || {};
    const files = o.files || fileCoinvolti();
    const sezione = (titolo, testo) => (testo ? `<h3>${titolo}</h3><p class="explanation">${fmt(testo)}</p>` : '');
    return `
      <span class="panel-tag">RIEPILOGO</span>
      <h2>${esc(FLOW.title)}</h2>
      ${sezione('Obiettivo', o.goal)}
      ${sezione('Problema', o.problem)}
      ${sezione('Cosa fare', o.todo)}
      <h3>File coinvolti</h3>
      <ul class="files">${files.map((f) => `<li>${codeLink(f, 1, `<b>${esc(f.file)}</b>`)}${f.role ? ` <span class="route">· ${fmt(f.role)}</span>` : ''}</li>`).join('')}</ul>
      ${(o.notes || []).length ? `<h3>Da sapere</h3><ul class="files">${o.notes.map((n) => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
      <div class="azioni-mappa">
        <button type="button" data-azione="cartella" title="Apre la cartella con il file della mappa selezionato">Apri cartella</button>
        <button type="button" data-azione="elimina" title="Cancella il file della mappa dal PC">Elimina mappa</button>
      </div>`;
  }

  // RENDER PANNELLO
  const CALL_LABELS = {
    http: 'Chiamata HTTP al server',
    socket: 'Messaggio socket',
    navigation: 'Navigazione verso un\'altra schermata',
    function: 'Chiamata di funzione',
    event: 'Evento',
    storage: 'Lettura o scrittura nella memoria del dispositivo',
    process: 'Avvio di un altro programma',
  };

  function oggettoHtml(node) {
    const hasPayload = node.payload !== null && node.payload !== undefined;
    return hasPayload
      ? `<div class="obj stacked">${renderObject(node.payload, node.fields || {})}</div>`
      : `<p class="hint">${node.payloadName ? `${esc(node.payloadName)}: nessun oggetto` : 'Non passa nessun oggetto.'}</p>`;
  }

  // PANNELLO FRECCIA
  // Che tipo di passaggio è (chiamata HTTP, navigazione, funzione…) e cosa trasporta
  function renderEdgePanel(panel) {
    const from = FLOW.nodes[state.selected];
    const to = FLOW.nodes[state.selected + 1];
    const call = from.call;
    const dentro = from.side === 'FRONTEND' ? 'dentro l\'app' : 'dentro il server';
    const tipo = call
      ? (CALL_LABELS[call.kind] || call.kind)
      : (from.side !== to.side ? 'Passaggio tra app e server' : `Passaggio ${dentro}`);

    panel.innerHTML = `
      <span class="panel-tag ${from.side}">${from.side}</span> &rarr; <span class="panel-tag ${to.side}">${to.side}</span>
      <h2>D${from.number} &rarr; D${to.number}</h2>
      <p class="route">${esc(from.element || from.file)} &rarr; ${esc(to.element || to.file)}${to.incoming === 'lost' ? ' — <b style="color: var(--lost)">non arriva</b>' : ''}</p>
      <h3>Cosa succede su questa freccia</h3>
      <p><span class="call-kind">${esc(tipo)}</span></p>
      ${call?.label ? `<p><code>${highlight(call.label)}</code></p>` : ''}
      ${call?.note ? `<p class="explanation">${fmt(call.note)}</p>` : ''}
      ${call ? '' : '<p class="hint">Per questa freccia la mappa non indica una chiamata: il dato passa e basta.</p>'}
      <h3>Cosa passa · ${esc(from.payloadName || 'oggetto')}</h3>
      ${oggettoHtml(from)}`;
  }

  function renderPanel() {
    const panel = document.getElementById('panel');

    if (state.selected === null) {
      panel.innerHTML = riepilogoHtml();
      return;
    }

    if (state.edge) {
      renderEdgePanel(panel);
      return;
    }

    const node = FLOW.nodes[state.selected];
    const next = FLOW.nodes[state.selected + 1];
    const goesOn = next && !next.section;
    const hasPayload = node.payload !== null && node.payload !== undefined;
    const destination = goesOn
      ? `<p class="route">passa a: <span class="panel-tag ${next.side}">${next.side}</span> ${esc(next.file)}${next.incoming === 'lost' ? ' — <b style="color: var(--lost)">non arriva</b>' : ''}</p>`
      : '<p class="route">ultimo passo di questo flusso</p>';

    const section = (title, text) => (text ? `<h3>${title}</h3><p class="explanation">${fmt(text)}</p>` : '');
    const terms = Object.entries(node.terms || {});
    const termsHtml = terms.length
      ? `<h3>Termini</h3><dl class="terms">${terms.map(([term, meaning]) => `<dt>${fmt(term)}</dt><dd>${fmt(meaning)}</dd>`).join('')}</dl>`
      : '';

    panel.innerHTML = `
      <span class="panel-tag ${node.side}">${node.side}</span>
      <h2>D${node.number}. ${codeLink(node, node.line, esc(node.element || node.file))}${node.element ? ` ${codeLink(node, 1, `<span class="route">${esc(node.file)}</span>`)}` : ''}</h2>
      ${section('Cosa succede fisicamente', node.physical)}
      ${section('Spiegazione semplice', node.simple)}
      ${section('Cosa fa', node.does || node.explanation)}
      ${section('A cosa serve', node.purpose)}
      ${section('Riceve', node.receives)}
      ${section('Restituisce', node.returns)}
      <h3>${hasPayload ? `Cosa passa al passo successivo · ${esc(node.payloadName || 'oggetto')}` : 'Cosa passa al passo successivo'}</h3>
      ${destination}
      ${oggettoHtml(node)}
      ${termsHtml}`;
  }

  // SELEZIONE E NAVIGAZIONE
  // tipo "freccia": è selezionata la freccia che esce dal passo i, non il riquadro
  function applicaSelezione() {
    const i = state.selected;
    document.querySelectorAll('.item').forEach((g) => {
      const gi = Number(g.dataset.i);
      const isEdge = g.classList.contains('edge');
      const isSelected = i !== null && gi === i && isEdge === state.edge;
      g.classList.toggle('sel', isSelected);
      g.classList.toggle('dim', state.stepMode && i !== null && gi > i);
      const edge = g.querySelector('.edge-path');
      if (edge) edge.setAttribute('marker-end', `url(#head-${isSelected ? 'sel' : edge.dataset.marker})`);
    });
  }

  function select(i, tipo = 'nodo') {
    state.selected = i;
    state.edge = i !== null && tipo === 'freccia';
    applicaSelezione();
    renderPanel();
    renderTracked();
  }

  function move(delta) {
    const current = state.selected === null ? -1 : state.selected;
    const next = Math.min(Math.max(current + delta, 0), FLOW.nodes.length - 1);
    select(next);
    document.querySelector(`.item[data-i="${next}"] foreignObject`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('title').textContent = FLOW.title;
  document.getElementById('subtitle').textContent = FLOW.subtitle || '';
  document.getElementById('prev').addEventListener('click', () => move(-1));
  document.getElementById('next').addEventListener('click', () => move(1));
  // Cliccando fuori da riquadri e frecce torna il riepilogo
  document.getElementById('diagram').addEventListener('click', (e) => {
    if (!e.target.closest('.item, #tracked')) select(null);
  });
  document.getElementById('mode').addEventListener('click', (e) => {
    state.stepMode = !state.stepMode;
    e.currentTarget.setAttribute('aria-pressed', state.stepMode);
    select(state.selected, state.edge ? 'freccia' : 'nodo');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      move(1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      move(-1);
    }
    if (e.key === 'Escape') select(null);
  });

  misuraAltezze();
  renderDiagram();
  renderPanel();
  renderTracked();

  // Apertura diretta su un passo: file.html#D3 (o #passo-3)
  const fromHash = location.hash.match(/^#(?:D|passo-)(\d+)$/i);
  if (fromHash) {
    const target = Number(fromHash[1]) - 1;
    if (target >= 0 && target < FLOW.nodes.length) select(target);
  }
</script>
<script>
  // NAVIGAZIONE MAPPA
  // Trascinando la mappa si scorre; con i pulsanti − + o Ctrl + rotella si ingrandisce e si riduce
  (() => {
    const area = document.querySelector('#diagram');
    const MIN = 0.4;
    const MAX = 2.5;
    const PASSO = 1.2;
    const SOGLIA = 4;
    let zoom = 1;
    let trascinato = false;

    function impostaZoom(valore, cx, cy) {
      const nuovo = Math.min(MAX, Math.max(MIN, valore));
      const box = area.getBoundingClientRect();
      const px = (cx ?? box.left + box.width / 2) - box.left;
      const py = (cy ?? box.top + box.height / 2) - box.top;
      const fx = (area.scrollLeft + px) / zoom;
      const fy = (area.scrollTop + py) / zoom;
      zoom = nuovo;
      area.style.setProperty('--zoom', zoom);
      // Il punto sotto il puntatore resta fermo mentre la mappa cambia dimensione
      area.scrollLeft = fx * zoom - px;
      area.scrollTop = fy * zoom - py;
      document.getElementById('zoom-reset').textContent = `${Math.round(zoom * 100)}%`;
    }

    document.getElementById('zoom-in').addEventListener('click', () => impostaZoom(zoom * PASSO));
    document.getElementById('zoom-out').addEventListener('click', () => impostaZoom(zoom / PASSO));
    document.getElementById('zoom-reset').addEventListener('click', () => impostaZoom(1));
    area.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      impostaZoom(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });

    // TRASCINAMENTO MAPPA
    // Sotto la soglia è un clic (seleziona); oltre, la mappa segue il puntatore e il clic finale viene ignorato
    area.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('a, button, input, textarea')) return;
      trascinato = false;
      const x0 = e.clientX;
      const y0 = e.clientY;
      const sl = area.scrollLeft;
      const st = area.scrollTop;
      let preso = false;

      const muovi = (ev) => {
        if (!preso && Math.hypot(ev.clientX - x0, ev.clientY - y0) < SOGLIA) return;
        if (!preso) {
          preso = true;
          area.setPointerCapture(e.pointerId);
          area.classList.add('panning');
        }
        area.scrollLeft = sl - (ev.clientX - x0);
        area.scrollTop = st - (ev.clientY - y0);
      };
      const lascia = () => {
        area.removeEventListener('pointermove', muovi);
        area.classList.remove('panning');
        trascinato = preso;
      };
      area.addEventListener('pointermove', muovi);
      area.addEventListener('pointerup', lascia, { once: true });
      area.addEventListener('pointercancel', lascia, { once: true });
    });
    area.addEventListener('click', (e) => {
      if (!trascinato) return;
      trascinato = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  })();

  // SEZIONI APRIBILI
  // Ogni titolo del pannello di destra apre e chiude la sua sezione; una sezione chiusa resta chiusa anche cambiando selezione
  (() => {
    const panel = document.getElementById('panel');
    const chiuse = new Set();

    function rendiApribili() {
      panel.querySelectorAll(':scope > h3').forEach((h3) => {
        const sez = document.createElement('section');
        sez.className = 'sez';
        h3.before(sez);
        let nodo = h3;
        while (nodo && !(nodo !== h3 && (nodo.tagName === 'H3' || nodo.matches('.howto, .azioni-mappa')))) {
          const dopo = nodo.nextElementSibling;
          sez.appendChild(nodo);
          nodo = dopo;
        }
        const titolo = h3.textContent.split('·')[0].trim();
        sez.classList.toggle('chiusa', chiuse.has(titolo));
        h3.addEventListener('click', () => {
          const chiusa = sez.classList.toggle('chiusa');
          if (chiusa) chiuse.add(titolo);
          else chiuse.delete(titolo);
        });
      });
    }

    // Il pannello viene riscritto a ogni selezione: le sezioni si ricreano ogni volta
    new MutationObserver(() => {
      if (panel.querySelector(':scope > h3')) rendiApribili();
    }).observe(panel, { childList: true });
    rendiApribili();
  })();
</script>

<script>
  // CHAT DELLA MAPPA
  // Le domande vanno al server locale (~/.claude/shared/chat-mappa-server.js), che le passa a claude -p in sola lettura.
  (() => {
    const CONFIG = MAPPA_CHAT.dati.chat || {};
    const SERVER = `http://127.0.0.1:${CONFIG.port || 4517}`;
    const AVVIO = 'node "$HOME/.claude/shared/chat-mappa-server.js" --sfondo';
    const MAX_STORIA = 10;
    const storia = [];
    const $ = (id) => document.getElementById(id);
    let inAttesa = false;

    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');

    // FORMATTAZIONE RISPOSTA
    // Markdown essenziale: blocchi di codice, `codice`, **grassetto**, elenchi puntati, paragrafi.
    function paragrafo(testo) {
      let html = '';
      let lista = [];
      const chiudiLista = () => {
        if (lista.length) html += `<ul>${lista.join('')}</ul>`;
        lista = [];
      };
      testo.split('\n').forEach((riga) => {
        const punto = riga.match(/^\s*[-*] (.*)/);
        if (punto) return lista.push(`<li>${inline(punto[1])}</li>`);
        chiudiLista();
        html += `${html && !html.endsWith('</ul>') ? '<br>' : ''}${inline(riga)}`;
      });
      chiudiLista();
      return `<div class="par">${html}</div>`;
    }

    const markdown = (testo) => esc(testo)
      .split(/```[\w-]*\n?([\s\S]*?)```/)
      .map((parte, i) => (i % 2
        ? `<pre><code>${parte.replace(/\n$/, '')}</code></pre>`
        : parte.split(/\n{2,}/).filter((p) => p.trim()).map(paragrafo).join('')))
      .join('');

    function aggiungi(classe, html, contesto) {
      const msg = document.createElement('div');
      msg.className = `msg ${classe}`;
      msg.innerHTML = (contesto ? `<span class="ctx">su ${esc(contesto)}</span>` : '') + html;
      $('chat-log').appendChild(msg);
      $('chat-log').scrollTop = $('chat-log').scrollHeight;
      return msg;
    }


    function serverSpento() {
      const msg = aggiungi('errore', `La chat non risponde: il server locale è spento. Avvialo da un terminale con<br><code>${esc(AVVIO)}</code><br><button type="button">Copia comando</button>`);
      msg.querySelector('button').addEventListener('click', async () => {
        if (await copyText(AVVIO)) showToast('Comando copiato: incollalo in un terminale e riprova');
      });
    }

    // STATO SERVER
    async function controllaServer() {
      const dot = document.querySelector('#chat-open .dot');
      try {
        const res = await fetch(`${SERVER}/stato`);

    function aggiornaContesto() {

        ? `Domanda su <b>${esc(selezione)}</b>`

    // INVIO DOMANDA
    async function invia(e) {
      e.preventDefault();
      const domanda = $('chat-input').value.trim();
      if (!domanda || inAttesa) return;
      if (!CONFIG.token || !CONFIG.project) {
        aggiungi('errore', 'Chat non configurata: in questa mappa mancano <code>chat.token</code> e <code>chat.project</code>. Chiedi a Claude di rigenerarla.');
        return;
      }

      const selezione = MAPPA_CHAT.selezione();
      aggiungi('utente', paragrafo(esc(domanda)), selezione);
      $('chat-input').value = '';
      inAttesa = true;
      $('chat-send').disabled = true;
      $('chat-open').classList.add('pensa');
      const inizio = Date.now();
      const attesa = aggiungi('info', 'Sto pensando…');
      const timer = setInterval(() => {
        attesa.textContent = `Sto pensando… ${Math.round((Date.now() - inizio) / 1000)} s`;
      }, 1000);

      try {
        const res = await fetch(`${SERVER}/chiedi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: CONFIG.token,
            project: CONFIG.project,
            tipo: MAPPA_CHAT.tipo,
            titolo: MAPPA_CHAT.dati.title,
            mappa: JSON.stringify(MAPPA_CHAT.mappa()),
            selezione,
            storia: storia.slice(-MAX_STORIA),
            domanda,
            modalita: $('chat-modo').value,
          }),
        });
        const corpo = await res.json();
        if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
        storia.push({ ruolo: 'utente', testo: selezione ? `[su ${selezione}] ${domanda}` : domanda }, { ruolo: 'claude', testo: corpo.risposta });
        aggiungi('claude', markdown(corpo.risposta));
        if ($('chat').hidden) document.querySelector('#chat-open .dot').classList.add('pronta');
      } catch (err) {
        if (err instanceof TypeError) serverSpento();
        else aggiungi('errore', esc(err.message));
      } finally {
        clearInterval(timer);
        attesa.remove();
        inAttesa = false;
        $('chat-send').disabled = false;
        $('chat-open').classList.remove('pensa');
        controllaServer();
      }
    }

    // INDIZI
    // Graduali (prima la zona, poi il punto) e preparati dalla skill: dicono dove guardare, mai cosa cambiare
    const INDIZI = Array.isArray(MAPPA_CHAT.dati.indizi) ? MAPPA_CHAT.dati.indizi : [];
    let indiziUsati = 0;

    let luceAttiva = null;

    function illumina(indizio) {
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      const trovati = indizio.punti.map(MAPPA_CHAT.trova).filter(Boolean);
      trovati.forEach((el) => el.classList.add('luce'));
      if (trovati.length === 1) trovati[0].classList.add('luce-zoom');
      document.body.classList.add('con-indizio');
      return trovati;
    }

    function spegniLuce() {
      luceAttiva = null;
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      document.body.classList.remove('con-indizio');
    }

    // La mappa dati si ridisegna quando apri un riquadro: la luce va riaccesa sui riquadri nuovi
    document.addEventListener('mappa-ridisegnata', () => {
      if (luceAttiva) illumina(luceAttiva);
    });

    function accendiLuce(indizio) {
      luceAttiva = indizio;
      const trovati = illumina(indizio);
      if (!trovati.length) return;
      // Nella mappa struttura si scorre il telefono intero: scorrere dentro lo schermo simulato lo sposterebbe
      (trovati[0].closest('.frame') || trovati[0]).scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      setTimeout(() => liberaVista(trovati), 600);
    }

    // Se la chat copre i punti illuminati, si sposta sul lato opposto della finestra
    function liberaVista(trovati) {
      const chat = $('chat');
      if (chat.hidden) return;
      const c = chat.getBoundingClientRect();
      const coperto = trovati.some((el) => {
        const r = el.getBoundingClientRect();
        return r.left < c.right && r.right > c.left && r.top < c.bottom && r.bottom > c.top;
      });
      if (!coperto) return;
      const aDestra = c.left + c.width / 2 < window.innerWidth / 2;
      Object.assign(chat.style, {
        left: `${aDestra ? window.innerWidth - c.width - MARGINE : MARGINE}px`,
        top: `${c.top}px`,
        bottom: 'auto',
      });
      tieniDentro(chat);
      mascotteSottoChat();
    }

    function mostraIndizio(i) {
      const indizio = INDIZI[i];
      const tipo = indizio.punti.length > 1 ? 'zona' : 'punto';
      const msg = aggiungi('suggerimento', `<div class="par"><b>&#x1F4A1; Indizio ${i + 1} di ${INDIZI.length} · ${tipo}: ${esc(indizio.punti.join(', '))}</b><br>${inline(esc(indizio.testo))}</div><button type="button" data-rivedi>Illumina di nuovo</button> <button type="button" data-spegni>Spegni la luce</button>`);
      msg.querySelector('[data-rivedi]').addEventListener('click', () => accendiLuce(indizio));
      msg.querySelector('[data-spegni]').addEventListener('click', spegniLuce);
      accendiLuce(indizio);
    }

    function chiediIndizio() {
      if ($('chat-log').querySelector('[data-conferma]')) return;
      if (indiziUsati >= INDIZI.length) {
        aggiungi('info', 'Indizi finiti: da qui il ragionamento è tuo. La soluzione la do solo se la chiedi esplicitamente nella chat di Claude Code.');
        return;
      }
      const n = indiziUsati + 1;
      const msg = aggiungi('suggerimento', `<div class="par" data-conferma>Vuoi l'indizio ${n} di ${INDIZI.length}? ${n === 1 ? 'Ti illumino la zona in cui guardare.' : 'Ti illumino il punto preciso.'} Non ti dirò cosa cambiare.</div><button type="button" data-si>Sì, mostramelo</button> <button type="button" data-no>No, ci provo ancora</button>`);
      msg.querySelector('[data-si]').addEventListener('click', () => {
        msg.remove();
        mostraIndizio(indiziUsati);
        indiziUsati += 1;
      }, { once: true });
      msg.querySelector('[data-no]').addEventListener('click', () => msg.remove(), { once: true });
    }

    $('chat-hint').hidden = INDIZI.length === 0;
    $('chat-hint').addEventListener('click', chiediIndizio);

    // AZIONI SULLA MAPPA
    // Apri cartella ed elimina passano dal server locale: la pagina da sola non può toccare i file
    const FILE_MAPPA = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1');
    let daConfermare = null;

    async function azioneMappa(azione) {
      const res = await fetch(`${SERVER}/${azione}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: CONFIG.token, file: FILE_MAPPA }),
      });
      const corpo = await res.json();
      if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
    }

    // Eliminare chiede un secondo clic entro 4 secondi
    $('panel').addEventListener('click', async (e) => {
      const bottone = e.target.closest('[data-azione]');
      if (!bottone) return;
      if (!CONFIG.token) {
        showToast('Questa mappa non è collegata al server locale: chiedi a Claude di rigenerarla');
        return;
      }
      const azione = bottone.dataset.azione;
      if (azione === 'elimina' && daConfermare !== bottone) {
        daConfermare = bottone;
        bottone.textContent = 'Sicuro? Clicca di nuovo';
        bottone.classList.add('pericolo');
        setTimeout(() => {
          if (daConfermare !== bottone) return;
          daConfermare = null;
          bottone.textContent = 'Elimina mappa';
          bottone.classList.remove('pericolo');
        }, 4000);
        return;
      }
      try {
        await azioneMappa(azione);
        if (azione === 'elimina') document.body.innerHTML = '<p class="eliminata">Mappa eliminata dal PC. Puoi chiudere questa scheda.</p>';
      } catch (err) {
        showToast(err instanceof TypeError ? `Il server locale è spento: avvialo con <code>${esc(AVVIO)}</code>` : esc(err.message));
      }
    });

    // MASCOTTE
    // Ogni carattere è un pixel: D contorno, P arancione, L riflesso, W bianco occhio, K pupilla e bocca, R guance
    const SPRITE = [
      '..DDDDDDDD..',
      '.DPPPPPPPPD.',
      'DPLLPPPPPPPD',
      'DPLPWWPPWWPD',
      'DPPPWKPPWKPD',
      'DPPPWKPPWKPD',
      'DPRPPPPPPRPD',
      'DPPPPKKKPPPD',
      '.DPPPPPPPPD.',
      '..DPDDDDDD..',
      '..DD........',
      '.DD.........',
    ];
    const PIXEL = { D: '#5c2414', P: '#d97757', L: '#f5c4ad', W: '#ffffff', K: '#2b130b', R: '#f9a8a0' };
    const pixel = (x, y, c) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PIXEL[c]}"/>`;
    // Sotto occhi e bocca va il colore del corpo: si vede quando cambia espressione
    const mobile = (x, y, c) => (y >= 3 && y <= 5 && 'WK'.includes(c)) || (y === 7 && c === 'K');
    const corpo = SPRITE.flatMap((riga, y) => [...riga].map((c, x) => (PIXEL[c] ? pixel(x, y, mobile(x, y, c) ? 'P' : c) : ''))).join('');
    const bocca = `<g class="bocca">${[5, 6, 7].map((x) => pixel(x, 7, 'K')).join('')}</g>`;
    // Occhi sgranati 3×3 con la pupilla al centro e bocca spalancata con la lingua
    const PAURA = [
      ...[3, 7].flatMap((x0) => [2, 3, 4].flatMap((y) => [0, 1, 2].map((dx) => [x0 + dx, y, y === 3 && dx === 1 ? 'K' : 'W']))),
      [5, 6, 'K'], [6, 6, 'K'], [7, 6, 'K'], [5, 7, 'K'], [6, 7, 'R'], [7, 7, 'K'], [5, 8, 'K'], [6, 8, 'K'], [7, 8, 'K'],
    ];
    const paura = `<g class="paura">${PAURA.map(([x, y, c]) => pixel(x, y, c)).join('')}</g>`;
    const occhio = (x0) => `<g class="eye">${[3, 4, 5].flatMap((y) => [x0, x0 + 1].map((x) => pixel(x, y, SPRITE[y][x]))).join('')}</g>`;
    const spirale = (cx, cy) => {
      const punti = Array.from({ length: 61 }, (_, i) => {
        const angolo = (i / 60) * 4 * Math.PI;
        const raggio = 0.08 + (1.05 * i) / 60;
        return `${(cx + raggio * Math.cos(angolo)).toFixed(2)},${(cy + raggio * Math.sin(angolo)).toFixed(2)}`;
      });
      return `<g class="ipno"><circle cx="${cx}" cy="${cy}" r="1.3" fill="${PIXEL.W}"/><polyline class="spirale" style="transform-origin: ${cx}px ${cy}px" points="${punti.join(' ')}" fill="none" stroke="${PIXEL.K}" stroke-width=".3" stroke-linecap="round"/></g>`;
    };
    // DECORAZIONI DELLE MODALITÀ
    // Pixel fuori dal corpo (la tela va da -2 a 15 in orizzontale e da -4 a 11 in verticale): ognuna si vede solo nella sua modalità
    const COLORI_ACCESSORI = { o: '#141312', g: '#9b968a', A: '#a7afb8', a: '#5f6670', L: '#3d6fb6', P: '#f4f2ec', N: '#22252b', n: '#454b55', Y: '#f2c14e', K: '#2b130b', C: '#4b5563', T: '#2bb3a3', t: '#8fe3d8', S: '#111111', s: '#6b7280', M: '#f4f2ec', m: '#c9c4b8', B: '#6b3e26', V: '#e6e6e6' };
    const punti = (colore, coppie) => coppie.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${COLORI_ACCESSORI[colore]}"/>`).join('');
    const intervallo = (da, a, y) => Array.from({ length: a - da + 1 }, (_, i) => [da + i, y]);
    // Gli occhi sono larghi 2 pixel e distano 2 pixel: una montatura a pixel interi li coprirebbe, quindi è a linee sottili
    const OCCHIALI = `<g class="occhiali" fill="none" stroke="#2b130b" stroke-width=".35"><rect x="3.55" y="2.6" width="2.9" height="3.8" rx=".5"/><rect x="7.55" y="2.6" width="2.9" height="3.8" rx=".5"/><path d="M6.45 3.6h1.1M3.55 3.4h-1.3M10.45 3.4h1.3"/></g>`;
    const ACCESSORI = [
      // Insegnante: occhiali dorati e un libro aperto in mano, con la piega al centro
      `<g class="acc acc-insegnante"><g class="viso">${OCCHIALI}</g>${punti('P', [[11, 7], [12, 7], [14, 7], [15, 7], [11, 8], [12, 8], [14, 8], [15, 8], [11, 9], [12, 9], [14, 9], [15, 9]])}${punti('g', [[13, 7], [13, 8], [13, 9]])}${punti('m', [[12, 8], [15, 8]])}${punti('L', intervallo(11, 15, 10))}</g>`,
      // Traduttore: cuffie da interprete e microfono a lato, con il bordo scuro per staccarlo dal corpo
      `<g class="acc acc-traduttore">${punti('C', [...intervallo(3, 8, -2), [1, -1], [2, -1], [9, -1], [10, -1], [0, 0], [11, 0], [-1, 1], [12, 1], [-1, 2], [12, 2]])}${punti('T', [[-2, 3], [-2, 4], [-2, 5], [-1, 4], [-1, 5], [-1, 6], [-2, 6], [13, 3], [13, 4], [13, 5], [13, 6], [12, 4], [12, 5], [12, 6]])}${punti('t', [[-1, 3], [12, 3]])}${punti('o', [[-2, 7], [-1, 7], [-3, 8], [-3, 9], [0, 8], [0, 9]])}${punti('s', [[-2, 8], [-1, 8], [-2, 9], [-1, 9]])}${punti('V', [[-2, 8]])}${punti('N', [[-2, 10], [-1, 10], [-2, 11]])}</g>`,
      // Senior developer: occhiali da sole e un portatile davanti, visto dal dorso argentato con il logo
      `<g class="acc acc-senior"><g class="viso">${punti('S', [...intervallo(2, 10, 3), [3, 4], [4, 4], [5, 4], [7, 4], [8, 4], [9, 4], [4, 5], [8, 5]])}${punti('s', [[3, 3], [7, 3]])}</g>${punti('A', [...intervallo(11, 15, 5), [11, 6], [15, 6], [11, 7], [15, 7], ...intervallo(11, 15, 8)])}${punti('A', [...intervallo(12, 14, 6), ...intervallo(12, 14, 7)])}${punti('V', [[13, 6]])}${punti('a', intervallo(10, 15, 9))}${punti('n', intervallo(10, 15, 10))}</g>`,
    ].join('');
    // Stelline che compaiono intorno quando cambi modalità
    const stellina = (x, y) => punti('Y', [[x, y], [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]);
    const SCINTILLE = `<g class="scintille">${stellina(-1, -2)}${stellina(14, -1)}${stellina(-1, 9)}${stellina(15, 6)}</g>`;
    $('chat-open').insertAdjacentHTML('afterbegin', `<svg class="sprite" viewBox="-2 -4 18 16" aria-hidden="true">${corpo}${occhio(4)}${occhio(8)}${bocca}${spirale(5, 4.5)}${spirale(9, 4.5)}${paura}${ACCESSORI}${SCINTILLE}</svg>`);

    // TRASCINAMENTO
    // Chat e mascotte sono incollate: la chat sta sempre sopra la mascotte e chi viene spostato si porta dietro l'altro
    const MARGINE = 8;
    const STACCO = 6;
    const SOGLIA = 4;

    const sposta = (el, left, top) => Object.assign(el.style, { left: `${left}px`, top: `${top}px`, bottom: 'auto' });

    function tieniDentro(el) {
      if (!el.style.top || el.hidden) return;
      const box = el.getBoundingClientRect();
      sposta(
        el,
        Math.min(Math.max(box.left, MARGINE), window.innerWidth - box.width - MARGINE),
        Math.min(Math.max(box.top, MARGINE), window.innerHeight - box.height - MARGINE),
      );
    }

    // La chat si mette sopra la mascotte; se sopra non c'è spazio scendono insieme
    function chatSopraMascotte() {
      const chat = $('chat');
      if (chat.hidden) return;
      const omino = $('chat-open').getBoundingClientRect();
      const left = Math.min(Math.max(omino.left, MARGINE), window.innerWidth - chat.offsetWidth - MARGINE);
      const top = Math.max(MARGINE, omino.top - chat.offsetHeight - STACCO);
      sposta(chat, left, top);
      sposta($('chat-open'), left, top + chat.offsetHeight + STACCO);
    }

    // La mascotte si mette sotto la chat; se sotto non c'è spazio salgono insieme
    function mascotteSottoChat() {
      const chat = $('chat');
      if (chat.hidden || !chat.style.top) return;
      const box = chat.getBoundingClientRect();
      const omino = $('chat-open');
      const sfora = box.bottom + STACCO + omino.offsetHeight - (window.innerHeight - MARGINE);
      const top = Math.max(MARGINE, box.top - Math.max(0, sfora));
      sposta(chat, box.left, top);
      sposta(omino, box.left, top + chat.offsetHeight + STACCO);
    }

    function rendiTrascinabile(el, maniglia, { mentreSposti, quandoLasci }) {
      maniglia.addEventListener('pointerdown', (e) => {
        const bottone = e.target.closest('button');
        if (e.button !== 0 || (bottone && bottone !== maniglia) || e.target.closest('select')) return;
        const box = el.getBoundingClientRect();
        const dx = e.clientX - box.left;
        const dy = e.clientY - box.top;
        let mosso = false;
        maniglia.setPointerCapture(e.pointerId);

        // Sotto la soglia è un clic, non un trascinamento
        const muovi = (ev) => {
          if (!mosso && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < SOGLIA) return;
          if (!mosso) {
            mosso = true;
            el.classList.add('dragging');
          }
          sposta(el, ev.clientX - dx, ev.clientY - dy);
          tieniDentro(el);
          mentreSposti();
        };
        const lascia = () => {
          maniglia.removeEventListener('pointermove', muovi);
          el.classList.remove('dragging');
          if (mosso) quandoLasci?.();
        };
        maniglia.addEventListener('pointermove', muovi);
        maniglia.addEventListener('pointerup', lascia, { once: true });
        maniglia.addEventListener('pointercancel', lascia, { once: true });
      });
    }

    // Dopo un trascinamento il browser manda comunque un clic: va ignorato
    let ignoraClic = false;
    $('chat-open').addEventListener('pointerdown', () => {
      ignoraClic = false;
    });
    rendiTrascinabile($('chat-open'), $('chat-open'), {
      mentreSposti: chatSopraMascotte,
      quandoLasci: () => {
        ignoraClic = true;
      },
    });
    rendiTrascinabile($('chat'), $('chat').querySelector('.chat-head'), { mentreSposti: mascotteSottoChat });
    $('chat').querySelector('.chat-head').addEventListener('dblclick', (e) => {
      if (e.target.closest('button')) return;
      $('chat').classList.remove('big');
      $('chat-big').setAttribute('aria-pressed', false);
      Object.assign($('chat').style, { width: '', height: '' });
      chatSopraMascotte();
    });
    new ResizeObserver(mascotteSottoChat).observe($('chat'));
    window.addEventListener('resize', () => {
      tieniDentro($('chat-open'));
      chatSopraMascotte();
    });

    // APERTURA E COMANDI
    $('chat-open').addEventListener('click', () => {
      if (ignoraClic) {
        ignoraClic = false;
        return;
      }
      $('chat').hidden = !$('chat').hidden;
      if ($('chat').hidden) return;
      document.querySelector('#chat-open .dot').classList.remove('pronta');
      chatSopraMascotte();
      aggiornaContesto();
      controllaServer();
      $('chat-input').focus();
    });
    $('chat-close').addEventListener('click', () => {
      $('chat').hidden = true;
    });
    $('chat-big').addEventListener('click', (e) => {
      Object.assign($('chat').style, { width: '', height: '' });
      e.currentTarget.setAttribute('aria-pressed', $('chat').classList.toggle('big'));
      mascotteSottoChat();
    });
    $('chat-clear').addEventListener('click', () => {
      storia.length = 0;
      $('chat-log').innerHTML = '';
    });
    $('chat-form').addEventListener('submit', invia);
    // La modalità scelta resta anche nelle prossime pagine
    try {
      $('chat-modo').value = localStorage.getItem('chattino.modo') || 'normale';
    } catch {}
    if (!$('chat-modo').value) $('chat-modo').value = 'normale';
    // CAMBIO DECORAZIONI
    // Chattino salta e brilla; a metà salto si cambia d'abito, così il cambio non si vede
    let timerCambio;
    function cambiaDecorazioni(modo) {
      const omino = $('chat-open');
      clearTimeout(timerCambio);
      omino.classList.remove('cambia');
      void omino.offsetWidth;
      omino.classList.add('cambia');
      timerCambio = setTimeout(() => {
        omino.dataset.modo = modo;
        timerCambio = setTimeout(() => omino.classList.remove('cambia'), 400);
      }, 300);
    }
    $('chat-open').dataset.modo = $('chat-modo').value;
    $('chat-modo').addEventListener('change', () => {
      try {
        localStorage.setItem('chattino.modo', $('chat-modo').value);
      } catch {}
      cambiaDecorazioni($('chat-modo').value);
    });
    // I tasti scritti nella chat non devono muovere la selezione della mappa
    $('chat').addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') $('chat').hidden = true;
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input') invia(e);
    });
    document.addEventListener('click', aggiornaContesto);
    document.addEventListener('keyup', aggiornaContesto);

    controllaServer();
  })();
</script>
</body>
</html>
