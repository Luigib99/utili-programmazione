<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramma pagina</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --component: #3b82f6;
    --component-bg: #0f2547;
    --view: #8b949e;
    --view-bg: #161b22;
    --control: #facc15;
    --control-bg: #3a3008;
    --text-box: #a5d6ff;
    --text-box-bg: #0d1a2b;
    --list: #d2a8ff;
    --list-bg: #241a33;
    --accent: #ffffff;
    --syn-var: #79c0ff;
    --syn-string: #a5d6ff;
    --syn-number: #ffa657;
    --syn-literal: #ff7b72;
    --syn-function: #d2a8ff;
    --syn-type: #56d4dd;
    --syn-file: #8b949e;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    margin: 2px 0 0;
    color: var(--muted);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    color: var(--muted);
    font-size: 12px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 14px;
    height: 14px;
    border: 2px solid;
    border-radius: 3px;
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--muted);
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    height: calc(100vh - 74px);
  }

  #page {
    overflow: auto;
    padding: 24px;
  }

  #screen {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }

  #panel {
    overflow: auto;
    padding: 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      height: auto;
    }

    #panel {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  .box {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 6px 8px 8px;
    border: 2px solid;
    border-radius: 10px;
    cursor: pointer;
    transition: filter .15s;
  }

  .box.component {
    background: var(--component-bg);
    border-color: var(--component);
  }

  .box.view {
    background: var(--view-bg);
    border-color: var(--view);
    border-style: dashed;
  }

  .box.control {
    background: var(--control-bg);
    border-color: var(--control);
  }

  .box.text {
    background: var(--text-box-bg);
    border-color: var(--text-box);
  }

  .box.list {
    background: var(--list-bg);
    border-color: var(--list);
  }

  .box.hover {
    filter: brightness(1.3);
  }

  .box.sel {
    border-color: var(--accent);
    border-style: solid;
  }

  .box.grow {
    flex: 1;
  }

  .box-head {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    align-items: baseline;
  }

  .num {
    padding: 0 6px;
    background: var(--bg);
    border: 1px solid currentColor;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 700;
  }

  .box.component > .box-head .num { color: var(--component); }
  .box.view > .box-head .num { color: var(--view); }
  .box.control > .box-head .num { color: var(--control); }
  .box.text > .box-head .num { color: var(--text-box); }
  .box.list > .box-head .num { color: var(--list); }

  .name {
    font-weight: 700;
  }

  .file {
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    padding: 0 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
  }

  .badge.condition {
    border-color: var(--syn-number);
    color: var(--syn-number);
  }

  .label {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12.5px;
  }

  .children {
    display: flex;
    flex: 1;
    gap: 8px;
    margin-top: 6px;
  }

  .children.column {
    flex-direction: column;
  }

  .children.row {
    flex-direction: row;
    align-items: stretch;
  }

  .children.row > .box {
    flex: 1 1 0;
  }

  .children.row > .box.fixed {
    flex: 0 1 auto;
    max-width: 35%;
  }

  .box-head > * {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  a.code-link {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }

  a.code-link:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 10;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[hidden] {
    display: none;
  }

  #toast code {
    color: var(--syn-file);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .panel-tag {
    display: inline-block;
    padding: 1px 8px;
    border: 1px solid;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .panel-tag.component { color: var(--component); }
  .panel-tag.view { color: var(--view); }
  .panel-tag.control { color: var(--control); }
  .panel-tag.text { color: var(--text-box); }
  .panel-tag.list { color: var(--list); }

  #panel h2 {
    margin: 10px 0 4px;
    font-size: 17px;
  }

  #panel h3 {
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .route {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .explanation {
    margin: 0;
  }

  code .tk-var { color: var(--syn-var); }
  code .tk-string { color: var(--syn-string); }
  code .tk-number { color: var(--syn-number); }
  code .tk-literal { color: var(--syn-literal); }
  code .tk-function { color: var(--syn-function); }
  code .tk-type { color: var(--syn-type); }
  code .tk-file { color: var(--syn-file); }

  #panel code,
  .box code {
    padding: 0 4px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .terms {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    margin: 0;
    font-size: 13px;
  }

  .terms dt {
    font-weight: 600;
  }

  .terms dd {
    margin: 0;
    color: var(--muted);
  }

  .terms.code dt {
    color: var(--syn-var);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="legend">
    <span><i class="swatch" style="border-color: var(--component); background: var(--component-bg)"></i>componente</span>
    <span><i class="swatch" style="border-color: var(--view); background: var(--view-bg); border-style: dashed"></i>contenitore</span>
    <span><i class="swatch" style="border-color: var(--list); background: var(--list-bg)"></i>lista / pagine</span>
    <span><i class="swatch" style="border-color: var(--control); background: var(--control-bg)"></i>pulsante / input</span>
    <span><i class="swatch" style="border-color: var(--text-box); background: var(--text-box-bg)"></i>testo / immagine</span>
  </div>
  <div class="controls">
    <button id="prev" title="Riquadro precedente (freccia su)">&uarr;</button>
    <button id="next" title="Riquadro successivo (freccia giù)">&darr;</button>
  </div>
</header>
<main>
  <div id="page"><div id="screen"></div></div>
  <aside id="panel"></aside>
  <div id="toast" role="status" hidden></div>
</main>

<!--
  DATI DELLA PAGINA (unica parte da modificare). La pagina è un albero di riquadri uno dentro l'altro,
  disegnati nell'ordine e nella direzione in cui compaiono sullo schermo; i numeri S1, S2… sono assegnati
  in automatico dall'alto in basso (prima il riquadro, poi i suoi figli).
  - name: nome nel codice (componente, View con il suo stile, es. "footerContainer") o descrizione breve
  - kind: "component" (componente del progetto) | "view" (contenitore) | "list" (lista, pager, ripetizioni)
          | "control" (pulsante, input, interruttore) | "text" (testo, icona, immagine)
  - file, path, line: dove si trova; path assoluto con "/" e riga verificata: rendono cliccabile il nome
  - label: (opzionale) cosa si vede, una riga (es. "titolo in maiuscolo", "freccia →")
  - direction: (opzionale) "column" (predefinita) | "row": come sono messi i figli
  - grow: (opzionale) true se il riquadro occupa lo spazio libero (flex: 1)
  - fixed: (opzionale) true se in una riga ha larghezza fissa (es. un pulsante tondo)
  - condition: (opzionale) quando compare (es. "solo admin", "pagina 9")
  - badges: (opzionale) note brevi sul riquadro (es. "×10", "copia di S5", "position: absolute")
  - explanation: cosa è e cosa fa il riquadro, 1-3 frasi semplici
  - props: (opzionale) { "nomeProp": "valore o significato" }
  - style: (opzionale) { "proprietà": "valore" } solo gli stili che contano per la grafica (colori, misure, posizione)
  - terms: (opzionale) { "termine": "significato semplice" }
  - children: (opzionale) riquadri contenuti, in ordine di comparsa
  - nei testi, il codice va tra backtick (`esempio`) e viene mostrato come codice
  Non inserire la sequenza </script> nel JSON.
-->
<script id="page-data" type="application/json">
{
  "title": "Titolo della pagina",
  "subtitle": "progetto · data · cosa rappresenta",
  "root": {
    "name": "Schermata", "kind": "component", "file": "Schermata.jsx",
    "explanation": "Il componente principale della pagina.",
    "children": [
      { "name": "header", "kind": "view", "direction": "row", "label": "barra in alto",
        "explanation": "Contenitore del titolo.",
        "children": [
          { "name": "Titolo", "kind": "text", "label": "testo del titolo", "explanation": "Il titolo della pagina." },
          { "name": "Chiudi", "kind": "control", "fixed": true, "label": "X", "explanation": "Chiude la pagina." }
        ]
      },
      { "name": "contenuto", "kind": "list", "grow": true, "badges": ["×3"], "explanation": "Le pagine scorrevoli." }
    ]
  }
}
</script>

<script>
  const PAGE = JSON.parse(document.getElementById('page-data').textContent);
  const boxes = [];
  const state = { selected: null };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // EVIDENZIAZIONE CODICE NEI TESTI
  const TOKEN = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b(true|false|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b|([A-Za-z_$][\w$]*)/g;
  const TOKEN_CLASSES = ['tk-string', 'tk-number', 'tk-literal', 'tk-function', 'tk-type', 'tk-var'];

  const highlight = (code) => {
    if (/^[\w./-]+\.(jsx?|tsx?|json|md)$/.test(code)) return `<span class="tk-file">${esc(code)}</span>`;
    let html = '';
    let last = 0;
    for (const match of code.matchAll(TOKEN)) {
      const group = match.slice(1).findIndex((g) => g !== undefined);
      html += esc(code.slice(last, match.index)) + `<span class="${TOKEN_CLASSES[group]}">${esc(match[0])}</span>`;
      last = match.index + match[0].length;
    }
    return html + esc(code.slice(last));
  };

  const fmt = (s) => (s || '')
    .split(/(`[^`]+`)/)
    .map((part) => (/^`[^`]+`$/.test(part) ? `<code>${highlight(part.slice(1, -1))}</code>` : esc(part)))
    .join('');

  const codeLink = (box, line, inner) => {
    if (!box.path) return inner;
    const target = `${box.path.replace(/\\/g, '/')}:${line || 1}`;
    const href = encodeURI(`vscode://file/${target}:1`);
    return `<a class="code-link" href="${esc(href)}" data-copy="${esc(target)}" title="Apri in VS Code (nel browser integrato: copia il percorso per Ctrl+P)">${inner}</a>`;
  };

  // COPIA PERCORSO
  // Il browser integrato di VS Code blocca i link vscode:// senza avvisare: il percorso copiato si apre con Ctrl+P
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
      toast.hidden = true;
    }, 4000);
  }

  document.addEventListener('click', async (e) => {
    const link = e.target.closest('a.code-link');
    if (!link) return;
    const copied = await copyText(link.dataset.copy);
    showToast(copied
      ? `Copiato <code>${esc(link.dataset.copy)}</code><br>In VS Code premi <kbd>Ctrl</kbd>+<kbd>P</kbd>, incolla e premi <kbd>Invio</kbd>`
      : 'Copia non riuscita: apri il file in un browser esterno per usare il link diretto');
  });

  // RENDER RIQUADRI
  // Il file si mostra nel riquadro solo se cambia rispetto a quello del contenitore
  function renderBox(box, parentFile = null) {
    const index = boxes.length;
    box.number = `S${index + 1}`;
    boxes.push(box);

    const kind = box.kind || 'view';
    const div = document.createElement('div');
    div.className = ['box', kind, box.grow ? 'grow' : '', box.fixed ? 'fixed' : ''].join(' ');
    div.dataset.i = index;

    const badges = [
      box.condition ? `<span class="badge condition">${esc(box.condition)}</span>` : '',
      ...(box.badges || []).map((b) => `<span class="badge">${esc(b)}</span>`),
    ].join('');

    div.innerHTML = `
      <div class="box-head">
        <span class="num">${box.number}</span>
        ${codeLink(box, box.line, `<span class="name">${esc(box.name)}</span>`)}
        ${box.file && box.file !== parentFile ? codeLink(box, 1, `<span class="file">${esc(box.file)}</span>`) : ''}
        ${badges}
      </div>
      ${box.label ? `<div class="label">${fmt(box.label)}</div>` : ''}`;

    div.addEventListener('click', (e) => {
      if (e.target.closest('a.code-link')) return;
      e.stopPropagation();
      select(index);
    });
    div.addEventListener('mouseover', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.box.hover').forEach((b) => b.classList.remove('hover'));
      div.classList.add('hover');
    });
    div.addEventListener('mouseleave', () => div.classList.remove('hover'));

    if (box.children && box.children.length) {
      const children = document.createElement('div');
      children.className = `children ${box.direction === 'row' ? 'row' : 'column'}`;
      box.children.forEach((child) => children.appendChild(renderBox(child, box.file || parentFile)));
      div.appendChild(children);
    }
    return div;
  }

  // RENDER PANNELLO
  function renderPanel() {
    const panel = document.getElementById('panel');

    if (state.selected === null) {
      panel.innerHTML = `
        <h2>Come leggere il diagramma</h2>
        <p class="hint">Ogni riquadro è un pezzo della pagina, messo dove compare sullo schermo: i riquadri dentro un altro sono i suoi contenuti. Le proporzioni sono indicative, ricavate dal codice.</p>
        <p class="hint">I numeri <b>S1, S2…</b> sono il riferimento comune: puoi scrivere "sposta S4 sopra S2". Clicca un riquadro per vedere file, props e stile.</p>
        <p class="hint">Usa <kbd>&uarr;</kbd> <kbd>&darr;</kbd> per scorrere i riquadri, <kbd>Esc</kbd> per tornare qui.</p>`;
      return;
    }

    const box = boxes[state.selected];
    const kind = box.kind || 'view';
    const KIND_LABELS = { component: 'COMPONENTE', view: 'CONTENITORE', list: 'LISTA / PAGINE', control: 'PULSANTE / INPUT', text: 'TESTO / IMMAGINE' };
    const list = (title, entries, cls) => (entries.length
      ? `<h3>${title}</h3><dl class="terms ${cls}">${entries.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(String(v))}</dd>`).join('')}</dl>`
      : '');
    const children = (box.children || []).map((c) => `${c.number} ${esc(c.name)}`).join(' · ');

    panel.innerHTML = `
      <span class="panel-tag ${kind}">${KIND_LABELS[kind] || kind}</span>
      <h2>${box.number}. ${codeLink(box, box.line, esc(box.name))}${box.file ? ` ${codeLink(box, 1, `<span class="route">${esc(box.file)}</span>`)}` : ''}</h2>
      ${box.path ? `<p class="hint">Clic sul nome per aprirlo in VS Code${box.line ? ` alla riga ${box.line}` : ''}.</p>` : ''}
      ${box.condition ? `<p class="route">Compare: ${esc(box.condition)}</p>` : ''}
      ${box.explanation ? `<h3>Cos'è</h3><p class="explanation">${fmt(box.explanation)}</p>` : ''}
      ${children ? `<h3>Contiene</h3><p class="explanation">${children}</p>` : ''}
      ${list('Props', Object.entries(box.props || {}), 'code')}
      ${list('Stile', Object.entries(box.style || {}), 'code')}
      ${list('Termini', Object.entries(box.terms || {}), '')}`;
  }

  // SELEZIONE E NAVIGAZIONE
  function select(i) {
    state.selected = i;
    document.querySelectorAll('.box').forEach((b) => b.classList.toggle('sel', i !== null && Number(b.dataset.i) === i));
    renderPanel();
  }

  function move(delta) {
    const current = state.selected === null ? -1 : state.selected;
    const next = Math.min(Math.max(current + delta, 0), boxes.length - 1);
    select(next);
    document.querySelector(`.box[data-i="${next}"]`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('title').textContent = PAGE.title;
  document.getElementById('subtitle').textContent = PAGE.subtitle || '';
  document.getElementById('screen').appendChild(renderBox(PAGE.root));
  document.getElementById('prev').addEventListener('click', () => move(-1));
  document.getElementById('next').addEventListener('click', () => move(1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      move(1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      move(-1);
    }
    if (e.key === 'Escape') select(null);
  });

  renderPanel();

  // Apertura diretta su un riquadro: file.html#S3
  const fromHash = location.hash.match(/^#S(\d+)$/i);
  if (fromHash) {
    const target = Number(fromHash[1]) - 1;
    if (target >= 0 && target < boxes.length) select(target);
  }
</script>
</body>
</html>
