<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa struttura</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff4fd8;
    --chip: #ff4fd8;
    --syn-var: #79c0ff;
    --syn-string: #a5d6ff;
    --syn-number: #ffa657;
    --syn-literal: #ff7b72;
    --syn-function: #d2a8ff;
    --syn-type: #56d4dd;
    --syn-file: #8b949e;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    margin: 2px 0 0;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--muted);
  }

  button[aria-pressed="true"] {
    border-color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    height: calc(100vh - 74px);
  }

  #stage {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    overflow: auto;
    padding: 20px 24px;
  }

  .screen-col {
    flex: none;
  }

  .screen-name {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  /* Cornice del telefono: la schermata dentro ha le misure reali, la cornice la rimpicciolisce */
  .frame {
    overflow: hidden;
    border: 8px solid #000;
    border-radius: 40px;
    box-shadow: 0 0 0 2px var(--border), 0 12px 32px rgba(0, 0, 0, .5);
  }

  .device {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: top left;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Ogni elemento è un flex in colonna come in React Native */
  .el {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    cursor: pointer;
  }

  .el.text {
    display: block;
    white-space: pre-wrap;
  }

  .el.image {
    align-items: center;
    justify-content: center;
    background-image: repeating-linear-gradient(45deg, rgba(128, 128, 128, .18) 0 8px, rgba(128, 128, 128, .08) 8px 16px);
    color: #6b6b6b;
    font-size: 11px;
    text-align: center;
  }

  .el.icon {
    align-items: center;
    justify-content: center;
  }

  .el.hover {
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  .el.sel {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }

  .chip {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 5;
    display: none;
    padding: 0 5px;
    background: var(--chip);
    border-radius: 0 0 6px 0;
    color: #000;
    font: 700 11px/16px system-ui, sans-serif;
    pointer-events: none;
  }

  .el.hover > .chip,
  .el.sel > .chip,
  body.numbers .chip {
    display: block;
  }

  #panel {
    overflow: auto;
    padding: 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      height: auto;
    }

    #panel {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  a.code-link {
    color: inherit;
    text-decoration: none;
  }

  a.code-link:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 10;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[hidden] {
    display: none;
  }

  #toast code {
    color: var(--syn-file);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .panel-tag {
    display: inline-block;
    padding: 1px 8px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .badge {
    display: inline-block;
    margin: 0 4px 4px 0;
    padding: 0 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }

  .badge.condition {
    border-color: var(--syn-number);
    color: var(--syn-number);
  }

  #panel h2 {
    margin: 10px 0 4px;
    font-size: 17px;
  }

  #panel h3 {
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .route {
    color: var(--muted);
    font-size: 13px;
  }

  .explanation {
    margin: 0;
  }

  code .tk-var { color: var(--syn-var); }
  code .tk-string { color: var(--syn-string); }
  code .tk-number { color: var(--syn-number); }
  code .tk-literal { color: var(--syn-literal); }
  code .tk-function { color: var(--syn-function); }
  code .tk-type { color: var(--syn-type); }
  code .tk-file { color: var(--syn-file); }

  #panel code {
    padding: 0 4px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .terms {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    margin: 0;
    font-size: 13px;
  }

  .terms dt {
    font-weight: 600;
  }

  .terms dd {
    margin: 0;
    color: var(--muted);
  }

  .terms.code dt {
    color: var(--syn-var);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    vertical-align: -1px;
  }

  .tree {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
  }

  .tree li {
    padding: 2px 0;
    cursor: pointer;
  }

  .tree li:hover {
    color: var(--accent);
  }

  .tree .num {
    display: inline-block;
    min-width: 34px;
    color: var(--accent);
    font-weight: 700;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="controls">
    <button id="numbers" aria-pressed="false" title="Mostra il numero S di ogni elemento">Numeri</button>
    <button id="prev" title="Elemento precedente (freccia su)">&uarr;</button>
    <button id="next" title="Elemento successivo (freccia giù)">&darr;</button>
  </div>
</header>
<main>
  <div id="stage"></div>
  <aside id="panel"></aside>
  <div id="toast" role="status" hidden></div>
</main>

<!--
  DATI DELLA STRUTTURA (unica parte da modificare). Ogni schermata coinvolta è disegnata come appare sul
  telefono: gli elementi sono div flex in colonna come in React Native, con gli stili reali presi dal codice.
  I numeri S1, S2… sono assegnati in automatico in ordine (schermata per schermata, prima un elemento poi i suoi figli).
  - device: (opzionale) { "width": 390, "height": 844 } misure del telefono simulato
  - screens: [{ "name": "cosa mostra", "background": colore di fondo, "root": elemento }]
  Elemento:
  - name: nome nel codice (componente o chiave di stile, es. "footer", "nextButton") o descrizione breve
  - kind: "component" | "view" | "list" | "control" | "text" | "image" | "icon"
  - file, path, line: dove si trova; path assoluto con "/" e riga verificata: rendono cliccabile il nome
  - style: lo stile React Native REALE, già risolto: colori in esadecimale (non "colors.primary"), numeri in punti,
           percentuali come stringhe ("100%"), fontWeight numerico al posto di fontFamily (Regular 400, SemiBold 600, Bold 700);
           paddingHorizontal/Vertical, marginHorizontal/Vertical e elevation sono convertiti dal template
  - styleSource: (opzionale) { "proprietà": "da dove arriva", es. "colors.secondary", "theme.textMuted", "globalStyles.tutorialTitle" }
  - text: testo che si vede (traduzione nella lingua principale del progetto)
  - glyph: per le icone, un carattere che le rappresenta (es. "←", "✕", "☰")
  - image: per le immagini, cosa mostrano (es. "logo dell'app"); le misure vanno in style
  - condition: (opzionale) quando compare (es. "solo admin", "dalla 2ª pagina")
  - badges: (opzionale) note brevi (es. "×11 pallini", "position: absolute")
  - explanation: cosa è, 1-2 frasi semplici
  - props, terms: (opzionali) { "nome": "valore o significato" }
  - children: (opzionale) elementi contenuti, in ordine di comparsa
  Non inserire la sequenza </script> nel JSON.
-->
<script id="page-data" type="application/json">
{
  "title": "Titolo",
  "subtitle": "progetto · data · cosa rappresenta",
  "screens": [
    {
      "name": "Schermata",
      "background": "#f1f1f0",
      "root": {
        "name": "root", "kind": "view", "style": { "flex": 1 },
        "explanation": "La schermata.",
        "children": [
          { "name": "header", "kind": "view", "style": { "backgroundColor": "#05364b", "padding": 20 },
            "children": [ { "name": "titolo", "kind": "text", "text": "Titolo", "style": { "color": "#ffffff", "fontSize": 18, "fontWeight": 700 } } ] }
        ]
      }
    }
  ]
}
</script>

<script>
  const DATA = JSON.parse(document.getElementById('page-data').textContent);
  const DEVICE = { width: 390, height: 844, ...(DATA.device || {}) };
  const elements = [];
  const state = { selected: null };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // EVIDENZIAZIONE CODICE NEI TESTI
  const TOKEN = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b(true|false|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b|([A-Za-z_$][\w$]*)/g;
  const TOKEN_CLASSES = ['tk-string', 'tk-number', 'tk-literal', 'tk-function', 'tk-type', 'tk-var'];

  const highlight = (code) => {
    if (/^[\w./-]+\.(jsx?|tsx?|json|md)$/.test(code)) return `<span class="tk-file">${esc(code)}</span>`;
    let html = '';
    let last = 0;
    for (const match of code.matchAll(TOKEN)) {
      const group = match.slice(1).findIndex((g) => g !== undefined);
      html += esc(code.slice(last, match.index)) + `<span class="${TOKEN_CLASSES[group]}">${esc(match[0])}</span>`;
      last = match.index + match[0].length;
    }
    return html + esc(code.slice(last));
  };

  const fmt = (s) => (s || '')
    .split(/(`[^`]+`)/)
    .map((part) => (/^`[^`]+`$/.test(part) ? `<code>${highlight(part.slice(1, -1))}</code>` : esc(part)))
    .join('');

  const codeLink = (item, line, inner) => {
    if (!item.path) return inner;
    const target = `${item.path.replace(/\\/g, '/')}:${line || 1}`;
    const href = encodeURI(`vscode://file/${target}:1`);
    return `<a class="code-link" href="${esc(href)}" data-copy="${esc(target)}" title="Apri in VS Code (nel browser integrato: copia il percorso per Ctrl+P)">${inner}</a>`;
  };

  // COPIA PERCORSO
  // Il browser integrato di VS Code blocca i link vscode:// senza avvisare: il percorso copiato si apre con Ctrl+P
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
      toast.hidden = true;
    }, 4000);
  }

  document.addEventListener('click', async (e) => {
    const link = e.target.closest('a.code-link');
    if (!link) return;
    const copied = await copyText(link.dataset.copy);
    showToast(copied
      ? `Copiato <code>${esc(link.dataset.copy)}</code><br>In VS Code premi <kbd>Ctrl</kbd>+<kbd>P</kbd>, incolla e premi <kbd>Invio</kbd>`
      : 'Copia non riuscita: apri il file in un browser esterno per usare il link diretto');
  });

  // CONVERSIONE STILE REACT NATIVE → CSS
  const PX = /^(width|height|min|max|padding|margin|top|left|right|bottom|border.*(Radius|Width)|fontSize|lineHeight|gap|rowGap|columnGap|letterSpacing)/;
  const IGNORED = new Set(['resizeMode', 'shadowColor', 'shadowOpacity', 'shadowRadius', 'shadowOffset', 'elevation', 'transform', 'tintColor', 'includeFontPadding', 'textAlignVertical']);

  function toCss(style = {}) {
    const css = {};
    Object.entries(style).forEach(([key, value]) => {
      if (IGNORED.has(key)) return;
      const v = typeof value === 'number' && PX.test(key) ? `${value}px` : value;
      if (key === 'paddingHorizontal') Object.assign(css, { paddingLeft: v, paddingRight: v });
      else if (key === 'paddingVertical') Object.assign(css, { paddingTop: v, paddingBottom: v });
      else if (key === 'marginHorizontal') Object.assign(css, { marginLeft: v, marginRight: v });
      else if (key === 'marginVertical') Object.assign(css, { marginTop: v, marginBottom: v });
      else if (key === 'flex' && typeof value === 'number') css.flex = value > 0 ? `${value} 1 0%` : 'none';
      else css[key] = v;
    });
    if (Object.keys(style).some((key) => /^border\w*Width$/.test(key))) css.borderStyle = style.borderStyle || 'solid';
    if (style.elevation || style.shadowOpacity) {
      const blur = style.shadowRadius ?? (style.elevation || 4) * 1.5;
      css.boxShadow = `0 ${style.shadowOffset?.height ?? 2}px ${blur}px rgba(0, 0, 0, ${style.shadowOpacity ?? 0.25})`;
    }
    return css;
  }

  // RENDER ELEMENTI
  function renderElement(item, screenName) {
    const index = elements.length;
    item.number = `S${index + 1}`;
    item.screenName = screenName;
    elements.push(item);

    const kind = item.kind || 'view';
    const div = document.createElement('div');
    div.className = `el ${kind}`;
    div.dataset.i = index;
    Object.assign(div.style, toCss(item.style));

    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = item.number;
    div.appendChild(chip);

    if (item.text !== undefined) div.appendChild(document.createTextNode(item.text));
    if (item.glyph) div.appendChild(document.createTextNode(item.glyph));
    if (item.image) div.appendChild(document.createTextNode(item.image));

    div.addEventListener('click', (e) => {
      if (e.target.closest('a.code-link')) return;
      e.stopPropagation();
      select(index);
    });
    div.addEventListener('mouseover', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.el.hover').forEach((el) => el.classList.remove('hover'));
      div.classList.add('hover');
    });
    div.addEventListener('mouseleave', () => div.classList.remove('hover'));

    (item.children || []).forEach((child) => div.appendChild(renderElement(child, screenName)));
    return div;
  }

  // RENDER SCHERMATE
  function renderScreens() {
    const stage = document.getElementById('stage');
    const available = Math.max(320, stage.clientHeight - 80);
    const scale = Math.min(1, available / DEVICE.height);

    DATA.screens.forEach((screen) => {
      const col = document.createElement('div');
      col.className = 'screen-col';
      col.innerHTML = `<p class="screen-name">${esc(screen.name)}</p>`;

      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.width = `${DEVICE.width * scale + 16}px`;
      frame.style.height = `${DEVICE.height * scale + 16}px`;

      const device = document.createElement('div');
      device.className = 'device';
      Object.assign(device.style, {
        width: `${DEVICE.width}px`,
        height: `${DEVICE.height}px`,
        transform: `scale(${scale})`,
        background: screen.background || '#ffffff',
      });
      device.appendChild(renderElement(screen.root, screen.name));
      frame.appendChild(device);
      col.appendChild(frame);
      stage.appendChild(col);
    });
  }

  // RENDER PANNELLO
  function renderPanel() {
    const panel = document.getElementById('panel');

    if (state.selected === null) {
      const byScreen = DATA.screens.map((screen) => {
        const items = elements.filter((el) => el.screenName === screen.name);
        return `<h3>${esc(screen.name)}</h3><ul class="tree">${items
          .map((el) => `<li data-i="${elements.indexOf(el)}"><span class="num">${el.number}</span>${esc(el.name)}${el.text ? ` <span class="route">"${esc(el.text.slice(0, 30))}${el.text.length > 30 ? '…' : ''}"</span>` : ''}</li>`)
          .join('')}</ul>`;
      }).join('');
      panel.innerHTML = `
        <h2>Come leggere la mappa</h2>
        <p class="hint">Ogni schermata è disegnata come appare sul telefono, con gli stili presi dal codice: le proporzioni sono simulate, testi e colori sono quelli reali.</p>
        <p class="hint">Passa il mouse su un elemento per vedere il suo numero <b>S</b>, cliccalo per vedere file, props e stile. Con <b>Numeri</b> li vedi tutti insieme.</p>
        <p class="hint">Usa <kbd>&uarr;</kbd> <kbd>&darr;</kbd> per scorrere gli elementi, <kbd>Esc</kbd> per tornare qui.</p>
        ${byScreen}`;
      panel.querySelectorAll('.tree li').forEach((li) => li.addEventListener('click', () => select(Number(li.dataset.i))));
      return;
    }

    const item = elements[state.selected];
    const KIND_LABELS = { component: 'COMPONENTE', view: 'CONTENITORE', list: 'LISTA / PAGINE', control: 'PULSANTE / INPUT', text: 'TESTO', image: 'IMMAGINE', icon: 'ICONA' };
    const isColor = (v) => typeof v === 'string' && /^(#|rgb|hsl)/.test(v);
    const styleRows = Object.entries(item.style || {}).map(([k, v]) => {
      const value = typeof v === 'object' ? JSON.stringify(v) : String(v);
      const source = item.styleSource?.[k] ? ` <span class="route">· ${esc(item.styleSource[k])}</span>` : '';
      return `<dt>${esc(k)}</dt><dd>${isColor(v) ? `<i class="swatch" style="background:${esc(v)}"></i>` : ''}<code>${esc(value)}</code>${source}</dd>`;
    }).join('');
    const list = (title, entries, cls) => (entries.length
      ? `<h3>${title}</h3><dl class="terms ${cls}">${entries.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(String(v))}</dd>`).join('')}</dl>`
      : '');
    const children = (item.children || []).map((c) => `${c.number} ${esc(c.name)}`).join(' · ');
    const badges = [
      item.condition ? `<span class="badge condition">compare: ${esc(item.condition)}</span>` : '',
      ...(item.badges || []).map((b) => `<span class="badge">${esc(b)}</span>`),
    ].join('');

    panel.innerHTML = `
      <span class="panel-tag">${KIND_LABELS[item.kind] || 'ELEMENTO'}</span>
      <h2>${item.number}. ${codeLink(item, item.line, esc(item.name))}${item.file ? ` <span class="route">·</span> ${codeLink(item, 1, `<span class="route">${esc(item.file)}</span>`)}` : ''}</h2>
      <p class="route">${esc(item.screenName)}</p>
      ${badges ? `<p>${badges}</p>` : ''}
      ${item.explanation ? `<h3>Cos'è</h3><p class="explanation">${fmt(item.explanation)}</p>` : ''}
      ${item.text ? `<h3>Testo</h3><p class="explanation">${esc(item.text)}</p>` : ''}
      ${children ? `<h3>Contiene</h3><p class="explanation">${children}</p>` : ''}
      ${list('Props', Object.entries(item.props || {}), 'code')}
      ${styleRows ? `<h3>Stile</h3><dl class="terms code">${styleRows}</dl>` : ''}
      ${list('Termini', Object.entries(item.terms || {}), '')}`;
  }

  // SELEZIONE E NAVIGAZIONE
  function select(i) {
    state.selected = i;
    document.querySelectorAll('.el').forEach((el) => el.classList.toggle('sel', i !== null && Number(el.dataset.i) === i));
    renderPanel();
  }

  function move(delta) {
    const current = state.selected === null ? -1 : state.selected;
    const next = Math.min(Math.max(current + delta, 0), elements.length - 1);
    select(next);
    document.querySelector(`.el[data-i="${next}"]`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('title').textContent = DATA.title;
  document.getElementById('subtitle').textContent = DATA.subtitle || '';
  renderScreens();
  document.getElementById('numbers').addEventListener('click', (e) => {
    const on = document.body.classList.toggle('numbers');
    e.currentTarget.setAttribute('aria-pressed', on);
  });
  document.getElementById('prev').addEventListener('click', () => move(-1));
  document.getElementById('next').addEventListener('click', () => move(1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      move(1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      move(-1);
    }
    if (e.key === 'Escape') select(null);
  });

  renderPanel();

  // Apertura diretta su un elemento: file.html#S3
  const fromHash = location.hash.match(/^#S(\d+)$/i);
  if (fromHash) {
    const target = Number(fromHash[1]) - 1;
    if (target >= 0 && target < elements.length) select(target);
  }
</script>
</body>
</html>
