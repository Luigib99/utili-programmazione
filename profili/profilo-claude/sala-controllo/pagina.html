<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala di controllo</title>
<style>
  :root {
    --bg: #1a1918;
    --bg-input: #141312;
    --surface: #252422;
    --surface-2: #2f2d2a;
    --border: #3a3834;
    --border-forte: #4a4741;
    --text: #f4f2ec;
    --muted: #a6a298;
    --accent: #d97757;
    --accent-chiaro: #f0a988;
    --accent-bg: rgba(217, 119, 87, .14);
    --ok: #6cc07e;
    --ok-bg: rgba(108, 192, 126, .12);
    --danger: #e5534b;
    --danger-text: #ff9f97;
    --chat: var(--accent);
    --chat-bg: var(--accent-bg);
    --raggio: 12px;
    --ombra: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .18);
  }

  * { box-sizing: border-box; }

  /* Spazio della barra di scorrimento sempre riservato: il contenuto non si sposta quando compare */
  html { scrollbar-gutter: stable; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 50% -220px, rgba(217, 119, 87, .13), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: rgba(217, 119, 87, .35); }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 22px;
    padding: 14px 28px;
    background: rgba(26, 25, 24, .78);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
  }

  h1 {
    display: flex;
    align-items: center;
    gap: .25em;
    margin: 0;
    font: 500 20px/1 ui-serif, Georgia, "Times New Roman", serif;
    letter-spacing: -.01em;
  }

  h1 span { color: var(--accent); }

  h1::before {
    content: "";
    width: 22px;
    height: 22px;
    margin-right: 6px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent-chiaro), var(--accent));
    box-shadow: 0 0 18px rgba(217, 119, 87, .45);
  }

  /* Filtri squadrati con gli angoli appena arrotondati */
  .pillole {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .pillola {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    transition: background .15s, color .15s, border-color .15s;
  }

  .pillole .pillola { border-color: transparent; }

  /* La ✕ per togliere un progetto compare solo passandoci sopra */
  .voce-progetto {
    position: relative;
    display: inline-flex;
  }

  .togli-progetto {
    position: absolute;
    top: -6px;
    right: -6px;
    z-index: 1;
    display: none;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    padding: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted);
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
  }

  .voce-progetto:hover .togli-progetto,
  .togli-progetto.pericolo {
    display: inline-flex;
  }

  .togli-progetto:hover { color: var(--text); }

  .togli-progetto.pericolo {
    width: auto;
    padding: 0 8px;
    border-color: var(--danger);
    border-radius: 8px;
    background: var(--surface);
    color: var(--danger-text);
    font-size: 11px;
    white-space: nowrap;
  }

  .aggiungi-progetto {
    min-width: 32px;
    font-size: 15px;
    line-height: 1;
  }

  /* Il percorso può essere lungo: va a capo lui, i tasti restano sulla stessa riga */
  .conferma-progetto { flex-wrap: nowrap; }
  .conferma-progetto .riepilogo { flex: 1; min-width: 0; }
  .conferma-progetto code { margin-left: 4px; overflow-wrap: anywhere; }
  .conferma-progetto .btn { flex-shrink: 0; }
  .conferma-progetto .nota { display: block; margin-top: 4px; }

  .pillola:hover { color: var(--text); background: var(--surface-2); }

  .pillola.attiva {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .aggiornato {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
  }

  nav {
    display: flex;
    gap: 6px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 28px 0;
  }

  nav button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    transition: background .15s, color .15s;
  }

  nav button:hover { color: var(--text); background: var(--surface); }

  nav button.attiva {
    border-color: var(--border);
    background: var(--surface);
    color: var(--text);
    box-shadow: inset 0 -2px 0 var(--accent);
  }

  nav .conta {
    min-width: 22px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  nav button.attiva .conta { background: var(--accent-bg); color: var(--accent-chiaro); }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 28px 120px;
  }

  /* a.btn: i link che sembrano tasti (es. Apri mappa) hanno lo stesso aspetto dei bottoni */
  button.btn, a.btn {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }

  button.btn:hover:not(:disabled), a.btn:hover { border-color: var(--border-forte); background: #37352f; }
  button.btn:active:not(:disabled) { transform: translateY(1px); }
  button.btn:disabled { opacity: .35; cursor: default; }
  button.btn.primario, a.btn.primario { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 500; }
  button.btn.primario:hover:not(:disabled), a.btn.primario:hover { border-color: var(--accent-chiaro); background: #e0866a; }
  .pillola:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.pericolo { border-color: var(--danger); background: rgba(229, 83, 75, .12); color: var(--danger-text); }

  input, textarea, select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-input);
    color: var(--text);
    font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 119, 87, .18);
  }

  .barra {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .barra .spazio { flex: 1; }

  .riepilogo { color: var(--muted); }
  .riepilogo b { color: var(--text); }

  /* Ogni riga è una scheda a sé, staccata dalle altre */
  .lista {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .riga, .scheda, .lista > .vuoto {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
    transition: border-color .15s, background .15s;
  }

  .riga:hover, .scheda:hover { border-color: var(--border-forte); }

  .riga {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 20px;
  }

  .riga .corpo, .scheda .corpo {
    flex: 1;
    min-width: 0;
  }

  .riga .titolo, .scheda .titolo {
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.005em;
  }

  .riga .meta, .contesto .meta, .scheda .meta {
    color: var(--muted);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Larghezza fissa: con o senza Chiudi la barra del contesto resta allineata in tutte le righe */
  .riga .azioni {
    display: flex;
    flex-shrink: 0;
    justify-content: flex-end;
    gap: 8px;
    width: 250px;
  }

  .stato {
    min-width: 80px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    font-size: 11.5px;
    text-align: center;
    white-space: nowrap;
  }

  .stato.corrente {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .scheda.branch.corrente,
  .scheda.branch.corrente:hover,
  .riga.aperta,
  .riga.aperta:hover,
  .scheda.attiva,
  .scheda.attiva:hover {
    border-color: var(--accent);
    background: linear-gradient(var(--accent-bg), var(--accent-bg)), var(--surface);
    box-shadow: 0 0 0 1px rgba(217, 119, 87, .25), 0 8px 28px rgba(217, 119, 87, .12);
  }

  /* ATTIVITÀ COMPLETATE */
  .scheda.fatto,
  .scheda.fatto:hover {
    border-color: var(--ok);
    background: linear-gradient(var(--ok-bg), var(--ok-bg)), var(--surface);
    box-shadow: 0 0 0 1px rgba(108, 192, 126, .2), 0 8px 28px rgba(108, 192, 126, .08);
  }

  .scheda.fatto .titolo { color: var(--ok); }

  .scheda.branch.corrente .titolo code { color: #fff; }
  .riga.aperta .titolo, .scheda.attiva .titolo { color: #fff; }

  .stato.lavoro {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .stato.aperta {
    border-color: var(--accent);
    color: var(--accent-chiaro);
    font-weight: 600;
  }

  .contesto {
    width: 190px;
    flex-shrink: 0;
  }

  .contesto .tubo {
    height: 8px;
    margin-bottom: 7px;
    border-radius: 999px;
    background: var(--bg-input);
    overflow: hidden;
  }

  .contesto .tubo span {
    display: block;
    height: 100%;
    border-radius: 999px;
  }

  .avanti { color: var(--ok); }
  .indietro { color: var(--danger-text); }

  code {
    font: 12px ui-monospace, Consolas, monospace;
    color: var(--accent-chiaro);
  }

  .vuoto {
    padding: 32px;
    color: var(--muted);
    text-align: center;
  }

  .modulo {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 18px;
    margin-bottom: 18px;
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
  }

  .modulo .chiudi-modulo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 28px;
    padding: 0;
    color: var(--muted);
  }

  .modulo .chiudi-modulo:hover { color: var(--text); }

  .lista .modulo {
    margin: 0;
    border-color: var(--accent);
  }

  .modulo label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
  }

  .modulo label :is(input, textarea, select) {
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
  }

  .modulo label.largo { grid-column: 1 / -1; }
  .modulo label b { color: var(--accent); }

  .modulo textarea {
    min-height: 68px;
    resize: vertical;
  }

  .modulo .piede {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .scheda .testa {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-radius: var(--raggio);
    cursor: pointer;
  }

  .scheda .freccia {
    color: var(--muted);
    font-size: 11px;
    transition: transform .25s;
  }

  .scheda.aperta { border-color: var(--border-forte); }
  .scheda.aperta .freccia { transform: rotate(90deg); color: var(--accent); }

  /* Altezza animata da 0 al contenuto con le righe della griglia, senza misurare in JavaScript */
  .scheda .dettagli {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
  }

  .scheda.aperta .dettagli { grid-template-rows: 1fr; }

  .scheda .dettagli > div { overflow: hidden; }

  .scheda .interno {
    margin: 0 20px;
    padding: 18px 0 18px 26px;
    border-top: 1px solid var(--border);
  }

  .scheda dl {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 22px 16px;
    margin: 4px 0 22px;
    line-height: 1.6;
  }

  .scheda dt {
    padding-top: 2px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
  }

  .scheda dd {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* MESSAGGI BACKEND: testo lungo incollato, scorre dentro il suo riquadro */
  .scheda dd.messaggi-backend {
    max-height: 280px;
    overflow: auto;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px;
  }

  .scheda dt .copia-backend {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-top: 8px;
    padding: 3px 8px;
    font-size: 11.5px;
    letter-spacing: 0;
  }

  .copia-backend svg, .backend-piano .piede svg { width: 14px; height: 14px; }

  .backend-piano {
    grid-column: 1 / -1;
    padding: 12px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .fase-piano h2.con-azione { display: flex; align-items: center; gap: 10px; }
  .compila-auto { color: var(--accent-chiaro); }
  .compila-auto.attivo { opacity: .6; animation: pulsa 1s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .25; } }

  .aggiungi-backend {
    width: 100%;
    margin-top: 12px;
    padding: 10px 0;
    background: none;
    border: 1px dashed var(--border-forte);
    border-radius: 8px;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .aggiungi-backend:hover { border-color: var(--accent); color: var(--accent-chiaro); }
  .aggiungi-backend[hidden] { display: none; }

  .backend-attivita { margin: 4px 0 22px; }
  .modulo .backend-attivita { grid-column: 1 / -1; margin: 0; }
  .scheda dd.backend-dd { white-space: normal; }
  .backend-espandi summary { width: max-content; color: var(--muted); cursor: pointer; }
  .backend-espandi summary:hover, .backend-espandi[open] summary { color: var(--text); }
  .backend-espandi .blocco-backend { margin-top: 10px; }
  .backend-attivita > .titolo-sezione {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
  }
  .backend-attivita > .titolo-sezione i {
    margin-left: 6px;
    font-style: normal;
    font-weight: 400;
    letter-spacing: 0;
  }
  .backend-attivita textarea {
    width: 100%;
    min-height: 84px;
    max-height: calc(14 * 1.5em + 22px);
    margin-top: 12px;
    line-height: 1.5;
    overflow-y: auto;
    resize: none;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px;
  }
  .backend-attivita .piede { margin-top: 10px; }
  .backend-attivita .piede svg { width: 14px; height: 14px; }

  .backend-piano summary {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    cursor: pointer;
  }

  .backend-piano summary i {
    margin-left: 6px;
    font-style: normal;
    font-weight: 400;
    letter-spacing: 0;
  }

  .backend-piano textarea {
    width: 100%;
    min-height: 84px;
    max-height: calc(14 * 1.5em + 22px);
    margin-top: 12px;
    line-height: 1.5;
    overflow-y: auto;
    resize: none;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .backend-piano .piede { margin-top: 10px; }

  /* Esempio sotto il nome del campo: mostra il livello di dettaglio che serve */
  .modulo label .esempio {
    margin-top: -3px;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.45;
  }

  /* PIANO TERMINATO E LEZIONI */
  .spunta-fatto.attiva,
  .spunta-fatto.attiva:hover:not(:disabled) {
    border-color: #3fb950;
    background: #3fb950;
    color: #fff;
  }

  .spunta-fatto:hover:not(:disabled):not(.attiva) { color: #3fb950; }

  .blocco-backend {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }

  .testa-blocco {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 4px 6px 4px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
  }

  .testa-blocco b { color: var(--text); }
  .testa-blocco .btn.icona { width: 30px; height: 28px; }

  .blocco-backend pre {
    max-height: 280px;
    margin: 0;
    padding: 10px 12px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 12.5px;
  }
  .btn svg { vertical-align: -2px; }

  #cerca-lezioni {
    width: min(360px, 100%);
    padding: 8px 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-size: 13.5px;
  }

  #cerca-lezioni:focus { border-color: var(--accent); outline: none; }

  .scheda.lezione { padding: 16px 20px; }

  .testa-lezione {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 14px;
  }

  .testa-lezione .corpo { flex: 1; min-width: 0; }
  .scheda.lezione dl { margin: 0; }

  /* QUIZ DI FINE LEZIONE */
  #quiz {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, .62);
  }

  #quiz[hidden] { display: none; }

  .quiz-finestra {
    display: flex;
    flex-direction: column;
    width: min(760px, 100%);
    max-height: 100%;
    background: var(--surface);
    border: 1px solid var(--border-forte);
    border-radius: var(--raggio);
    box-shadow: var(--ombra);
  }

  .quiz-testa {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .quiz-testa .corpo { flex: 1; min-width: 0; }
  .quiz-testa .sotto { color: var(--muted); font-size: 12.5px; }

  #quiz-corpo {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 18px;
    overflow-y: auto;
  }

  .quiz-piede {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
  }

  .quiz-domanda {
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .quiz-domanda.ok { border-color: var(--ok); background: var(--ok-bg); }
  .quiz-domanda.no { border-color: var(--danger); opacity: .8; }
  .quiz-domanda .tipo-domanda { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .quiz-domanda p { margin: 4px 0 10px; font-weight: 500; }

  .quiz-opzione {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .quiz-opzione:hover { background: var(--surface-2); }
  .quiz-opzione.giusta { color: var(--ok); }
  .quiz-opzione.sbagliata { color: var(--danger-text); }

  .quiz-domanda textarea {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    resize: vertical;
  }

  .quiz-domanda textarea:focus { border-color: var(--accent); outline: none; }
  .quiz-esito { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .quiz-esito b { color: var(--text); }
  .quiz-messaggio { padding: 24px 6px; color: var(--muted); text-align: center; }
  .quiz-messaggio.errore { color: var(--danger-text); }

  #chat-log .termina-lezione {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
  }

  #chat-log .termina-lezione:hover { color: var(--text); }
  #chat-log .termina-lezione input { accent-color: var(--accent); cursor: pointer; }

  .scheda .piede {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .scheda .piede .spazio { flex: 1; }

  .btn.icona {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 34px;
    padding: 0;
    color: var(--muted);
  }

  .btn.icona:hover:not(:disabled) { color: var(--text); }
  .btn.icona.pericolo { width: auto; padding: 0 12px; }

  .scheda .azioni {
    display: flex;
    gap: 8px;
  }

  button.btn svg { vertical-align: -3px; }

  .commit {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .commit li {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }

  .commit li:first-child { border-top: 0; }

  .commit .messaggio {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .commit .chi, .nota {
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
  }

  .commit .partenza-titolo {
    min-height: 0;
    padding: 14px 0 2px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .commit .partenza { border-top: 0; opacity: .75; }

  .nessuno {
    margin: 4px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .commit .qui {
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--accent-bg);
    color: var(--accent-chiaro);
    font-size: 11.5px;
  }

  .file {
    max-height: 220px;
    margin: 0;
    padding: 10px 14px;
    overflow: auto;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: 12.5px/1.7 ui-monospace, Consolas, monospace;
    letter-spacing: 0;
    list-style: none;
  }

  /* PIANI */
  .riga.piano { cursor: pointer; }
  .senza-titolo { color: var(--muted); font-style: italic; }

  .stato.tipo { min-width: 112px; }

  /* PIANO ESPANSO: l'editor sta dentro la scheda, senza le cornici evidenziate dei moduli */
  .scheda.piano .interno { padding-left: 0; }
  .scheda.piano .interno .modulo {
    background: var(--bg);
    border-color: var(--border);
    box-shadow: none;
  }
  .scheda.piano .interno .backend-piano { background: var(--bg-input); }
  .scheda.piano .interno .modulo:last-child { margin-bottom: 0; }

  /* TITOLI DEI CAMPI: arancione il nome, grigia la guida */
  .fase-piano label.largo > span:first-child,
  .testa-piano label > span:first-child { color: var(--accent); }

  .testa-piano + .passi { margin-top: 18px; }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .fase-piano .piede .nota { flex: 1; align-self: center; }

  .tipo-piano {
    display: flex;
    flex-direction: column;
    gap: 7px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
  }

  .filtri-tipo {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .filtri-tipo .pillola { letter-spacing: 0; font-weight: 400; }

  /* RIQUADRO MAPPA: una sola colonna, tutto a sinistra sotto il titolo; la nota sta su una riga sua e i pulsanti vanno sotto */
  .riquadro-mappa { grid-template-columns: 1fr; justify-items: start; }
  .lista .modulo.riquadro-mappa { margin-top: 18px; }
  .riquadro-mappa > * { justify-self: start; width: 100%; }
  .riquadro-mappa .piede { flex-wrap: wrap; align-items: center; justify-content: flex-end; }

  .modulo label span i {
    margin-left: 6px;
    color: var(--muted);
    font-style: normal;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }

  .tacche {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 3px;
  }

  .tacche span {
    width: 20px;
    height: 7px;
    border-radius: 2px;
    background: var(--bg-input);
  }

  .tacche span.iniziata { background: var(--accent); }
  .tacche span.completa { background: var(--ok); }

  .tacche b {
    margin-left: 8px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }

  .testa-piano { grid-template-columns: 1fr 1fr; }

  .collegata {
    padding: 8px 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
  }

  .passi {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }

  .passo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }

  .passo .numero {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: var(--bg-input);
    font-size: 12px;
    font-weight: 600;
  }

  .passo .numero svg { width: 14px; height: 14px; }
  .passo:disabled { opacity: .4; cursor: not-allowed; }
  .passo.iniziata { color: var(--text); }
  .passo.iniziata .numero { background: var(--accent-bg); color: var(--accent-chiaro); }
  .passo.completa { color: var(--text); }
  .passo.completa .numero { background: var(--ok); color: #1a1918; }
  .passo.attiva { border-color: var(--accent); background: var(--accent-bg); color: #fff; }

  .fase-piano h2 {
    margin: 0;
    font: 500 19px/1.2 ui-serif, Georgia, "Times New Roman", serif;
    color: var(--text);
    letter-spacing: 0;
  }

  /* Crescono con il testo fino a 10 righe, poi scorrono */
  .fase-piano textarea {
    min-height: 84px;
    max-height: calc(10 * 1.5em + 22px);
    line-height: 1.5;
    overflow-y: auto;
    resize: none;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .errore-generazione { color: var(--danger-text); }

  /* GUIDA ALLA SCRITTURA: come si scrive il campo, consigli mentre scrivi, tasto per partire da un altro campo */
  .guida-campo {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0;
  }

  .guida-campo summary { width: max-content; color: var(--muted); cursor: pointer; }
  .guida-campo summary:hover { color: var(--text); }
  .guida-campo p { margin: 6px 0 0; }
  .guida-campo ul { margin: 6px 0 0; padding-left: 18px; }
  .guida-campo li { margin: 2px 0; line-height: 1.45; }

  .consigli { display: flex; flex-direction: column; gap: 3px; }
  .consigli:empty { display: none; }

  .consiglio {
    color: #e3b341;
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.45;
  }

  /* STRUMENTI DEI CAMPI: pulsanti sotto il campo, pannello dei risultati e risposte rapide */
  .strumenti-campo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .strumenti-campo .btn { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  .pannello {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-forte);
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
  .pannello:empty { display: none; }
  .pannello a { color: var(--accent-chiaro); text-decoration: underline; }
  .pannello .riga-cerca { display: flex; gap: 6px; }
  .pannello .riga-cerca input { flex: 1; min-width: 0; }
  .pannello .trovato { display: flex; gap: 8px; align-items: baseline; }
  .pannello .trovato code { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pannello .azioni-pannello { display: flex; flex-wrap: wrap; gap: 6px; }
  .scelte { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .scelta { display: flex; flex-direction: column; gap: 4px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .modulo .scelta b { color: var(--text); font-size: 12.5px; }
  .scelta .opzioni { display: flex; flex-wrap: wrap; gap: 6px; }

  .riprendi { align-self: flex-start; font-size: 12.5px; font-weight: 500; letter-spacing: 0; }
  .avvisi-mappa { align-self: center; color: #e3b341; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .consumo { align-self: center; color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; white-space: nowrap; }
  .consumo .tok-num { color: var(--accent-chiaro); font-weight: 700; font-size: 1.15em; }
  .consumo .tok-cache, #chat-consumo .tok-cache { color: var(--ok); font-weight: 700; font-size: 1.15em; }
  .consumo .tok-chi { color: var(--text); font-weight: 600; }

  /* IN BREVE: oggi e dopo la modifica, affiancati; su schermo stretto uno sotto l'altro */
  .sintesi {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sintesi .piede { align-items: center; }
  .sintesi .nota { font-size: 13px; font-weight: 400; letter-spacing: 0; }

  .sintesi-riquadri {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .sintesi-riquadro {
    min-height: 96px;
    padding: 12px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
    line-height: 1.5;
  }

  .sintesi-riquadro p { margin: 0; white-space: pre-wrap; }

  .sintesi-riquadro h3 {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
  }

  .sintesi-riquadro .vuoto { color: var(--muted); font-style: italic; }
  .sintesi-riquadro.non-chiaro { border-color: var(--danger); background: rgba(229, 83, 75, .08); }
  .sintesi-riquadro.non-chiaro h3 { color: var(--danger-text); }
  .sintesi.vecchia .sintesi-riquadro { opacity: .6; }

  @media (max-width: 800px) {
    .sintesi-riquadri { grid-template-columns: 1fr; }
  }

  .fase-piano textarea:hover {
    scrollbar-color: var(--muted) transparent;
  }

  .spunte {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .spunta {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    gap: 12px !important;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-input);
    color: var(--text) !important;
    cursor: pointer;
    font-size: 14px !important;
    font-weight: 400 !important;
    letter-spacing: 0 !important;
  }

  .spunta:has(input:checked) { border-color: rgba(108, 192, 126, .55); }

  .spunta input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--ok);
  }

  .naviga-fasi {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .scheda .stati {
    display: flex;
    gap: 4px;
    padding: 3px;
    background: var(--bg-input);
    border-radius: 8px;
  }

  .scheda .stati .btn.icona {
    width: 32px;
    height: 28px;
    border-color: transparent;
    border-radius: 5px;
    background: transparent;
  }

  .scheda .maniglia {
    display: inline-flex;
    margin: -6px -4px -6px -8px;
    padding: 6px 4px;
    border-radius: 4px;
    color: var(--muted);
    cursor: grab;
  }

  .scheda .maniglia:hover { color: var(--text); background: var(--surface-2); }
  .scheda .maniglia:active { cursor: grabbing; }
  .scheda .maniglia circle { fill: currentColor; stroke: none; }
  .scheda .testa .titolo, .scheda .testa .meta, .scheda .dettagli { user-select: text; }
  .scheda.trascinata { opacity: .45; border-style: dashed; border-color: var(--accent); }

  .scheda .aggiunta {
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
  }

  .btn.icona.attuale { color: #1a1918; cursor: default; }
  .scheda .stati .btn.icona.attuale.da-fare { background: var(--text); }
  .scheda .stati .btn.icona.attuale.in-corso { background: var(--accent); color: #fff; }
  .scheda .stati .btn.icona.attuale.fatto { background: var(--ok); }

  .etichetta {
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--accent-bg);
    color: var(--accent-chiaro);
    font: 11px ui-monospace, Consolas, monospace;
  }

  #avviso {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 30;
    max-width: 420px;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border-forte);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }

  #avviso.visibile {
    opacity: 1;
    transform: none;
  }

  #avviso.errore { border-color: var(--danger); color: var(--danger-text); }

  @media (max-width: 800px) {
    header, nav, main { padding-left: 16px; padding-right: 16px; }
    .modulo, .scheda dl { grid-template-columns: 1fr; }
    .riga { flex-wrap: wrap; }
    .riga .azioni { width: auto; }
  }

  /* Bottoni della chat: stesso stile degli altri */
  #chat button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }

  #chat button:hover:not(:disabled) { border-color: var(--border-forte); }
  #chat button[aria-pressed="true"] { border-color: var(--accent); }

  /* CHATTINO */
  /* Mascotte in pixel art: fluttua, sbatte gli occhi e saltella mentre aspetta la risposta */
  #chat-open {
    position: fixed;
    bottom: 14px;
    left: 18px;
    z-index: 21;
    width: 72px;
    height: 82px;
    padding: 0;
    background: none;
    border: 0;
  }

  #chat-open:hover {
    border: 0;
  }

  #chat-open,
  #chat-open .sprite {
    cursor: grab;
    touch-action: none;
  }

  #chat-open .sprite {
    display: block;
    width: 72px;
    height: 64px;
    margin: 0 auto;
    image-rendering: pixelated;
    shape-rendering: crispEdges;
    filter: drop-shadow(0 0 6px rgba(217, 119, 87, .6));
    animation: chat-float 2.6s ease-in-out infinite;
  }

  #chat-open:hover .sprite {
    animation: chat-float 2.6s ease-in-out infinite, chat-wiggle .4s ease-in-out 2;
  }

  #chat-open.pensa .sprite {
    animation: chat-hop .5s ease-in-out infinite;
  }

  #chat-open::after {
    content: "";
    display: block;
    width: 30px;
    height: 6px;
    margin: 6px auto 0;
    background: rgba(0, 0, 0, .55);
    border-radius: 50%;
    animation: chat-shadow 2.6s ease-in-out infinite;
  }

  #chat-open .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: chat-blink 4.5s infinite;
  }

  @keyframes chat-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes chat-shadow {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50% { transform: scaleX(.7); opacity: .5; }
  }

  @keyframes chat-wiggle {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -8deg; }
    75% { rotate: 8deg; }
  }

  @keyframes chat-hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes chat-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  /* DECORAZIONI DELLE MODALITÀ: si vede solo quella della modalità scelta */
  #chat-open .acc,
  #chat-open .scintille {
    display: none;
  }

  #chat-open[data-modo="insegnante"] .acc-insegnante,
  #chat-open[data-modo="traduttore"] .acc-traduttore,
  #chat-open[data-modo="senior"] .acc-senior,
  #chat-open.cambia .scintille {
    display: inline;
  }

  /* Occhiali e occhiali da sole spariscono quando urla o quando gli occhi girano mentre pensa */
  #chat-open.dragging .viso,
  #chat-open.pensa .acc-senior .viso {
    display: none;
  }

  #chat-open .occhiali {
    shape-rendering: geometricPrecision;
  }

  /* Cambio di modalità: salto a scatti, come un vecchio videogioco, con le stelline che lampeggiano */
  #chat-open.cambia .sprite {
    animation: chat-cambia .7s steps(7) 1;
  }

  @keyframes chat-cambia {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-14px) scale(1.15, .85); }
    45% { transform: translateY(-16px) scaleX(-1); }
    60% { transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }

  #chat-open.cambia .scintille {
    animation: chat-scintille .35s steps(2) infinite;
  }

  @keyframes chat-scintille {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open.cambia .sprite,
    #chat-open.cambia .scintille {
      animation: none;
    }
  }

  /* Presa in mano: si ingrandisce e trema dalla paura */
  #chat-open.dragging .sprite {
    cursor: grabbing;
    animation: chat-trema .12s linear infinite;
  }

  @keyframes chat-trema {
    0%, 100% { transform: scale(1.15) translate(0, 0) rotate(-4deg); }
    25% { transform: scale(1.15) translate(-1px, 1px) rotate(4deg); }
    50% { transform: scale(1.15) translate(1px, -1px) rotate(-4deg); }
    75% { transform: scale(1.15) translate(-1px, -1px) rotate(4deg); }
  }

  #chat-open.dragging::after {
    animation: none;
    opacity: .3;
  }

  /* Mentre aspetta la risposta gli occhi diventano spirali a pixel che girano a scatti */
  #chat-open .ipno {
    display: none;
  }

  #chat-open.pensa .ipno {
    display: inline;
  }

  #chat-open.pensa .eye {
    display: none;
  }

  /* 4 fotogrammi sfasati: ognuno resta acceso per un quarto del giro */
  #chat-open .giro {
    opacity: 0;
    animation: chat-giro .6s steps(1, end) infinite;
  }

  @keyframes chat-giro {
    0% { opacity: 1; }
    25%, 100% { opacity: 0; }
  }

  /* Senza animazioni resta ferma la prima spirale */
  @media (prefers-reduced-motion: reduce) {
    #chat-open .giro:first-child {
      opacity: 1;
    }
  }

  /* Faccia che urla mentre la trascini: ha la precedenza anche sugli occhi che girano */
  #chat-open .paura {
    display: none;
  }

  #chat-open.dragging .paura {
    display: inline;
  }

  #chat-open.dragging .eye,
  #chat-open.dragging .bocca,
  #chat-open.dragging .ipno {
    display: none;
  }

  @keyframes chat-ping {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, .7); }
    50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open .sprite,
    #chat-open::after,
    #chat-open .eye,
    #chat-open .giro,
    #chat-open .dot {
      animation: none;
    }
  }

  /* Verde: risposta pronta e non ancora vista; rosso: server spento */

  #chat {

  /* RIDIMENSIONAMENTO: maniglie invisibili su tutti i lati e gli angoli */

  #chat .chat-bordo.s { bottom: 0; left: 12px; right: 12px; height: 5px; cursor: ns-resize; }
  #chat .chat-bordo.e { right: 0; top: 12px; bottom: 12px; width: 5px; cursor: ew-resize; }

  #chat.schermo-intero .chat-bordo { display: none; }

  /* BARRA DI SCORRIMENTO: sottile, a pillola, si accende al passaggio */
  #chat-log, #chat-log * { scrollbar-width: auto; scrollbar-color: auto; }
  #chat-log::-webkit-scrollbar, #chat-log *::-webkit-scrollbar { width: 12px; height: 12px; }
  #chat-log::-webkit-scrollbar-track, #chat-log *::-webkit-scrollbar-track { background: transparent; }
  #chat-log::-webkit-scrollbar-corner, #chat-log *::-webkit-scrollbar-corner { background: transparent; }

  <form id="chat-form">
    <textarea id="chat-input" rows="2" placeholder="Fai una domanda…"></textarea>
    <button type="submit" id="chat-send" title="Invia (Invio)" aria-label="Invia"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
  </form>
  <details class="token-box" id="chat-consumo"><summary>TOKEN</summary><div class="dati" id="chat-consumo-dati"></div></details>
</section>
<div id="quiz" hidden>
  <div class="quiz-finestra" role="dialog" aria-modal="true" aria-labelledby="quiz-titolo">
    <div class="quiz-testa">
      <div class="corpo"><b id="quiz-titolo"></b><div class="sotto" id="quiz-sotto"></div></div>
      <button type="button" class="btn" id="quiz-chiudi" title="Chiudi (Esc)">&#x2715;</button>
    </div>
    <div id="quiz-corpo"></div>
    <div class="quiz-piede" id="quiz-piede"></div>
  </div>
</div>

<script src="/lettura-codice/analisi.js"></script>
<script src="/lettura-codice/pagina.js"></script>
<script>
  const GETTONE = '__GETTONE__';
  const AGGIORNA_MS = 15000;
  const STATI = [['in-corso', 'In corso'], ['da-fare', 'Da fare'], ['fatto', 'Fatto']];
  // FILTRI PER STATO
  // Valgono per attività e piani: "Aperti" (da fare + in corso) è quello di partenza, "Tutte" sta in fondo
  const FILTRI_STATO = [['aperti', 'Aperti'], ...STATI, ['tutte', 'Tutte']];
  const passaFiltro = (filtro, statoElemento) => filtro === 'tutte' || (filtro === 'aperti' ? statoElemento !== 'fatto' : statoElemento === filtro);
  // Le attività mai trascinate non hanno ancora un ordine: vanno in fondo, dalla più recente
  const perOrdine = (a, b) => (a.ordine ?? Infinity) - (b.ordine ?? Infinity) || b.creata - a.creata;
  const SOGLIA_CONTESTO = 0.4;
  const MAX_COMMIT = 40;
  const COLORI_CONTESTO = [
    ['#3fb950', 'va benissimo', 0.5],
    ['#d29922', 'inizia a essere lunga', 0.75],
    ['#db6d28', 'conviene preparare una chat nuova', 1],
    ['#f85149', 'apri una chat nuova', Infinity],
  ];
  const FILTRI = [['tutte', 'Tutte'], ['correnti', 'Non archiviate'], ['archiviate', 'Archiviate']];
  const CAMPI_SCHEDA = [
    { id: 'titolo', nome: 'TITOLO', obbligatorio: true, tipo: 'input', largo: true, aiuto: 'nome breve: diventa il titolo della sessione' },
    { id: 'obiettivo', nome: 'OBIETTIVO', obbligatorio: true, tipo: 'textarea', largo: true, aiuto: 'cosa vuoi ottenere' },
    { id: 'problema', nome: 'PROBLEMA', obbligatorio: false, tipo: 'textarea', largo: true, aiuto: 'se è un bug: cosa succede, cosa ti aspettavi, come riprodurlo, dove (piattaforma, dispositivo)' },
    { id: 'dove', nome: 'DOVE', obbligatorio: true, tipo: 'input', aiuto: 'pagina, flusso o file' },
    { id: 'mappa', nome: 'MAPPA', obbligatorio: true, tipo: 'select', valori: ['dati', 'struttura', 'entrambi'] },
    { id: 'note', nome: 'NOTE', obbligatorio: false, tipo: 'textarea', largo: true, aiuto: 'tutto il resto: vincoli, dubbi, esempi' },
  ];

  const ICONE = {
    chiudi: '<path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
    archivia: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/>',
    ripristina: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M12 18v-5"/><path d="m9.5 15.5 2.5-2.5 2.5 2.5"/>',
    compila: '<path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/>',
    elimina: '<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
    'da-fare': '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    'in-corso': '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>',
    fatto: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    maniglia: '<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>',
    copia: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
    passa: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="m10 17 5-5-5-5"/><path d="M15 12H4"/>',
    torna: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    commit: '<circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/>',
  };
  const icona = (nome) => `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[nome]}</svg>`;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const memoria = {
    leggi(chiave, base) {
      try { return localStorage.getItem(chiave) ?? base; } catch { return base; }
    },
    scrivi(chiave, valore) {
      try { localStorage.setItem(chiave, valore); } catch {}
    },
  };

  const stato = {
    progetti: [],
    progetto: memoria.leggi('sala.progetto', ''),
    sezione: memoria.leggi('sala.sezione', 'sessioni'),
    filtro: 'tutte',
    filtroAttivita: 'aperti',
    filtroPiani: 'aperti',
    trascinata: null,
    piani: [],
    lezioni: [],
    contesti: [],
    fileLezioni: '',
    backendAperti: new Set(),
    contestiAperti: new Set(),
    cercaLezioni: '',
    fasiPiano: [],
    tipiPiano: [],
    pianoAperto: null,
    fasePiano: '',
    branchAperti: new Set(),
    commit: {},
    commitAperto: false,
    nuova: false,
    aperte: new Set(),
    sessioni: [],
    branch: null,
    attivita: [],
    modifica: null,
  };

  // CHIAMATE AL SERVER
  async function api(percorso, dati = {}) {
    const res = await fetch(percorso, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Gettone': GETTONE },
      body: JSON.stringify({ progetto: stato.progetto, ...dati }),
    });
    const corpo = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
    return corpo;
  }

  let timerAvviso;
  function avvisa(testo, errore = false) {
    const el = $('avviso');
    el.textContent = testo;
    el.className = `visibile${errore ? ' errore' : ''}`;
    clearTimeout(timerAvviso);
    timerAvviso = setTimeout(() => { el.className = ''; }, errore ? 6000 : 2500);
  }

  function quando(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    const ora = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const giorni = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(ms).setHours(0, 0, 0, 0)) / 86400000);
    if (giorni === 0) return `oggi ${ora}`;
    if (giorni === 1) return `ieri ${ora}`;
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: giorni > 300 ? '2-digit' : undefined });
  }

  // CARICAMENTO DATI
  async function carica() {
    if (!stato.progetto) return;
    const [sessioni, branch, attivita, piani, lezioni, consumiClaude, contesti] = await Promise.allSettled([
      api('/api/sessioni'), api('/api/branch'), api('/api/attivita'), api('/api/piani'), api('/api/lezioni'), api('/api/consumi'), api('/api/contesti'),
    ]);
    if (consumiClaude.status === 'fulfilled') stato.consumi = consumiClaude.value;
    stato.contesti = contesti.status === 'fulfilled' ? contesti.value : [];
    if (lezioni.status === 'fulfilled') Object.assign(stato, { lezioni: lezioni.value.lezioni, fileLezioni: lezioni.value.file });
    if (piani.status === 'fulfilled') Object.assign(stato, { piani: piani.value.piani, fasiPiano: piani.value.fasi, tipiPiano: piani.value.tipi });
    stato.sessioni = sessioni.status === 'fulfilled' ? sessioni.value : [];
    stato.branch = branch.status === 'fulfilled' ? branch.value : { errore: branch.reason.message };
    // Un server non riavviato manda ancora il vecchio testo unico: senza questo la scheda non si disegna
    stato.attivita = attivita.status === 'fulfilled' ? attivita.value.map((a) => ({ ...a, backend: Array.isArray(a.backend) ? a.backend : [] })) : [];
    stato.commit = {};
    await Promise.all([...stato.branchAperti].map(caricaCommit));
    if (sessioni.status === 'rejected') avvisa(sessioni.reason.message, true);
    if (stato.piani.some(generaInCorso)) seguiGenerazione();
    $('aggiornato').textContent = `aggiornato ${new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    disegna();
  }

  async function caricaCommit(nome) {
    try {
      stato.commit[nome] = await api('/api/branch/commit', { nome });
    } catch (err) {
      stato.commit[nome] = { errore: err.message };
    }
  }

  async function avvio() {
    if (location.protocol === 'file:') {
      $('contenuto').innerHTML = '<p class="vuoto">Questo file non funziona aperto con doppio clic: lancia /sala-controllo in Claude e usa la pagina che si apre su http://127.0.0.1:4518</p>';
      return;
    }
    try {
      stato.progetti = await api('/api/progetti');
    } catch (e) {
      $('contenuto').innerHTML = `<p class="vuoto">${esc(e instanceof TypeError ? 'Il server è spento: avvialo con node ~/.claude/sala-controllo/server.js --apri' : e.message)}</p>`;
      return;
    }
    const richiesto = new URLSearchParams(location.search).get('progetto');
    if (stato.progetti.some((p) => p.nome === richiesto)) stato.progetto = richiesto;
    if (!stato.progetti.some((p) => p.nome === stato.progetto)) stato.progetto = stato.progetti[0]?.nome || '';
    memoria.scrivi('sala.progetto', stato.progetto);
    if (richiesto) history.replaceState(null, '', '/');
    if (!stato.progetto) return disegnaSenzaProgetti();
    await carica();
  }

  function disegnaSenzaProgetti() {
    $('progetti').innerHTML = htmlProgetti();
    $('contenuto').innerHTML = `${htmlNuovoProgetto()}<p class="vuoto">Nessun progetto: aggiungine uno con il + in alto.</p>`;
  }

  // PROGETTI
  // La ✕ toglie solo la voce dalla lista; il + apre la finestra di Windows per scegliere la cartella
  const htmlProgetti = () => stato.progetti.map((p) => `<span class="voce-progetto">
      <button class="pillola${p.nome === stato.progetto ? ' attiva' : ''}" data-progetto="${esc(p.nome)}" title="${esc(p.cartella)}">${esc(p.nome)}</button>
      <button class="togli-progetto" data-azione="rimuovi-progetto" data-nome="${esc(p.nome)}" title="Togli ${esc(p.nome)} dalla sala (la cartella non viene toccata)">&#x2715;</button>
    </span>`).join('') + '<button class="pillola aggiungi-progetto" data-azione="scegli-progetto" title="Aggiungi un progetto scegliendo la sua cartella">+</button>';

  const htmlNuovoProgetto = () => (stato.nuovoProgetto ? `<div class="barra conferma-progetto">
      <span class="riepilogo">Aggiungere <b>${esc(stato.nuovoProgetto.nome)}</b> alla sala? <code>${esc(stato.nuovoProgetto.cartella)}</code>
        <span class="nota">Aggiungi solo repo tuoi o di cui ti fidi: la sala ci lancia comandi git.</span></span>
      <button class="btn" data-azione="annulla-progetto">Annulla</button>
      <button class="btn primario" data-azione="conferma-progetto">Aggiungi</button>
    </div>` : '');

  // Dopo aver tolto o aggiunto un progetto si riparte da zero, come cambiando progetto
  async function apriProgetto(nome) {
    stato.progetti = await api('/api/progetti');
    stato.progetto = stato.progetti.some((p) => p.nome === nome) ? nome : stato.progetti[0]?.nome || '';
    Object.assign(stato, { modifica: null, nuova: false, commitAperto: false, pianoAperto: null });
    stato.branchAperti.clear();
    memoria.scrivi('sala.progetto', stato.progetto);
    if (!stato.progetto) return disegnaSenzaProgetti();
    await carica();
  }

  // DISEGNO
  function disegna() {
    $('progetti').innerHTML = htmlProgetti();
    document.querySelectorAll('#sezioni button').forEach((b) => b.classList.toggle('attiva', b.dataset.sezione === stato.sezione));
    $('conta-sessioni').textContent = stato.sessioni.length;
    $('conta-branch').textContent = stato.branch?.branch?.length ?? '';
    $('conta-attivita').textContent = stato.attivita.filter((a) => a.stato !== 'fatto').length;
    $('conta-piani').textContent = stato.piani.length;
    $('conta-lezioni').textContent = stato.lezioni.length;
    $('conta-contesto').textContent = stato.contesti.length;
    const sezioni = { sessioni: htmlSessioni, branch: htmlBranch, attivita: htmlAttivita, piani: htmlPiani, contesto: htmlContesti, lezioni: htmlLezioni };
    // Lettura codice e Funzionalità sono elementi che sopravvivono ai ridisegni: si riagganciano invece di ricrearli
    const persistenti = { codice: LetturaCodice.nodo, funzionalita: LetturaCodice.catalogo };
    const persistente = persistenti[stato.sezione];
    $('contenuto').classList.toggle('largo', stato.sezione === 'codice');
    $('contenuto').innerHTML = htmlNuovoProgetto() + (persistente ? '' : sezioni[stato.sezione]());
    if (persistente) $('contenuto').append(persistente());
    if (stato.sezione === 'codice') LetturaCodice.ripristinaScroll();
    document.querySelectorAll('.fase-piano textarea, .backend-piano textarea').forEach(adattaAltezza);
  }

  // ALTEZZA CAMPI
  // Prima si azzera, altrimenti scrollHeight non cala quando cancelli righe
  function adattaAltezza(campo) {
    campo.style.height = 'auto';
    campo.style.height = `${campo.scrollHeight + campo.offsetHeight - campo.clientHeight}px`;
  }

  function sessioniFiltrate() {
    if (stato.filtro === 'archiviate') return stato.sessioni.filter((s) => s.stato === 'archiviata');
    if (stato.filtro === 'correnti') return stato.sessioni.filter((s) => s.stato !== 'archiviata');
    return stato.sessioni;
  }

  // RIEMPIMENTO CONTESTO
  // Pieno = 40% della finestra del modello: oltre, le risposte peggiorano e Claude compatta la chat perdendo dettagli.
  // Ogni compattazione ha già riassunto la chat, quindi conta come chat quasi piena anche se i token sono ripartiti da poco.
  function riempimento(s) {
    const quota = s.token / (s.finestra * SOGLIA_CONTESTO);
    const minimo = s.compattazioni >= 2 ? 1 : s.compattazioni === 1 ? 0.8 : 0;
    return Math.min(1, Math.max(quota, minimo));
  }

  function htmlContesto(s) {
    if (!s.token) return '<div class="contesto"></div>';
    const quota = riempimento(s);
    const [colore, consiglio] = COLORI_CONTESTO.find(([, , limite]) => quota < limite) || COLORI_CONTESTO.at(-1);
    const compattata = s.compattazioni ? ` · compattata ×${s.compattazioni}` : '';
    return `<div class="contesto" title="${esc(`${s.token.toLocaleString('it-IT')} token nel contesto su ${(s.finestra / 1000).toLocaleString('it-IT')}K${compattata}: ${consiglio}`)}">
      <div class="tubo"><span style="width:${Math.max(3, quota * 100).toFixed(0)}%;background:${colore}"></span></div>
      <div class="meta">${Math.round(s.token / 1000)}K token${compattata}</div>
    </div>`;
  }

  function htmlArchivia(s) {
    if (s.archiviataDa === 'vscode') return `<button class="btn icona" disabled title="Archiviata dall'estensione: si ripristina dalla barra di Claude in VS Code">${icona('ripristina')}</button>`;
    if (s.archiviataDa === 'sala') return `<button class="btn icona" data-azione="archivia" data-id="${s.id}" data-archivia="no" title="Togli dall'archivio">${icona('ripristina')}</button>`;
    return `<button class="btn icona" data-azione="archivia" data-id="${s.id}" data-archivia="si" ${s.stato === 'aperta' ? 'disabled title="Chiudi la chat prima di archiviarla"' : 'title="Archivia"'}>${icona('archivia')}</button>`;
  }

  function motivoNonChiudibile(s) {
    if (s.stato !== 'aperta') return 'La chat non è aperta';
    if (!s.pid) return 'Aperta da poco ma senza un processo noto: chiudi la scheda in VS Code';
    if (s.lavoro === 'busy') return 'Sta lavorando: aspetta che finisca';
    return '';
  }

  function htmlSessioni() {
    // Le chat aperte vanno in cima, evidenziate; tra loro resta l'ordine per data
    const righe = [...sessioniFiltrate()].sort((a, b) => (b.stato === 'aperta') - (a.stato === 'aperta')).map((s) => {
      const aperta = s.stato === 'aperta';
      const motivo = motivoNonChiudibile(s);
      const etichetta = !aperta ? `<span class="stato">${s.stato}</span>`
        : s.lavoro === 'busy' ? '<span class="stato lavoro">al lavoro</span>' : '<span class="stato aperta">aperta</span>';
      return `<div class="riga${aperta ? ' aperta' : ''}" data-blocco="sessione" data-bid="${esc(s.id)}">
        ${etichetta}
        <div class="corpo">
          <div class="titolo" title="${esc(s.titolo)}">${esc(s.titolo)}</div>
          <div class="meta">${quando(s.modificata)} · ${s.mb} MB · <code>${s.id.slice(0, 8)}</code></div>
        </div>
        ${htmlContesto(s)}
        <div class="azioni">
          <button class="btn icona" data-azione="chiudi" data-id="${s.id}" ${motivo ? `disabled title="${motivo}"` : 'title="Chiudi: termina il processo, la chat resta salvata"'}>${icona('chiudi')}</button>
          ${htmlArchivia(s)}
          <button class="btn icona" data-azione="elimina-sessione" data-id="${s.id}" ${aperta ? 'disabled title="Chiudi la chat prima di eliminarla"' : 'title="Elimina la chat"'}>${icona('elimina')}</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="barra">
        ${FILTRI.map(([id, nome]) => `<button class="pillola${stato.filtro === id ? ' attiva' : ''}" data-filtro="${id}">${nome}</button>`).join('')}
      </div>
      <div class="lista">${righe || '<p class="vuoto">Nessuna chat</p>'}</div>`;
  }

  // STORIA DEI COMMIT
  // Tornare indietro si può solo sul branch attuale: il commit in cima è quello su cui sei
  function htmlCommit(nome) {
    const dati = stato.commit[nome];
    if (!dati) return '<p class="vuoto">Caricamento dei commit…</p>';
    if (dati.errore) return `<p class="vuoto">${esc(dati.errore)}</p>`;
    const corrente = nome === stato.branch.corrente;
    const bottoneTorna = (c, tolti) => `<button class="btn icona" data-azione="torna" data-hash="${c.hash}" data-tolti="${tolti}" ${stato.branch.modifiche
      ? 'disabled title="Ci sono modifiche non salvate: committale prima di tornare indietro"'
      : `title="Torna a questo commit: i ${tolti} commit più recenti escono dal branch"`}>${icona('torna')}</button>`;
    const riga = (c, azione, classe = '') => `<li class="${classe}">
        <code>${c.breve}</code>
        <span class="messaggio" title="${esc(c.messaggio)}">${esc(c.messaggio)}</span>
        <span class="chi">${esc(c.autore)} · ${quando(c.data)}</span>
        ${azione}
      </li>`;
    const righe = dati.commit.map((c, i) => riga(c, !corrente ? '' : i === 0 ? '<span class="qui">sei qui</span>' : bottoneTorna(c, i))).join('');
    if (!dati.commit.length) return '<p class="nessuno">Nessun commit</p>';
    // Il punto di partenza è l'ultimo commit in comune con il principale: tornarci toglie tutti i commit del branch
    const base = !dati.base ? '' : `<li class="partenza-titolo">Partito da <code>${esc(dati.da)}</code> qui</li>${riga(dati.base,
      !corrente ? '' : bottoneTorna(dati.base, dati.commit.length), 'partenza')}`;
    const limite = dati.commit.length >= MAX_COMMIT ? `<p class="nota">Sono mostrati gli ultimi ${MAX_COMMIT} commit.</p>` : '';
    return `<ol class="commit">${righe}${base}</ol>${limite}`;
  }

  // MODULO COMMIT
  function htmlModuloCommit(b) {
    const altri = b.modifiche > b.file.length ? `<li>… e altri ${b.modifiche - b.file.length}</li>` : '';
    return `<div class="modulo">
        <button class="btn chiudi-modulo" data-azione="annulla-commit" title="Annulla">&#x2715;</button>
        <label class="largo"><span>FILE CHE ENTRANO NEL COMMIT · ${b.modifiche}</span>
          <ul class="file">${b.file.map((f) => `<li><code>${esc(f.stato)}</code> ${esc(f.percorso)}</li>`).join('')}${altri}</ul>
        </label>
        <label class="largo"><span>MESSAGGIO <b>*</b></span><input id="messaggio-commit" maxlength="2000" placeholder="cosa hai cambiato e perché" autocomplete="off"></label>
        <div class="piede">
          <button class="btn" data-azione="annulla-commit">Annulla</button>
          <button class="btn primario" data-azione="committa">Committa tutto su ${esc(b.corrente)}</button>
        </div>
      </div>`;
  }

  function htmlBranch() {
    const b = stato.branch;
    if (!b) return '<p class="vuoto">Caricamento…</p>';
    if (b.errore) return `<p class="vuoto">${esc(b.errore)}</p>`;
    // Il branch attuale va sempre in cima
    const ordinati = [...b.branch].sort((x, y) => (y.nome === b.corrente) - (x.nome === b.corrente));
    const righe = ordinati.map((r) => {
      const corrente = r.nome === b.corrente;
      const confronto = r.nome === b.principale || r.avanti === undefined ? ''
        : ` · <span class="avanti">↑${r.avanti}</span> <span class="indietro">↓${r.indietro}</span> rispetto a ${esc(b.principale)}`;
      const noPassa = corrente ? 'Sei già su questo branch' : b.modifiche ? 'Ci sono modifiche non salvate: committale prima' : '';
      const noElimina = corrente ? 'Sei su questo branch: passa a un altro prima di eliminarlo'
        : r.nome === b.principale ? 'Il branch principale non si elimina da qui' : '';
      const titoloElimina = r.avanti ? `Elimina: ha ${r.avanti} commit che non sono in ${esc(b.principale)}` : 'Elimina il branch locale';
      return `<div class="scheda branch${corrente ? ' corrente' : ''}${stato.branchAperti.has(r.nome) ? ' aperta' : ''}" data-blocco="branch" data-bid="${esc(r.nome)}">
        <div class="testa" data-azione="espandi-branch" data-nome="${esc(r.nome)}" title="Clicca per vedere i commit">
          <span class="freccia">▶</span>
          <span class="stato${corrente ? ' corrente' : ''}">${corrente ? 'attuale' : 'locale'}</span>
          <div class="corpo">
            <div class="titolo"><code>${esc(r.nome)}</code></div>
            <div class="meta">${quando(r.data)} · ${esc(r.messaggio)}${confronto}${r.remoto ? ` · remoto ${esc(r.remoto)}` : ''}</div>
          </div>
          <div class="azioni">
            <button class="btn icona" data-azione="passa" data-nome="${esc(r.nome)}" ${noPassa ? `disabled title="${noPassa}"` : 'title="Passa a questo branch"'}>${icona('passa')}</button>
            <button class="btn icona" data-azione="elimina-branch" data-nome="${esc(r.nome)}" data-avanti="${r.avanti ?? ''}" ${noElimina ? `disabled title="${noElimina}"` : `title="${titoloElimina}"`}>${icona('elimina')}</button>
          </div>
        </div>
        <div class="dettagli"><div><div class="interno" data-commit="${esc(r.nome)}">${htmlCommit(r.nome)}</div></div></div>
      </div>`;
    }).join('');
    return `<div class="barra">
        <span class="riepilogo">Sei su <b>${esc(b.corrente || '(nessun branch)')}</b> · ${b.modifiche ? `<span class="indietro">${b.modifiche} file modificati</span>` : 'nessuna modifica'}</span>
        ${b.modifiche && !stato.commitAperto ? `<button class="btn primario" data-azione="apri-commit">${icona('commit')} Commit</button>` : ''}
        <span class="spazio"></span>
        <input id="nuovo-branch" placeholder="nome-nuovo-branch" autocomplete="off">
        <button class="btn" data-azione="crea-branch">Crea branch</button>
      </div>
      ${stato.commitAperto && b.modifiche ? htmlModuloCommit(b) : ''}
      <div class="lista">${righe}</div>`;
  }

  function opzioniBranch(scelto = '') {
    const nomi = stato.branch?.branch?.map((b) => b.nome) || [];
    if (scelto && !nomi.includes(scelto)) nomi.unshift(scelto);
    return `<option value="">nessun branch</option>${nomi.map((n) => `<option${n === scelto ? ' selected' : ''}>${esc(n)}</option>`).join('')}`;
  }

  // PIANI
  // Il ragionamento lo scrivi tu: la pagina dà solo la struttura delle fasi, adattata al tipo di lavoro, e tiene il conto di cosa manca
  const delTipo = (elementi, tipo) => elementi.filter((e) => !e.tipi || e.tipi.includes(tipo));
  const fasiDelPiano = (piano) => delTipo(stato.fasiPiano, piano.tipo);
  const nomeTipo = (tipo) => stato.tipiPiano.find((t) => t.id === tipo)?.nome || tipo;

  // MAPPA OBBLIGATORIA
  // Le fasi dopo la Richiesta si aprono solo con la mappa scelta e, se non è "Nessuna", generata
  const TIPI_MAPPA = { dati: ['dati'], struttura: ['struttura'], entrambi: ['dati', 'struttura'] };
  const mappePronte = (piano) => (TIPI_MAPPA[piano.mappa] || []).every((t) => piano.mappe.some((m) => m.tipo === t && m.esiste));

  function bloccoMappa(piano) {
    // Un piano terminato si rilegge e si corregge sempre, anche se la mappa è stata eliminata
    if (piano.terminato) return '';
    if (!piano.mappa) return 'Scegli prima la mappa nella Richiesta';
    if (piano.mappa === 'nessuna') return '';
    if (piano.generazione?.stato === 'in-corso') return 'Aspetta che la mappa sia pronta';
    return mappePronte(piano) ? '' : 'Genera prima la mappa nella Richiesta';
  }

  // Come chiede la skill /piano: servono il Dove e lo scopo, che cambia campo in base al tipo di lavoro
  function mancaPerGenerare(piano) {
    const c = piano.fasi.richiesta.campi;
    const scopo = { bug: c.atteso, minore: c.cosa, modifica: c.obiettivo || c.cambia }[piano.tipo] ?? c.obiettivo;
    if (!String(scopo || '').trim()) return `Compila ${piano.tipo === 'bug' ? 'il Comportamento atteso' : piano.tipo === 'minore' ? 'Cosa cambiare' : 'l\'Obiettivo'} nella Richiesta`;
    return '';
  }

  const durata = (inizio) => {
    const secondi = Math.max(0, Math.round((Date.now() - inizio) / 1000));
    return `${Math.floor(secondi / 60)}m ${String(secondi % 60).padStart(2, '0')}s`;
  };

  // CONSUMI DI CLAUDE
  // Token delle ultime 5 ore per funzione, dal registro che scrivono sala, catalogo e chat: numeri veri, non stime
  const formatoToken = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1).replace('.', ',')}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
  const testoToken = (token, cache) => `<b class="tok-num">${formatoToken(token)}</b>${cache ? ` + <b class="tok-cache">${formatoToken(cache)}</b> da cache` : ''}`;
  const NOMI_FUNZIONI = { mappa: 'Mappa', sintesi: 'In breve' };
  const AIUTO_CONSUMI = 'Token di oggi, da mezzanotte (00:00) alle 23:59. Si contano solo sala, catalogo e Chattino, non le chat di Claude Code in VS Code. I token da cache pesano molto meno.';
  const testoGiornata = () => 'oggi';

  function htmlConsumi(funzione) {
    const t = stato.consumi?.perFunzione?.[funzione];
    const testo = t ? `${testoToken(t.token, t.cache)} · ${t.chiamate} ${t.chiamate === 1 ? 'chiamata' : 'chiamate'}` : 'nessun consumo';
    const aperto = stato.consumiAperti?.has(funzione) ? ' open' : '';
    return `<details class="consumo token-box" data-funzione="${funzione}" title="${esc(AIUTO_CONSUMI)}"${aperto}><summary>TOKEN</summary><div class="dati"><div><span class="tok-chi">${NOMI_FUNZIONI[funzione] || funzione}</span> · ${testoGiornata()}: ${testo}</div></div></details>`;
  }

  function htmlGenerazione(piano) {
    const g = piano.generazione;
    const [nota, tasto] = g?.stato === 'in-corso'
      ? [`<span class="nota" id="stato-generazione" data-inizio="${g.inizio}">Generazione della mappa in corso… ${durata(g.inizio)} · puoi chiudere la pagina, continua lo stesso</span>`,
        '<button class="btn primario" disabled>Generazione…</button>']
      : g?.stato === 'errore'
        ? [`<span class="nota errore-generazione">Generazione non riuscita: ${esc(g.errore)}</span>`,
          '<button class="btn primario" data-azione="genera-mappa">Riprova</button>']
        : mappePronte(piano)
          ? ['<span class="nota">Mappa pronta: tienila aperta mentre compili le fasi dopo.</span>',
            '<button class="btn" data-azione="genera-mappa" title="Ridisegna la mappa con il codice di adesso">Rigenera mappa</button>']
          : ['<span class="nota">La mappa mostra com\'è il codice oggi: serve per sbloccare le fasi dopo. Ci vuole qualche minuto.</span>',
            '<button class="btn primario" data-azione="genera-mappa">Genera mappa</button>'];
    // Mentre si genera la mappa vecchia non si apre: sta per essere sostituita
    return `<div class="largo piede">${nota}${htmlConsumi('mappa')}${g?.stato === 'in-corso' ? '' : htmlMappePiano(piano)}${tasto}</div>`;
  }

  // IN BREVE
  // Il testo della Richiesta che va a Claude è anche la firma: se cambia dopo la generazione, il riassunto è vecchio
  function testoRichiesta(piano) {
    const fase = stato.fasiPiano.find((f) => f.id === 'richiesta');
    const campi = delTipo(fase.campi, piano.tipo)
      .map((c) => [c.nome, String(piano.fasi.richiesta.campi[c.id] || '').trim()])
      .filter(([, valore]) => valore);
    if (!campi.length) return '';
    return [`TIPO: ${nomeTipo(piano.tipo)}`, ...campi.map(([nome, valore]) => `${nome}: ${valore}`)].join('\n');
  }

  function statoSintesi(piano) {
    const g = piano.generazioneSintesi;
    const vuota = !testoRichiesta(piano);
    const vecchia = Boolean(piano.sintesi) && piano.sintesi.firma !== testoRichiesta(piano);
    if (g?.stato === 'in-corso') return { vecchia, disattivo: 'Aspetta che finisca', nota: `<span class="nota" id="stato-sintesi" data-inizio="${g.inizio}">Sto leggendo il codice… ${durata(g.inizio)} · puoi chiudere la pagina, continua lo stesso</span>` };
    const disattivo = vuota ? 'Scrivi qualcosa nei campi qui sopra' : '';
    if (g?.stato === 'errore') return { vecchia, disattivo, nota: `<span class="nota errore-generazione">Non riuscito: ${esc(g.errore)}</span>` };
    if (vecchia) return { vecchia, disattivo, nota: '<span class="nota">Hai cambiato la Richiesta dopo averlo generato: rigeneralo per aggiornarlo.</span>' };
    if (piano.sintesi?.chiaro === false) return { vecchia, disattivo, nota: '<span class="nota errore-generazione">La Richiesta non si capisce: correggi i campi qui sopra e rigenera.</span>' };
    return { vecchia, disattivo, nota: `<span class="nota">${piano.sintesi ?'Com\'è oggi e come deve essere dopo, in breve: il dettaglio è nella mappa.' : 'Ti riassumo in breve com\'è oggi e come deve essere dopo la modifica.'}</span>` };
  }

  function htmlTastoSintesi(piano, disattivo) {
    const nome = piano.generazioneSintesi?.stato === 'in-corso' ? 'Generazione…' : piano.sintesi ? 'Rigenera' : 'Genera';
    return `<button class="btn${piano.sintesi ? '' : ' primario'}" id="tasto-sintesi" data-azione="genera-sintesi"${disattivo ? ` disabled title="${esc(disattivo)}"` : ''}>${nome}</button>`;
  }

  function htmlSintesi(piano) {
    const s = piano.sintesi;
    const { vecchia, disattivo, nota } = statoSintesi(piano);
    const riquadro = (titolo, valore) => `<div class="sintesi-riquadro${s && !s.chiaro ? ' non-chiaro' : ''}">
        <h3>${s && !s.chiaro ? 'NON SI CAPISCE' : titolo}</h3>
        <p>${valore ? esc(valore) : '<span class="vuoto">Premi Genera</span>'}</p>
      </div>`;
    return `<div class="largo tipo-piano sintesi${vecchia ? ' vecchia' : ''}" id="sintesi"><span>IN BREVE</span>
        <div class="piede">${nota}${htmlConsumi('sintesi')}${htmlTastoSintesi(piano, disattivo)}</div>
        <div class="sintesi-riquadri">${riquadro('OGGI', s?.oggi)}${riquadro('DOPO LA MODIFICA', s?.dopo)}</div>
      </div>`;
  }

  // Mentre scrivi nei campi si aggiornano solo il tasto e la nota, non i riquadri: la pagina non si ridisegna
  function aggiornaSintesi(piano) {
    const sezione = $('sintesi');
    if (!sezione) return;
    const { vecchia, disattivo, nota } = statoSintesi(piano);
    sezione.classList.toggle('vecchia', vecchia);
    sezione.querySelector('.piede').innerHTML = `${nota}${htmlConsumi('sintesi')}${htmlTastoSintesi(piano, disattivo)}`;
  }

  // ATTESA MAPPA
  // Ogni secondo si aggiorna il tempo, ogni 5 si chiede al server; la pagina si ridisegna solo alla fine, rimettendo il cursore dov'era
  let timerGenerazione = null;
  let battiti = 0;

  // Segue insieme la mappa e il riassunto In breve: stesso giro, ognuno con il suo avviso quando finisce
  const GENERAZIONI = [
    { chiave: 'generazione', etichetta: 'stato-generazione', testo: 'Generazione della mappa in corso…', pronto: (p) => `Mappa pronta per "${p.titolo || 'Senza titolo'}"`, fallito: 'Mappa non generata' },
    { chiave: 'generazioneSintesi', etichetta: 'stato-sintesi', testo: 'Sto leggendo il codice…', pronto: (p) => (p.sintesi?.chiaro === false ? 'Richiesta poco chiara: guarda i riquadri In breve' : `In breve pronto per "${p.titolo || 'Senza titolo'}"`), fallito: 'In breve non generato' },
  ];
  const generaInCorso = (p) => GENERAZIONI.some((g) => p[g.chiave]?.stato === 'in-corso');

  function seguiGenerazione() {
    if (timerGenerazione) return;
    timerGenerazione = setInterval(async () => {
      GENERAZIONI.forEach((g) => {
        const etichetta = $(g.etichetta);
        if (etichetta) etichetta.textContent = `${g.testo} ${durata(Number(etichetta.dataset.inizio))} · puoi chiudere la pagina, continua lo stesso`;
      });
      if (++battiti % 5) return;
      const inCorso = stato.piani.filter(generaInCorso);
      if (!inCorso.length) return void (clearInterval(timerGenerazione), timerGenerazione = null);
      try {
        const nuovi = (await api('/api/piani')).piani;
        const finiti = [];
        inCorso.forEach((p) => {
          const n = nuovi.find((x) => x.id === p.id);
          const chiuse = GENERAZIONI.filter((g) => p[g.chiave]?.stato === 'in-corso' && n?.[g.chiave]?.stato !== 'in-corso');
          if (!chiuse.length) return;
          Object.assign(p, n ? { mappe: n.mappe, sintesi: n.sintesi } : {}, ...chiuse.map((g) => ({ [g.chiave]: n?.[g.chiave] || null })));
          chiuse.forEach((g) => finiti.push({ p, g }));
        });
        if (!finiti.length) return;
        await salvaPiano();
        stato.consumi = await api('/api/consumi').catch(() => stato.consumi);
        const attivo = document.activeElement;
        const dove = attivo?.dataset?.campo ? { fase: attivo.dataset.fase, campo: attivo.dataset.campo, inizio: attivo.selectionStart, fine: attivo.selectionEnd } : null;
        disegna();
        if (dove) {
          const campo = document.querySelector(`[data-fase="${dove.fase}"][data-campo="${dove.campo}"]`);
          campo?.focus();
          campo?.setSelectionRange(dove.inizio, dove.fine);
        }
        finiti.forEach(({ p, g }) => {
          const errore = p[g.chiave]?.stato === 'errore';
          avvisa(errore ? `${g.fallito}: ${p[g.chiave].errore}` : g.pronto(p), errore || p.sintesi?.chiaro === false && g.chiave === 'generazioneSintesi');
        });
      } catch {}
    }, 1000);
  }

  const MAPPE_PIANO = [['dati', 'Dati'], ['struttura', 'Struttura'], ['entrambi', 'Entrambi'], ['nessuna', 'Nessuna']];
  // Un campo con la traccia da completare conta solo se c'è del testo dopo i due punti (in tutte le righe, se `tutte`)
  const campoScritto = (c, valore) => {
    const testo = String(valore || '');
    if (!c.traccia) return Boolean(testo.trim());
    const piene = testo.split('\n').map((r) => r.replace(/^[^:]*:/, '').trim());
    return c.tutte ? piene.length >= c.traccia.split('\n').length && piene.every(Boolean) : piene.some(Boolean);
  };
  const faseCompleta = (piano, fase) => {
    const dati = piano.fasi[fase.id];
    if (fase.id === 'richiesta' && !piano.mappa) return false;
    return delTipo(fase.campi, piano.tipo).every((c) => c.facoltativo || campoScritto(c, dati.campi[c.id]));
  };
  const faseIniziata = (piano, fase) => {
    const dati = piano.fasi[fase.id];
    return delTipo(fase.campi, piano.tipo).some((c) => campoScritto(c, dati.campi[c.id]));
  };
  const statoFase = (piano, fase) => (faseCompleta(piano, fase) ? 'completa' : faseIniziata(piano, fase) ? 'iniziata' : '');
  const pianoAperto = () => stato.piani.find((p) => p.id === stato.pianoAperto);

  function htmlTacche(piano) {
    const fasi = fasiDelPiano(piano);
    const fatte = fasi.filter((f) => faseCompleta(piano, f)).length;
    return `<div class="tacche" title="${fatte} fasi complete su ${fasi.length}">
        ${fasi.map((f) => `<span class="${statoFase(piano, f)}"></span>`).join('')}
        <b>${fatte}/${fasi.length}</b>
      </div>`;
  }

  function htmlElencoPiani() {
    // Il piano aperto porta dentro il suo editor; gli altri restano vuoti finché non li apri
    // Il piano aperto resta in lista anche se cambi il suo stato
    const visibili = stato.piani.filter((p) => p.id === stato.pianoAperto || passaFiltro(stato.filtroPiani, p.stato));
    const conta = (id) => stato.piani.filter((p) => passaFiltro(id, p.stato)).length;
    const righe = [...visibili].sort((a, b) => b.aggiornato - a.aggiornato).map((p) => {
      const attivita = stato.attivita.find((a) => a.id === p.attivita);
      const aperto = p.id === stato.pianoAperto;
      const classeStato = { 'in-corso': ' attiva', fatto: ' fatto' }[p.stato] || '';
      return `<div class="scheda piano${classeStato}${aperto ? ' aperta' : ''}" data-piano-id="${p.id}" data-blocco="piano" data-bid="${p.id}">
        <div class="testa" data-azione="espandi-piano" data-id="${p.id}" title="Clicca per aprire il piano">
          <span class="freccia">▶</span>
          <span class="stato tipo">${esc(nomeTipo(p.tipo))}</span>
          <div class="corpo">
            <div class="titolo">${p.titolo ? esc(p.titolo) : '<span class="senza-titolo">Senza titolo</span>'}</div>
            <div class="meta">${attivita ? `da attività "${esc(attivita.titolo)}" · ` : ''}${p.mappe.length ? `mappa ${p.mappe.map((m) => m.tipo).join(' e ')} · ` : ''}aggiornato ${quando(p.aggiornato)}</div>
          </div>
          ${htmlTacche(p)}
          <div class="azioni">
            <div class="stati">
              ${STATI.map(([id, nome]) => `<button class="btn icona ${id}${id === p.stato ? ' attuale' : ''}" data-azione="sposta-piano" data-id="${p.id}" data-stato="${id}"
                title="${id === p.stato ? `È in ${nome}` : id === 'fatto' ? 'Termina il piano (quiz di verifica)' : `Sposta in ${nome}`}">${icona(id)}</button>`).join('')}
            </div>
            <button class="btn icona" data-azione="copia-piano" data-id="${p.id}" title="Copia il piano da incollare in Claude Code con /piano">${icona('copia')}</button>
            <button class="btn icona" data-azione="elimina-piano" data-id="${p.id}" title="Elimina il piano">${icona('elimina')}</button>
          </div>
        </div>
        <div class="dettagli"><div><div class="interno">${aperto ? htmlEditorPiano(p) : ''}</div></div></div>
      </div>`;
    }).join('');
    return `<div class="barra">
        ${FILTRI_STATO.map(([id, nome]) => `<button class="pillola${stato.filtroPiani === id ? ' attiva' : ''}" data-filtro-piani="${id}">${nome} · ${conta(id)}</button>`).join('')}
        <span class="spazio"></span>
        <button class="btn primario" data-azione="crea-piano">+ Nuovo piano</button>
      </div>
      <div class="lista">${righe || `<p class="vuoto">${stato.piani.length ? 'Nessun piano in questa lista' : 'Nessun piano. Creane uno qui sopra o da un\'attività con "Pianifica".'}</p>`}</div>`;
  }

  // GUIDA ALLA SCRITTURA
  // Ogni campo ha la sua forma (elenco puntato, passi numerati, traccia da completare), una guida su come scriverlo e dei
  // controlli che girano mentre scrivi: sono consigli locali, non bloccano niente e non usano token.
  const PUNTO = '• ';
  const VAGO = /\b(sistem\w+|aggiust\w+|non va|non funziona|migliorar\w+|ottimizzar\w+|qualcosa|qualche cosa|roba|cose|ecc|etc|boh|in qualche modo|più bello|fix)\b/i;
  const NOME_CODICE = /\.(jsx?|tsx?|json|md)\b|\b[a-z]+[A-Z]\w*|\b[A-Z][a-z]+[A-Z]\w*|\b\w+\(\)/;
  const MIN_CARATTERI = 25;
  const riferimentoCampo = (id) => id.split('.');
  const testoCampo = (piano, id) => {
    const [fase, campo] = riferimentoCampo(id);
    return String(piano.fasi[fase]?.campi[campo] || '').trim();
  };
  const nomeCampo = (piano, id) => {
    const [fase, campo] = riferimentoCampo(id);
    return delTipo(stato.fasiPiano.find((f) => f.id === fase)?.campi || [], piano.tipo).find((c) => c.id === campo)?.nome || campo;
  };

  // Una riga per voce: con l'elenco si toglie il punto, con i passi il numero, e si ricontano
