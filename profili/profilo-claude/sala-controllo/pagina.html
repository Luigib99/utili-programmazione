  const righeDelTesto = (testo) => String(testo).split('\n').map((r) => r.replace(/^\s*(•\s*|[-*]\s+|\d+[.)]\s+)/, '').trimEnd()).filter((r) => r.trim());

  function formattaCampo(testo, forma) {
    const righe = righeDelTesto(testo);
    if (forma === 'elenco') return righe.map((r) => `${PUNTO}${r}`).join('\n');
    if (forma === 'passi') return righe.map((r, i) => `${i + 1}. ${r}`).join('\n');
    return testo;
  }

  function controlliCampo(c, testo) {
    const consigli = [];
    const pieno = String(testo).trim();
    if (!pieno || !c.controlli) return consigli;
    if (c.controlli.includes('vago')) {
      const parola = pieno.match(VAGO)?.[0];
      if (parola) consigli.push(`«${parola}» è troppo generico: di' cosa succede o cosa cambia, in concreto.`);
    }
    if (c.controlli.includes('breve') && pieno.length < MIN_CARATTERI) consigli.push('Troppo corto: aggiungi chi, cosa e dove, così la mappa e la revisione hanno da cosa partire.');
    if (c.controlli.includes('file')) {
      const voci = c.forma ? righeDelTesto(pieno) : [pieno];
      const senza = voci.map((r, i) => [r, i + 1]).filter(([r]) => !NOME_CODICE.test(r));
      if (senza.length === voci.length) consigli.push('Non vedo nessun nome di file o di funzione: scrivilo come sta nel codice (es. AuthContext.js, login).');
      else if (senza.length) consigli.push(`${senza.length === 1 ? 'La voce' : 'Le voci'} ${senza.map(([, n]) => n).join(', ')} ${senza.length === 1 ? 'non ha' : 'non hanno'} un nome di file o di funzione.`);
    }
    return consigli;
  }

  const htmlConsigli = (c, testo) => controlliCampo(c, testo).map((m) => `<span class="consiglio">&#x1F4A1; ${esc(m)}</span>`).join('');

  function htmlGuidaCampo(piano, fase, c) {
    if (!c.guida?.[0]) return '';
    return `<details class="guida-campo"><summary>Come si scrive</summary><p>${esc(c.guida[0])}</p></details>`;
  }

  function htmlRiprendi(piano, fase, c) {
    if (!c.riprendi || testoCampo(piano, `${fase.id}.${c.id}`) || !testoCampo(piano, c.riprendi)) return '';
    return `<button type="button" class="btn riprendi" data-azione="riprendi-campo" data-fase="${fase.id}" data-campo="${c.id}" data-da="${c.riprendi}">&#x21A7; Parti da «${esc(nomeCampo(piano, c.riprendi))}»</button>`;
  }

  // STRUMENTI DEI CAMPI
  // Pulsanti sotto il campo: cercano loro nel progetto, nella mappa o con Chattino, così non scrivi a memoria. I risultati restano finché la pagina è aperta
  const strumenti = {};
  const chiaveStrumento = (piano, faseId, campoId) => `${piano.id}.${faseId}.${campoId}`;
  const cartellaProgetto = () => (stato.progetti.find((p) => p.nome === stato.progetto)?.cartella || '').replace(/\\/g, '/');
  const linkVsCode = (file, riga) => `vscode://file/${encodeURI(`${cartellaProgetto()}/${file}`)}:${riga}`;

  // Il nome da cercare si ricava da quello che hai già scritto: prima «(login)» tra parentesi, poi «login(», poi il nome del file
  function nomeDaCercare(piano) {
    const testi = ['progettare.file', 'indagare.posizione', 'indagare.aggancio', 'richiesta.dove'].map((id) => testoCampo(piano, id)).join('\n');
    return testi.match(/\(([A-Za-z_$][\w$]*)\)/)?.[1] || testi.match(/\b([A-Za-z_$][\w$]*)\(/)?.[1] || testi.match(/\b([A-Za-z_$][\w$]*)\.(?:jsx?|tsx?)\b/)?.[1] || '';
  }

  const datiCampo = (b) => ({
    piano: pianoAperto(),
    fase: stato.fasiPiano.find((f) => f.id === b.dataset.fase),
    c: stato.fasiPiano.find((f) => f.id === b.dataset.fase)?.campi.find((x) => x.id === b.dataset.campo),
    campo: document.querySelector(`.fase-piano textarea[data-fase="${b.dataset.fase}"][data-campo="${b.dataset.campo}"]`),
  });

  function htmlPannelloCodice(piano, fase, c, s) {
    const attr = `data-fase="${fase.id}" data-campo="${c.id}"`;
    const cerca = `<div class="riga-cerca"><input data-cerca-nome value="${esc(s.nome)}" placeholder="nome della funzione o del file (es. login)" autocomplete="off"><button type="button" class="btn" data-azione="cerca-codice" ${attr}>Cerca</button></div>`;
    if (s.caricamento) return `${cerca}<div>Cerco nel progetto…</div>`;
    if (s.errore) return `${cerca}<div>${esc(s.errore)}</div>`;
    if (!s.risultati) return `${cerca}<div>Scrivi un nome e premi Cerca: ti mostro dove compare nel progetto, con un link che apre VS Code alla riga giusta.</div>`;
    if (!s.risultati.length) return `${cerca}<div>«${esc(s.nome)}» non compare in nessun file.</div>`;
    const file = new Set(s.risultati.map((r) => r.file));
    const righe = s.risultati.slice(0, 40).map((r) => `<div class="trovato"><a href="${linkVsCode(r.file, r.riga)}" title="Apri in VS Code">${esc(r.file)}:${r.riga}</a><code>${esc(r.testo)}</code></div>`).join('');
    const riempi = c.riempi ? `<div class="azioni-pannello"><button type="button" class="btn" data-azione="riempi-campo" ${attr}>Metti questi file nel campo</button></div>` : '';
    return `${cerca}<div><b>${s.risultati.length}${s.troncato ? '+' : ''} risultati in ${file.size} file</b> per «${esc(s.nome)}»</div>${righe}${riempi}`;
  }

  function htmlPannelloDiagramma(piano, fase, c, testo) {
    const esistenti = (piano.mappe || []).filter((m) => m.esiste);
    const link = (tipo, nome, hash = '') => `<a class="btn primario" href="/mappa?piano=${piano.id}&tipo=${tipo}${hash}" target="_blank" rel="noopener">${nome}</a>`;
    const citati = [...new Set([...String(testo).matchAll(/\b([DS])(\d{1,3})\b/g)].map((m) => `${m[1]}${m[2]}`))]
      .filter((ref) => esistenti.some((m) => m.tipo === (ref[0] === 'D' ? 'dati' : 'struttura')))
      .map((ref) => link(ref[0] === 'D' ? 'dati' : 'struttura', `Vai a ${ref}`, `#${ref}`));
    const mappe = esistenti.map((m) => link(m.tipo, `Apri mappa ${m.tipo}`));
    return `<div>${citati.length ? 'Passi citati nel campo: la mappa si apre già lì.' : 'Nel campo non c\'è nessun passo (es. D4 o S2). Scrivilo, o chiedi a Chattino di citarlo, e premi di nuovo: la mappa si aprirà su quel passo.'}</div><div class="azioni-pannello">${citati.join('')}${mappe.join('')}</div>`;
  }

  const lineaScelta = (testo, titolo) => String(testo).split('\n').find((r) => r.startsWith(`${titolo}:`)) || '';
  const sceltePresenti = (testo, titolo) => lineaScelta(testo, titolo).slice(titolo.length + 1).split(',').map((x) => x.trim()).filter(Boolean);

  function htmlScelte(fase, c, testo) {
    return c.scelte.map((s) => {
      const presenti = sceltePresenti(testo, s.titolo);
      return `<div class="scelta"><b>${esc(s.titolo)}</b><div class="opzioni">${s.opzioni.map((o) => `<button type="button" class="pillola${presenti.includes(o) ? ' attiva' : ''}" data-azione="scegli" data-fase="${fase.id}" data-campo="${c.id}" data-titolo="${esc(s.titolo)}" data-opzione="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
    }).join('');
  }

  function htmlStrumenti(piano, fase, c) {
    const attr = `data-fase="${fase.id}" data-campo="${c.id}"`;
    const bottoni = [
      c.codice ? `<button type="button" class="btn" data-azione="vedi-codice" ${attr}>VEDI NEL CODICE</button>` : '',
      c.diagramma && (piano.mappe || []).some((m) => m.esiste) ? `<button type="button" class="btn" data-azione="vedi-diagramma" ${attr}>VEDI NEL DIAGRAMMA</button>` : '',
      c.domanda ? `<button type="button" class="btn" data-azione="chiedi-chattino" ${attr}>CHIEDI A CHATTINO</button>` : '',
    ].join('');
    if (!bottoni && !c.scelte) return '';
    const s = strumenti[chiaveStrumento(piano, fase.id, c.id)];
    const pannello = !s ? '' : s.tipo === 'codice' ? htmlPannelloCodice(piano, fase, c, s) : htmlPannelloDiagramma(piano, fase, c, piano.fasi[fase.id]?.campi[c.id] || '');
    return `${bottoni ? `<div class="strumenti-campo">${bottoni}</div>` : ''}
        <div class="pannello" data-pannello="${fase.id}.${c.id}">${pannello}</div>
        ${c.scelte ? `<div class="scelte" data-scelte="${fase.id}.${c.id}">${htmlScelte(fase, c, piano.fasi[fase.id]?.campi[c.id] || '')}</div>` : ''}`;
  }

  function aggiornaPannello(piano, fase, c, campo) {
    const s = strumenti[chiaveStrumento(piano, fase.id, c.id)];
    const el = document.querySelector(`[data-pannello="${fase.id}.${c.id}"]`);
    if (el && s) el.innerHTML = s.tipo === 'codice' ? htmlPannelloCodice(piano, fase, c, s) : htmlPannelloDiagramma(piano, fase, c, campo?.value || '');
  }

  async function eseguiCerca(piano, fase, c, campo, nome) {
    const s = strumenti[chiaveStrumento(piano, fase.id, c.id)];
    Object.assign(s, { nome, caricamento: true, errore: '', risultati: null });
    aggiornaPannello(piano, fase, c, campo);
    try {
      const { risultati, troncato } = await api('/api/codice/cerca', { testo: nome });
      Object.assign(s, { risultati, troncato });
    } catch (err) {
      s.errore = err.message;
    }
    s.caricamento = false;
    aggiornaPannello(piano, fase, c, campo);
  }

  // MESSAGGI BACKEND DEL PIANO
  // Stanno solo nella Richiesta: è lì che si scrive cosa serve dal backend
  const htmlBackendPiano = (piano) => `<details class="backend-piano" data-piano-id="${piano.id}"${stato.backendAperti.has(piano.id) ? ' open' : ''}>
      <summary>MESSAGGI BACKEND <i>${piano.backend.length || 'facoltativo'}</i></summary>
      ${piano.backend.map((b, i) => htmlBloccoBackend(b, i, '')).join('')}
      <button type="button" class="aggiungi-backend" id="aggiungi-backend" data-azione="nuovo-backend" title="Aggiungi un messaggio del backend">+</button>
      <div class="nuovo-backend" id="form-backend" hidden>
        <textarea id="nuovo-backend" maxlength="20000" placeholder="incolla qui il messaggio del backend e salvalo"></textarea>
        <div class="piede"><button class="btn" data-azione="annulla-backend">Annulla</button><button class="btn primario" data-azione="salva-backend">Salva messaggio</button></div>
      </div>
    </details>`;

  function htmlFase(piano, fase, numero) {
    const dati = piano.fasi[fase.id];
    const campi = delTipo(fase.campi, piano.tipo).map((c) => `<label class="largo" data-blocco="campo" data-bid="${fase.id}.${c.id}"><span>${esc(c.nome.toUpperCase())}${c.facoltativo ? ' <i>facoltativo</i>' : ''}</span>
        ${htmlGuidaCampo(piano, fase, c)}
        <textarea data-fase="${fase.id}" data-campo="${c.id}" data-forma="${c.forma || ''}" data-traccia="${esc(c.traccia || '')}" maxlength="5000" placeholder="${esc([c.aiuto, c.esempio ? `es. ${c.esempio}` : ''].filter(Boolean).join('\n'))}">${esc(dati.campi[c.id] || '')}</textarea>
        <span class="consigli" data-consigli="${fase.id}.${c.id}">${htmlConsigli(c, dati.campi[c.id] || '')}</span>
        ${htmlRiprendi(piano, fase, c)}
        ${htmlStrumenti(piano, fase, c)}
      </label>`).join('');
    const daGenerare = ['dati', 'struttura', 'entrambi'].includes(piano.mappa);
    const mappa = fase.id !== 'richiesta' ? '' : `<div class="largo tipo-piano"><span>MAPPA DA GENERARE</span>
        <div class="filtri-tipo">${MAPPE_PIANO.map(([id, nome]) => `<button class="pillola${piano.mappa === id ? ' attiva' : ''}" data-azione="mappa-piano" data-mappa="${id}"${piano.generazione?.stato === 'in-corso' ? ' disabled title="Aspetta che finisca la generazione"' : ''}>${nome}</button>`).join('')}</div>
      </div>
      ${daGenerare ? htmlGenerazione(piano) : ''}`;
    // Sotto le Note: c'è solo nei tipi che hanno le Note (non nella Modifica minore)
    const conSintesi = fase.id === 'richiesta' && delTipo(fase.campi, piano.tipo).some((c) => c.id === 'note');
    return `<div class="modulo fase-piano" data-blocco="fase" data-bid="${fase.id}">
        <h2 class="largo${fase.id === 'richiesta' ? ' con-azione' : ''}">${numero ? `${numero}. ` : ''}${esc(fase.nome)}${fase.id === 'richiesta' ? `<button type="button" class="btn icona compila-auto" id="compila-richiesta" data-azione="compila-richiesta" title="Compila automaticamente: legge i messaggi del backend e propone il testo dei campi vuoti">${icona('compila')}</button>` : ''}</h2>
        ${campi}
        ${conSintesi ? htmlSintesi(piano) : ''}
      </div>
      ${mappa ? `<div class="modulo fase-piano riquadro-mappa"><h2 class="largo">Mappa</h2>${mappa}</div>` : ''}`;
  }

  // Gli avvisi sono le incongruenze tra mappa e codice trovate dalla sala: il dettaglio è in cima al riepilogo della mappa
  const htmlAvvisiMappa = (m) => (m.avvisi > 0
    ? `<span class="avvisi-mappa" title="La sala ha confrontato la mappa con il codice: apri la mappa, gli avvisi sono in cima al riepilogo">&#x26A0; ${m.avvisi} ${m.avvisi === 1 ? 'avviso' : 'avvisi'}</span>`
    : m.avvisi === 0 ? '<span class="consumo" title="La sala ha confrontato righe, nomi e frecce della mappa con il codice">&#x2713; controllata</span>' : '');

  // La mappa la serve la sala: il browser non apre i file del disco da una pagina web
  const htmlMappePiano = (piano) => piano.mappe.map((m) => (m.esiste
    ? `${htmlAvvisiMappa(m)}<a class="btn primario" href="/mappa?piano=${piano.id}&tipo=${m.tipo}" target="_blank" rel="noopener" title="${esc(m.file)}">Apri mappa ${m.tipo}</a>`
    : `<span class="nota" title="${esc(m.file)}">mappa ${m.tipo} eliminata</span>`)).join('');

  function htmlEditorPiano(piano) {
    const fasi = fasiDelPiano(piano);
    const indice = Math.max(0, fasi.findIndex((f) => f.id === stato.fasePiano));
    const tipi = stato.tipiPiano.map((t) => `<button class="pillola${t.id === piano.tipo ? ' attiva' : ''}" data-azione="tipo-piano" data-tipo="${t.id}">${esc(t.nome)}</button>`).join('');
    const blocco = bloccoMappa(piano);
    const chiusa = (i) => (i > 0 && blocco ? ` disabled title="${esc(blocco)}"` : '');
    const passi = fasi.map((f, i) => `<button class="passo ${statoFase(piano, f)}${i === indice ? ' attiva' : ''}" data-azione="vai-fase" data-fase="${f.id}"${chiusa(i)}>
        <span class="numero">${faseCompleta(piano, f) ? icona('fatto') : i + 1}</span>${esc(f.nome)}
      </button>`).join('');
    return `<div class="modulo testa-piano">
        <label class="largo"><span>TITOLO DEL PIANO</span><input data-piano="titolo" value="${esc(piano.titolo)}" maxlength="200" placeholder="cosa vuoi risolvere, in poche parole" autocomplete="off"></label>
        <div class="largo tipo-piano"><span>TIPO DI LAVORO</span><div class="filtri-tipo">${tipi}</div></div>
        ${htmlBackendPiano(piano)}
      </div>
      <div class="passi" id="passi-piano">${passi}</div>
      ${htmlFase(piano, fasi[indice], indice + 1)}
      <div class="naviga-fasi">
        <button class="btn" data-azione="vai-fase" data-fase="${fasi[indice - 1]?.id || ''}" ${indice ? '' : 'disabled'}>← Fase precedente</button>
        <span class="spazio"></span>
        ${indice < fasi.length - 1
    ? `<button class="btn primario" data-azione="vai-fase" data-fase="${fasi[indice + 1].id}"${chiusa(indice + 1)}>Fase successiva →</button>`
    : `<button class="btn primario" data-azione="copia-piano" data-id="${piano.id}" title="Crea il piano e lo copia: incollalo in una chat di Claude Code con /piano">Crea il piano</button>`}
      </div>`;
  }

  // CONTESTO
  // I passaggi salvati da /chat-termina: ogni scheda si apre per leggerli e si copia per incollarli in una chat nuova
  const PARTI_CONTESTO = [['obiettivo', 'OBIETTIVO'], ['fatto', 'FATTO'], ['file', 'FILE TOCCATI'], ['decisioni', 'DECISIONI'], ['prossimo', 'PROSSIMO PASSO']];

  function testoContesto(c) {
    const parti = PARTI_CONTESTO.filter(([id]) => c[id]).map(([id, nome]) => `${nome}:\n${c[id]}`);
    return [`CONTESTO: ${c.titolo} (${c.progetto || stato.progetto}, ${quando(c.data)})`, ...parti].join('\n\n');
  }

  function htmlContesti() {
    const righe = stato.contesti.map((c) => `<div class="scheda${stato.contestiAperti.has(c.id) ? ' aperta' : ''}" data-contesto="${c.id}" data-blocco="contesto" data-bid="${c.id}">
        <div class="testa" data-azione="espandi-contesto" data-id="${c.id}">
          <span class="freccia">▶</span>
          <div class="corpo">
            <div class="titolo">${esc(c.titolo)}</div>
            <div class="meta">${quando(c.data)} · <code>${c.id.slice(0, 8)}</code></div>
          </div>
          <div class="azioni">
            <button class="btn icona" data-azione="copia-contesto" data-id="${c.id}" title="Copia il contesto da incollare in una chat nuova">${icona('copia')}</button>
            <button class="btn icona" data-azione="elimina-contesto" data-id="${c.id}" title="Elimina il contesto">${icona('elimina')}</button>
          </div>
        </div>
        <div class="dettagli"><div><div class="interno"><dl>${PARTI_CONTESTO.filter(([id]) => c[id]).map(([id, nome]) => `<dt>${nome}</dt><dd>${esc(c[id])}</dd>`).join('')}</dl></div></div></div>
      </div>`).join('');
    return `<div class="barra">
        <span class="riepilogo">A fine chat scrivi <code>/chat-termina</code>; nella chat nuova scrivi <code>/chat-riprendi</code>.</span>
      </div>
      <div class="lista">${righe || '<p class="vuoto">Nessun contesto salvato per questo progetto.</p>'}</div>`;
  }

  // LEZIONI
  const testoLezione = (l) => [l.titolo, l.progetto, ...l.parti.flat()].join(' ').toLowerCase();

  function htmlElencoLezioni() {
    const cerca = stato.cercaLezioni.trim().toLowerCase();
    const lista = stato.lezioni.filter((l) => !cerca || testoLezione(l).includes(cerca));
    if (!lista.length) {
      return `<p class="vuoto">${stato.lezioni.length ? 'Nessuna lezione con queste parole.' : 'Ancora nessuna lezione: arrivano da Chattino insegnante (quadrato «Termina lezione») e dai piani che termini, dopo il quiz.'}</p>`;
    }
    return lista.map((l) => `<div class="scheda lezione" data-blocco="lezione" data-bid="${esc(l.id)}">
        <div class="testa-lezione">
          <span class="stato tipo ${l.origine}">${l.origine}</span>
          <div class="corpo">
            <div class="titolo">${esc(l.titolo)}</div>
            <div class="meta">${new Date(l.data).toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' })}${l.progetto ? ` · ${esc(l.progetto)}` : ''}</div>
          </div>
          <button class="btn icona" data-azione="elimina-lezione" data-id="${esc(l.id)}" title="Elimina questa lezione">${icona('elimina')}</button>
        </div>
        <dl>${l.parti.map(([nome, valore]) => `<dt>${esc(nome || 'Riassunto')}</dt><dd>${esc(valore)}</dd>`).join('')}</dl>
      </div>`).join('');
  }

  function htmlLezioni() {
    return `<div class="barra">
        <input id="cerca-lezioni" placeholder="cerca nelle lezioni…" value="${esc(stato.cercaLezioni)}" autocomplete="off">
        <span class="spazio"></span>
        <span class="riepilogo">Si aggiornano da sole anche in <code>${esc(stato.fileLezioni || '~/Lezioni.md')}</code></span>
      </div>
      <div class="lista" id="elenco-lezioni">${htmlElencoLezioni()}</div>`;
  }

  const htmlPiani = htmlElencoPiani;

  // Aggiorna numeri e colori delle fasi senza ridisegnare la pagina, così chi scrive non perde il cursore
  function aggiornaIndicatoriPiano() {
    const piano = pianoAperto();
    if (!piano) return;
    const fasi = fasiDelPiano(piano);
    document.querySelectorAll('#passi-piano .passo').forEach((b, i) => {
      const fase = fasi[i];
      b.classList.remove('completa', 'iniziata');
      if (statoFase(piano, fase)) b.classList.add(statoFase(piano, fase));
      b.querySelector('.numero').innerHTML = faseCompleta(piano, fase) ? icona('fatto') : i + 1;
    });
    aggiornaSintesi(piano);
    const tacche = document.querySelector(`.scheda.piano[data-piano-id="${piano.id}"] .tacche`);
    if (tacche) tacche.outerHTML = htmlTacche(piano);
  }

  function testoPiano(piano) {
    const attivita = stato.attivita.find((a) => a.id === piano.attivita);
    const fasi = fasiDelPiano(piano).map((f, i) => {
      const dati = piano.fasi[f.id];
      const campi = delTipo(f.campi, piano.tipo).map((c) => `${c.nome}: ${String(dati.campi[c.id] || '').trim() || (c.facoltativo ? '(non scritto)' : '(vuoto)')}`);
      return [`## ${i + 1}. ${f.nome.toUpperCase()}`, ...campi].join('\n');
    });
    const progetto = stato.progetti.find((p) => p.nome === piano.progetto);
    const mappe = piano.mappe.filter((m) => m.esiste).map((m) => `${m.tipo} ${m.file}`);
    return [
      '/piano',
      `PIANO: ${piano.titolo || 'Senza titolo'}`,
      `ID PIANO: ${piano.id}`,
      `TIPO: ${nomeTipo(piano.tipo)}`,
      `PROGETTO: ${piano.progetto}${progetto ? ` (${progetto.cartella})` : ''}`,
      ...(attivita ? [`ATTIVITÀ: ${attivita.titolo}`] : []),
      `MAPPA: ${piano.mappa || 'non scelta'}`,
      `MAPPE GIÀ FATTE: ${mappe.length ? mappe.join(' · ') : 'nessuna'}`,
      '',
      fasi.join('\n\n'),
      ...(piano.backend.length ? ['', '## MESSAGGI BACKEND', ...piano.backend.map((b, i) => `### Messaggio ${i + 1}\n${b.testo}`)] : []),
    ].join('\n');
  }

  // MODULO ATTIVITÀ
  // Stessi campi della Richiesta di un piano: "Pianifica" li porta lì
  function htmlModulo(a, azione) {
    const controllo = (c) => {
      const valore = a[c.id] || '';
      if (c.tipo === 'textarea') return `<textarea name="${c.id}" maxlength="${c.max || 5000}" placeholder="${esc(c.aiuto)}">${esc(valore)}</textarea>`;
      if (c.tipo === 'select') return `<select name="${c.id}">${['', ...c.valori].map((v) => `<option value="${v}"${v === valore ? ' selected' : ''}>${v || '—'}</option>`).join('')}</select>`;
      return `<input name="${c.id}" value="${esc(valore)}" maxlength="${c.id === 'titolo' ? 200 : 1000}" placeholder="${esc(c.aiuto)}" autocomplete="off">`;
    };
    const campi = CAMPI_SCHEDA.map((c) =>
      `<label class="${c.largo ? 'largo' : ''}"><span>${c.nome}${c.obbligatorio ? ' <b>*</b>' : ''}</span>${controllo(c)}</label>`).join('');
    return `<div class="modulo" data-scheda="${a.id || 'nuova'}">
        <button class="btn chiudi-modulo" data-azione="annulla" title="Annulla">&#x2715;</button>
        ${campi}
        <label><span>BRANCH</span><select name="branch">${opzioniBranch(a.branch)}</select></label>
        ${a.id ? htmlBackendAttivita(a, true) : ''}
        <div class="piede">
          <button class="btn" data-azione="annulla">Annulla</button>
          <button class="btn primario" data-azione="${azione}" data-id="${a.id || ''}">${azione === 'salva' ? 'Salva' : 'Aggiungi'}</button>
        </div>
      </div>`;
  }

  // MESSAGGI BACKEND DELL'ATTIVITÀ
  // Come nei piani: ogni messaggio è un blocco a sé, si aggiunge e si elimina da solo
  const htmlBloccoBackend = (b, i, dati, soloCopia = false) => `<div class="blocco-backend">
      <div class="testa-blocco"><b>${i + 1}</b><span>${quando(b.data)}</span><span class="spazio"></span>
        <button class="btn icona" data-azione="copia-backend" data-blocco="${b.id}" ${dati} title="Copia questo messaggio">${icona('copia')}</button>
        ${soloCopia ? '' : `<button class="btn icona" data-azione="elimina-backend" data-blocco="${b.id}" ${dati} title="Elimina questo messaggio">${icona('elimina')}</button>`}
      </div>
      <pre>${esc(b.testo)}</pre>
    </div>`;

  // Si scrive e si elimina solo mentre modifichi l'attività; altrimenti i messaggi si leggono e si copiano, ridotti come nei piani
  function htmlBackendAttivita(a, modifica) {
    if (modifica) {
      return `<div class="backend-attivita" data-attivita-backend="${a.id}">
        <div class="titolo-sezione">MESSAGGI BACKEND <i>${a.backend.length || 'facoltativo'}</i></div>
        ${a.backend.map((b, i) => htmlBloccoBackend(b, i, `data-attivita="${a.id}"`)).join('')}
        <textarea maxlength="20000" placeholder="incolla qui un messaggio del backend e salvalo: ne puoi aggiungere quanti vuoi"></textarea>
        <div class="piede"><button class="btn primario" data-azione="salva-backend" data-attivita="${a.id}">Salva messaggio</button></div>
      </div>`;
    }
    if (!a.backend.length) return '';
    const n = a.backend.length;
    return `<details class="backend-espandi" data-attivita-id="${a.id}"${stato.backendAperti.has(`a-${a.id}`) ? ' open' : ''}><summary>${n} ${n === 1 ? 'messaggio' : 'messaggi'} · clicca per espandere</summary>${a.backend.map((b, i) => htmlBloccoBackend(b, i, `data-attivita="${a.id}"`, true).replace(/\n\s*/g, '')).join('')}</details>`;
  }

  // Durante la modifica si ridisegna solo la sezione dei messaggi: i campi che stai scrivendo non si perdono
  function aggiornaBackendAttivita(a) {
    const sezione = document.querySelector(`[data-attivita-backend="${a.id}"]`);
    if (!sezione) return disegna();
    sezione.outerHTML = htmlBackendAttivita(a, true);
  }

  function htmlScheda(a) {
    const voci = CAMPI_SCHEDA.filter((c) => c.id !== 'titolo' && a[c.id])
      .map((c) => `<dt>${c.nome}</dt><dd>${esc(a[c.id])}</dd>`).join('');
    const classeStato = { 'in-corso': ' attiva', fatto: ' fatto' }[a.stato] || '';
    return `<div class="scheda${classeStato}${stato.aperte.has(a.id) ? ' aperta' : ''}" data-id="${a.id}" data-blocco="attivita" data-bid="${a.id}">
      <div class="testa" data-azione="espandi" data-id="${a.id}">
        <span class="maniglia" title="Trascina per spostare l'attività">${icona('maniglia')}</span>
        <span class="freccia">▶</span>
        <div class="corpo">
          <div class="titolo">${esc(a.titolo)}</div>
          <div class="meta">${esc(a.obiettivo || 'nessun obiettivo scritto')}</div>
        </div>
        ${a.branch ? `<span class="etichetta">${esc(a.branch)}</span>` : ''}
        <span class="aggiunta" title="Data di aggiunta">${quando(a.creata)}</span>
        <div class="stati">
          ${STATI.map(([id, nome]) => `<button class="btn icona ${id}${id === a.stato ? ' attuale' : ''}" data-azione="sposta" data-id="${a.id}" data-stato="${id}"
            title="${id === a.stato ? `È in ${nome}` : `Sposta in ${nome}`}">${icona(id)}</button>`).join('')}
        </div>
        <button class="btn icona" data-azione="elimina-attivita" data-id="${a.id}" title="Elimina l'attività">${icona('elimina')}</button>
      </div>
      <div class="dettagli"><div><div class="interno">
        ${voci || a.backend.length ? `<dl>${voci}${a.backend.length ? `<dt>MESSAGGI BACKEND</dt><dd class="backend-dd">${htmlBackendAttivita(a, false)}</dd>` : ''}</dl>` : ''}
        <div class="piede">
          <span class="spazio"></span>
          <button class="btn" data-azione="pianifica" data-id="${a.id}" title="Ragiona sull'attività fase per fase prima di scrivere codice">${stato.piani.some((p) => p.attivita === a.id) ? 'Apri piano' : 'Pianifica'}</button>
          <button class="btn" data-azione="modifica" data-id="${a.id}">Modifica</button>
        </div>
      </div></div></div>
    </div>`;
  }

  function htmlAttivita() {
    const lista = stato.attivita.filter((a) => passaFiltro(stato.filtroAttivita, a.stato))
      .sort(perOrdine);
    const conta = (id) => stato.attivita.filter((a) => passaFiltro(id, a.stato)).length;
    return `<div class="barra">
        ${FILTRI_STATO.map(([id, nome]) => `<button class="pillola${stato.filtroAttivita === id ? ' attiva' : ''}" data-filtro-attivita="${id}">${nome} · ${conta(id)}</button>`).join('')}
        <span class="spazio"></span>
        ${stato.nuova ? '' : '<button class="btn primario" data-azione="nuova">+ Nuova attività</button>'}
      </div>
      ${stato.nuova ? htmlModulo(stato.bozza || {}, 'aggiungi') : ''}
      <div class="lista">${lista.map((a) => (stato.modifica === a.id ? htmlModulo(a, 'salva') : htmlScheda(a))).join('') || '<p class="vuoto">Nessuna attività in questa lista</p>'}</div>`;
  }


  // CONFERMA
  // Le azioni irreversibili chiedono un secondo clic entro 4 secondi
  let daConfermare = null;
  function confermato(bottone, domanda = 'Sicuro? Clicca di nuovo') {
    if (daConfermare === bottone) {
      daConfermare = null;
      return true;
    }
    daConfermare = bottone;
    const contenuto = bottone.innerHTML;
    bottone.textContent = domanda;
    bottone.classList.add('pericolo');
    setTimeout(() => {
      if (daConfermare !== bottone) return;
      daConfermare = null;
      bottone.innerHTML = contenuto;
      bottone.classList.remove('pericolo');
    }, 4000);
    return false;
  }

  const campi = (contenitore) => Object.fromEntries([...contenitore.querySelectorAll('[name]')].map((c) => [c.name, c.value]));

  // RIDUZIONE SCHEDE
  // Attività e branch si aprono una alla volta: aprirne una riduce le altre
  function riduciSchede() {
    document.querySelectorAll('.scheda:not(.piano).aperta').forEach((s) => s.classList.remove('aperta'));
    stato.aperte.clear();
    stato.branchAperti.clear();
  }

  // RIDUZIONE PIANO
  // Il piano aperto si salva e si riduce; se è nuovo e non hai scritto nulla viene eliminato
  async function riduciPiano() {
    const id = stato.pianoAperto;
    if (!id) return;
    const scheda = document.querySelector(`.scheda.piano[data-piano-id="${id}"]`);
    const scartato = pianoNuovo === id;
    if (scartato) {
      clearTimeout(timerPiano);
      modifichePiano = null;
      await api('/api/piani/elimina', { id });
      stato.piani = stato.piani.filter((p) => p.id !== id);
      pianoNuovo = null;
      $('conta-piani').textContent = stato.piani.length;
      avvisa('Piano vuoto non salvato');
    } else {
      await salvaPiano();
    }
    stato.pianoAperto = null;
    if (!scheda?.isConnected) return;
    scheda.classList.remove('aperta');
    setTimeout(() => {
      if (scartato) scheda.remove();
      else if (!scheda.classList.contains('aperta')) scheda.querySelector('.interno').innerHTML = '';
    }, 350);
  }

  // AZIONI
  const AZIONI = {
    async chiudi(b) {
      if (!confermato(b)) return;
      await api('/api/sessioni/chiudi', { id: b.dataset.id });
      avvisa('Chat chiusa: la scheda in VS Code ora è scollegata');
      await carica();
    },
    async archivia(b) {
      const archivia = b.dataset.archivia === 'si';
      await api('/api/sessioni/archivia', { id: b.dataset.id, archivia });
      avvisa(archivia ? 'Chat archiviata' : 'Chat tolta dall\'archivio');
      await carica();
    },
    async 'elimina-sessione'(b) {
      if (!confermato(b)) return;
      await api('/api/sessioni/elimina', { id: b.dataset.id });
      avvisa('Chat eliminata');
      await carica();
    },
    async 'espandi-branch'(b) {
      const nome = b.dataset.nome;
      const scheda = b.closest('.scheda');
      const chiudi = stato.branchAperti.has(nome);
      riduciSchede();
      if (chiudi) return;
      stato.branchAperti.add(nome);
      scheda.classList.add('aperta');
      if (stato.commit[nome]) return;
      await caricaCommit(nome);
      scheda.querySelector('[data-commit]').innerHTML = htmlCommit(nome);
    },
    'apri-commit'() {
      stato.commitAperto = true;
      disegna();
      $('messaggio-commit').focus();
    },
    'annulla-commit'() {
      stato.commitAperto = false;
      disegna();
    },
    async committa() {
      const messaggio = $('messaggio-commit').value.trim();
      if (!messaggio) return avvisa('Scrivi il messaggio del commit', true);
      const esito = await api('/api/branch/committa', { messaggio });
      stato.commitAperto = false;
      avvisa(`Commit fatto su ${esito.branch}: ${esito.committati} file`);
      await carica();
    },
    async torna(b) {
      if (!confermato(b, `Togli ${b.dataset.tolti} commit: clicca di nuovo`)) return;
      const esito = await api('/api/branch/torna', { hash: b.dataset.hash });
      avvisa(`Tolti ${esito.tolti} commit. Per annullare: git reset --hard ${esito.prima.slice(0, 8)}`);
      await carica();
    },
    // Il piano nasce vuoto e si apre con il cursore sul titolo
    async 'crea-piano'() {
      await riduciPiano();
      const piano = await api('/api/piani/crea', {});
      pianoNuovo = piano.id;
      apriPiano(piano);
      document.querySelector('[data-piano="titolo"]').focus();
    },
    async pianifica(b) {
      const esistente = stato.piani.find((p) => p.attivita === b.dataset.id);
      const piano = esistente || await api('/api/piani/crea', { attivita: b.dataset.id });
      if (!esistente) pianoNuovo = piano.id;
      apriPiano(piano);
    },
    // APERTURA PIANO
    // Si apre uno alla volta: quello aperto prima si salva e si riduce. L'editor si scrive nella scheda
    // prima di aggiungere la classe, così la transizione di altezza parte da chiuso
    async 'espandi-piano'(b) {
      if (String(window.getSelection())) return;
      const id = b.dataset.id;
      const apri = stato.pianoAperto !== id;
      await riduciPiano();
      if (!apri) return;
      const piano = stato.piani.find((p) => p.id === id);
      const scheda = document.querySelector(`.scheda.piano[data-piano-id="${id}"]`);
      if (!piano || !scheda) return;
      stato.pianoAperto = id;
      stato.fasePiano = stato.fasiPiano[0]?.id || '';
      scheda.querySelector('.interno').innerHTML = htmlEditorPiano(piano);
      scheda.querySelectorAll('.fase-piano textarea, .backend-piano textarea').forEach(adattaAltezza);
      void scheda.offsetHeight;
      scheda.classList.add('aperta');
    },
    async 'copia-backend'(b) {
      const lista = b.dataset.attivita ? stato.attivita.find((a) => a.id === b.dataset.attivita)?.backend : pianoAperto()?.backend;
      const testo = lista?.find((x) => x.id === b.dataset.blocco)?.testo;
      if (!testo?.trim()) return avvisa('Non ci sono messaggi del backend da copiare', true);
      await navigator.clipboard.writeText(testo);
      avvisa('Messaggio del backend copiato');
    },
    // Il riquadro + apre il campo per scrivere un messaggio nuovo; Annulla lo richiude
    // COMPILA LA RICHIESTA
    // Claude legge i messaggi del backend e propone i campi; si scrivono solo quelli vuoti, il resto resta com'è
    async 'compila-richiesta'(b) {
      const piano = pianoAperto();
      if (!piano) return;
      if (!piano.backend.length) return avvisa('Aggiungi prima un messaggio del backend (sotto Tipo di lavoro)', true);
      await salvaPiano();
      b.disabled = true;
      b.classList.add('attivo');
      avvisa('Sto leggendo i messaggi del backend… può volerci un minuto');
      try {
        const { campi } = await api('/api/piani/compila', { id: piano.id });
        const scritti = [];
        const saltati = [];
        for (const [id, testoProposto] of Object.entries(campi)) {
          const campo = document.querySelector(`.fase-piano textarea[data-fase="richiesta"][data-campo="${id}"]`);
          if (!campo) continue;
          if (campo.value.trim()) {
            saltati.push(id);
            continue;
          }
          scriviCampo(campo, campo.dataset.forma ? formattaCampo(testoProposto, campo.dataset.forma) : testoProposto);
          scritti.push(id);
        }
        avvisa(scritti.length ? `Compilati ${scritti.length} campi${saltati.length ? `; ${saltati.length} già scritti non toccati` : ''}. Controllali e correggi.` : saltati.length ? 'I campi proposti erano già compilati: non ho toccato niente' : 'I messaggi non dicono abbastanza per compilare i campi', !scritti.length && !saltati.length);
      } finally {
        b.disabled = false;
        b.classList.remove('attivo');
      }
    },
    'nuovo-backend'() {
      $('aggiungi-backend').hidden = true;
      $('form-backend').hidden = false;
      $('nuovo-backend').focus();
    },
    'annulla-backend'() {
      $('nuovo-backend').value = '';
      $('form-backend').hidden = true;
      $('aggiungi-backend').hidden = false;
    },
    // Il blocco nuovo si salva sul server e il campo si svuota per il prossimo
    async 'salva-backend'(b) {
      const idAttivita = b.dataset.attivita;
      const campo = idAttivita ? b.closest('.backend-attivita').querySelector('textarea') : $('nuovo-backend');
      if (!campo.value.trim()) return avvisa('Incolla prima il messaggio', true);
      if (idAttivita) {
        const attivita = stato.attivita.find((a) => a.id === idAttivita);
        attivita.backend = (await api('/api/attivita/backend/aggiungi', { id: idAttivita, testo: campo.value })).backend;
        aggiornaBackendAttivita(attivita);
        return;
      }
      const piano = pianoAperto();
      piano.backend = (await api('/api/piani/backend/aggiungi', { id: piano.id, testo: campo.value })).backend;
      pianoNuovo = null;
      disegna();
      $('nuovo-backend')?.focus();
    },
    async 'elimina-backend'(b) {
      if (!confermato(b)) return;
      if (b.dataset.attivita) {
        const attivita = stato.attivita.find((a) => a.id === b.dataset.attivita);
        attivita.backend = (await api('/api/attivita/backend/elimina', { id: b.dataset.attivita, blocco: b.dataset.blocco })).backend;
        return aggiornaBackendAttivita(attivita);
      }
      const piano = pianoAperto();
      piano.backend = (await api('/api/piani/backend/elimina', { id: piano.id, blocco: b.dataset.blocco })).backend;
      disegna();
    },
    // La ✓ sta sulla riga di ogni piano: apre il quiz per terminarlo; gli altri stati lo riaprono
    async 'sposta-piano'(b) {
      const piano = stato.piani.find((p) => p.id === b.dataset.id);
      if (!piano || piano.stato === b.dataset.stato) return;
      if (piano.id === stato.pianoAperto) await salvaPiano();
      if (b.dataset.stato === 'fatto') {
        document.dispatchEvent(new CustomEvent('quiz-avvia', { detail: { origine: 'piano', piano: piano.id } }));
        return;
      }
      const aggiornato = await api('/api/piani/aggiorna', { id: piano.id, stato: b.dataset.stato });
      Object.assign(piano, { stato: aggiornato.stato, terminato: aggiornato.terminato, terminatoIl: aggiornato.terminatoIl });
      pianoNuovo = null;
      disegna();
    },
    'espandi-contesto'(b) {
      if (String(window.getSelection())) return;
      const chiudi = stato.contestiAperti.has(b.dataset.id);
      document.querySelectorAll('.scheda[data-contesto].aperta').forEach((s) => s.classList.remove('aperta'));
      stato.contestiAperti.clear();
      if (chiudi) return;
      b.closest('.scheda').classList.add('aperta');
      stato.contestiAperti.add(b.dataset.id);
    },
    async 'copia-contesto'(b) {
      await navigator.clipboard.writeText(testoContesto(stato.contesti.find((c) => c.id === b.dataset.id)));
      avvisa('Contesto copiato: incollalo in una chat nuova');
    },
    async 'elimina-contesto'(b) {
      if (!confermato(b)) return;
      await api('/api/contesti/elimina', { id: b.dataset.id });
      await carica();
    },
    async 'elimina-lezione'(b) {
      if (!confermato(b)) return;
      await api('/api/lezioni/elimina', { id: b.dataset.id });
      avvisa('Lezione eliminata');
      await carica();
    },
    async 'genera-mappa'() {
      const piano = pianoAperto();
      const manca = mancaPerGenerare(piano);
      if (manca) return avvisa(manca, true);
      await salvaPiano();
      const { generazione } = await api('/api/piani/genera-mappa', { id: piano.id, testo: testoPiano(piano) });
      piano.generazione = generazione;
      pianoNuovo = null;
      disegna();
      seguiGenerazione();
    },
    'riprendi-campo'(b) {
      const piano = pianoAperto();
      const campo = document.querySelector(`.fase-piano textarea[data-fase="${b.dataset.fase}"][data-campo="${b.dataset.campo}"]`);
      if (!piano || !campo) return;
      const testo = testoCampo(piano, b.dataset.da);
      scriviCampo(campo, campo.dataset.forma ? formattaCampo(testo, campo.dataset.forma) : testo);
      campo.focus();
    },
    // STRUMENTI DEI CAMPI
    async 'vedi-codice'(b) {
      const { piano, fase, c, campo } = datiCampo(b);
      if (!piano || !fase || !c) return;
      const nome = nomeDaCercare(piano);
      strumenti[chiaveStrumento(piano, fase.id, c.id)] = { tipo: 'codice', nome, risultati: null };
      aggiornaPannello(piano, fase, c, campo);
      if (nome) await eseguiCerca(piano, fase, c, campo, nome);
    },
    async 'cerca-codice'(b) {
      const { piano, fase, c, campo } = datiCampo(b);
      const nome = b.closest('.pannello')?.querySelector('[data-cerca-nome]')?.value.trim();
      if (!piano || !nome) return avvisa('Scrivi il nome da cercare', true);
      await eseguiCerca(piano, fase, c, campo, nome);
    },
    'riempi-campo'(b) {
      const { piano, fase, c, campo } = datiCampo(b);
      const s = strumenti[chiaveStrumento(piano, fase.id, c.id)];
      if (!campo || !s?.risultati?.length) return;
      const perFile = new Map();
      s.risultati.forEach((r) => perFile.set(r.file, [...(perFile.get(r.file) || []), r.riga]));
      const righe = [...perFile].map(([file, numeri]) => `- ${file} (riga ${numeri.slice(0, 5).join(', ')})`).join('\n');
      scriviCampo(campo, campo.dataset.forma ? formattaCampo(righe, campo.dataset.forma) : righe);
      campo.focus();
    },
    'vedi-diagramma'(b) {
      const { piano, fase, c, campo } = datiCampo(b);
      if (!piano || !fase || !c) return;
      strumenti[chiaveStrumento(piano, fase.id, c.id)] = { tipo: 'diagramma' };
      aggiornaPannello(piano, fase, c, campo);
    },
    'chiedi-chattino'(b) {
      const { piano, c } = datiCampo(b);
      if (piano && c?.domanda) document.dispatchEvent(new CustomEvent('chattino-chiedi', { detail: { piano: piano.id, domanda: c.domanda } }));
    },
    'scegli'(b) {
      const { fase, c, campo } = datiCampo(b);
      if (!campo || !c) return;
      const righe = (campo.value.trim() ? campo.value : c.traccia || '').split('\n');
      const prefisso = `${b.dataset.titolo}:`;
      let i = righe.findIndex((r) => r.startsWith(prefisso));
      if (i < 0) i = righe.push(`${prefisso} `) - 1;
      const attuali = sceltePresenti(righe.join('\n'), b.dataset.titolo);
      const nuovi = attuali.includes(b.dataset.opzione) ? attuali.filter((x) => x !== b.dataset.opzione) : [...attuali, b.dataset.opzione];
      righe[i] = `${prefisso} ${nuovi.join(', ')}`;
      scriviCampo(campo, righe.join('\n'));
      document.querySelector(`[data-scelte="${fase.id}.${c.id}"]`).innerHTML = htmlScelte(fase, c, campo.value);
    },
    async 'genera-sintesi'() {
      const piano = pianoAperto();
      const testo = testoRichiesta(piano);
      if (!testo) return avvisa('Scrivi qualcosa nei campi della Richiesta', true);
      await salvaPiano();
      const { generazioneSintesi } = await api('/api/piani/genera-sintesi', { id: piano.id, testo, firma: testo });
      piano.generazioneSintesi = generazioneSintesi;
      pianoNuovo = null;
      disegna();
      seguiGenerazione();
    },
    async 'vai-fase'(b) {
      if (!b.dataset.fase) return;
      const piano = pianoAperto();
      const blocco = bloccoMappa(piano);
      if (blocco && fasiDelPiano(piano).findIndex((f) => f.id === b.dataset.fase) > 0) return avvisa(blocco, true);
      await salvaPiano();
      stato.fasePiano = b.dataset.fase;
      disegna();
      document.querySelector('.scheda.piano.aperta')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    // Cambiando tipo si resta sulla stessa fase se esiste anche nel tipo nuovo, altrimenti si torna alla prima
    async 'tipo-piano'(b) {
      const piano = pianoAperto();
      if (piano.tipo === b.dataset.tipo) return;
      await salvaPiano();
      piano.tipo = b.dataset.tipo;
      if (!fasiDelPiano(piano).some((f) => f.id === stato.fasePiano)) stato.fasePiano = fasiDelPiano(piano)[0].id;
      pianoNuovo = null;
      await api('/api/piani/aggiorna', { id: piano.id, tipo: piano.tipo });
      disegna();
    },
    async 'mappa-piano'(b) {
      const piano = pianoAperto();
      if (piano.mappa === b.dataset.mappa || piano.generazione?.stato === 'in-corso') return;
      await salvaPiano();
      piano.mappa = b.dataset.mappa;
      pianoNuovo = null;
      await api('/api/piani/aggiorna', { id: piano.id, mappa: piano.mappa });
      disegna();
    },
    async 'copia-piano'(b) {
      await salvaPiano();
      await navigator.clipboard.writeText(testoPiano(stato.piani.find((p) => p.id === b.dataset.id)));
      avvisa('Copiato: incollalo in una chat di Claude Code e invia');
    },
    async 'elimina-piano'(b) {
      if (!confermato(b)) return;
      await api('/api/piani/elimina', { id: b.dataset.id });
      if (stato.pianoAperto === b.dataset.id) {
        clearTimeout(timerPiano);
        modifichePiano = null;
        stato.pianoAperto = null;
      }
      await carica();
    },
    async passa(b) {
      await api('/api/branch/cambia', { nome: b.dataset.nome });
      avvisa(`Ora sei su ${b.dataset.nome}`);
      await carica();
    },
    // Senza un numero di commit avanti (nessun branch principale) si tratta come non unito
    async 'elimina-branch'(b) {
      const avanti = b.dataset.avanti === '' ? null : Number(b.dataset.avanti);
      const forza = avanti !== 0;
      if (!confermato(b, forza ? `Perdi ${avanti ?? 'i'} commit non uniti: clicca di nuovo` : 'Sicuro? Clicca di nuovo')) return;
      await api('/api/branch/elimina', { nome: b.dataset.nome, forza });
      avvisa(`Branch ${b.dataset.nome} eliminato`);
      await carica();
    },
    // La richiesta resta aperta finché non chiudi la finestra di Windows
    async 'scegli-progetto'(b) {
      b.disabled = true;
      avvisa('Scegli la cartella nella finestra di Windows (se non la vedi, è nella barra delle applicazioni)');
      try {
        const scelta = await api('/api/progetti/scegli');
        if (scelta.annullato) return;
        if (scelta.esiste) return apriProgetto(scelta.nome);
        stato.nuovoProgetto = scelta;
        stato.progetto ? disegna() : disegnaSenzaProgetti();
      } finally {
        b.disabled = false;
      }
    },
    async 'conferma-progetto'() {
      const nuovo = await api('/api/progetti/aggiungi', { cartella: stato.nuovoProgetto.cartella });
      stato.nuovoProgetto = null;
      avvisa(`Progetto ${nuovo.nome} aggiunto`);
      await apriProgetto(nuovo.nome);
    },
    'annulla-progetto'() {
      stato.nuovoProgetto = null;
      stato.progetto ? disegna() : disegnaSenzaProgetti();
    },
    async 'rimuovi-progetto'(b) {
      if (!confermato(b, 'Togliere? Clicca di nuovo')) return;
      await api('/api/progetti/rimuovi', { nome: b.dataset.nome });
      avvisa(`${b.dataset.nome} tolto dalla sala: cartella, attività e piani restano dove sono`);
      await apriProgetto(stato.progetto === b.dataset.nome ? '' : stato.progetto);
    },
    async 'crea-branch'() {
      const nome = $('nuovo-branch').value.trim();
      if (!nome) return avvisa('Scrivi il nome del branch', true);
      await api('/api/branch/crea', { nome });
      avvisa(`Branch ${nome} creato: per lavorarci clicca Passa`);
      await carica();
    },
    nuova() {
      stato.nuova = true;
      stato.bozza = null;
      disegna();
      document.querySelector('[data-scheda="nuova"] [name="titolo"]')?.focus();
    },
    async aggiungi(b) {
      const dati = campi(b.closest('[data-scheda]'));
      if (!dati.titolo.trim()) return avvisa('Il TITOLO è obbligatorio', true);
      await api('/api/attivita/crea', dati);
      stato.nuova = false;
      stato.bozza = null;
      stato.filtroAttivita = 'aperti';
      avvisa('Attività aggiunta in Da fare');
      await carica();
    },
    // Il cambio di classe fa partire la transizione: niente ridisegno, altrimenti l'animazione non si vedrebbe
    espandi(b) {
      if (String(window.getSelection())) return;
      const scheda = b.closest('.scheda');
      const chiudi = stato.aperte.has(b.dataset.id);
      riduciSchede();
      if (chiudi) return;
      scheda.classList.add('aperta');
      stato.aperte.add(b.dataset.id);
    },
    async sposta(b) {
      if (b.classList.contains('attuale')) return;
      await api('/api/attivita/aggiorna', { id: b.dataset.id, stato: b.dataset.stato });
      avvisa(`Spostata in ${STATI.find(([id]) => id === b.dataset.stato)[1]}`);
      await carica();
    },
    modifica(b) {
      stato.modifica = b.dataset.id;
      disegna();
    },
    annulla() {
      stato.modifica = null;
      stato.nuova = false;
      stato.bozza = null;
      disegna();
    },
    async salva(b) {
      await api('/api/attivita/aggiorna', { id: b.dataset.id, ...campi(b.closest('[data-scheda]')) });
      stato.modifica = null;
      await carica();
    },
    async 'elimina-attivita'(b) {
      if (!confermato(b)) return;
      await api('/api/attivita/elimina', { id: b.dataset.id });
      await carica();
    },
  };

  document.addEventListener('click', async (e) => {
    // La maniglia serve solo a trascinare: il clic lì non apre l'attività
    if (e.target.closest('.maniglia')) return;
    const el = e.target.closest('[data-progetto], [data-sezione], [data-filtro], [data-filtro-attivita], [data-filtro-piani], [data-azione], #ricarica');
    if (!el) return;
    try {
      if (el.id === 'ricarica') return await carica();
      if (el.dataset.filtroAttivita) {
        stato.filtroAttivita = el.dataset.filtroAttivita;
        return disegna();
      }
      if (el.dataset.filtroPiani) {
        stato.filtroPiani = el.dataset.filtroPiani;
        return disegna();
      }
      if (el.dataset.progetto) {
        await riduciPiano();
        stato.progetto = el.dataset.progetto;
        stato.modifica = null;
        stato.nuova = false;
        stato.branchAperti.clear();
        stato.commitAperto = false;
        memoria.scrivi('sala.progetto', stato.progetto);
        return await carica();
      }
      if (el.dataset.sezione) {
        // Lasciando i Piani, quello aperto si salva e si riduce
        await riduciPiano();
        // Entrando in Attività o in Piani si parte sempre da Aperti
        if (el.dataset.sezione === 'attivita' && stato.sezione !== 'attivita') stato.filtroAttivita = 'aperti';
        if (el.dataset.sezione === 'piani' && stato.sezione !== 'piani') stato.filtroPiani = 'aperti';
        stato.sezione = el.dataset.sezione;
        memoria.scrivi('sala.sezione', stato.sezione);
        return disegna();
      }
      if (el.dataset.filtro) {
        stato.filtro = el.dataset.filtro;
        return disegna();
      }
      if (el.disabled) return;
      await AZIONI[el.dataset.azione](el);
    } catch (err) {
      avvisa(err instanceof TypeError ? 'Il server è spento' : err.message, true);
    }
  });

  // SALVATAGGIO DEI PIANI
  // Si salva da solo mentre scrivi: le modifiche si accumulano e partono dopo una breve pausa
  let modifichePiano = null;
  let timerPiano;

  function apriPiano(piano) {
    if (!stato.piani.some((p) => p.id === piano.id)) stato.piani.push(piano);
    stato.sezione = 'piani';
    stato.pianoAperto = piano.id;
    stato.fasePiano = stato.fasiPiano[0]?.id || '';
    memoria.scrivi('sala.sezione', stato.sezione);
    disegna();
    document.querySelector('.scheda.piano.aperta')?.scrollIntoView({ block: 'start' });
  }

  let pianoNuovo = null;

  async function salvaPiano() {
    clearTimeout(timerPiano);
    if (!modifichePiano) return;
    const dati = modifichePiano;
    modifichePiano = null;
    try {
      const piano = await api('/api/piani/aggiorna', dati);
      Object.assign(stato.piani.find((p) => p.id === piano.id), { aggiornato: piano.aggiornato });
    } catch (err) {
      avvisa(err.message, true);
    }
  }

  function modificaPiano(e) {
    const piano = pianoAperto();
    const el = e.target;
    if (!piano || !el.closest('#contenuto')) return;
    const { fase, campo, spunta } = el.dataset;
    if (!el.dataset.piano && !campo && !spunta) return;
    pianoNuovo = null;
    modifichePiano ??= { id: piano.id };
    if (el.dataset.piano) {
      piano[el.dataset.piano] = el.value;
      modifichePiano[el.dataset.piano] = el.value;
    } else {
      const chiave = campo ? 'campi' : 'spunte';
      const valore = campo ? el.value : el.checked;
      piano.fasi[fase][chiave][campo || spunta] = valore;
      modifichePiano.fasi ??= {};
      modifichePiano.fasi[fase] ??= {};
      modifichePiano.fasi[fase][chiave] ??= {};
      modifichePiano.fasi[fase][chiave][campo || spunta] = valore;
    }
    aggiornaIndicatoriPiano();
    clearTimeout(timerPiano);
    timerPiano = setTimeout(salvaPiano, spunta ? 0 : 700);
  }

  document.addEventListener('input', modificaPiano);
  // MESSAGGI BACKEND APERTI
  // Chiusi di partenza; aperti o chiusi restano così cambiando fase o sezione (toggle non risale: si ascolta in cattura)
  document.addEventListener('toggle', (e) => {
    if (!e.target.matches?.('.backend-piano, .backend-espandi')) return;
    const chiave = e.target.dataset.pianoId || `a-${e.target.dataset.attivitaId}`;
    if (e.target.open) stato.backendAperti.add(chiave);
    else stato.backendAperti.delete(chiave);
  }, true);
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'cerca-lezioni') return;
    stato.cercaLezioni = e.target.value;
    $('elenco-lezioni').innerHTML = htmlElencoLezioni();
  });
  document.addEventListener('input', (e) => {
    if (e.target.matches('.fase-piano textarea, .backend-piano textarea')) adattaAltezza(e.target);
  });
  document.addEventListener('change', (e) => {
    if (e.target.type === 'checkbox') modificaPiano(e);
  });
  window.addEventListener('beforeunload', () => salvaPiano());

  // CAMPI GUIDATI
  // Il valore cambiato da codice non genera "input": si lancia a mano, così il piano si salva e i consigli si aggiornano
  const campoDelPiano = (el) => stato.fasiPiano.find((f) => f.id === el.dataset.fase)?.campi.find((c) => c.id === el.dataset.campo);
  const scriviCampo = (el, valore) => {
    if (el.value === valore) return;
    el.value = valore;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  };

  // PUNTI FISSI
  // Ogni riga di un campo a elenco o a passi comincia sempre con il suo punto o numero: non si può cancellare né scrivere prima.
  // Qualsiasi modifica (tasti, taglia, incolla, seleziona tutto) viene riparata subito dopo, con il cursore al suo posto
  const INIZIO_VOCE = /^(•|\d+\.) /;
  const marcatoreDi = (forma, indice) => (forma === 'passi' ? `${indice + 1}. ` : PUNTO);
  const MARCATORE_ALTRUI = { elenco: /^\s*(•\s*|[-*]\s+)/, passi: /^\s*(\d+[.)]\s+|•\s*|[-*]\s+)/ };
  const lunghezzaMarcatore = (riga) => (riga.match(INIZIO_VOCE) || [''])[0].length;
  const campoConPunti = (el) => (el?.matches?.('.fase-piano textarea[data-forma]') && el.dataset.forma ? el.dataset.forma : '');
  const SOLO_MARCATORE = /^(•|\d+\.)\s*$/;

  function datiRiga(el) {
    const testo = el.value;
    const posizione = el.selectionStart;
    const inizioRiga = posizione ? testo.lastIndexOf('\n', posizione - 1) + 1 : 0;
    const prossimo = testo.indexOf('\n', posizione);
    const fineRiga = prossimo === -1 ? testo.length : prossimo;
    return { posizione, inizioRiga, fineRiga, riga: testo.slice(inizioRiga, fineRiga), indice: testo.slice(0, inizioRiga).split('\n').length - 1 };
  }

  function sistemaPunti(el) {
    const forma = campoConPunti(el);
    if (!forma) return;
    const { posizione, inizioRiga, riga, indice } = datiRiga(el);
    const togli = (r) => r.replace(MARCATORE_ALTRUI[forma], '');
    const righe = el.value.split('\n').map(togli);
    const nuovo = righe.map((r, i) => marcatoreDi(forma, i) + r).join('\n');
    if (nuovo === el.value) return;
    const prima = righe.slice(0, indice).reduce((t, r, i) => t + marcatoreDi(forma, i).length + r.length + 1, 0);
    const colonna = Math.max(0, posizione - inizioRiga - (riga.match(MARCATORE_ALTRUI[forma]) || [''])[0].length);
    const nuova = prima + marcatoreDi(forma, indice).length + colonna;
    el.value = nuovo;
    el.setSelectionRange(nuova, nuova);
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Il cursore non può stare dentro il punto: né con il mouse né con le frecce o Home
  function tieniDopoIlPunto(el) {
    if (!campoConPunti(el) || el.selectionStart !== el.selectionEnd) return;
    const { posizione, inizioRiga, riga } = datiRiga(el);
    const dopo = inizioRiga + lunghezzaMarcatore(riga);
    if (posizione < dopo) el.setSelectionRange(dopo, dopo);
  }
  document.addEventListener('selectionchange', () => tieniDopoIlPunto(document.activeElement));
  document.addEventListener('beforeinput', (e) => tieniDopoIlPunto(e.target));
  document.addEventListener('keyup', (e) => tieniDopoIlPunto(e.target));
  document.addEventListener('click', (e) => tieniDopoIlPunto(e.target));

  // Entrando in un campo compare il primo punto (o la traccia da completare, nei campi che ce l'hanno)
  document.addEventListener('focusin', (e) => {
    const el = e.target;
    if (!el.matches?.('.fase-piano textarea[data-campo]')) return;
    if (campoConPunti(el)) return sistemaPunti(el);
    const { traccia } = el.dataset;
    if (!traccia || el.value.trim()) return;
    scriviCampo(el, traccia);
    el.setSelectionRange(traccia.indexOf('\n'), traccia.indexOf('\n'));
  });

  // Rimuove la riga che contiene il cursore (con il suo a capo), lasciando il cursore alla fine di quella prima o dopo
  function togliRiga(el, { inizioRiga, fineRiga }) {
    const daInizio = inizioRiga ? inizioRiga - 1 : 0;
    const aFine = inizioRiga ? fineRiga : Math.min(el.value.length, fineRiga + 1);
    el.setRangeText('', daInizio, aFine, 'end');
  }

  // Invio aggiunge una voce. Backspace e Canc non toccano mai il punto: su una voce vuota Backspace e Invio la tolgono (se non è l'unica)
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    const forma = campoConPunti(el);
    if (!forma || e.isComposing || el.selectionStart !== el.selectionEnd) return;
    const dati = datiRiga(el);
    const { posizione, inizioRiga, fineRiga, riga } = dati;
    const lungPunto = lunghezzaMarcatore(riga);
    const vuota = SOLO_MARCATORE.test(riga);
    const altreRighe = el.value.includes('\n');
    let cambiato = false;
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!vuota) {
        el.setRangeText(`\n${marcatoreDi(forma, dati.indice + 1)}`, posizione, posizione, 'end');
        cambiato = true;
      } else if (altreRighe) {
        togliRiga(el, dati);
        cambiato = true;
      }
    } else if (e.key === 'Backspace' && posizione - inizioRiga <= lungPunto) {
      e.preventDefault();
      if (vuota && altreRighe) {
        togliRiga(el, dati);
        cambiato = true;
      }
    } else if (e.key === 'Delete') {
      if (posizione - inizioRiga < lungPunto) e.preventDefault();
      else if (posizione === fineRiga && fineRiga < el.value.length) {
        e.preventDefault();
        el.setRangeText('', fineRiga, fineRiga + 1 + lunghezzaMarcatore(el.value.slice(fineRiga + 1).split('\n')[0]), 'end');
        cambiato = true;
      }
    }
    if (cambiato) el.dispatchEvent(new Event('input', { bubbles: true }));
  });

  // Uscendo dal campo: le voci vuote spariscono e un campo toccato e lasciato vuoto si svuota del tutto (senza il punto conta come non scritto)
  document.addEventListener('focusout', (e) => {
    const el = e.target;
    if (!el.matches?.('.fase-piano textarea[data-campo]')) return;
    const { forma, traccia } = el.dataset;
    if (traccia && el.value.trim() === traccia.trim()) return scriviCampo(el, '');
    if (forma) scriviCampo(el, formattaCampo(el.value, forma));
  });

  // Mentre scrivi: i punti si riparano e i consigli si aggiornano, senza ridisegnare la pagina
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.matches?.('.fase-piano textarea[data-campo]')) return;
    if (!e.isComposing && document.activeElement === el) sistemaPunti(el);
    const c = campoDelPiano(el);
    const consigli = document.querySelector(`[data-consigli="${el.dataset.fase}.${el.dataset.campo}"]`);
    if (c && consigli) consigli.innerHTML = htmlConsigli(c, el.value);
    el.closest('label')?.querySelector('.riprendi')?.remove();
  });

  // TRASCINAMENTO ATTIVITÀ
  // Durante il trascinamento la scheda si sposta davvero nella pagina; al rilascio si salva il nuovo ordine
  document.addEventListener('pointerdown', (e) => {
    const maniglia = e.target.closest?.('.scheda .maniglia');
    if (maniglia) maniglia.closest('.scheda').draggable = true;
  });
  document.addEventListener('pointerup', () => {
    document.querySelectorAll('.scheda[draggable="true"]').forEach((s) => { s.draggable = false; });
  });

  document.addEventListener('dragstart', (e) => {
    const scheda = e.target.closest?.('.scheda[data-id]');
    if (!scheda) return;
    stato.trascinata = scheda;
    scheda.classList.add('trascinata');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', scheda.dataset.id);
  });

  document.addEventListener('dragover', (e) => {
    const lista = e.target.closest?.('.lista');
    if (!stato.trascinata || lista !== stato.trascinata.parentElement) return;
    e.preventDefault();
    const dopo = [...lista.querySelectorAll('.scheda[data-id]:not(.trascinata)')]
      .find((s) => e.clientY < s.getBoundingClientRect().top + s.offsetHeight / 2);
    if (dopo) lista.insertBefore(stato.trascinata, dopo);
    else lista.appendChild(stato.trascinata);
  });

  document.addEventListener('drop', (e) => {
    if (stato.trascinata) e.preventDefault();
  });

  // Le attività nascoste dal filtro restano nei loro posti: si riempiono solo i posti di quelle visibili
  document.addEventListener('dragend', async () => {
    const scheda = stato.trascinata;
    if (!scheda) return;
    scheda.classList.remove('trascinata');
    scheda.draggable = false;
    stato.trascinata = null;
    const visibili = [...scheda.parentElement.querySelectorAll('.scheda[data-id]')].map((s) => s.dataset.id);
    const prima = stato.attivita.slice().sort(perOrdine).map((a) => a.id);
    const posti = new Set(visibili);
    let k = 0;
    const ids = prima.map((id) => (posti.has(id) ? visibili[k++] : id));
    if (ids.every((id, i) => id === prima[i])) return;
    try {
      await api('/api/attivita/riordina', { ids });
      await carica();
    } catch (err) {
      avvisa(err.message, true);
      await carica();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.target.tagName !== 'INPUT') return;
    const bottone = e.target.id === 'nuovo-branch' ? document.querySelector('[data-azione="crea-branch"]')
      : e.target.id === 'messaggio-commit' ? document.querySelector('[data-azione="committa"]')
      : e.target.closest('[data-scheda]')?.querySelector('[data-azione="aggiungi"], [data-azione="salva"]');
    bottone?.click();
  });

  // AGGIORNAMENTO AUTOMATICO
  // Si ferma mentre scrivi o modifichi, altrimenti il ridisegno cancellerebbe il testo
  setInterval(() => {
    const scrivendo = ['codice', 'funzionalita'].includes(stato.sezione) ||document.activeElement?.matches('input, textarea, select') || stato.modifica || stato.nuova || stato.trascinata || stato.commitAperto || stato.pianoAperto || daConfermare;
    if (!document.hidden && !scrivendo) carica().catch(() => {});
  }, AGGIORNA_MS);

  // QUIZ DI FINE LEZIONE
  // Parte da Chattino insegnante o dal ✓ di un piano; domande, verifica e lezione le fa il server (quiz-lezione.js).
  // La lezione si salva solo quando tutte le domande sono giuste; il piano si termina nello stesso momento
  (() => {
    const $ = (id) => document.getElementById(id);
    const MIN_APERTA = 15;
    const NOMI_TIPO = { scelta: 'Risposta multipla', aperta: 'Risposta aperta' };
    let quiz = null;
    let schermata = 'chiuso';
    let messaggio = '';
    let lezione = null;
    let timer = null;
    let numeroRichiesta = 0;
    let ultimaChiamata = null;

    function ferma() {
      clearInterval(timer);
      timer = null;
    }

    function chiudi() {
      numeroRichiesta++;
      ferma();
      schermata = 'chiuso';
      $('quiz').hidden = true;
    }

    // ATTESA
    // Generare le domande o valutare le risposte richiede claude: si mostra il tempo trascorso
    function attendi(testo) {
      ferma();
      schermata = 'attesa';
      const inizio = Date.now();
      const scrivi = () => { messaggio = `${testo} ${Math.round((Date.now() - inizio) / 1000)} s`; const el = $('quiz-corpo').querySelector('.quiz-messaggio'); if (el) el.textContent = messaggio; };
      scrivi();
      timer = setInterval(scrivi, 1000);
      mostra();
    }

    // ESECUZIONE
    // Una risposta che arriva dopo la chiusura della finestra non la ridisegna, ma una lezione già salvata va comunque segnalata
    async function esegui(testo, percorso, dati) {
      const mio = ++numeroRichiesta;
      $('quiz').hidden = false;
      attendi(testo);
      try {
        const risultato = await api(percorso, dati);
        if (risultato.lezione) await carica();
        if (mio !== numeroRichiesta) {
          if (risultato.lezione) avvisa(`Lezione salvata: ${risultato.lezione.titolo}`);
          return;
        }
        ferma();
        quiz = risultato;
        lezione = risultato.lezione || null;
        schermata = lezione ? 'fatto' : 'domande';
      } catch (err) {
        if (mio !== numeroRichiesta) return;
        ferma();
        messaggio = err.message;
        schermata = 'errore';
        ultimaChiamata = () => esegui(testo, percorso, dati);
      }
      mostra();
    }

    // DOMANDE
    function htmlVoce(v) {
      const chiusa = Boolean(v.esito);
      const corpo = v.tipo === 'scelta'
        ? v.opzioni.map((o, i) => `<label class="quiz-opzione${chiusa ? (i === v.corretta ? ' giusta' : i === v.risposta ? ' sbagliata' : '') : ''}">
            <input type="radio" name="${v.id}" value="${i}"${chiusa ? ' disabled' : ''}${v.risposta === i ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')
        : `<textarea data-voce="${v.id}" rows="4"${chiusa ? ' disabled' : ''} placeholder="Rispondi con parole tue, in 2-4 frasi">${esc(v.risposta || '')}</textarea>`;
      const esito = chiusa ? `<div class="quiz-esito"><b>${v.esito === 'ok' ? '✓ Giusta' : '✗ Sbagliata'}</b>${v.feedback ? ` · ${esc(v.feedback)}` : ''}</div>` : '';
      return `<div class="quiz-domanda${v.esito ? ` ${v.esito}` : ''}"><span class="tipo-domanda">${NOMI_TIPO[v.tipo]}</span><p>${esc(v.testo)}</p>${corpo}${esito}</div>`;
    }

    function mostra() {
      const corpo = $('quiz-corpo');
      const piede = $('quiz-piede');
      $('quiz-titolo').textContent = quiz?.titolo || 'Quiz di fine lezione';
      const chiudiBtn = '<button type="button" class="btn" data-quiz="chiudi">Chiudi</button>';
      if (schermata === 'attesa') {
        $('quiz-sotto').textContent = '';
        corpo.innerHTML = `<div class="quiz-messaggio">${esc(messaggio)}</div>`;
        piede.innerHTML = '';
      } else if (schermata === 'errore') {
        $('quiz-sotto').textContent = '';
        corpo.innerHTML = `<div class="quiz-messaggio errore">${esc(messaggio)}</div>`;
        piede.innerHTML = `${chiudiBtn}<button type="button" class="btn primario" data-quiz="riprova">Riprova</button>`;
      } else if (schermata === 'fatto') {
        $('quiz-sotto').textContent = 'Quiz superato';
        corpo.innerHTML = `<div class="quiz-messaggio">✓ Lezione generata e salvata: <b>${esc(lezione.titolo)}</b></div>${quiz.voci.map(htmlVoce).join('')}`;
        piede.innerHTML = `${chiudiBtn}<button type="button" class="btn primario" data-quiz="lezioni">Apri le Lezioni</button>`;
      } else {
        const aperte = quiz.voci.filter((v) => !v.esito).length;
        $('quiz-sotto').textContent = `${quiz.voci.filter((v) => v.esito === 'ok').length} giuste · ${aperte} da fare: devi rispondere bene a tutte per generare la lezione`;
        corpo.innerHTML = quiz.voci.map(htmlVoce).join('');
        piede.innerHTML = `${chiudiBtn}<button type="button" class="btn primario" data-quiz="verifica">Verifica le risposte</button>`;
      }
    }

    // RISPOSTE
    function leggiRisposte() {
      const risposte = {};
      for (const v of quiz.voci.filter((x) => !x.esito)) {
        if (v.tipo === 'scelta') {
          const scelta = document.querySelector(`#quiz-corpo input[name="${v.id}"]:checked`);
          if (!scelta) return avvisa('Rispondi a tutte le domande', true);
          risposte[v.id] = Number(scelta.value);
        } else {
          const t = document.querySelector(`#quiz-corpo textarea[data-voce="${v.id}"]`).value.trim();
          if (t.length < MIN_APERTA) return avvisa(`Le risposte aperte vanno scritte con parole tue (almeno ${MIN_APERTA} caratteri)`, true);
          risposte[v.id] = t;
        }
      }
      return risposte;
    }

    const AZIONI_QUIZ = {
      chiudi,
      riprova: () => ultimaChiamata?.(),
      verifica() {
        const risposte = leggiRisposte();
        if (risposte) esegui('Verifico le risposte…', '/api/quiz/rispondi', { id: quiz.id, risposte });
      },
      lezioni() {
        chiudi();
        Object.assign(stato, { sezione: 'lezioni' });
        memoria.scrivi('sala.sezione', stato.sezione);
        disegna();
      },
    };

    $('quiz').addEventListener('click', (e) => {
      const azione = e.target.closest('[data-quiz]')?.dataset.quiz;
      if (azione) return AZIONI_QUIZ[azione]();
      if (e.target.id === 'quiz-chiudi') chiudi();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && schermata !== 'chiuso') chiudi();
    });
    document.addEventListener('quiz-avvia', (e) => {
      if (schermata === 'attesa') return;
      quiz = null;
      lezione = null;
      esegui('Preparo le domande…', '/api/quiz/avvia', e.detail);
    });
  })();

  // CHATTINO
  // Le domande vanno al server della chat delle mappe (~/.claude/shared/chat-mappa-server.js), che le passa a claude -p in sola lettura
  (() => {
    const GETTONE_CHAT = '__GETTONE_CHAT__';
    const SERVER = 'http://127.0.0.1:4517';
    const AVVIO = 'node "$HOME/.claude/shared/chat-mappa-server.js" --sfondo';
    const MAX_STORIA = 10;
    const MAX_QUIZ_STORIA = 8;
    const NOMI_SEZIONI = { sessioni: 'Sessioni Claude', branch: 'Branch', attivita: 'Attività', piani: 'Piani', contesto: 'Contesto', lezioni: 'Lezioni', funzionalita: 'Funzionalità', codice: 'Lettura codice' };
    const storia = [];
    const $ = (id) => document.getElementById(id);
    let inAttesa = false;

    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');

    // FORMATTAZIONE RISPOSTA
    // Markdown essenziale: blocchi di codice, `codice`, **grassetto**, elenchi puntati, paragrafi.
    // TABELLE
    // Righe "| a | b |" con sotto la riga dei trattini "|---|---|"; il testo arriva già escapato
    const rigaTabella = (r) => /^\s*\|.*\|\s*$/.test(r);
    const separatoreTabella = (r) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(r);
    const celleTabella = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));

    function htmlTabella([testa, , ...corpo]) {
      const riga = (celle, tag) => `<tr>${celle.map((c) => `<${tag}>${c}</${tag}>`).join('')}</tr>`;
      return `<table><thead>${riga(celleTabella(testa), 'th')}</thead><tbody>${corpo.map((r) => riga(celleTabella(r), 'td')).join('')}</tbody></table>`;
    }

    // RIGHE DEL TESTO
    // Titoli "## " e "### ", linea "---", citazione "> " (riquadro nota), elenchi puntati, numerati e checklist "- [ ]" / "- [x]".
    // Il testo arriva già escapato: ">" è diventato "&gt;"
    function paragrafo(testo) {
      let html = '';
      let lista = [];
      let tipoLista = 'ul';
      let citazione = [];
      let dopoTesto = false;
      const chiudiLista = () => {
        if (lista.length) html += `<${tipoLista}>${lista.join('')}</${tipoLista}>`;
        lista = [];
      };
      const chiudiCitazione = () => {
        if (citazione.length) html += `<blockquote>${citazione.join('<br>')}</blockquote>`;
        citazione = [];
      };
      const chiudi = () => {
        chiudiLista();
        chiudiCitazione();
      };
      const blocco = (h) => {
        chiudi();
        html += h;
        dopoTesto = false;
      };
      const voce = (tipo, contenuto) => {
        chiudiCitazione();
        if (tipoLista !== tipo) chiudiLista();
        tipoLista = tipo;
        lista.push(contenuto);
        dopoTesto = false;
      };
      const righe = testo.split('\n');
      for (let i = 0; i < righe.length; i++) {
        const riga = righe[i];
        if (rigaTabella(riga) && separatoreTabella(righe[i + 1] || '')) {
          let fine = i + 2;
          while (fine < righe.length && rigaTabella(righe[fine])) fine++;
          blocco(htmlTabella(righe.slice(i, fine)));
          i = fine - 1;
          continue;
        }
        const titolo = riga.match(/^(#{2,3})\s+(.+)$/);
        if (titolo) {
          blocco(`<div class="t${titolo[1].length - 1}">${inline(titolo[2])}</div>`);
          continue;
        }
        if (/^\s*(-{3,}|\*{3,})\s*$/.test(riga)) {
          blocco('<hr>');
          continue;
        }
        const cita = riga.match(/^&gt;\s?(.*)$/);
        if (cita) {
          chiudiLista();
          citazione.push(inline(cita[1]));
          dopoTesto = false;
          continue;
        }
        // value: con una riga vuota tra le voci ognuna diventa una lista a sé e ripartirebbe da 1
        const numero = riga.match(/^\s*(\d+)[.)]\s+(.*)/);
        if (numero) {
          voce('ol', `<li value="${numero[1]}">${inline(numero[2])}</li>`);
          continue;
        }
        const punto = riga.match(/^\s*[-*]\s+(.*)/);
        if (punto) {
          const spunta = punto[1].match(/^\[( |x|X)\]\s+(.*)/);
          voce('ul', spunta ? `<li class="spunta${spunta[1] === ' ' ? '' : ' fatta'}">${inline(spunta[2])}</li>` : `<li>${inline(punto[1])}</li>`);
          continue;
        }
        chiudi();
        html += `${dopoTesto ? '<br>' : ''}${inline(riga)}`;
        dopoTesto = true;
      }
      chiudi();
      return `<div class="par">${html}</div>`;
    }

    const testoHtml = (testo) => esc(testo).split(/\n{2,}/).filter((p) => p.trim()).map(paragrafo).join('');

    // BLOCCHI VISIVI
    // Chattino li scrive in blocchi con un nome (flusso, esempio, nota, attenzione) e la pagina li disegna: da Claude non arriva mai HTML o SVG
    const RIQUADRI = { esempio: 'Esempio', nota: 'Da ricordare', attenzione: 'Attenzione' };
    const BLOCCO_CODICE = /```([\w-]*)[ \t]*\n?([\s\S]*?)```/g;

    function htmlRiquadro(tipo, corpo) {
      const titolo = corpo.match(/^\s*titolo:[ \t]*(.+)\n?/);
      const resto = titolo ? corpo.slice(titolo[0].length) : corpo;
      return `<div class="riquadro ${tipo}"><div class="riquadro-testa">${esc(RIQUADRI[tipo])}${titolo ? ` · ${esc(titolo[1].trim())}` : ''}</div><div class="riquadro-corpo">${testoHtml(resto)}</div></div>`;
    }

    // FLUSSO
    // Righe "id: testo" = riquadro, "id -> id: etichetta" = freccia. Un blocco incomprensibile resta un blocco di codice
    function leggiFlusso(corpo) {
      const nodi = [];
      const archi = [];
      let titolo = '';
      for (const riga of corpo.split('\n')) {
        const r = riga.trim();
        const arco = r.match(/^([\w-]{1,20})\s*->\s*([\w-]{1,20})\s*(?::\s*(.{0,60}))?$/);
        if (arco) {
          archi.push({ da: arco[1], a: arco[2], etichetta: (arco[3] || '').trim() });
          continue;
        }
        const nodo = r.match(/^([\w-]{1,20})\s*:\s*(.{1,140})$/);
        if (!nodo) continue;
        if (nodo[1] === 'titolo') titolo = nodo[2].trim();
        else if (!nodi.some((n) => n.id === nodo[1])) nodi.push({ id: nodo[1], testo: nodo[2].trim() });
      }
      const ids = new Set(nodi.map((n) => n.id));
      const validi = archi.filter((a) => ids.has(a.da) && ids.has(a.a) && a.da !== a.a).slice(0, 30);
      return nodi.length >= 2 && nodi.length <= 14 && validi.length ? { titolo, nodi, archi: validi } : null;
    }

    // RIGHE DEL FLUSSO
    // Ogni riquadro sta una riga sotto quelli che lo precedono; le frecce che tornano indietro (cicli) non contano per le righe
    function righeFlusso({ nodi, archi }) {
      const figli = new Map(nodi.map((n) => [n.id, []]));
      archi.forEach((a) => figli.get(a.da).push(a.a));
      const entranti = new Set(archi.map((a) => a.a));
      const stato = new Map();
      const avanti = [];
      const visita = (id) => {
        stato.set(id, 1);
        for (const f of figli.get(id)) {
          if (stato.get(f) === 1) continue;
          avanti.push([id, f]);
          if (!stato.has(f)) visita(f);
        }
        stato.set(id, 2);
      };
      [...nodi.filter((n) => !entranti.has(n.id)), ...nodi].forEach((n) => { if (!stato.has(n.id)) visita(n.id); });
      const riga = new Map(nodi.map((n) => [n.id, 0]));
      for (let giro = 0; giro < nodi.length; giro++) {
        let cambiato = false;
        for (const [da, a] of avanti) {
          if (riga.get(a) <= riga.get(da)) {
            riga.set(a, riga.get(da) + 1);
            cambiato = true;
          }
        }
        if (!cambiato) break;
      }
      return riga;
    }

    function htmlFlusso(corpo) {
      const flusso = leggiFlusso(corpo);
      if (!flusso) return null;
      const riga = righeFlusso(flusso);
      const righe = [];
      const conUscita = new Set(flusso.archi.map((a) => a.da));
      const conIngresso = new Set(flusso.archi.map((a) => a.a));
      flusso.nodi.forEach((n, i) => {
        const classe = `nodo${conIngresso.has(n.id) ? '' : ' inizio'}${conUscita.has(n.id) ? '' : ' fine'}`;
        (righe[riga.get(n.id)] ||= []).push(`<div class="${classe}" data-id="${esc(n.id)}"><span class="nodo-n">${i + 1}</span>${esc(n.testo)}</div>`);
      });
      return `<div class="flusso">${flusso.titolo ? `<div class="flusso-titolo">${esc(flusso.titolo)}</div>` : ''}
        <div class="flusso-area" data-archi="${esc(JSON.stringify(flusso.archi))}">${righe.filter(Boolean).map((r) => `<div class="flusso-riga">${r.join('')}</div>`).join('')}<div class="flusso-frecce"></div></div></div>`;
    }

    // FRECCE
    // Si disegnano a pagina visibile, misurando i riquadri; il ResizeObserver le rifà quando la chat cambia dimensione
    const bordo = (r, centro, verso) => {
      const dx = verso.x - centro.x;
      const dy = verso.y - centro.y;
      const t = 1 / Math.max(Math.abs(dx) / (r.w / 2), Math.abs(dy) / (r.h / 2), 1e-6);
      return { x: centro.x + dx * t, y: centro.y + dy * t };
    };
    let contaFrecce = 0;

    function tracciaFlusso(area) {
      const sopra = area.querySelector('.flusso-frecce');
      const base = area.getBoundingClientRect();
      if (!base.width) return;
      const rettangoli = {};
      area.querySelectorAll('.nodo').forEach((el) => {
        const r = el.getBoundingClientRect();
        rettangoli[el.dataset.id] = { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
      });
      const punta = `punta-${++contaFrecce}`;
      let linee = '';
      let etichette = '';
      for (const a of JSON.parse(area.dataset.archi)) {
        const da = rettangoli[a.da];
        const verso = rettangoli[a.a];
        if (!da || !verso) continue;
        const c1 = { x: da.x + da.w / 2, y: da.y + da.h / 2 };
        const c2 = { x: verso.x + verso.w / 2, y: verso.y + verso.h / 2 };
        const p1 = bordo(da, c1, c2);
        const p2 = bordo(verso, c2, c1);
        linee += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" marker-end="url(#${punta})"/>`;
        if (a.etichetta) etichette += `<span class="freccia-etichetta" style="left:${(p1.x + p2.x) / 2}px;top:${(p1.y + p2.y) / 2}px">${esc(a.etichetta)}</span>`;
      }
      sopra.innerHTML = `<svg width="${base.width}" height="${base.height}"><defs><marker id="${punta}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${linee}</svg>${etichette}`;
    }

    const osservaFlussi = new ResizeObserver((voci) => voci.forEach((v) => tracciaFlusso(v.target)));

    // SCELTA
