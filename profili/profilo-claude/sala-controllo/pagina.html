    // Righe "N: testo" = un bottone; il clic invia da solo la scelta (vedi il listener sotto). Con meno di 2 voci resta un blocco di codice
    function htmlScelta(corpo) {
      const titolo = corpo.match(/^\s*titolo:[ \t]*(.+)$/m);
      const voci = [...corpo.matchAll(/^\s*(\d{1,2})[ \t]*:[ \t]*(.+)$/gm)].slice(0, 6);
      if (voci.length < 2) return null;
      const bottoni = voci.map((v) => `<button type="button" class="scelta-voce" data-scelta="${esc(v[1])}" data-testo="${esc(v[2].trim())}"><span class="scelta-num">${esc(v[1])}</span><span>${esc(v[2].trim())}</span></button>`).join('');
      return `<div class="scelta"><div class="scelta-testa">${esc(titolo ? titolo[1].trim() : 'Scegli un’ipotesi')}</div><div class="scelta-voci">${bottoni}</div></div>`;
    }

    function bloccoHtml(lingua, corpo) {
      if (lingua === 'flusso') {
        const html = htmlFlusso(corpo);
        if (html) return html;
      }
      if (lingua === 'scelta') {
        const html = htmlScelta(corpo);
        if (html) return html;
      }
      if (Object.hasOwn(RIQUADRI, lingua)) return htmlRiquadro(lingua, corpo);
      return `<div class="codice">${lingua ? `<span class="lingua">${esc(lingua)}</span>` : ''}<pre><code>${esc(corpo.replace(/\n$/, ''))}</code></pre></div>`;
    }

    function markdown(testo) {
      let html = '';
      let ultimo = 0;
      for (const m of testo.matchAll(BLOCCO_CODICE)) {
        html += testoHtml(testo.slice(ultimo, m.index)) + bloccoHtml(m[1], m[2]);
        ultimo = m.index + m[0].length;
      }
      return html + testoHtml(testo.slice(ultimo));
    }

    function aggiungi(classe, html, contesto) {
      const msg = document.createElement('div');
      msg.className = `msg ${classe}`;
      msg.innerHTML = (contesto ? `<span class="ctx">su ${esc(contesto)}</span>` : '') + html;
      $('chat-log').appendChild(msg);
      msg.querySelectorAll('.flusso-area').forEach((area) => osservaFlussi.observe(area));
      $('chat-log').scrollTop = $('chat-log').scrollHeight;
      return msg;
    }

    function serverSpento() {
      const msg = aggiungi('errore', `La chat non risponde: il server locale è spento. Avvialo da un terminale con<br><code>${esc(AVVIO)}</code><br><button type="button">Copia comando</button>`);
      msg.querySelector('button').addEventListener('click', async () => {
        await navigator.clipboard.writeText(AVVIO);
        avvisa('Comando copiato: incollalo in un terminale e riprova');
      });
    }

    // CONSUMO CHATTINO
    let consumoGiornata = null;
    let consumoRisposta = null;
    function mostraConsumo() {
      const t = consumoGiornata?.perFunzione?.chattino;
      const riga = (nome, html) => `<div><span class="tok-chi">${nome}</span>: ${html}</div>`;
      $('chat-consumo-dati').innerHTML = riga('Ultima risposta', consumoRisposta ? testoToken(consumoRisposta.token, consumoRisposta.cache) : 'nessuna ancora')
        + riga(testoGiornata(), t ? `${testoToken(t.token, t.cache)} · ${t.chiamate} ${t.chiamate === 1 ? 'chiamata' : 'chiamate'}` : 'nessun consumo');
      $('chat-consumo').title = AIUTO_CONSUMI;
    }

    // STATO SERVER
    async function controllaServer() {
      const dot = document.querySelector('#chat-open .dot');
      try {
        const res = await fetch(`${SERVER}/stato`);
        dot.classList.toggle('off', !res.ok);
      } catch {
        dot.classList.add('off');
      }
    }

    // CONTESTO
    // Al Claude della chat arriva quello che vedi: progetto, sezione aperta e i dati della sala, senza percorsi dei file delle chat
    // Di default Chattino non riceve nulla: il contesto è solo il blocco scelto con Alt + clic, senza percorsi dei file delle chat
    const BLOCCHI = {
      attivita: { nome: 'Attività', trova: (id) => stato.attivita.find((a) => String(a.id) === id), titolo: (a) => a.titolo, dati: ({ id, progetto, ...a }) => a },
      piano: { nome: 'Piano', trova: (id) => stato.piani.find((p) => String(p.id) === id), titolo: (p) => p.titolo, dati: ({ id, progetto, ...p }) => p },
      sessione: {
        nome: 'Sessione',
        trova: (id) => stato.sessioni.find((s) => String(s.id) === id),
        titolo: (s) => s.titolo,
        dati: ({ titolo, stato: s, token, finestra, compattazioni, modificata }) => ({ titolo, stato: s, token, finestra, compattazioni, modificata: new Date(modificata).toISOString() }),
      },
      branch: { nome: 'Branch', trova: (id) => stato.branch?.branch?.find((b) => b.nome === id), titolo: (b) => b.nome, dati: (b) => b },
      contesto: { nome: 'Contesto', trova: (id) => stato.contesti.find((c) => String(c.id) === id), titolo: (c) => c.titolo, dati: ({ id, progetto, ...c }) => c },
      lezione: { nome: 'Lezione', trova: (id) => stato.lezioni.find((l) => String(l.id) === id), titolo: (l) => l.titolo, dati: ({ id, ...l }) => l },
      campo: { nome: 'Campo del piano', trova: (id) => sezionePiano(id, true), titolo: (o) => o.etichetta, dati: (o) => o.dati },
      fase: { nome: 'Fase del piano', trova: (id) => sezionePiano(id, false), titolo: (o) => o.etichetta, dati: (o) => o.dati },
    };

    // SEZIONE DEL PIANO
    // Un campo ("rischi.rompe") o una fase intera ("rischi") del piano aperto: a Chattino arriva solo quel testo, non tutto il piano
    function sezionePiano(id, perCampo) {
      const piano = pianoAperto();
      const [faseId, campoId] = id.split('.');
      const fase = stato.fasiPiano.find((f) => f.id === faseId);
      if (!piano || !fase) return null;
      const intestazione = { piano: piano.titolo, tipo: nomeTipo(piano.tipo), fase: fase.nome };
      if (perCampo) {
        const c = fase.campi.find((x) => x.id === campoId);
        if (!c) return null;
        return { etichetta: `${fase.nome} › ${c.nome}`, dati: { ...intestazione, campo: c.nome, testo: String(piano.fasi[fase.id]?.campi[c.id] || '').trim() || '(vuoto)' } };
      }
      const campi = Object.fromEntries(delTipo(fase.campi, piano.tipo).map((c) => [c.nome, String(piano.fasi[fase.id]?.campi[c.id] || '').trim() || '(vuoto)']));
      return { etichetta: `fase ${fase.nome}`, dati: { ...intestazione, campi } };
    }

    // BLOCCO SCELTO
    // Resta agganciato alle domande finché non lo togli con la X; i dati si rileggono a ogni domanda, con l'ultima copia come ripiego
    let bloccoScelto = null;

    function leggiBlocco(el) {
      const def = BLOCCHI[el.dataset.blocco];
      const oggetto = def?.trova(el.dataset.bid);
      return oggetto ? { tipo: el.dataset.blocco, id: el.dataset.bid, etichetta: `${def.nome} "${def.titolo(oggetto)}"`, dati: def.dati(oggetto) } : null;
    }

    function datiBlocco() {
      const def = BLOCCHI[bloccoScelto.tipo];
      const oggetto = def.trova(bloccoScelto.id);
      return oggetto ? def.dati(oggetto) : bloccoScelto.dati;
    }

    const senzaContesto = () => !bloccoScelto;
    const selezione = () => (bloccoScelto ? `${bloccoScelto.etichetta} di ${stato.progetto}` : null);
    const datiSala = () => ({ progetto: stato.progetto, [bloccoScelto.tipo]: datiBlocco() });

    function aggiornaContesto() {
      $('chat-ctx').innerHTML = bloccoScelto
        ? `Domanda su <b>${esc(bloccoScelto.etichetta)}</b><button type="button" id="chat-ctx-togli" title="Togli il contesto">&#x2715;</button>`
        : 'Nessun contesto · tieni premuto <b>Alt</b> e clicca un blocco';
    }

    $('chat-ctx').addEventListener('click', (e) => {
      if (e.target.id !== 'chat-ctx-togli') return;
      bloccoScelto = null;
      aggiornaContesto();
    });

    // RIQUADRI TOKEN APERTI
    // Il ridisegno periodico ricrea i piè di pagina: ricordo quali riquadri hai aperto
    stato.consumiAperti = new Set();
    document.addEventListener('toggle', (e) => {
      const f = e.target.dataset?.funzione;
      if (f) e.target.open ? stato.consumiAperti.add(f) : stato.consumiAperti.delete(f);
      if (e.target.matches?.('.token-box')) posizionaToken();
    }, true);

    // POSIZIONE FINESTRA TOKEN
    // La finestra è fixed (i contenitori con overflow non la tagliano): sotto il riquadro, sopra se sotto non c'è spazio o se è quello della chat
    function posizionaToken() {
      document.querySelectorAll('.token-box[open]').forEach((box) => {
        const dati = box.querySelector('.dati');
        const r = box.querySelector('summary').getBoundingClientRect();
        const sopra = box.id === 'chat-consumo' || r.bottom + dati.offsetHeight + 14 > window.innerHeight;
        dati.style.top = `${Math.max(8, sopra ? r.top - dati.offsetHeight - 6 : r.bottom + 6)}px`;
        dati.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - dati.offsetWidth - 8))}px`;
      });
    }
    window.addEventListener('scroll', posizionaToken, true);
    window.addEventListener('resize', posizionaToken);
    let attesaPosizione = 0;
    new MutationObserver(() => {
      cancelAnimationFrame(attesaPosizione);
      attesaPosizione = requestAnimationFrame(posizionaToken);
    }).observe($('contenuto'), { childList: true, subtree: true });

    // DOMANDA DAI CAMPI
    // CHIEDI A CHATTINO apre la chat con il piano come contesto e la domanda già scritta: l'invio resta a te
    document.addEventListener('chattino-chiedi', (e) => {
      const blocco = leggiBlocco({ dataset: { blocco: 'piano', bid: String(e.detail.piano) } });
      if (!blocco) return;
      bloccoScelto = blocco;
      if ($('chat').hidden) $('chat-open').click();
      aggiornaContesto();
      $('chat-input').value = e.detail.domanda;
      adattaInput();
      $('chat-input').focus();
    });

    // MODALITÀ PUNTATORE
    // Con Alt premuto un mini Chattino segue il mouse e il blocco sotto il cursore si illumina; il clic lo sceglie
    let puntatore = false;
    let evidenziato = null;
    let ultimoMouse = { x: 0, y: 0 };
    const mini = document.createElement('div');
    mini.id = 'chat-mini';
    mini.hidden = true;
    mini.innerHTML = '<i class="dot"></i>Chattino';
    document.body.appendChild(mini);

    const bloccoSotto = (el) => el?.closest?.('#contenuto [data-blocco]') || null;

    function evidenzia(el) {
      if (el === evidenziato) return;
      evidenziato?.classList.remove('blocco-puntato');
      evidenziato = el;
      evidenziato?.classList.add('blocco-puntato');
    }

    function muoviMini() {
      mini.style.transform = `translate(${ultimoMouse.x + 14}px, ${ultimoMouse.y + 14}px)`;
    }

    function attivaPuntatore(acceso) {
      if (acceso === puntatore) return;
      puntatore = acceso;
      mini.hidden = !acceso;
      document.body.classList.toggle('puntatore', acceso);
      if (acceso) {
        muoviMini();
        evidenzia(bloccoSotto(document.elementFromPoint(ultimoMouse.x, ultimoMouse.y)));
      } else {
        evidenzia(null);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Alt') return;
      e.preventDefault();
      attivaPuntatore(true);
    });
    document.addEventListener('keyup', (e) => {
      if (e.key !== 'Alt') return;
      e.preventDefault();
      attivaPuntatore(false);
    });
    window.addEventListener('blur', () => attivaPuntatore(false));
    document.addEventListener('mousemove', (e) => {
      ultimoMouse = { x: e.clientX, y: e.clientY };
      if (!puntatore) return;
      muoviMini();
      evidenzia(bloccoSotto(e.target));
    });
    document.addEventListener('click', (e) => {
      if (!puntatore) return;
      const el = bloccoSotto(e.target);
      if (!el) return;
      e.preventDefault();
      e.stopPropagation();
      const blocco = leggiBlocco(el);
      if (!blocco) return avvisa('Questo blocco non si può usare come contesto', true);
      bloccoScelto = blocco;
      aggiornaContesto();
      avvisa(`Contesto di Chattino: ${blocco.etichetta}`);
    }, true);

    // ALTEZZA INPUT
    // Prima si azzera, altrimenti scrollHeight non cala quando cancelli righe
    function adattaInput() {
      const input = $('chat-input');
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight + input.offsetHeight - input.clientHeight}px`;
    }

    // PROPOSTE DI ATTIVITÀ
    // Chattino può solo leggere: propone l'attività in un blocco ```attivita e la crea la sala quando clicchi Aggiungi
    const BLOCCO_ATTIVITA = /```attivita[ \t]*\n([\s\S]*?)```/g;
    const MAPPE_ATTIVITA = ['dati', 'struttura', 'entrambi'];
    const LIMITI_ATTIVITA = { titolo: 200, obiettivo: 5000, problema: 5000, dove: 1000, note: 5000 };

    // Un JSON malformato o senza titolo resta un blocco di codice normale
    function leggiProposta(testo) {
      try {
        const dati = JSON.parse(testo);
        if (!dati || typeof dati !== 'object' || Array.isArray(dati)) return null;
        const proposta = Object.fromEntries(Object.entries(LIMITI_ATTIVITA).map(([c, max]) => [c, String(dati[c] ?? '').trim().slice(0, max)]));
        proposta.mappa = MAPPE_ATTIVITA.includes(dati.mappa) ? dati.mappa : '';
        return proposta.titolo ? proposta : null;
      } catch {
        return null;
      }
    }

    function htmlProposta(p, i) {
      const voci = [['OBIETTIVO', p.obiettivo], ['PROBLEMA', p.problema], ['DOVE', p.dove], ['MAPPA', p.mappa], ['NOTE', p.note]]
        .filter(([, v]) => v).map(([nome, v]) => `<dt>${nome}</dt><dd>${esc(v)}</dd>`).join('');
      return `<div class="proposta" data-indice="${i}">
        <span class="tipo-proposta">Nuova attività</span>
        <b>${esc(p.titolo)}</b>
        ${voci ? `<dl>${voci}</dl>` : ''}
        <div class="piede-proposta">
          <button type="button" data-proposta="aggiungi">Aggiungi</button>
          <button type="button" data-proposta="modifica">Modifica prima</button>
        </div>
      </div>`;
    }

    // Il progetto resta quello della domanda, anche se nel frattempo cambi progetto nella sala
    function rispostaClaude(testo) {
      const proposte = [];
      const resto = testo.replace(BLOCCO_ATTIVITA, (blocco, json) => {
        const proposta = leggiProposta(json);
        if (!proposta) return blocco;
        proposte.push(proposta);
        return '';
      });
      const termina = $('chat-modo').value === 'insegnante'
        ? '<label class="termina-lezione" title="Ti faccio delle domande: se rispondi bene la lezione si salva nelle Lezioni"><input type="checkbox" data-termina-lezione>Termina lezione</label>'
        : '';
      const msg = aggiungi('claude', markdown(resto) + proposte.map(htmlProposta).join('') + termina);
      msg.proposte = proposte;
      msg.progetto = stato.progetto;
    }

    // TERMINA LEZIONE
    // Il quadrato è un pulsante: si rispegne subito e apre il quiz sulla conversazione
    $('chat-log').addEventListener('change', (e) => {
      if (!e.target.matches('[data-termina-lezione]')) return;
      e.target.checked = false;
      const conversazione = storia.slice(-MAX_QUIZ_STORIA).map((m) => ({ ruolo: m.ruolo, testo: m.testo.slice(0, 4000) }));
      document.dispatchEvent(new CustomEvent('quiz-avvia', { detail: { origine: 'chattino', storia: conversazione } }));
    });

    $('chat-log').addEventListener('click', async (e) => {
      const bottone = e.target.closest('[data-proposta]');
      if (!bottone) return;
      const scheda = bottone.closest('.proposta');
      const msg = bottone.closest('.msg');
      const proposta = msg.proposte[scheda.dataset.indice];
      if (bottone.dataset.proposta === 'modifica') {
        if (msg.progetto !== stato.progetto) return avvisa(`Questa attività è per ${msg.progetto}: torna su quel progetto per modificarla`, true);
        Object.assign(stato, { sezione: 'attivita', filtroAttivita: 'tutte', modifica: null, nuova: true, bozza: proposta });
        memoria.scrivi('sala.sezione', stato.sezione);
        disegna();
        document.querySelector('[data-scheda="nuova"] [name="titolo"]')?.focus();
        return;
      }
      bottone.disabled = true;
      try {
        await api('/api/attivita/crea', { ...proposta, progetto: msg.progetto });
        scheda.querySelector('.piede-proposta').innerHTML = `<span class="fatta">Aggiunta in Da fare di ${esc(msg.progetto)} ✓</span>`;
        avvisa('Attività aggiunta in Da fare');
        await carica();
      } catch (err) {
        bottone.disabled = false;
        avvisa(err.message, true);
      }
    });

    // CLIC SU SCELTA
    // La voce scelta resta evidenziata, le altre si spengono; poi parte il messaggio come se lo avessi scritto tu
    $('chat-log').addEventListener('click', (e) => {
      const voce = e.target.closest('[data-scelta]');
      if (!voce || inAttesa) return;
      const scelta = voce.closest('.scelta');
      scelta.classList.add('scelta-fatta');
      scelta.querySelectorAll('.scelta-voce').forEach((b) => {
        b.disabled = true;
        b.classList.toggle('scelta-presa', b === voce);
      });
      $('chat-input').value = `Scelgo l'ipotesi ${voce.dataset.scelta}: ${voce.dataset.testo}`;
      $('chat-form').requestSubmit();
    });

    // INVIO DOMANDA
    async function invia(e) {
      e.preventDefault();
      const domanda = $('chat-input').value.trim();
      if (!domanda || inAttesa) return;
      const cartella = stato.progetti.find((p) => p.nome === stato.progetto)?.cartella;
      if (!GETTONE_CHAT || !cartella) {
        aggiungi('errore', 'Chat non configurata: manca il gettone della chat (<code>~/.claude/chat-mappa-token</code>) o il progetto. Avvia il server della chat con il comando qui sotto e ricarica la pagina.');
        serverSpento();
        return;
      }

      const vuoto = senzaContesto();
      const contesto = vuoto ? null : selezione();
      aggiungi('utente', paragrafo(esc(domanda)), contesto);
      $('chat-input').value = '';
      adattaInput();
      inAttesa = true;
      $('chat-send').disabled = true;
      $('chat-open').classList.add('pensa');
      const inizio = Date.now();
      const attesa = aggiungi('info', 'Sto pensando…');
      const timer = setInterval(() => {
        attesa.textContent = `Sto pensando… ${Math.round((Date.now() - inizio) / 1000)} s`;
      }, 1000);

      try {
        const res = await fetch(`${SERVER}/chiedi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: GETTONE_CHAT,
            project: cartella,
            tipo: 'sala',
            titolo: `Sala di controllo · ${stato.progetto}`,
            mappa: vuoto ? '' : JSON.stringify(datiSala()),
            selezione: contesto,
            senzaContesto: vuoto,
            storia: storia.slice(-MAX_STORIA),
            domanda,
            modalita: $('chat-modo').value,
          }),
        });
        const corpo = await res.json();
        if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
        storia.push({ ruolo: 'utente', testo: contesto ? `[su ${contesto}] ${domanda}` : domanda }, { ruolo: 'claude', testo: corpo.risposta });
        rispostaClaude(corpo.risposta);
        if (corpo.consumo) consumoRisposta = { token: corpo.consumo.input + corpo.consumo.scritti + corpo.consumo.output, cache: corpo.consumo.cache };
        if (corpo.giornata) consumoGiornata = corpo.giornata;
        mostraConsumo();
        if ($('chat').hidden) document.querySelector('#chat-open .dot').classList.add('pronta');
      } catch (err) {
        if (err instanceof TypeError) serverSpento();
        else aggiungi('errore', esc(err.message));
      } finally {
        clearInterval(timer);
        attesa.remove();
        inAttesa = false;
        $('chat-send').disabled = false;
        $('chat-open').classList.remove('pensa');
        controllaServer();
      }
    }

    // MASCOTTE
    // Ogni carattere è un pixel: D contorno, P arancione, L riflesso, W bianco occhio, K pupilla e bocca, R guance
    const SPRITE = [
      '..DDDDDDDD..',
      '.DPPPPPPPPD.',
      'DPLLPPPPPPPD',
      'DPLPWWPPWWPD',
      'DPPPWKPPWKPD',
      'DPPPWKPPWKPD',
      'DPRPPPPPPRPD',
      'DPPPPKKKPPPD',
      '.DPPPPPPPPD.',
      '..DPDDDDDD..',
      '..DD........',
      '.DD.........',
    ];
    const PIXEL = { D: '#5c2414', P: '#d97757', L: '#f5c4ad', W: '#ffffff', K: '#2b130b', R: '#f9a8a0' };
    const pixel = (x, y, c) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PIXEL[c]}"/>`;
    // Sotto occhi e bocca va il colore del corpo: si vede quando cambia espressione
    const mobile = (x, y, c) => (y >= 3 && y <= 5 && 'WK'.includes(c)) || (y === 7 && c === 'K');
    const corpo = SPRITE.flatMap((riga, y) => [...riga].map((c, x) => (PIXEL[c] ? pixel(x, y, mobile(x, y, c) ? 'P' : c) : ''))).join('');
    const bocca = `<g class="bocca">${[5, 6, 7].map((x) => pixel(x, 7, 'K')).join('')}</g>`;
    // Occhi sgranati 3×3 con la pupilla al centro e bocca spalancata con la lingua
    const PAURA = [
      ...[3, 7].flatMap((x0) => [2, 3, 4].flatMap((y) => [0, 1, 2].map((dx) => [x0 + dx, y, y === 3 && dx === 1 ? 'K' : 'W']))),
      [5, 6, 'K'], [6, 6, 'K'], [7, 6, 'K'], [5, 7, 'K'], [6, 7, 'R'], [7, 7, 'K'], [5, 8, 'K'], [6, 8, 'K'], [7, 8, 'K'],
    ];
    const paura = `<g class="paura">${PAURA.map(([x, y, c]) => pixel(x, y, c)).join('')}</g>`;
    const occhio = (x0) => `<g class="eye">${[3, 4, 5].flatMap((y) => [x0, x0 + 1].map((x) => pixel(x, y, SPRITE[y][x]))).join('')}</g>`;
    // SPIRALE A PIXEL
    // Spirale 7×7 a mezzi pixel (3,5×3,5 pixel) centrata sul centro dell'occhio normale (x 5 e 9, y 4,5), così gira sul posto; ogni fotogramma la ruota di 90° in senso orario
    const SPIRALE = ['KKKKKKK', 'WWWWWWK', 'KKKKKWK', 'KWWWKWK', 'KWKKKWK', 'KWWWWWK', 'KKKKKKK'];
    const ruota = (x, y, volte) => (volte ? ruota(SPIRALE.length - 1 - y, x, volte - 1) : [x, y]);
    const mezzo = (x, y) => `<rect x="${x}" y="${y}" width=".5" height=".5" fill="${PIXEL.K}"/>`;
    const fondo = (x0, y0) => `<rect x="${x0}" y="${y0}" width="3.5" height="3.5" fill="${PIXEL.W}"/>`;
    const fotogramma = (x0, y0, volte) => SPIRALE.flatMap((riga, y) => [...riga].map((c, x) => {
      if (c !== 'K') return '';
      const [rx, ry] = ruota(x, y, volte);
      return mezzo(x0 + rx / 2, y0 + ry / 2);
    })).join('');
    const ipno = (centro) => { const x0 = centro - 1.75; const y0 = 2.75; return `<g class="ipno">${fondo(x0, y0)}${[0, 1, 2, 3].map((volte) => `<g class="giro" style="animation-delay: ${volte * 0.15}s">${fotogramma(x0, y0, volte)}</g>`).join('')}</g>`; };
    // DECORAZIONI DELLE MODALITÀ
    // Pixel fuori dal corpo (la tela va da -2 a 15 in orizzontale e da -4 a 11 in verticale): ognuna si vede solo nella sua modalità
    const COLORI_ACCESSORI = { o: '#141312', g: '#9b968a', A: '#a7afb8', a: '#5f6670', L: '#3d6fb6', P: '#f4f2ec', N: '#22252b', n: '#454b55', Y: '#f2c14e', K: '#2b130b', C: '#4b5563', T: '#2bb3a3', t: '#8fe3d8', S: '#111111', s: '#6b7280', M: '#f4f2ec', m: '#c9c4b8', B: '#6b3e26', V: '#e6e6e6' };
    const punti = (colore, coppie) => coppie.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${COLORI_ACCESSORI[colore]}"/>`).join('');
    const intervallo = (da, a, y) => Array.from({ length: a - da + 1 }, (_, i) => [da + i, y]);
    // Gli occhi sono larghi 2 pixel e distano 2 pixel: una montatura a pixel interi li coprirebbe, quindi è a linee sottili
    const OCCHIALI = `<g class="occhiali" fill="none" stroke="#2b130b" stroke-width=".35"><rect x="3.55" y="2.6" width="2.9" height="3.8" rx=".5"/><rect x="7.55" y="2.6" width="2.9" height="3.8" rx=".5"/><path d="M6.45 3.6h1.1M3.55 3.4h-1.3M10.45 3.4h1.3"/></g>`;
    const ACCESSORI = [
      // Insegnante: occhiali dorati e un libro aperto in mano, con la piega al centro
      `<g class="acc acc-insegnante"><g class="viso">${OCCHIALI}</g>${punti('P', [[11, 7], [12, 7], [14, 7], [15, 7], [11, 8], [12, 8], [14, 8], [15, 8], [11, 9], [12, 9], [14, 9], [15, 9]])}${punti('g', [[13, 7], [13, 8], [13, 9]])}${punti('m', [[12, 8], [15, 8]])}${punti('L', intervallo(11, 15, 10))}</g>`,
      // Traduttore: cuffie da interprete e microfono a lato, con il bordo scuro per staccarlo dal corpo
      `<g class="acc acc-traduttore">${punti('C', [...intervallo(3, 8, -2), [1, -1], [2, -1], [9, -1], [10, -1], [0, 0], [11, 0], [-1, 1], [12, 1], [-1, 2], [12, 2]])}${punti('T', [[-2, 3], [-2, 4], [-2, 5], [-1, 4], [-1, 5], [-1, 6], [-2, 6], [13, 3], [13, 4], [13, 5], [13, 6], [12, 4], [12, 5], [12, 6]])}${punti('t', [[-1, 3], [12, 3]])}${punti('o', [[-2, 7], [-1, 7], [-3, 8], [-3, 9], [0, 8], [0, 9]])}${punti('s', [[-2, 8], [-1, 8], [-2, 9], [-1, 9]])}${punti('V', [[-2, 8]])}${punti('N', [[-2, 10], [-1, 10], [-2, 11]])}</g>`,
      // Senior developer: occhiali da sole e un portatile davanti, visto dal dorso argentato con il logo
      `<g class="acc acc-senior"><g class="viso">${punti('S', [...intervallo(2, 10, 3), [3, 4], [4, 4], [5, 4], [7, 4], [8, 4], [9, 4], [4, 5], [8, 5]])}${punti('s', [[3, 3], [7, 3]])}</g>${punti('A', [...intervallo(11, 15, 5), [11, 6], [15, 6], [11, 7], [15, 7], ...intervallo(11, 15, 8)])}${punti('A', [...intervallo(12, 14, 6), ...intervallo(12, 14, 7)])}${punti('V', [[13, 6]])}${punti('a', intervallo(10, 15, 9))}${punti('n', intervallo(10, 15, 10))}</g>`,
    ].join('');
    // Stelline che compaiono intorno quando cambi modalità
    const stellina = (x, y) => punti('Y', [[x, y], [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]);
    const SCINTILLE = `<g class="scintille">${stellina(-1, -2)}${stellina(14, -1)}${stellina(-1, 9)}${stellina(15, 6)}</g>`;
    $('chat-open').insertAdjacentHTML('afterbegin', `<svg class="sprite" viewBox="-2 -4 18 16" aria-hidden="true">${corpo}${occhio(4)}${occhio(8)}${bocca}${ipno(5)}${ipno(9)}${paura}${ACCESSORI}${SCINTILLE}</svg>`);

    // TRASCINAMENTO
    // Chat e mascotte sono incollate: la chat sta sempre sopra la mascotte e chi viene spostato si porta dietro l'altro
    const MARGINE = 8;
    const STACCO = 6;
    const SOGLIA = 4;

    const sposta = (el, left, top) => Object.assign(el.style, { left: `${left}px`, top: `${top}px`, bottom: 'auto' });

    function tieniDentro(el) {
      if (!el.style.top || el.hidden) return;
      const box = el.getBoundingClientRect();
      sposta(
        el,
        Math.min(Math.max(box.left, MARGINE), window.innerWidth - box.width - MARGINE),
        Math.min(Math.max(box.top, MARGINE), window.innerHeight - box.height - MARGINE),
      );
    }

    // La chat si mette sopra la mascotte; se sopra non c'è spazio scendono insieme
    function chatSopraMascotte() {
      const chat = $('chat');
      if (chat.hidden || chat.classList.contains('schermo-intero')) return;
      const omino = $('chat-open').getBoundingClientRect();
      const left = Math.min(Math.max(omino.left, MARGINE), window.innerWidth - chat.offsetWidth - MARGINE);
      const top = Math.max(MARGINE, omino.top - chat.offsetHeight - STACCO);
      sposta(chat, left, top);
      sposta($('chat-open'), left, top + chat.offsetHeight + STACCO);
    }

    // La mascotte si mette sotto la chat; se sotto non c'è spazio salgono insieme
    function mascotteSottoChat() {
      const chat = $('chat');
      if (chat.hidden || !chat.style.top || chat.classList.contains('schermo-intero')) return;
      const box = chat.getBoundingClientRect();
      const omino = $('chat-open');
      const sfora = box.bottom + STACCO + omino.offsetHeight - (window.innerHeight - MARGINE);
      const top = Math.max(MARGINE, box.top - Math.max(0, sfora));
      sposta(chat, box.left, top);
      sposta(omino, box.left, top + chat.offsetHeight + STACCO);
    }

    function rendiTrascinabile(el, maniglia, { mentreSposti, quandoLasci }) {
      maniglia.addEventListener('pointerdown', (e) => {
        const bottone = e.target.closest('button');
        if (e.button !== 0 || (bottone && bottone !== maniglia) || e.target.closest('select') || el.classList.contains('schermo-intero')) return;
        const box = el.getBoundingClientRect();
        const dx = e.clientX - box.left;
        const dy = e.clientY - box.top;
        let mosso = false;
        maniglia.setPointerCapture(e.pointerId);

        // Sotto la soglia è un clic, non un trascinamento
        const muovi = (ev) => {
          if (!mosso && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < SOGLIA) return;
          if (!mosso) {
            mosso = true;
            el.classList.add('dragging');
          }
          sposta(el, ev.clientX - dx, ev.clientY - dy);
          tieniDentro(el);
          mentreSposti();
        };
        const lascia = () => {
          maniglia.removeEventListener('pointermove', muovi);
          el.classList.remove('dragging');
          if (mosso) quandoLasci?.();
        };
        maniglia.addEventListener('pointermove', muovi);
        maniglia.addEventListener('pointerup', lascia, { once: true });
        maniglia.addEventListener('pointercancel', lascia, { once: true });
      });
    }

    // Dopo un trascinamento il browser manda comunque un clic: va ignorato
    let ignoraClic = false;
    $('chat-open').addEventListener('pointerdown', () => {
      ignoraClic = false;
    });
    rendiTrascinabile($('chat-open'), $('chat-open'), {
      mentreSposti: chatSopraMascotte,
      quandoLasci: () => {
        ignoraClic = true;
      },
    });
    rendiTrascinabile($('chat'), $('chat').querySelector('.chat-head'), { mentreSposti: mascotteSottoChat });
    $('chat').querySelector('.chat-head').addEventListener('dblclick', (e) => {
      if (e.target.closest('button')) return;
      Object.assign($('chat').style, { width: '', height: '' });
      chatSopraMascotte();
    });
    // RIDIMENSIONAMENTO
    // Otto maniglie (4 lati e 4 angoli): trascinando il lato sinistro o alto cambia anche la posizione, così il lato opposto resta fermo
    for (const lato of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) {
      const maniglia = document.createElement('div');
      maniglia.className = `chat-bordo ${lato}`;
      $('chat').appendChild(maniglia);
      maniglia.addEventListener('pointerdown', (e) => {
        const chat = $('chat');
        if (e.button !== 0 || chat.classList.contains('schermo-intero')) return;
        e.preventDefault();
        const partenza = chat.getBoundingClientRect();
        const stile = getComputedStyle(chat);
        const minL = parseFloat(stile.minWidth);
        const minA = parseFloat(stile.minHeight);
        const sotto = $('chat-open').offsetHeight + STACCO;
        maniglia.setPointerCapture(e.pointerId);

        const muovi = (ev) => {
          const dx = ev.clientX - e.clientX;
          const dy = ev.clientY - e.clientY;
          let { left, top, width, height } = partenza;
          if (lato.includes('e')) width = Math.min(Math.max(partenza.width + dx, minL), window.innerWidth - MARGINE - partenza.left);
          if (lato.includes('w')) {
            width = Math.min(Math.max(partenza.width - dx, minL), partenza.right - MARGINE);
            left = partenza.right - width;
          }
          if (lato.includes('s')) height = Math.min(Math.max(partenza.height + dy, minA), window.innerHeight - MARGINE - sotto - partenza.top);
          if (lato.includes('n')) {
            height = Math.min(Math.max(partenza.height - dy, minA), partenza.bottom - MARGINE);
            top = partenza.bottom - height;
          }
          Object.assign(chat.style, { width: `${width}px`, height: `${height}px` });
          sposta(chat, left, top);
        };
        const lascia = () => maniglia.removeEventListener('pointermove', muovi);
        maniglia.addEventListener('pointermove', muovi);
        maniglia.addEventListener('pointerup', lascia, { once: true });
        maniglia.addEventListener('pointercancel', lascia, { once: true });
      });
    }

    new ResizeObserver(mascotteSottoChat).observe($('chat'));
    window.addEventListener('resize', () => {
      tieniDentro($('chat-open'));
      chatSopraMascotte();
    });

    // APERTURA E COMANDI
    $('chat-open').addEventListener('click', () => {
      if (ignoraClic) {
        ignoraClic = false;
        return;
      }
      $('chat').hidden = !$('chat').hidden;
      if ($('chat').hidden) return;
      document.querySelector('#chat-open .dot').classList.remove('pronta');
      chatSopraMascotte();
      aggiornaContesto();
      controllaServer();
      consumoGiornata = stato.consumi || null;
      mostraConsumo();
      api('/api/consumi').then((c) => {
        consumoGiornata = c;
        mostraConsumo();
      }).catch(() => {});
      $('chat-input').focus();
    });
    $('chat-close').addEventListener('click', () => {
      $('chat').hidden = true;
    });

    // SCHERMO INTERO
    // Il tasto resta nell'intestazione; chat-open (la mascotte) non si tocca, quindi rimane nel punto in cui l'hai messa
    function schermoIntero(acceso) {
      $('chat').classList.toggle('schermo-intero', acceso);
      $('chat-schermo').setAttribute('aria-pressed', String(acceso));
      $('chat-schermo').textContent = acceso ? '⤡' : '⤢';
      $('chat-schermo').title = acceso ? 'Torna alla finestra (Esc)' : 'Schermo intero';
      try {
        localStorage.setItem('chattino.schermo', acceso ? '1' : '0');
      } catch {}
      chatSopraMascotte();
      $('chat-log').scrollTop = $('chat-log').scrollHeight;
    }
    $('chat-schermo').addEventListener('click', () => schermoIntero(!$('chat').classList.contains('schermo-intero')));
    try {
      if (localStorage.getItem('chattino.schermo') === '1') schermoIntero(true);
    } catch {}
    $('chat-clear').addEventListener('click', () => {
      storia.length = 0;
      $('chat-log').innerHTML = '';
    });
    $('chat-form').addEventListener('submit', invia);
    $('chat-input').addEventListener('input', adattaInput);
    // La modalità scelta resta anche nelle prossime pagine
    try {
      $('chat-modo').value = localStorage.getItem('chattino.modo') || 'normale';
    } catch {}
    if (!$('chat-modo').value) $('chat-modo').value = 'normale';
    // CAMBIO DECORAZIONI
    // Chattino salta e brilla; a metà salto si cambia d'abito, così il cambio non si vede
    let timerCambio;
    function cambiaDecorazioni(modo) {
      const omino = $('chat-open');
      clearTimeout(timerCambio);
      omino.classList.remove('cambia');
      void omino.offsetWidth;
      omino.classList.add('cambia');
      timerCambio = setTimeout(() => {
        omino.dataset.modo = modo;
        timerCambio = setTimeout(() => omino.classList.remove('cambia'), 400);
      }, 300);
    }
    $('chat-open').dataset.modo = $('chat-modo').value;
    $('chat-modo').addEventListener('change', () => {
      try {
        localStorage.setItem('chattino.modo', $('chat-modo').value);
      } catch {}
      cambiaDecorazioni($('chat-modo').value);
    });
    // I tasti scritti nella chat non devono arrivare alle scorciatoie della pagina, tranne Alt (modalità puntatore)
    $('chat').addEventListener('keydown', (e) => {
      if (e.key !== 'Alt') e.stopPropagation();
      if (e.key === 'Escape') {
        if ($('chat').classList.contains('schermo-intero')) schermoIntero(false);
        else $('chat').hidden = true;
      }
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input') invia(e);
    });
    document.addEventListener('click', aggiornaContesto);

    controllaServer();
  })();

  avvio();
</script>
</body>
</html>
