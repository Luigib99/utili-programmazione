<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa struttura</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff4fd8;
    --chip: #ff4fd8;
    --syn-var: #79c0ff;
    --syn-string: #a5d6ff;
    --syn-number: #ffa657;
    --syn-literal: #ff7b72;
    --syn-function: #d2a8ff;
    --syn-type: #56d4dd;
    --syn-file: #8b949e;
    --chat: #d97757;
    --chat-bg: #3d2219;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    margin: 2px 0 0;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--muted);
  }

  button[aria-pressed="true"] {
    border-color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 6px var(--larghezza-pannello, 440px);
    height: calc(100vh - 74px);
  }

  #stage {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    overflow: auto;
    padding: 20px 24px;
  }

  #stage {
    cursor: grab;
  }

  #stage.panning {
    cursor: grabbing;
    user-select: none;
  }

  .screen-col {
    flex: none;
    zoom: var(--zoom, 1);
  }

  .screen-name {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  /* Cornice del telefono: la schermata dentro ha le misure reali, la cornice la rimpicciolisce */
  .frame {
    overflow: hidden;
    border: 8px solid #000;
    border-radius: 40px;
    box-shadow: 0 0 0 2px var(--border), 0 12px 32px rgba(0, 0, 0, .5);
  }

  .device {
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-origin: top left;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Ogni elemento è un flex in colonna come in React Native */
  .el {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    cursor: pointer;
  }

  .el.text {
    display: block;
    white-space: pre-wrap;
  }

  .el.image {
    align-items: center;
    justify-content: center;
    background-image: repeating-linear-gradient(45deg, rgba(128, 128, 128, .18) 0 8px, rgba(128, 128, 128, .08) 8px 16px);
    color: #6b6b6b;
    font-size: 11px;
    text-align: center;
  }

  .el.icon {
    align-items: center;
    justify-content: center;
  }

  .el.hover {
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }

  .el.sel {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }

  .chip {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 5;
    display: none;
    padding: 0 5px;
    background: var(--chip);
    border-radius: 0 0 6px 0;
    color: #000;
    font: 700 11px/16px system-ui, sans-serif;
    pointer-events: none;
  }

  .el.hover > .chip,
  .el.sel > .chip,
  body.numbers .chip {
    display: block;
  }

/* PANNELLO DI DESTRA: largo quanto lo trascini; con "Dettagli" spento resta solo il diagramma */
  #divisore {
    position: relative;
    cursor: col-resize;
    touch-action: none;
  }

  #divisore::after {
    content: "";
    position: absolute;
    inset: 0 2px;
    border-radius: 2px;
    transition: background .15s;
  }

  #divisore:hover::after,
  #divisore.attivo::after {
    background: var(--muted);
  }

  main.senza-pannello {
    grid-template-columns: minmax(0, 1fr);
  }

  main.senza-pannello #divisore,
  main.senza-pannello #panel {
    display: none;
  }

  #panel {
    overflow: auto;
    padding: 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      height: auto;
    }

    #divisore {
      display: none;
    }

    #panel {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  a.code-link {
    color: inherit;
    text-decoration: none;
  }

  a.code-link:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 10;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[hidden] {
    display: none;
  }

  #toast code {
    color: var(--syn-file);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .panel-tag {
    display: inline-block;
    padding: 1px 8px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .badge {
    display: inline-block;
    margin: 0 4px 4px 0;
    padding: 0 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }

  .badge.condition {
    border-color: var(--syn-number);
    color: var(--syn-number);
  }

  #panel h2 {
    margin: 10px 0 4px;
    font-size: 17px;
  }

  #panel h3 {
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .route {
    color: var(--muted);
    font-size: 13px;
  }

  .explanation {
    margin: 0;
  }

  code .tk-var { color: var(--syn-var); }
  code .tk-string { color: var(--syn-string); }
  code .tk-number { color: var(--syn-number); }
  code .tk-literal { color: var(--syn-literal); }
  code .tk-function { color: var(--syn-function); }
  code .tk-type { color: var(--syn-type); }
  code .tk-file { color: var(--syn-file); }

  #panel code {
    padding: 0 4px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .terms {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    margin: 0;
    font-size: 13px;
  }

  .terms dt {
    font-weight: 600;
  }

  .terms dd {
    margin: 0;
    color: var(--muted);
  }

  .terms.code dt {
    color: var(--syn-var);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    vertical-align: -1px;
  }

  .tree {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13px;
  }

  .tree li {
    padding: 2px 0;
    cursor: pointer;
  }

  .tree li:hover {
    color: var(--accent);
  }

  .tree .num {
    display: inline-block;
    min-width: 34px;
    color: var(--accent);
    font-weight: 700;
  }

  /* RIEPILOGO nel pannello di destra */
  .files {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
  }

  .files li {
    margin-bottom: 4px;
  }

  .howto {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .howto summary {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }

  /* Azioni sul file della mappa, in fondo al riepilogo */
  /* AVVISI: incongruenze tra mappa e codice trovate dalla sala dopo la generazione */
  .avvisi-mappa {
    margin: 14px 0;
    padding: 10px 14px;
    border: 1px solid #d29922;
    border-radius: 8px;
    background: rgba(210, 153, 34, .1);
  }

  .avvisi-mappa h3 { margin-top: 0; color: #e3b341; }
  .avvisi-mappa ul { margin: 6px 0 0; padding-left: 18px; }

  .azioni-mappa {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .azioni-mappa .pericolo {
    border-color: #f85149;
    color: #ffa198;
  }

  .eliminata {
    margin: 48px;
    color: var(--muted);
    font-size: 15px;
  }

  /* Sezioni del pannello di destra: il titolo le apre e le chiude */
  .sez > h3 {
    cursor: pointer;
    user-select: none;
  }

  .sez > h3::before {
    content: "▾";
    display: inline-block;
    width: 14px;
    transition: transform .15s;
  }

  .sez.chiusa > h3::before {
    transform: rotate(-90deg);
  }

  .sez.chiusa > :not(h3) {
    display: none;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
  /* CHAT DELLA MAPPA */
  /* Mascotte in pixel art: fluttua, sbatte gli occhi e saltella mentre aspetta la risposta */
  #chat-open {
    position: fixed;
    bottom: 14px;
    left: 18px;
    z-index: 21;
    width: 72px;
    height: 82px;
    padding: 0;
    background: none;
    border: 0;
  }

  #chat-open:hover {
    border: 0;
  }

  #chat-open,
  #chat-open .sprite {
    cursor: grab;
    touch-action: none;
  }

  #chat-open .sprite {
    display: block;
    width: 72px;
    height: 64px;
    margin: 0 auto;
    image-rendering: pixelated;
    shape-rendering: crispEdges;
    filter: drop-shadow(0 0 6px rgba(217, 119, 87, .6));
    animation: chat-float 2.6s ease-in-out infinite;
  }

  #chat-open:hover .sprite {
    animation: chat-float 2.6s ease-in-out infinite, chat-wiggle .4s ease-in-out 2;
  }

  #chat-open.pensa .sprite {
    animation: chat-hop .5s ease-in-out infinite;
  }

  #chat-open::after {
    content: "";
    display: block;
    width: 30px;
    height: 6px;
    margin: 6px auto 0;
    background: rgba(0, 0, 0, .55);
    border-radius: 50%;
    animation: chat-shadow 2.6s ease-in-out infinite;
  }

  #chat-open .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: chat-blink 4.5s infinite;
  }

  @keyframes chat-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes chat-shadow {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50% { transform: scaleX(.7); opacity: .5; }
  }

  @keyframes chat-wiggle {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -8deg; }
    75% { rotate: 8deg; }
  }

  @keyframes chat-hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes chat-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  /* DECORAZIONI DELLE MODALITÀ: si vede solo quella della modalità scelta */
  #chat-open .acc,
  #chat-open .scintille {
    display: none;
  }

  #chat-open[data-modo="insegnante"] .acc-insegnante,
  #chat-open[data-modo="traduttore"] .acc-traduttore,
  #chat-open[data-modo="senior"] .acc-senior,
  #chat-open.cambia .scintille {
    display: inline;
  }

  /* Occhiali e occhiali da sole spariscono quando urla o quando gli occhi girano mentre pensa */
  #chat-open.dragging .viso,
  #chat-open.pensa .acc-senior .viso {
    display: none;
  }

  #chat-open .occhiali {
    shape-rendering: geometricPrecision;
  }

  /* Cambio di modalità: salto a scatti, come un vecchio videogioco, con le stelline che lampeggiano */
  #chat-open.cambia .sprite {
    animation: chat-cambia .7s steps(7) 1;
  }

  @keyframes chat-cambia {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-14px) scale(1.15, .85); }
    45% { transform: translateY(-16px) scaleX(-1); }
    60% { transform: translateY(-14px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }

  #chat-open.cambia .scintille {
    animation: chat-scintille .35s steps(2) infinite;
  }

  @keyframes chat-scintille {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open.cambia .sprite,
    #chat-open.cambia .scintille {
      animation: none;
    }
  }

  /* Presa in mano: si ingrandisce e trema dalla paura */
  #chat-open.dragging .sprite {
    cursor: grabbing;
    animation: chat-trema .12s linear infinite;
  }

  @keyframes chat-trema {
    0%, 100% { transform: scale(1.15) translate(0, 0) rotate(-4deg); }
    25% { transform: scale(1.15) translate(-1px, 1px) rotate(4deg); }
    50% { transform: scale(1.15) translate(1px, -1px) rotate(-4deg); }
    75% { transform: scale(1.15) translate(-1px, -1px) rotate(4deg); }
  }

  #chat-open.dragging::after {
    animation: none;
    opacity: .3;
  }

  /* Mentre aspetta la risposta gli occhi diventano spirali a pixel che girano a scatti */
  #chat-open .ipno {
    display: none;
  }

  #chat-open.pensa .ipno {
    display: inline;
  }

  #chat-open.pensa .eye {
    display: none;
  }

  /* 4 fotogrammi sfasati: ognuno resta acceso per un quarto del giro */
  #chat-open .giro {
    opacity: 0;
    animation: chat-giro .6s steps(1, end) infinite;
  }

  @keyframes chat-giro {
    0% { opacity: 1; }
    25%, 100% { opacity: 0; }
  }

  /* Senza animazioni resta ferma la prima spirale */
  @media (prefers-reduced-motion: reduce) {
    #chat-open .giro:first-child {
      opacity: 1;
    }
  }

  /* Faccia che urla mentre la trascini: ha la precedenza anche sugli occhi che girano */
  #chat-open .paura {
    display: none;
  }

  #chat-open.dragging .paura {
    display: inline;
  }

  #chat-open.dragging .eye,
  #chat-open.dragging .bocca,
  #chat-open.dragging .ipno {
    display: none;
  }

  @keyframes chat-ping {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, .7); }
    50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #chat-open .sprite,
    #chat-open::after,
    #chat-open .eye,
    #chat-open .giro,
    #chat-open .dot {
      animation: none;
    }
  }

  /* Verde: risposta pronta e non ancora vista; rosso: server spento */
  #chat-open .dot {
    position: absolute;
    top: 0;
    right: 2px;
    display: none;
    width: 12px;
    height: 12px;
    border: 2px solid var(--bg);
    border-radius: 50%;
  }

  #chat-open .dot.off {
    display: block;
    background: #f85149;
  }

  #chat-open .dot.pronta {
    display: block;
    background: #3fb950;
    animation: chat-ping 1.2s ease-in-out infinite;
  }

  #chat {
    position: fixed;
    bottom: 84px;
    left: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    width: min(400px, calc(100vw - 40px));
    height: min(480px, calc(100vh - 110px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
    /* Maniglia di ridimensionamento nell'angolo in basso a destra */
    resize: both;
    overflow: hidden;
    min-width: 300px;
    min-height: 260px;
    max-width: calc(100vw - 16px);
    max-height: calc(100vh - 16px);
  }

  #chat[hidden] {
    display: none;
  }

  #chat .chat-head {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  #chat.dragging .chat-head {
    cursor: grabbing;
  }

  #chat .chat-head b {
    flex: 1;
    font-size: 14px;
  }

  #chat .chat-head button {
    padding: 2px 8px;
    font-size: 13px;
  }

  #chat-log {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    overflow: auto;
    padding: 12px;
  }

  #chat-log:empty::before {
    content: "Fai una domanda";
    margin: auto;
    color: var(--muted);
    font-size: 14px;
  }

  #chat-log .msg {
    max-width: 92%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  #chat-log .msg.utente {
    align-self: flex-end;
    background: var(--chat-bg);
    border: 1px solid var(--chat);
  }

  #chat-log .msg.claude {
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  #chat-log .msg.info {
    align-self: stretch;
    max-width: none;
    color: var(--muted);
    font-size: 12.5px;
  }

  #chat-log .msg.consumo {
    align-self: stretch;
    max-width: none;
    padding: 0 4px;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    white-space: normal;
  }

  #chat-log .msg.consumo .tok-num { color: #e3b341; font-weight: 700; font-size: 1.15em; }
  #chat-log .msg.consumo .tok-cache { color: #6cc07e; font-weight: 700; font-size: 1.15em; }
  #chat-log .msg.consumo summary {
    display: inline-block;
    padding: 1px 9px;
    border: 1px solid var(--border, #555);
    border-radius: 6px;
    color: #e3b341;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    list-style: none;
    cursor: pointer;
  }
  #chat-log .msg.consumo summary::-webkit-details-marker { display: none; }
  #chat-log .msg.consumo .dati { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
  #chat-log .msg.consumo .tok-chi { color: var(--text); font-weight: 600; }

  #chat-log .msg.errore {
    align-self: stretch;
    max-width: none;
    border: 1px solid #f85149;
    color: #ffa198;
  }

  #chat-log .msg.suggerimento {
    align-self: stretch;
    max-width: none;
    background: rgba(250, 204, 21, .08);
    border: 1px solid #facc15;
  }

  #chat-log .msg button {
    margin-top: 8px;
    padding: 3px 10px;
    font-size: 12.5px;
  }

  #chat-hint[hidden] {
    display: none;
  }

  /* LUCE DELL'INDIZIO: la zona si illumina, il punto si illumina e pulsa ingrandito */
  /* Lampadina per riaccendere l'ultimo indizio dopo averlo spento cliccando fuori */
  #riaccendi {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid #facc15;
    border-radius: 50%;
    background: var(--surface);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(250, 204, 21, .35);
  }

  #riaccendi[hidden] {
    display: none;
  }

  .luce {
    filter: drop-shadow(0 0 6px #fde047) drop-shadow(0 0 16px rgba(253, 224, 71, .75));
  }

  .el.luce {
    z-index: 6;
    outline: 3px solid #fde047;
    outline-offset: -3px;
  }

  .luce-zoom {
    transform-box: fill-box;
    transform-origin: center;
    animation: luce-zoom 1.4s ease-in-out infinite;
  }

  body.con-indizio .item:not(.luce) {
    opacity: .3;
  }

  @keyframes luce-zoom {

  </div>

<main>

  <div id="divisore" title="Trascina per allargare o stringere il pannello · doppio clic per la larghezza iniziale"></div>
  <aside id="panel"></aside>
  <div id="toast" role="status" hidden></div>
</main>
<script>
  // PANNELLO DI DESTRA
  // Si allarga trascinando il bordo (doppio clic: larghezza iniziale) e si nasconde con "Dettagli"; le scelte restano nel browser
  (() => {
    const main = document.querySelector('main');
    const divisore = document.getElementById('divisore');
    const tasto = document.getElementById('pannello');
    const MINIMA = 260;
    const leggi = (chiave) => {
      try {
        return localStorage.getItem(chiave);
      } catch {
        return null;
      }
    };
    const scrivi = (chiave, valore) => {
      try {
        localStorage.setItem(chiave, valore);
      } catch {}
    };
    const allarga = (px) => {
      const larghezza = Math.round(Math.min(Math.max(px, MINIMA), window.innerWidth * 0.7));
      main.style.setProperty('--larghezza-pannello', `${larghezza}px`);
      return larghezza;
    };
    const mostra = (visibile) => {
      main.classList.toggle('senza-pannello', !visibile);
      tasto.setAttribute('aria-pressed', String(visibile));
      scrivi('mappa.pannello', visibile ? 'si' : 'no');
      window.dispatchEvent(new Event('resize'));
    };

    if (Number(leggi('mappa.larghezza-pannello'))) allarga(Number(leggi('mappa.larghezza-pannello')));
    mostra(leggi('mappa.pannello') !== 'no');
    tasto.addEventListener('click', () => mostra(main.classList.contains('senza-pannello')));

    divisore.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      divisore.setPointerCapture(e.pointerId);
      divisore.classList.add('attivo');
      const sposta = (ev) => allarga(window.innerWidth - ev.clientX);
      const lascia = (ev) => {
        divisore.removeEventListener('pointermove', sposta);
        divisore.removeEventListener('pointerup', lascia);
        divisore.classList.remove('attivo');
        scrivi('mappa.larghezza-pannello', String(allarga(window.innerWidth - ev.clientX)));
        window.dispatchEvent(new Event('resize'));
      };
      divisore.addEventListener('pointermove', sposta);
      divisore.addEventListener('pointerup', lascia);
    });
    divisore.addEventListener('dblclick', () => {
      main.style.removeProperty('--larghezza-pannello');
      scrivi('mappa.larghezza-pannello', '');
      window.dispatchEvent(new Event('resize'));
    });
  })();
</script>

<script>
  const DATA = JSON.parse(document.getElementById('page-data').textContent);
  const DEVICE = { width: 390, height: 844, ...(DATA.device || {}) };
  const elements = [];
  const state = { selected: null };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // EVIDENZIAZIONE CODICE NEI TESTI
  const TOKEN = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b(true|false|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b|([A-Za-z_$][\w$]*)/g;
  const TOKEN_CLASSES = ['tk-string', 'tk-number', 'tk-literal', 'tk-function', 'tk-type', 'tk-var'];

  const highlight = (code) => {
    if (/^[\w./-]+\.(jsx?|tsx?|json|md)$/.test(code)) return `<span class="tk-file">${esc(code)}</span>`;
    let html = '';
    let last = 0;
    for (const match of code.matchAll(TOKEN)) {
      const group = match.slice(1).findIndex((g) => g !== undefined);
      html += esc(code.slice(last, match.index)) + `<span class="${TOKEN_CLASSES[group]}">${esc(match[0])}</span>`;
      last = match.index + match[0].length;
    }
    return html + esc(code.slice(last));
  };

  const fmt = (s) => (s || '')
    .split(/(`[^`]+`)/)
    .map((part) => (/^`[^`]+`$/.test(part) ? `<code>${highlight(part.slice(1, -1))}</code>` : esc(part)))
    .join('');

  const codeLink = (item, line, inner) => {
    if (!item.path) return inner;
    const target = `${item.path.replace(/\\/g, '/')}:${line || 1}`;
    const href = encodeURI(`vscode://file/${target}:1`);
    return `<a class="code-link" href="${esc(href)}" data-copy="${esc(target)}" title="Apri in VS Code (nel browser integrato: copia il percorso per Ctrl+P)">${inner}</a>`;
  };

  // COPIA PERCORSO
  // Il browser integrato di VS Code blocca i link vscode:// senza avvisare: il percorso copiato si apre con Ctrl+P
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
      toast.hidden = true;
    }, 4000);
  }

  document.addEventListener('click', async (e) => {
    const link = e.target.closest('a.code-link');
    if (!link) return;
    // Il percorso si copia in silenzio: l'avviso compare solo se la copia non riesce
    if (!(await copyText(link.dataset.copy))) showToast('Copia non riuscita: apri il file in un browser esterno per usare il link diretto');
  });

  // CONVERSIONE STILE REACT NATIVE → CSS
  const PX = /^(width|height|min|max|padding|margin|top|left|right|bottom|border.*(Radius|Width)|fontSize|lineHeight|gap|rowGap|columnGap|letterSpacing)/;
  const IGNORED = new Set(['resizeMode', 'shadowColor', 'shadowOpacity', 'shadowRadius', 'shadowOffset', 'elevation', 'transform', 'tintColor', 'includeFontPadding', 'textAlignVertical']);

  function toCss(style = {}) {
    const css = {};
    Object.entries(style).forEach(([key, value]) => {
      if (IGNORED.has(key)) return;
      const v = typeof value === 'number' && PX.test(key) ? `${value}px` : value;
      if (key === 'paddingHorizontal') Object.assign(css, { paddingLeft: v, paddingRight: v });
      else if (key === 'paddingVertical') Object.assign(css, { paddingTop: v, paddingBottom: v });
      else if (key === 'marginHorizontal') Object.assign(css, { marginLeft: v, marginRight: v });
      else if (key === 'marginVertical') Object.assign(css, { marginTop: v, marginBottom: v });
      else if (key === 'flex' && typeof value === 'number') css.flex = value > 0 ? `${value} 1 0%` : 'none';
      else css[key] = v;
    });
    if (Object.keys(style).some((key) => /^border\w*Width$/.test(key))) css.borderStyle = style.borderStyle || 'solid';
    if (style.elevation || style.shadowOpacity) {
      const blur = style.shadowRadius ?? (style.elevation || 4) * 1.5;
      css.boxShadow = `0 ${style.shadowOffset?.height ?? 2}px ${blur}px rgba(0, 0, 0, ${style.shadowOpacity ?? 0.25})`;
    }
    return css;
  }

  // RENDER ELEMENTI
  function renderElement(item, screenName) {
    const index = elements.length;
    item.number = `S${index + 1}`;
    item.screenName = screenName;
    elements.push(item);

    const kind = item.kind || 'view';
    const div = document.createElement('div');
    div.className = `el ${kind}`;
    div.dataset.i = index;
    Object.assign(div.style, toCss(item.style));

    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = item.number;
    div.appendChild(chip);

    if (item.text !== undefined) div.appendChild(document.createTextNode(item.text));
    if (item.glyph) div.appendChild(document.createTextNode(item.glyph));
    if (item.image) div.appendChild(document.createTextNode(item.image));

    div.addEventListener('click', (e) => {
      if (e.target.closest('a.code-link')) return;
      e.stopPropagation();
      select(index);
    });
    div.addEventListener('mouseover', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.el.hover').forEach((el) => el.classList.remove('hover'));
      div.classList.add('hover');
    });
    div.addEventListener('mouseleave', () => div.classList.remove('hover'));

    (item.children || []).forEach((child) => div.appendChild(renderElement(child, screenName)));
    return div;
  }

  // RENDER SCHERMATE
  function renderScreens() {
    const stage = document.getElementById('stage');
    const available = Math.max(320, stage.clientHeight - 80);
    const scale = Math.min(1, available / DEVICE.height);

    DATA.screens.forEach((screen) => {
      const col = document.createElement('div');
      col.className = 'screen-col';
      col.innerHTML = `<p class="screen-name">${esc(screen.name)}</p>`;

      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.width = `${DEVICE.width * scale + 16}px`;
      frame.style.height = `${DEVICE.height * scale + 16}px`;

      const device = document.createElement('div');
      device.className = 'device';
      Object.assign(device.style, {
        width: `${DEVICE.width}px`,
        height: `${DEVICE.height}px`,
        transform: `scale(${scale})`,
        background: screen.background || '#ffffff',
      });
      device.appendChild(renderElement(screen.root, screen.name));
      frame.appendChild(device);
      col.appendChild(frame);
      stage.appendChild(col);
    });
  }

  // RIEPILOGO
  // Si vede all'apertura e cliccando fuori: obiettivo, problema, cosa fare e file coinvolti
  function fileCoinvolti() {
    const perPercorso = new Map();
    elements.forEach((item) => {
      if (!item.file) return;
      const chiave = item.path || item.file;
      if (!perPercorso.has(chiave)) perPercorso.set(chiave, { file: item.file, path: item.path, punti: [] });
      perPercorso.get(chiave).punti.push(item.number);
    });
    return [...perPercorso.values()].map((f) => ({ ...f, role: f.punti.join(', ') }));
  }

  function riepilogoHtml() {
    const o = DATA.overview || {};
    const files = o.files || fileCoinvolti();
    const sezione = (titolo, testo) => (testo ? `<h3>${titolo}</h3><p class="explanation">${fmt(testo)}</p>` : '');
    return `
      <span class="panel-tag">RIEPILOGO</span>
      <h2>${esc(DATA.title)}</h2>
      ${(DATA.avvisi || []).length ? `<div class="avvisi-mappa"><h3>&#x26A0; Avvisi · ${DATA.avvisi.length}</h3><p class="route">La sala ha confrontato la mappa con il codice e qui qualcosa non torna: controlla questi punti prima di fidarti.</p><ul>${DATA.avvisi.map((a) => `<li>${fmt(a)}</li>`).join('')}</ul></div>` : ''}
      ${sezione('Obiettivo', o.goal)}
      ${sezione('Problema', o.problem)}
      ${sezione('Cosa fare', o.todo)}
      <h3>File coinvolti</h3>
      <ul class="files">${files.map((f) => `<li>${codeLink(f, 1, `<b>${esc(f.file)}</b>`)}${f.role ? ` <span class="route">· ${fmt(f.role)}</span>` : ''}</li>`).join('')}</ul>
      ${(o.notes || []).length ? `<h3>Da sapere</h3><ul class="files">${o.notes.map((n) => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
      ${DATA.screens.map((screen) => `<h3>${esc(screen.name)}</h3><ul class="tree">${elements
        .filter((item) => item.screenName === screen.name)
        .map((item) => `<li data-i="${elements.indexOf(item)}"><span class="num">${item.number}</span>${esc(item.name)}${item.text ? ` <span class="route">"${esc(item.text.slice(0, 30))}${item.text.length > 30 ? '…' : ''}"</span>` : ''}</li>`)
        .join('')}</ul>`).join('')}
      <div class="azioni-mappa">
        <button type="button" data-azione="cartella" title="Apre la cartella con il file della mappa selezionato">Apri cartella</button>
        <button type="button" data-azione="elimina" title="Cancella il file della mappa dal PC">Elimina mappa</button>
      </div>`;
  }

  // RENDER PANNELLO
  function renderPanel() {
    const panel = document.getElementById('panel');

    if (state.selected === null) {
      panel.innerHTML = riepilogoHtml();
      panel.querySelectorAll('.tree li').forEach((li) => li.addEventListener('click', () => select(Number(li.dataset.i))));
      return;
    }

    const item = elements[state.selected];
    const KIND_LABELS = { component: 'COMPONENTE', view: 'CONTENITORE', list: 'LISTA / PAGINE', control: 'PULSANTE / INPUT', text: 'TESTO', image: 'IMMAGINE', icon: 'ICONA' };
    const isColor = (v) => typeof v === 'string' && /^(#|rgb|hsl)/.test(v);
    const styleRows = Object.entries(item.style || {}).map(([k, v]) => {
      const value = typeof v === 'object' ? JSON.stringify(v) : String(v);
      const source = item.styleSource?.[k] ? ` <span class="route">· ${esc(item.styleSource[k])}</span>` : '';
      return `<dt>${esc(k)}</dt><dd>${isColor(v) ? `<i class="swatch" style="background:${esc(v)}"></i>` : ''}<code>${esc(value)}</code>${source}</dd>`;
    }).join('');
    const list = (title, entries, cls) => (entries.length
      ? `<h3>${title}</h3><dl class="terms ${cls}">${entries.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(String(v))}</dd>`).join('')}</dl>`
      : '');
    const children = (item.children || []).map((c) => `${c.number} ${esc(c.name)}`).join(' · ');
    const badges = [
      item.condition ? `<span class="badge condition">compare: ${esc(item.condition)}</span>` : '',
      ...(item.badges || []).map((b) => `<span class="badge">${esc(b)}</span>`),
    ].join('');

    panel.innerHTML = `
      <span class="panel-tag">${KIND_LABELS[item.kind] || 'ELEMENTO'}</span>
      <h2>${item.number}. ${codeLink(item, item.line, esc(item.name))}${item.file ? ` <span class="route">·</span> ${codeLink(item, 1, `<span class="route">${esc(item.file)}</span>`)}` : ''}</h2>
      <p class="route">${esc(item.screenName)}</p>
      ${badges ? `<p>${badges}</p>` : ''}
      ${item.explanation ? `<h3>Cos'è</h3><p class="explanation">${fmt(item.explanation)}</p>` : ''}
      ${item.text ? `<h3>Testo</h3><p class="explanation">${esc(item.text)}</p>` : ''}
      ${children ? `<h3>Contiene</h3><p class="explanation">${children}</p>` : ''}
      ${list('Props', Object.entries(item.props || {}), 'code')}
      ${styleRows ? `<h3>Stile</h3><dl class="terms code">${styleRows}</dl>` : ''}
      ${list('Termini', Object.entries(item.terms || {}), '')}`;
  }

  // SELEZIONE E NAVIGAZIONE
  function select(i) {
    state.selected = i;
    document.querySelectorAll('.el').forEach((el) => el.classList.toggle('sel', i !== null && Number(el.dataset.i) === i));
    renderPanel();
  }

  function move(delta) {
    const current = state.selected === null ? -1 : state.selected;
    const next = Math.min(Math.max(current + delta, 0), elements.length - 1);
    select(next);
    document.querySelector(`.el[data-i="${next}"]`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('title').textContent = DATA.title;
  document.getElementById('subtitle').textContent = DATA.subtitle || '';
  renderScreens();
  document.getElementById('numbers').addEventListener('click', (e) => {
    const on = document.body.classList.toggle('numbers');
    e.currentTarget.setAttribute('aria-pressed', on);
  });
  // Cliccando fuori dai telefoni torna il riepilogo
  document.getElementById('stage').addEventListener('click', (e) => {
    if (!e.target.closest('.el')) select(null);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      move(1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      move(-1);
    }
    if (e.key === 'Escape') select(null);
  });

  renderPanel();

  // Apertura diretta su un elemento: file.html#S3
  const fromHash = location.hash.match(/^#S(\d+)$/i);
  if (fromHash) {
    const target = Number(fromHash[1]) - 1;
    if (target >= 0 && target < elements.length) select(target);
  }
</script>
<script>
  // NAVIGAZIONE MAPPA
  // Trascinando la mappa si scorre; con i pulsanti − + o Ctrl + rotella si ingrandisce e si riduce
  (() => {
    const area = document.querySelector('#stage');
    const MIN = 0.4;
    const MAX = 2.5;
    const PASSO = 1.2;
    const SOGLIA = 4;
    let zoom = 1;
    let trascinato = false;

    function impostaZoom(valore, cx, cy) {
      const nuovo = Math.min(MAX, Math.max(MIN, valore));
      const box = area.getBoundingClientRect();
      const px = (cx ?? box.left + box.width / 2) - box.left;
      const py = (cy ?? box.top + box.height / 2) - box.top;
      const fx = (area.scrollLeft + px) / zoom;
      const fy = (area.scrollTop + py) / zoom;
      zoom = nuovo;
      area.style.setProperty('--zoom', zoom);
      // Il punto sotto il puntatore resta fermo mentre la mappa cambia dimensione
      area.scrollLeft = fx * zoom - px;
      area.scrollTop = fy * zoom - py;
    }

    area.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      impostaZoom(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });

    // TRASCINAMENTO MAPPA
    // Sotto la soglia è un clic (seleziona); oltre, la mappa segue il puntatore e il clic finale viene ignorato
    area.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('a, button, input, textarea')) return;
      trascinato = false;
      const x0 = e.clientX;
      const y0 = e.clientY;
      const sl = area.scrollLeft;
      const st = area.scrollTop;
      let preso = false;

      const muovi = (ev) => {
        if (!preso && Math.hypot(ev.clientX - x0, ev.clientY - y0) < SOGLIA) return;
        if (!preso) {
          preso = true;
          area.setPointerCapture(e.pointerId);
          area.classList.add('panning');
        }
        area.scrollLeft = sl - (ev.clientX - x0);
        area.scrollTop = st - (ev.clientY - y0);
      };
      const lascia = () => {
        area.removeEventListener('pointermove', muovi);
        area.classList.remove('panning');
        trascinato = preso;
      };
      area.addEventListener('pointermove', muovi);
      area.addEventListener('pointerup', lascia, { once: true });
      area.addEventListener('pointercancel', lascia, { once: true });
    });
    area.addEventListener('click', (e) => {
      if (!trascinato) return;
      trascinato = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  })();

  // SEZIONI APRIBILI
  // Ogni titolo del pannello di destra apre e chiude la sua sezione; una sezione chiusa resta chiusa anche cambiando selezione
  (() => {
    const panel = document.getElementById('panel');
    const chiuse = new Set();

    function rendiApribili() {
      panel.querySelectorAll(':scope > h3').forEach((h3) => {
        const sez = document.createElement('section');
        sez.className = 'sez';
        h3.before(sez);
        let nodo = h3;
        while (nodo && !(nodo !== h3 && (nodo.tagName === 'H3' || nodo.matches('.howto, .azioni-mappa')))) {
          const dopo = nodo.nextElementSibling;
          sez.appendChild(nodo);
          nodo = dopo;
        }
        const titolo = h3.textContent.split('·')[0].trim();
        sez.classList.toggle('chiusa', chiuse.has(titolo));
        h3.addEventListener('click', () => {
          const chiusa = sez.classList.toggle('chiusa');
          if (chiusa) chiuse.add(titolo);
          else chiuse.delete(titolo);
        });
      });
    }

    // Il pannello viene riscritto a ogni selezione: le sezioni si ricreano ogni volta
    new MutationObserver(() => {
      if (panel.querySelector(':scope > h3')) rendiApribili();
    }).observe(panel, { childList: true });
    rendiApribili();
  })();
</script>
<script>
  // Cosa la chat sa della mappa: i dati (con i numeri S assegnati) e l'elemento selezionato
  const MAPPA_CHAT = {
    tipo: 'struttura',
    dati: DATA,
    // Gli indizi non vanno al Claude della chat: potrebbe svelare il punto prima che l'utente lo chieda
    mappa: () => ({ ...DATA, chat: undefined, indizi: undefined }),
    trova: (punto) => document.querySelector(`.el[data-i="${Number(String(punto).replace(/^S/i, '')) - 1}"]`),
    selezione: () => {
      const item = elements[state.selected];
      return item ? `${item.number} · ${item.name} (${item.screenName})` : null;
    },
  };
</script>
<script>
  // CHAT DELLA MAPPA
  // Le domande vanno al server locale (~/.claude/shared/chat-mappa-server.js), che le passa a claude -p in sola lettura.
  (() => {
    const CONFIG = MAPPA_CHAT.dati.chat || {};
    const SERVER = `http://127.0.0.1:${CONFIG.port || 4517}`;
    const AVVIO = 'node "$HOME/.claude/shared/chat-mappa-server.js" --sfondo';
    const MAX_STORIA = 10;
    const storia = [];
    const $ = (id) => document.getElementById(id);
    let inAttesa = false;

    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');

    // FORMATTAZIONE RISPOSTA
    // Markdown essenziale: blocchi di codice, `codice`, **grassetto**, elenchi puntati, paragrafi.
    function paragrafo(testo) {
      let html = '';
      let lista = [];
      const chiudiLista = () => {
        if (lista.length) html += `<ul>${lista.join('')}</ul>`;
        lista = [];
      };
      testo.split('\n').forEach((riga) => {
        const punto = riga.match(/^\s*[-*] (.*)/);
        if (punto) return lista.push(`<li>${inline(punto[1])}</li>`);
        chiudiLista();
        html += `${html && !html.endsWith('</ul>') ? '<br>' : ''}${inline(riga)}`;
      });
      chiudiLista();
      return `<div class="par">${html}</div>`;
    }

    const markdown = (testo) => esc(testo)
      .split(/```[\w-]*\n?([\s\S]*?)```/)
      .map((parte, i) => (i % 2
        ? `<pre><code>${parte.replace(/\n$/, '')}</code></pre>`
        : parte.split(/\n{2,}/).filter((p) => p.trim()).map(paragrafo).join('')))
      .join('');

    // CONSUMI
    // Token usati da Claude, restituiti dal server della chat: numeri veri, non stime
    const formatoToken = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1).replace('.', ',')}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
    const testoToken = (token, cache) => `<b class="tok-num">${formatoToken(token)}</b>${cache ? ` + <b class="tok-cache">${formatoToken(cache)}</b> da cache` : ''}`;
    const AIUTO_CONSUMI = 'Token di oggi, da mezzanotte (00:00) alle 23:59. I token da cache pesano molto meno.';

    function aggiungi(classe, html, contesto) {
      const msg = document.createElement('div');
      msg.className = `msg ${classe}`;
      msg.innerHTML = (contesto ? `<span class="ctx">su ${esc(contesto)}</span>` : '') + html;
      $('chat-log').appendChild(msg);
      $('chat-log').scrollTop = $('chat-log').scrollHeight;
      return msg;
    }


    function serverSpento() {
      const msg = aggiungi('errore', `La chat non risponde: il server locale è spento. Avvialo da un terminale con<br><code>${esc(AVVIO)}</code><br><button type="button">Copia comando</button>`);
      msg.querySelector('button').addEventListener('click', async () => {
        if (await copyText(AVVIO)) showToast('Comando copiato: incollalo in un terminale e riprova');
      });
    }

    // STATO SERVER
    async function controllaServer() {
      const dot = document.querySelector('#chat-open .dot');
      try {
        const res = await fetch(`${SERVER}/stato`);
        dot.classList.toggle('off', !res.ok);
      } catch {
        dot.classList.add('off');
      }
    }

    // CONTESTO TOLTO
    // La X vale finché non cambia la selezione: un clic qualsiasi sulla mappa non lo riaccende
    let tolto = false;
    let toltoSu = null;
    const senzaContesto = () => tolto && toltoSu === MAPPA_CHAT.selezione();

    function aggiornaContesto() {
      const selezione = MAPPA_CHAT.selezione();
      if (tolto && toltoSu !== selezione) tolto = false;
      const togli = '<button type="button" id="chat-ctx-togli" title="Non mandare a Claude né la selezione né la mappa">&#x2715;</button>';
      $('chat-ctx').classList.toggle('vuoto', tolto);
      $('chat-ctx').innerHTML = tolto ? '&nbsp;'
        : (selezione
          ? `Domanda su <b>${esc(selezione)}</b>`
          : 'Nessun elemento selezionato: la domanda riguarda tutta la mappa') + togli;
    }

    $('chat-ctx').addEventListener('click', (e) => {
      if (e.target.id !== 'chat-ctx-togli') return;
      tolto = true;
      toltoSu = MAPPA_CHAT.selezione();
      aggiornaContesto();
    });

    // ALTEZZA INPUT
    // Prima si azzera, altrimenti scrollHeight non cala quando cancelli righe
    function adattaInput() {
      const input = $('chat-input');
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight + input.offsetHeight - input.clientHeight}px`;
    }

    // INVIO DOMANDA
    async function invia(e) {
      e.preventDefault();
      const domanda = $('chat-input').value.trim();
      if (!domanda || inAttesa) return;
      if (!CONFIG.token || !CONFIG.project) {
        aggiungi('errore', 'Chat non configurata: in questa mappa mancano <code>chat.token</code> e <code>chat.project</code>. Chiedi a Claude di rigenerarla.');
        return;
      }

      const vuoto = senzaContesto();
      const selezione = vuoto ? null : MAPPA_CHAT.selezione();
      aggiungi('utente', paragrafo(esc(domanda)), selezione);
      $('chat-input').value = '';
      adattaInput();
      inAttesa = true;
      $('chat-send').disabled = true;
      $('chat-open').classList.add('pensa');
      const inizio = Date.now();
      const attesa = aggiungi('info', 'Sto pensando…');
      const timer = setInterval(() => {
        attesa.textContent = `Sto pensando… ${Math.round((Date.now() - inizio) / 1000)} s`;
      }, 1000);

      try {
        const res = await fetch(`${SERVER}/chiedi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: CONFIG.token,
            project: CONFIG.project,
            tipo: MAPPA_CHAT.tipo,
            titolo: MAPPA_CHAT.dati.title,
            mappa: vuoto ? '' : JSON.stringify(MAPPA_CHAT.mappa()),
            selezione,
            senzaContesto: vuoto,
            storia: storia.slice(-MAX_STORIA),
            domanda,
            modalita: $('chat-modo').value,
          }),
        });
        const corpo = await res.json();
        if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
        storia.push({ ruolo: 'utente', testo: selezione ? `[su ${selezione}] ${domanda}` : domanda }, { ruolo: 'claude', testo: corpo.risposta });
        aggiungi('claude', markdown(corpo.risposta));
        if (corpo.consumo) {
          const c = corpo.consumo;
          const t = corpo.giornata?.perFunzione?.['chat-mappa'];
          const totale = t ? `<span><span class="tok-chi">Chat delle mappe</span> · oggi: ${testoToken(t.token, t.cache)}</span>` : '';
          aggiungi('consumo', `<details><summary>TOKEN</summary><div class="dati"><span><span class="tok-chi">Questa risposta</span>: ${testoToken(c.input + c.scritti + c.output, c.cache)}</span>${totale}</div></details>`).title = AIUTO_CONSUMI;
        }
        if ($('chat').hidden) document.querySelector('#chat-open .dot').classList.add('pronta');
      } catch (err) {
        if (err instanceof TypeError) serverSpento();
        else aggiungi('errore', esc(err.message));
      } finally {
        clearInterval(timer);
        attesa.remove();
        inAttesa = false;
        $('chat-send').disabled = false;
        $('chat-open').classList.remove('pensa');
        controllaServer();
      }
    }

    // INDIZI
    // Graduali (prima la zona, poi il punto) e preparati dalla skill: dicono dove guardare, mai cosa cambiare
    const INDIZI = Array.isArray(MAPPA_CHAT.dati.indizi) ? MAPPA_CHAT.dati.indizi : [];
    let indiziUsati = 0;

    let luceAttiva = null;
    let ultimoIndizio = null;

    function illumina(indizio) {
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      const trovati = indizio.punti.map(MAPPA_CHAT.trova).filter(Boolean);
      trovati.forEach((el) => el.classList.add('luce'));
      if (trovati.length === 1) trovati[0].classList.add('luce-zoom');
      document.body.classList.add('con-indizio');
      return trovati;
    }

    function spegniLuce() {
      luceAttiva = null;
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      document.body.classList.remove('con-indizio');
      $('riaccendi').hidden = !ultimoIndizio;
    }

    // LUCE DELL'INDIZIO
    // Si spegne cliccando fuori dai punti illuminati (la chat non conta); la lampadina in basso a destra la riaccende
    document.body.insertAdjacentHTML('beforeend', '<button type="button" id="riaccendi" title="Riaccendi l&#39;ultimo indizio" aria-label="Riaccendi l&#39;ultimo indizio" hidden>&#x1F4A1;</button>');
    $('riaccendi').addEventListener('click', () => ultimoIndizio && accendiLuce(ultimoIndizio));
    document.addEventListener('click', (e) => {
      // Un bottone della chat che si toglie da solo (es. "Sì, mostramelo") non è più nella pagina: non conta come clic fuori
      if (!luceAttiva || !e.target.isConnected || e.target.closest('#chat, #chat-open, #riaccendi, .luce')) return;
      spegniLuce();
    });

    // La mappa dati si ridisegna quando apri un riquadro: la luce va riaccesa sui riquadri nuovi
    document.addEventListener('mappa-ridisegnata', () => {
      if (luceAttiva) illumina(luceAttiva);
    });

    function accendiLuce(indizio) {
      luceAttiva = indizio;
      ultimoIndizio = indizio;
      $('riaccendi').hidden = true;
      const trovati = illumina(indizio);
      if (!trovati.length) return;
      // Nella mappa struttura si scorre il telefono intero: scorrere dentro lo schermo simulato lo sposterebbe
      (trovati[0].closest('.frame') || trovati[0]).scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      setTimeout(() => liberaVista(trovati), 600);
    }

    // Se la chat copre i punti illuminati, si sposta sul lato opposto della finestra
    function liberaVista(trovati) {
      const chat = $('chat');
      if (chat.hidden) return;
      const c = chat.getBoundingClientRect();
      const coperto = trovati.some((el) => {
        const r = el.getBoundingClientRect();
        return r.left < c.right && r.right > c.left && r.top < c.bottom && r.bottom > c.top;
      });
      if (!coperto) return;
      const aDestra = c.left + c.width / 2 < window.innerWidth / 2;
      Object.assign(chat.style, {
        left: `${aDestra ? window.innerWidth - c.width - MARGINE : MARGINE}px`,
        top: `${c.top}px`,
        bottom: 'auto',
      });
      tieniDentro(chat);
      mascotteSottoChat();
    }

    function mostraIndizio(i) {
      const indizio = INDIZI[i];
      const tipo = indizio.punti.length > 1 ? 'zona' : 'punto';
      const msg = aggiungi('suggerimento', `<div class="par"><b>&#x1F4A1; Indizio ${i + 1} di ${INDIZI.length} · ${tipo}: ${esc(indizio.punti.join(', '))}</b><br>${inline(esc(indizio.testo))}</div><button type="button" data-rivedi>&#x1F4A1; Illumina di nuovo</button> <button type="button" data-spegni>Spegni la luce</button>`);
      msg.querySelector('[data-rivedi]').addEventListener('click', () => accendiLuce(indizio));
      msg.querySelector('[data-spegni]').addEventListener('click', spegniLuce);
      accendiLuce(indizio);
    }

    function chiediIndizio() {
      if ($('chat-log').querySelector('[data-conferma]')) return;
      if (indiziUsati >= INDIZI.length) {
        aggiungi('info', 'Indizi finiti: da qui il ragionamento è tuo. La soluzione la do solo se la chiedi esplicitamente nella chat di Claude Code.');
        return;
      }
      const n = indiziUsati + 1;
      const msg = aggiungi('suggerimento', `<div class="par" data-conferma>Vuoi l'indizio ${n} di ${INDIZI.length}? ${n === 1 ? 'Ti illumino la zona in cui guardare.' : 'Ti illumino il punto preciso.'} Non ti dirò cosa cambiare.</div><button type="button" data-si>Sì, mostramelo</button> <button type="button" data-no>No, ci provo ancora</button>`);
      msg.querySelector('[data-si]').addEventListener('click', () => {
        msg.remove();
        mostraIndizio(indiziUsati);
        indiziUsati += 1;
      }, { once: true });
      msg.querySelector('[data-no]').addEventListener('click', () => msg.remove(), { once: true });
    }

    $('chat-hint').hidden = INDIZI.length === 0;
    $('chat-hint').addEventListener('click', chiediIndizio);

    // AZIONI SULLA MAPPA
    // Apri cartella ed elimina passano dal server locale: la pagina da sola non può toccare i file
    const FILE_MAPPA = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1');
    let daConfermare = null;

    async function azioneMappa(azione) {
      const res = await fetch(`${SERVER}/${azione}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: CONFIG.token, file: FILE_MAPPA }),
      });
      const corpo = await res.json();
      if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
    }

    // Eliminare chiede un secondo clic entro 4 secondi
    $('panel').addEventListener('click', async (e) => {
      const bottone = e.target.closest('[data-azione]');
      if (!bottone) return;
      if (!CONFIG.token) {
        showToast('Questa mappa non è collegata al server locale: chiedi a Claude di rigenerarla');
        return;
      }
      const azione = bottone.dataset.azione;
      if (azione === 'elimina' && daConfermare !== bottone) {
        daConfermare = bottone;
        bottone.textContent = 'Sicuro? Clicca di nuovo';
        bottone.classList.add('pericolo');
        setTimeout(() => {
          if (daConfermare !== bottone) return;
          daConfermare = null;
          bottone.textContent = 'Elimina mappa';
          bottone.classList.remove('pericolo');
        }, 4000);
        return;
      }
      try {
        await azioneMappa(azione);
        if (azione === 'elimina') document.body.innerHTML = '<p class="eliminata">Mappa eliminata dal PC. Puoi chiudere questa scheda.</p>';
      } catch (err) {
        showToast(err instanceof TypeError ? `Il server locale è spento: avvialo con <code>${esc(AVVIO)}</code>` : esc(err.message));
      }
    });

    // MASCOTTE
    // Ogni carattere è un pixel: D contorno, P arancione, L riflesso, W bianco occhio, K pupilla e bocca, R guance
    const SPRITE = [
      '..DDDDDDDD..',
      '.DPPPPPPPPD.',
      'DPLLPPPPPPPD',
      'DPLPWWPPWWPD',
      'DPPPWKPPWKPD',
      'DPPPWKPPWKPD',
      'DPRPPPPPPRPD',
      'DPPPPKKKPPPD',
      '.DPPPPPPPPD.',
      '..DPDDDDDD..',
      '..DD........',
      '.DD.........',
    ];
    const PIXEL = { D: '#5c2414', P: '#d97757', L: '#f5c4ad', W: '#ffffff', K: '#2b130b', R: '#f9a8a0' };
    const pixel = (x, y, c) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PIXEL[c]}"/>`;
    // Sotto occhi e bocca va il colore del corpo: si vede quando cambia espressione
    const mobile = (x, y, c) => (y >= 3 && y <= 5 && 'WK'.includes(c)) || (y === 7 && c === 'K');
    const corpo = SPRITE.flatMap((riga, y) => [...riga].map((c, x) => (PIXEL[c] ? pixel(x, y, mobile(x, y, c) ? 'P' : c) : ''))).join('');
    const bocca = `<g class="bocca">${[5, 6, 7].map((x) => pixel(x, 7, 'K')).join('')}</g>`;
    // Occhi sgranati 3×3 con la pupilla al centro e bocca spalancata con la lingua
    const PAURA = [
      ...[3, 7].flatMap((x0) => [2, 3, 4].flatMap((y) => [0, 1, 2].map((dx) => [x0 + dx, y, y === 3 && dx === 1 ? 'K' : 'W']))),
      [5, 6, 'K'], [6, 6, 'K'], [7, 6, 'K'], [5, 7, 'K'], [6, 7, 'R'], [7, 7, 'K'], [5, 8, 'K'], [6, 8, 'K'], [7, 8, 'K'],
    ];
    const paura = `<g class="paura">${PAURA.map(([x, y, c]) => pixel(x, y, c)).join('')}</g>`;
    const occhio = (x0) => `<g class="eye">${[3, 4, 5].flatMap((y) => [x0, x0 + 1].map((x) => pixel(x, y, SPRITE[y][x]))).join('')}</g>`;
    // SPIRALE A PIXEL
    // Spirale 7×7 a mezzi pixel (3,5×3,5 pixel) centrata sul centro dell'occhio normale (x 5 e 9, y 4,5), così gira sul posto; ogni fotogramma la ruota di 90° in senso orario
    const SPIRALE = ['KKKKKKK', 'WWWWWWK', 'KKKKKWK', 'KWWWKWK', 'KWKKKWK', 'KWWWWWK', 'KKKKKKK'];
    const ruota = (x, y, volte) => (volte ? ruota(SPIRALE.length - 1 - y, x, volte - 1) : [x, y]);
    const mezzo = (x, y) => `<rect x="${x}" y="${y}" width=".5" height=".5" fill="${PIXEL.K}"/>`;
    const fondo = (x0, y0) => `<rect x="${x0}" y="${y0}" width="3.5" height="3.5" fill="${PIXEL.W}"/>`;
    const fotogramma = (x0, y0, volte) => SPIRALE.flatMap((riga, y) => [...riga].map((c, x) => {
      if (c !== 'K') return '';
      const [rx, ry] = ruota(x, y, volte);
      return mezzo(x0 + rx / 2, y0 + ry / 2);
    })).join('');
    const ipno = (centro) => { const x0 = centro - 1.75; const y0 = 2.75; return `<g class="ipno">${fondo(x0, y0)}${[0, 1, 2, 3].map((volte) => `<g class="giro" style="animation-delay: ${volte * 0.15}s">${fotogramma(x0, y0, volte)}</g>`).join('')}</g>`; };
    // DECORAZIONI DELLE MODALITÀ
    // Pixel fuori dal corpo (la tela va da -2 a 15 in orizzontale e da -4 a 11 in verticale): ognuna si vede solo nella sua modalità
    const COLORI_ACCESSORI = { o: '#141312', g: '#9b968a', A: '#a7afb8', a: '#5f6670', L: '#3d6fb6', P: '#f4f2ec', N: '#22252b', n: '#454b55', Y: '#f2c14e', K: '#2b130b', C: '#4b5563', T: '#2bb3a3', t: '#8fe3d8', S: '#111111', s: '#6b7280', M: '#f4f2ec', m: '#c9c4b8', B: '#6b3e26', V: '#e6e6e6' };
    const punti = (colore, coppie) => coppie.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${COLORI_ACCESSORI[colore]}"/>`).join('');
    const intervallo = (da, a, y) => Array.from({ length: a - da + 1 }, (_, i) => [da + i, y]);
    // Gli occhi sono larghi 2 pixel e distano 2 pixel: una montatura a pixel interi li coprirebbe, quindi è a linee sottili
    const OCCHIALI = `<g class="occhiali" fill="none" stroke="#2b130b" stroke-width=".35"><rect x="3.55" y="2.6" width="2.9" height="3.8" rx=".5"/><rect x="7.55" y="2.6" width="2.9" height="3.8" rx=".5"/><path d="M6.45 3.6h1.1M3.55 3.4h-1.3M10.45 3.4h1.3"/></g>`;
    const ACCESSORI = [
      // Insegnante: occhiali dorati e un libro aperto in mano, con la piega al centro
      `<g class="acc acc-insegnante"><g class="viso">${OCCHIALI}</g>${punti('P', [[11, 7], [12, 7], [14, 7], [15, 7], [11, 8], [12, 8], [14, 8], [15, 8], [11, 9], [12, 9], [14, 9], [15, 9]])}${punti('g', [[13, 7], [13, 8], [13, 9]])}${punti('m', [[12, 8], [15, 8]])}${punti('L', intervallo(11, 15, 10))}</g>`,
      // Traduttore: cuffie da interprete e microfono a lato, con il bordo scuro per staccarlo dal corpo
      `<g class="acc acc-traduttore">${punti('C', [...intervallo(3, 8, -2), [1, -1], [2, -1], [9, -1], [10, -1], [0, 0], [11, 0], [-1, 1], [12, 1], [-1, 2], [12, 2]])}${punti('T', [[-2, 3], [-2, 4], [-2, 5], [-1, 4], [-1, 5], [-1, 6], [-2, 6], [13, 3], [13, 4], [13, 5], [13, 6], [12, 4], [12, 5], [12, 6]])}${punti('t', [[-1, 3], [12, 3]])}${punti('o', [[-2, 7], [-1, 7], [-3, 8], [-3, 9], [0, 8], [0, 9]])}${punti('s', [[-2, 8], [-1, 8], [-2, 9], [-1, 9]])}${punti('V', [[-2, 8]])}${punti('N', [[-2, 10], [-1, 10], [-2, 11]])}</g>`,
      // Senior developer: occhiali da sole e un portatile davanti, visto dal dorso argentato con il logo
      `<g class="acc acc-senior"><g class="viso">${punti('S', [...intervallo(2, 10, 3), [3, 4], [4, 4], [5, 4], [7, 4], [8, 4], [9, 4], [4, 5], [8, 5]])}${punti('s', [[3, 3], [7, 3]])}</g>${punti('A', [...intervallo(11, 15, 5), [11, 6], [15, 6], [11, 7], [15, 7], ...intervallo(11, 15, 8)])}${punti('A', [...intervallo(12, 14, 6), ...intervallo(12, 14, 7)])}${punti('V', [[13, 6]])}${punti('a', intervallo(10, 15, 9))}${punti('n', intervallo(10, 15, 10))}</g>`,
    ].join('');
    // Stelline che compaiono intorno quando cambi modalità
    const stellina = (x, y) => punti('Y', [[x, y], [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]);
    const SCINTILLE = `<g class="scintille">${stellina(-1, -2)}${stellina(14, -1)}${stellina(-1, 9)}${stellina(15, 6)}</g>`;
    $('chat-open').insertAdjacentHTML('afterbegin', `<svg class="sprite" viewBox="-2 -4 18 16" aria-hidden="true">${corpo}${occhio(4)}${occhio(8)}${bocca}${ipno(5)}${ipno(9)}${paura}${ACCESSORI}${SCINTILLE}</svg>`);

    // TRASCINAMENTO
    // Chat e mascotte sono incollate: la chat sta sempre sopra la mascotte e chi viene spostato si porta dietro l'altro
    const MARGINE = 8;
    const STACCO = 6;
    const SOGLIA = 4;

    const sposta = (el, left, top) => Object.assign(el.style, { left: `${left}px`, top: `${top}px`, bottom: 'auto' });

    function tieniDentro(el) {
      if (!el.style.top || el.hidden) return;
      const box = el.getBoundingClientRect();
      sposta(
        el,
        Math.min(Math.max(box.left, MARGINE), window.innerWidth - box.width - MARGINE),
        Math.min(Math.max(box.top, MARGINE), window.innerHeight - box.height - MARGINE),
      );
    }

    // La chat si mette sopra la mascotte; se sopra non c'è spazio scendono insieme
    function chatSopraMascotte() {
      const chat = $('chat');
      if (chat.hidden) return;
      const omino = $('chat-open').getBoundingClientRect();
      const left = Math.min(Math.max(omino.left, MARGINE), window.innerWidth - chat.offsetWidth - MARGINE);
      const top = Math.max(MARGINE, omino.top - chat.offsetHeight - STACCO);
      sposta(chat, left, top);
      sposta($('chat-open'), left, top + chat.offsetHeight + STACCO);
    }

    // La mascotte si mette sotto la chat; se sotto non c'è spazio salgono insieme
    function mascotteSottoChat() {
      const chat = $('chat');
      if (chat.hidden || !chat.style.top) return;
      const box = chat.getBoundingClientRect();
      const omino = $('chat-open');
      const sfora = box.bottom + STACCO + omino.offsetHeight - (window.innerHeight - MARGINE);
      const top = Math.max(MARGINE, box.top - Math.max(0, sfora));
      sposta(chat, box.left, top);
      sposta(omino, box.left, top + chat.offsetHeight + STACCO);
    }

    function rendiTrascinabile(el, maniglia, { mentreSposti, quandoLasci }) {
      maniglia.addEventListener('pointerdown', (e) => {
        const bottone = e.target.closest('button');
        if (e.button !== 0 || (bottone && bottone !== maniglia) || e.target.closest('select')) return;
        const box = el.getBoundingClientRect();
        const dx = e.clientX - box.left;
        const dy = e.clientY - box.top;
        let mosso = false;
        maniglia.setPointerCapture(e.pointerId);

        // Sotto la soglia è un clic, non un trascinamento
        const muovi = (ev) => {
          if (!mosso && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < SOGLIA) return;
          if (!mosso) {
            mosso = true;
            el.classList.add('dragging');
          }
          sposta(el, ev.clientX - dx, ev.clientY - dy);
          tieniDentro(el);
          mentreSposti();
        };
        const lascia = () => {
          maniglia.removeEventListener('pointermove', muovi);
          el.classList.remove('dragging');
          if (mosso) quandoLasci?.();
        };
        maniglia.addEventListener('pointermove', muovi);
        maniglia.addEventListener('pointerup', lascia, { once: true });
        maniglia.addEventListener('pointercancel', lascia, { once: true });
      });
    }

    // Dopo un trascinamento il browser manda comunque un clic: va ignorato
    let ignoraClic = false;
    $('chat-open').addEventListener('pointerdown', () => {
      ignoraClic = false;
    });
    rendiTrascinabile($('chat-open'), $('chat-open'), {
      mentreSposti: chatSopraMascotte,
      quandoLasci: () => {
        ignoraClic = true;
      },
    });
    rendiTrascinabile($('chat'), $('chat').querySelector('.chat-head'), { mentreSposti: mascotteSottoChat });
    $('chat').querySelector('.chat-head').addEventListener('dblclick', (e) => {
      if (e.target.closest('button')) return;
      Object.assign($('chat').style, { width: '', height: '' });
      chatSopraMascotte();
    });
    new ResizeObserver(mascotteSottoChat).observe($('chat'));
    window.addEventListener('resize', () => {
      tieniDentro($('chat-open'));
      chatSopraMascotte();
    });

    // APERTURA E COMANDI
    $('chat-open').addEventListener('click', () => {
      if (ignoraClic) {
        ignoraClic = false;
        return;
      }
      $('chat').hidden = !$('chat').hidden;
      if ($('chat').hidden) return;
      document.querySelector('#chat-open .dot').classList.remove('pronta');
      chatSopraMascotte();
      aggiornaContesto();
      controllaServer();
      $('chat-input').focus();
    });
    $('chat-close').addEventListener('click', () => {
      $('chat').hidden = true;
    });
    $('chat-clear').addEventListener('click', () => {
      storia.length = 0;
      $('chat-log').innerHTML = '';
    });
    $('chat-form').addEventListener('submit', invia);
    $('chat-input').addEventListener('input', adattaInput);
    // La modalità scelta resta anche nelle prossime pagine
    try {
      $('chat-modo').value = localStorage.getItem('chattino.modo') || 'normale';
    } catch {}
    if (!$('chat-modo').value) $('chat-modo').value = 'normale';
    // CAMBIO DECORAZIONI
    // Chattino salta e brilla; a metà salto si cambia d'abito, così il cambio non si vede
    let timerCambio;
    function cambiaDecorazioni(modo) {
      const omino = $('chat-open');
      clearTimeout(timerCambio);
      omino.classList.remove('cambia');
      void omino.offsetWidth;
      omino.classList.add('cambia');
      timerCambio = setTimeout(() => {
        omino.dataset.modo = modo;
        timerCambio = setTimeout(() => omino.classList.remove('cambia'), 400);
      }, 300);
    }
    $('chat-open').dataset.modo = $('chat-modo').value;
    $('chat-modo').addEventListener('change', () => {
      try {
        localStorage.setItem('chattino.modo', $('chat-modo').value);
      } catch {}
      cambiaDecorazioni($('chat-modo').value);
    });
    // I tasti scritti nella chat non devono muovere la selezione della mappa
    $('chat').addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') $('chat').hidden = true;
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input') invia(e);
    });
    document.addEventListener('click', aggiornaContesto);
    document.addEventListener('keyup', aggiornaContesto);

    controllaServer();
  })();
</script>
</body>
</html>
