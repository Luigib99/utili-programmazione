<script>
  const FLOW = JSON.parse(document.getElementById('flow-data').textContent);
  // "(non in locale)" accanto al backend non serve: che il backend sia dedotto lo dice già la spiegazione del passo
  FLOW.nodes.forEach((n) => {
    if (typeof n.file === 'string') n.file = n.file.replace(/\s*\((non\s+)?in\s+locale\)/gi, '').trim();
  });

  const PAD = 16;
  const LANE_INNER = 20;
  const LANE_GAP = 48;
  const COL_GAP = 56;
  const NODE_W = 380;
  const NODE_MIN_H = 84;
  const BIVIO_W = 300;
  const BIVIO_H = 116;
  const ANIM_MS = 260;
  const GAP = 76;
  const SECTION_H = 44;
  const HEADER_H = 46;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XHTML_NS = 'http://www.w3.org/1999/xhtml';

  // Gli attributi SVG non risolvono var(): leggo i token CSS una volta sola
  const cv = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();

  // x e w si calcolano in layout(): una corsia si allarga quando ha passi affiancati
  const LANES = {
    FRONTEND: { x: PAD, w: NODE_W + LANE_INNER * 2, stroke: cv('fe'), fill: cv('fe-bg') },
    BACKEND: { x: 0, w: NODE_W + LANE_INNER * 2, stroke: cv('be'), fill: cv('be-bg') },
  };

  // edge: indice in FLOW.edges della freccia selezionata (null se è selezionato un riquadro)
  const state = { selected: null, edge: null, stepMode: false };
  const isBivio = (node) => node.tipo === 'bivio';
  const isFine = (node) => node.tipo === 'fine';
  // Bivio e fine hanno misure fisse e non si aprono
  const fisso = (node) => isBivio(node) || isFine(node);
  const FINE_W = 240;
  const FINE_H = 52;
  const larghezza = (node) => (isBivio(node) ? BIVIO_W : isFine(node) ? FINE_W : NODE_W);
  const centerX = (node) => node.x + larghezza(node) / 2;

  const el = (tag, attrs = {}, parent) => {
    const node = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (parent) parent.appendChild(node);
    return node;
  };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // EVIDENZIAZIONE CODICE NEI TESTI
  // Gruppi in ordine: stringa, numero, letterale, funzione (seguita da "("), tipo/componente (Maiuscola), variabile
  const TOKEN = /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b(true|false|null|undefined)\b|([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Z][\w$]*)\b|([A-Za-z_$][\w$]*)/g;
  const TOKEN_CLASSES = ['tk-string', 'tk-number', 'tk-literal', 'tk-function', 'tk-type', 'tk-var'];

  const highlight = (code) => {
    if (/^[\w./-]+\.(jsx?|tsx?|json|md)$/.test(code)) return `<span class="tk-file">${esc(code)}</span>`;
    let html = '';
    let last = 0;
    for (const match of code.matchAll(TOKEN)) {
      const group = match.slice(1).findIndex((g) => g !== undefined);
      html += esc(code.slice(last, match.index)) + `<span class="${TOKEN_CLASSES[group]}">${esc(match[0])}</span>`;
      last = match.index + match[0].length;
    }
    return html + esc(code.slice(last));
  };

  // RIFERIMENTI AL CODICE
  // FLOW.codice dice dove sta ogni nome: `handleAdd`, `registerPasskey()` o `auth.login(dati)` diventano link alla loro riga
  const CODICE = FLOW.codice || {};
  const riferimento = (testo) => {
    const nome = String(testo).match(/^[A-Za-z_$][\w$]*(?:\.[\w$]+)*/)?.[0];
    if (!nome) return null;
    return CODICE[nome] || CODICE[nome.split('.').pop()] || null;
  };

  // Link che apre il file in VS Code alla riga indicata (vscode://file/<percorso>:<riga>:<colonna>)
  const linkPercorso = (percorso, line, inner) => {
    if (!percorso) return inner;
    const target = `${percorso.replace(/\\/g, '/')}:${line || 1}`;
    const href = encodeURI(`vscode://file/${target}:1`);
    return `<a class="code-link" href="${esc(href)}" data-copy="${esc(target)}" title="Apri in VS Code alla riga ${esc(String(line || 1))}">${inner}</a>`;
  };

  const codeLink = (node, line, inner) => {
    if (node.path) return linkPercorso(node.path, line, inner);
    const ref = line !== 1 && riferimento(node.element || '');
    return ref ? linkPercorso(ref.path, ref.line, inner) : inner;
  };

  const fmt = (s) => (s || '')
    .split(/(`[^`]+`)/)
    .map((part) => {
      if (!/^`[^`]+`$/.test(part)) return esc(part);
      const codice = part.slice(1, -1);
      const ref = riferimento(codice);
      const html = `<code>${highlight(codice)}</code>`;
      return ref ? linkPercorso(ref.path, ref.line, html) : html;
    })
    .join('');

  // COPIA PERCORSO
  // Il browser integrato di VS Code blocca i link vscode:// senza avvisare: il percorso copiato si apre con Ctrl+P
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    }
  }

  function showToast(html) {
    const toast = document.getElementById('toast');
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
      toast.hidden = true;
    }, 4000);
  }

  document.addEventListener('click', async (e) => {
    const link = e.target.closest('a.code-link');
    if (!link) return;
    // Il percorso si copia in silenzio: l'avviso compare solo se la copia non riesce
    if (!(await copyText(link.dataset.copy))) showToast('Copia non riuscita: apri il file in un browser esterno per usare il link diretto');
  });

  // CONTENUTO RIQUADRO
  // Chiuso: solo nome della funzione e una frase semplice in grigio. Aperto: anche il file e i punti tecnici. p va da 0 (chiuso) a 1 (aperto)
  const primaFrase = (testo) => (testo || '').split(/(?<=[.!?])\s/)[0];
  // Una frase per punto: si va a capo dopo . o ; seguiti da una maiuscola o da codice
  const dividiInFrasi = (testo) => (testo || '').split(/(?<=[.;])\s+(?=[A-ZÀ-Ý`])/).map((frase) => frase.trim()).filter(Boolean);

  function contenutoNodo(node, p) {
    const breve = node.short || primaFrase(node.simple) || node.action;
    const punti = node.steps || dividiInFrasi(node.does || node.explanation || node.action);
    const corpo = p > 0
      ? `<div class="tecnico" style="opacity: ${p.toFixed(2)}"><ul class="passi">${punti.map((punto) => `<li>${fmt(punto)}</li>`).join('')}</ul>${node.payloadName ? `<div class="passa">passa: <code>${esc(node.payloadName)}</code></div>` : ''}</div>`
      : `<div class="breve">${fmt(breve)}</div>`;
    return `
      <div class="node ${node.side}${p > 0 ? ' open' : ''}${node.inErrore ? ' in-errore' : ''}">
        <div class="tag">${node.side}<span class="toggle">${p > 0 ? '&#9652;' : '&#9662;'}</span></div>
        <div class="title">${p > 0
          ? `${codeLink(node, node.line, `<span class="element">${esc(node.element || node.file)}</span>`)}${node.element ? `<span class="sep">·</span>${codeLink(node, 1, `<span class="file">${esc(node.file)}</span>`)}` : ''}`
          : `<span class="element">${esc(node.element || node.file)}</span>`}</div>
        ${corpo}
      </div>`;
  }

  // ALTEZZA RIQUADRI
  // Misura fuori schermo ogni riquadro chiuso e aperto, con la stessa larghezza che ha nel diagramma
  function misuraAltezze() {
    const prova = document.createElement('div');
    prova.style.cssText = `position: absolute; left: -9999px; top: 0; width: ${NODE_W}px; visibility: hidden`;
    document.body.appendChild(prova);
    FLOW.nodes.forEach((node) => {
      if (fisso(node)) {
        node.hOpen = node.hClosed = isBivio(node) ? BIVIO_H : FINE_H;
      } else {
        [['hClosed', 0], ['hOpen', 1]].forEach(([chiave, p]) => {
          prova.innerHTML = contenutoNodo(node, p);
          const div = prova.firstElementChild;
          div.style.height = 'auto';
          node[chiave] = Math.max(NODE_MIN_H, Math.ceil(div.getBoundingClientRect().height));
        });
      }
      node.p = node.open && !fisso(node) ? 1 : 0;
      node.h = node.open && !fisso(node) ? node.hOpen : node.hClosed;
    });
    prova.remove();
  }

  // APERTURA RIQUADRO
  // L'altezza cresce un fotogramma alla volta e i riquadri sotto scorrono giù: è l'effetto di scorrimento. Un bivio non si apre
  function apriChiudi(i) {
    const node = FLOW.nodes[i];
    if (fisso(node)) return;
    node.open = !node.open;
    const da = node.h;
    const a = node.open ? node.hOpen : node.hClosed;
    const inizio = performance.now();
    const passo = (ora) => {
      const t = Math.min(1, (ora - inizio) / ANIM_MS);
      const e = 1 - (1 - t) ** 3;
      node.h = da + (a - da) * e;
      node.p = node.open ? e : 1 - e;
      renderDiagram();
      if (t < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  // FRECCE
  // Senza "uscite" un passo va al successivo (tranne quando inizia una sezione); con "uscite" decide lui dove andare,
  // anche più frecce (un bivio, un errore, un ritorno). "verso" è "D5" oppure l'id di un passo
  const indiceDi = (verso) => {
    const perId = FLOW.nodes.findIndex((n) => n.id && n.id === verso);
    if (perId >= 0) return perId;
    const numero = Number(String(verso).replace(/^D/i, ''));
    return Number.isInteger(numero) && numero >= 1 && numero <= FLOW.nodes.length ? numero - 1 : -1;
  };

  function costruisciFrecce() {
    FLOW.edges = [];
    FLOW.nodes.forEach((node, i) => {
      if (Array.isArray(node.uscite)) {
        node.uscite.forEach((u) => {
          const to = indiceDi(u.verso);
          if (to >= 0 && to !== i) FLOW.edges.push({ from: i, to, tipo: u.tipo || 'normale', etichetta: u.etichetta || '', call: u.call || null, payloadName: u.payloadName, payload: u.payload, fields: u.fields, riga: Number(u.riga) || null, esplicita: true });
        });
        return;
      }
      const next = FLOW.nodes[i + 1];
      // Un passo di fine chiude la sua parte di flusso: niente freccia automatica verso il passo dopo
      if (!next || next.section || isFine(node)) return;
      FLOW.edges.push({ from: i, to: i + 1, tipo: next.incoming === 'lost' ? 'persa' : 'normale', etichetta: '', call: node.call || null, payloadName: node.payloadName, payload: node.payload, fields: node.fields, esplicita: false });
    });
  }

  function affiancaRami() {
    FLOW.nodes.forEach((node, i) => {
      if (!isBivio(node)) return;
      const mete = [...new Set(FLOW.edges.filter((e) => e.from === i && e.to > i).map((e) => e.to))].sort((a, b) => a - b);
      const contigue = mete.length > 1 && mete.every((m, k) => m === i + 1 + k);
      if (!contigue) return;
      mete.slice(1).forEach((m) => {
        if (!FLOW.nodes[m].section) FLOW.nodes[m].accantoAuto = true;
      });
      // Due strade alternative non si passano il testimone: tolta la freccia automatica tra una meta e la successiva
      FLOW.edges = FLOW.edges.filter((e) => e.esplicita || !(mete.includes(e.from) && mete.includes(e.to)));
    });
    segnaErrori();
  }

  // RAMO DI ERRORE
  // Rosso tutto quello che viene dopo una freccia di errore, fino alla fine del ramo (anche la pillola di fine):
  // si segue in avanti, ma non lungo le frecce "alternativa" (un "riprova" torna al flusso normale).
  // Il backend resta giallo: il server che risponde non è "in errore", lo è il ramo dell'app che gestisce la risposta
  function segnaErrori() {
    const coda = [
      ...FLOW.edges.filter((e) => e.tipo === 'errore').map((e) => e.to),
      ...FLOW.nodes.map((n, i) => (n.errore === true ? i : -1)).filter((i) => i >= 0),
    ];
    const visti = new Set();
    while (coda.length) {
      const i = coda.shift();
      if (visti.has(i)) continue;
      visti.add(i);
      if (FLOW.nodes[i].side !== 'BACKEND') FLOW.nodes[i].inErrore = true;
      FLOW.edges.filter((e) => e.from === i && e.to > i && e.tipo !== 'alternativa').forEach((e) => coda.push(e.to));
    }
  }

  // POSIZIONI NODI
  // Righe: un passo con "accanto": true sta sulla stessa riga del precedente. Nella stessa corsia i passi di una riga
  // si mettono uno di fianco all'altro e la corsia si allarga quanto serve
  function layout() {
    if (!FLOW.edges) {
      costruisciFrecce();
      affiancaRami();
    }
    const righe = [];
    FLOW.nodes.forEach((node, i) => {
      node.number = i + 1;
      if (i === 0 || !(node.accanto || node.accantoAuto) || node.section) righe.push([]);
      node.riga = righe.length - 1;
      righe[righe.length - 1].push(node);
    });

    const colonne = { FRONTEND: 1, BACKEND: 1 };
    righe.forEach((riga) => Object.keys(colonne).forEach((side) => {
      colonne[side] = Math.max(colonne[side], riga.filter((n) => n.side === side).length);
    }));
    Object.entries(colonne).forEach(([side, n]) => { LANES[side].w = n * NODE_W + (n - 1) * COL_GAP + LANE_INNER * 2; });
    LANES.FRONTEND.x = PAD;
    LANES.BACKEND.x = PAD + LANES.FRONTEND.w + LANE_GAP;

    let y = HEADER_H + 24;
    righe.forEach((riga, r) => {
      const primo = riga[0];
      if (primo.section) {
        const extra = r === 0 ? 0 : 8;
        primo.sectionY = y + extra;
        y += SECTION_H + extra;
      }
      Object.keys(LANES).forEach((side) => {
        const qui = riga.filter((n) => n.side === side);
        const occupata = qui.length * NODE_W + (qui.length - 1) * COL_GAP;
        const inizio = LANES[side].x + (LANES[side].w - occupata) / 2;
        qui.forEach((node, c) => {
          node.x = inizio + c * (NODE_W + COL_GAP) + (NODE_W - larghezza(node)) / 2;
          node.y = y;
        });
      });
      y += Math.max(...riga.map((n) => n.h)) + GAP;
    });
    return y - GAP + 24;
  }

  // RENDER DIAGRAMMA
  // Ridisegnato da zero a ogni apertura di un riquadro; dopo, la selezione (e la luce degli indizi) si riapplica
  function renderDiagram() {
    document.querySelector('#diagram > svg')?.remove();
    const height = layout();
    const width = LANES.BACKEND.x + LANES.BACKEND.w + PAD;
    const svg = el('svg', { width, height, viewBox: `0 0 ${width} ${height}` });
    document.getElementById('diagram').appendChild(svg);

    const defs = el('defs', {}, svg);
    [['FRONTEND', cv('fe')], ['BACKEND', cv('be')], ['lost', cv('lost')], ['errore', cv('errore')], ['ok', cv('ok')], ['alternativa', cv('muted')], ['sel', cv('accent')]].forEach(([id, color]) => {
      const marker = el('marker', { id: `head-${id}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }, marker);
    });

    Object.entries(LANES).forEach(([side, lane]) => {
      el('rect', { x: lane.x, y: 0, width: lane.w, height, rx: 12, fill: lane.fill, 'fill-opacity': 0.25, stroke: lane.stroke, 'stroke-opacity': 0.35 }, svg);
      el('text', { x: lane.x + lane.w / 2, y: 30, 'text-anchor': 'middle', fill: lane.stroke, 'font-size': 15, 'font-weight': 800, 'letter-spacing': '.2em' }, svg).textContent = side;
    });

    FLOW.nodes.forEach((node) => {
      if (!node.section) return;
      el('line', { x1: PAD, y1: node.sectionY + 18, x2: width - PAD, y2: node.sectionY + 18, stroke: cv('border'), 'stroke-dasharray': '6 4' }, svg);
      const label = el('text', { x: width / 2, y: node.sectionY + 23, 'text-anchor': 'middle', fill: cv('text'), 'font-size': 13, 'font-weight': 700 }, svg);
      label.textContent = node.section.toUpperCase();
      const box = label.getBBox();
      el('rect', { x: box.x - 12, y: box.y - 4, width: box.width + 24, height: box.height + 8, rx: 6, fill: cv('bg'), stroke: cv('border') }, svg);
      svg.appendChild(label);
    });

    latiBivi();
    const linee = el('g', {}, svg);
    FLOW.nodes.forEach((node, i) => renderNode(svg, node, i));
    const etichette = el('g', {}, svg);
    etichettePosate = [];
    FLOW.edges.forEach((edge, k) => renderEdge(linee, edge, k, etichette));
    applicaSelezione();
    document.dispatchEvent(new Event('mappa-ridisegnata'));
  }

  // LATI DEI BIVI
  // Ogni uscita di un bivio parte da un vertice laterale: verso sinistra se la meta è a sinistra, a destra se è a destra;
  // le mete in colonna si dividono tra i due lati, così le due strade non partono mai dallo stesso punto
  function latiBivi() {
    FLOW.nodes.forEach((node, i) => {
      if (!isBivio(node)) return;
      const uscite = FLOW.edges.filter((e) => e.from === i);
      const cx = centerX(node);
      const usati = { sx: 0, dx: 0 };
      uscite.forEach((e) => {
        const tx = centerX(FLOW.nodes[e.to]);
        e.lato = tx < cx - 1 ? 'sx' : tx > cx + 1 ? 'dx' : null;
        if (e.lato) usati[e.lato] += 1;
      });
      uscite.filter((e) => !e.lato).forEach((e) => {
        e.lato = usati.dx <= usati.sx ? 'dx' : 'sx';
        usati[e.lato] += 1;
      });
      // Con due strade ognuna ha il suo vertice: mai "sì" e "no" dallo stesso lato, uno sopra l'altro
      if (uscite.length === 2 && uscite[0].lato === uscite[1].lato) {
        const [prima, seconda] = [...uscite].sort((a, b) => centerX(FLOW.nodes[a.to]) - centerX(FLOW.nodes[b.to]) || a.to - b.to);
        prima.lato = 'sx';
        seconda.lato = 'dx';
      }
      // Sul vertice c'è posto per una sola etichetta per lato: la prende la meta più vicina, le altre la mettono sul loro tratto
      ['sx', 'dx'].forEach((lato) => {
        const qui = uscite.filter((e) => e.lato === lato).sort((a, b) => Math.abs(centerX(FLOW.nodes[a.to]) - cx) - Math.abs(centerX(FLOW.nodes[b.to]) - cx));
        qui.forEach((e, n) => { e.primaDelLato = n === 0; });
      });
    });
  }

  // PERCORSO FRECCIA
  // Ogni freccia prova più strade ad angolo retto (diretta, con un gomito, lungo un corridoio libero) e prende la prima
  // che non attraversa un riquadro. Il corridoio è uno spazio vuoto verticale: il bordo di una corsia, lo spazio tra due colonne o tra le corsie
  const MARGINE_RIQ = 8;
  const rettangoli = () => FLOW.nodes.map((n, i) => ({ i, x1: n.x - MARGINE_RIQ, x2: n.x + larghezza(n) + MARGINE_RIQ, y1: n.y - MARGINE_RIQ, y2: n.y + n.h + MARGINE_RIQ }));

  function attraversa(punti, esclusi, rett) {
    for (let k = 0; k < punti.length - 1; k += 1) {
      const [ax, ay] = punti[k];
      const [bx, by] = punti[k + 1];
      const x1 = Math.min(ax, bx);
      const x2 = Math.max(ax, bx);
      const y1 = Math.min(ay, by);
      const y2 = Math.max(ay, by);
      if (rett.some((r) => !esclusi.includes(r.i) && x1 < r.x2 && x2 > r.x1 && y1 < r.y2 && y2 > r.y1)) return true;
    }
    return false;
  }

  function corridoi() {
    const xs = [LANES.FRONTEND.x + LANES.FRONTEND.w + LANE_GAP / 2];
    Object.values(LANES).forEach((l) => xs.push(l.x + LANE_INNER / 2, l.x + l.w - LANE_INNER / 2));
    FLOW.nodes.forEach((n) => xs.push(n.x - COL_GAP / 2, n.x + larghezza(n) + COL_GAP / 2));
    return [...new Set(xs.map(Math.round))];
  }

  // In un bivio la freccia dall'alto si ferma sul cerchio del numero, che sta sulla punta
  const arrivoDallAlto = (to) => (isBivio(to) ? to.y - 17 : to.y - 2);

  function percorso(from, to, edge) {
    const rett = rettangoli();
    const esclusi = [edge.from, edge.to];
    const vicini = (x) => corridoi().sort((a, b) => Math.abs(a - x) - Math.abs(b - x));
    const fw = larghezza(from);
    const tw = larghezza(to);
    const fx = centerX(from);
    const tx = centerX(to);
    const sopraMeta = to.y - GAP / 2;
    const candidati = [];

    if (isBivio(from)) {
      const s = edge.lato === 'sx' ? -1 : 1;
      const sx = fx + s * (BIVIO_W / 2);
      const sy = from.y + BIVIO_H / 2;
      const sotto = [tx, arrivoDallAlto(to)];
      // Stessa riga: dritta se è la vicina; se in mezzo c'è un altro riquadro, passa sopra la riga ed entra dall'alto
      if (to.riga === from.riga) {
        const su = Math.min(...FLOW.nodes.filter((n) => n.riga === from.riga).map((n) => n.y)) - GAP / 2;
        candidati.push([[sx, sy], [s > 0 ? to.x - 2 : to.x + tw + 2, sy]]);
        candidati.push([[sx, sy], [sx + s * 18, sy], [sx + s * 18, su], [tx, su], [tx, to.y - 2]]);
      }
      else if (to.riga > from.riga) {
        if (s * (tx - sx) > 24) candidati.push([[sx, sy], [tx, sy], sotto]);
        vicini(sx).filter((xc) => s * (xc - sx) > 0).forEach((xc) => candidati.push([[sx, sy], [xc, sy], [xc, sopraMeta], [tx, sopraMeta], sotto]));
      } else {
        const ey = to.y + Math.min(40, to.h / 2);
        vicini(sx).filter((xc) => s * (xc - sx) > 0).forEach((xc) => candidati.push([[sx, sy], [xc, sy], [xc, ey], [xc > tx ? to.x + tw + 2 : to.x - 2, ey]]));
      }
      const punti = scegli(candidati, esclusi, rett);
      return { punti, etichetta: edge.primaDelLato ? { x: sx + s * 10, y: sy - 14, ancora: s > 0 ? 'start' : 'end' } : null };
    }

    if (to.riga === from.riga) {
      const y0 = from.y + 40;
      const destra = tx > fx;
      candidati.push([[destra ? from.x + fw : from.x, y0], [destra ? to.x - 2 : to.x + tw + 2, y0]]);
      const su = Math.min(from.y, to.y) - GAP / 2;
      candidati.push([[fx, from.y], [fx, su], [tx, su], [tx, to.y - 2]]);
    } else if (to.riga > from.riga) {
      const inizio = [fx, from.y + from.h];
      const fine = [tx, arrivoDallAlto(to)];
      const sottoPartenza = from.y + from.h + GAP / 2;
      candidati.push(Math.abs(fx - tx) < 1 ? [inizio, fine] : [inizio, [fx, sopraMeta], [tx, sopraMeta], fine]);
      if (Math.abs(fx - tx) >= 1) candidati.push([inizio, [fx, sottoPartenza], [tx, sottoPartenza], fine]);
      vicini(fx).forEach((xc) => candidati.push([inizio, [fx, sottoPartenza], [xc, sottoPartenza], [xc, sopraMeta], [tx, sopraMeta], fine]));
    } else {
      // Un ritorno entra ed esce dalla parte bassa dei fianchi: in alto passano già le frecce orizzontali della riga
      const sy = from.y + Math.max(from.h - 22, from.h / 2);
      const ey = to.y + Math.max(to.h - 22, to.h / 2);
      vicini(Math.max(from.x + fw, to.x + tw)).forEach((xc) => {
        const daDestra = xc >= Math.max(from.x + fw, to.x + tw);
        const daSinistra = xc <= Math.min(from.x, to.x);
        if (daDestra) candidati.push([[from.x + fw, sy], [xc, sy], [xc, ey], [to.x + tw + 2, ey]]);
        if (daSinistra) candidati.push([[from.x, sy], [xc, sy], [xc, ey], [to.x - 2, ey]]);
      });
    }
    return { punti: scegli(candidati, esclusi, rett) };
  }

  const scegli = (candidati, esclusi, rett) => candidati.find((p) => !attraversa(p, esclusi, rett)) || candidati[0];

  // POSTO DELL'ETICHETTA
  // Sul tratto più lungo, provando prima gli orizzontali; se il posto copre un riquadro si prova il tratto dopo
  // Le etichette già messe contano come ostacoli: due etichette non si coprono
  let etichettePosate = [];

  function postoEtichetta(punti, larghezzaTesto) {
    const rett = [...rettangoli(), ...etichettePosate];
    const tratti = punti.slice(1).map((b, k) => ({ a: punti[k], b, lungo: Math.abs(b[0] - punti[k][0]) + Math.abs(b[1] - punti[k][1]) }))
      .sort((p, q) => (q.a[1] === q.b[1]) - (p.a[1] === p.b[1]) || q.lungo - p.lungo);
    const posti = tratti.flatMap(({ a, b }) => (a[1] === b[1]
      ? [0.5, 0.25, 0.75].map((t) => ({ x: a[0] + (b[0] - a[0]) * t, y: a[1] - 16 }))
      : [0.5, 0.3, 0.7].map((t) => ({ x: a[0], y: a[1] + (b[1] - a[1]) * t }))));
    const libero = posti.find((p) => !rett.some((r) => p.x + larghezzaTesto / 2 > r.x1 && p.x - larghezzaTesto / 2 < r.x2 && p.y + 10 > r.y1 && p.y - 10 < r.y2));
    return { ...(libero || posti[0]), ancora: 'middle' };
  }

  // RENDER FRECCIA
  // Colore e tratto dicono il tipo: normale (colore della corsia), ok (verde), errore (rosso), alternativa (grigio tratteggiato),
  // persa (rossa tratteggiata con la croce). Tra app e server l'etichetta dice anche il tipo di chiamata (HTTP, SOCKET…)
  const SIGLE_CHIAMATA = { http: 'HTTP', socket: 'SOCKET', navigation: 'NAVIGAZIONE', event: 'EVENTO', storage: 'MEMORIA', process: 'PROCESSO' };

  // Le linee vanno sotto i riquadri (se un tratto non trova strada, il riquadro lo copre); le etichette sopra, per restare leggibili
  const BREVE_BIVIO = 14;
  const breve = (testo) => {
    const t = String(testo || '').trim();
    const parola = t.match(/^(sì|si|no)(?!\p{L})/iu)?.[0];
    if (parola) return parola.toLowerCase();
    return t.length > BREVE_BIVIO ? `${t.slice(0, BREVE_BIVIO - 1).trim()}…` : t;
  };

  // "POST /auth/biometric/register-verify" diventa "POST register-verify"; una risposta "200 OK" diventa "200"
  const chiamataBreve = (call) => {
    const testo = String(call.label || '').trim();
    const metodo = testo.match(/^(GET|POST|PUT|PATCH|DELETE)\s+(\S+)/i);
    if (metodo) return `${metodo[1].toUpperCase()} ${metodo[2].split('?')[0].split('/').filter(Boolean).pop() || metodo[2]}`;
    return testo.match(/^\d{3}\b/)?.[0] || '';
  };

  function renderEdge(svg, edge, k, livelloEtichette) {
    const from = FLOW.nodes[edge.from];
    const to = FLOW.nodes[edge.to];
    const stile = {
      normale: { color: LANES[from.side].stroke, marker: from.side, dash: '' },
      ok: { color: cv('ok'), marker: 'ok', dash: '' },
      errore: { color: cv('errore'), marker: 'errore', dash: '' },
      alternativa: { color: cv('muted'), marker: 'alternativa', dash: '3 5' },
      persa: { color: cv('lost'), marker: 'lost', dash: '6 4' },
    }[edge.tipo] || { color: LANES[from.side].stroke, marker: from.side, dash: '' };
    const { punti, etichetta: postoBivio } = percorso(from, to, edge);
    const d = punti.map(([x, y], n) => `${n ? 'L' : 'M'}${x},${y}`).join(' ');
    const traLati = from.side !== to.side;

    const g = el('g', { class: `item edge${edge.tipo === 'errore' ? ' errore' : ''}`, 'data-i': edge.from, 'data-k': k }, svg);
    g.addEventListener('click', () => select(edge.from, k));
    el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 16 }, g);
    el('path', { class: 'edge-path', d, fill: 'none', stroke: stile.color, 'stroke-width': traLati || edge.tipo === 'errore' ? 2.5 : 2, 'stroke-dasharray': stile.dash, 'marker-end': `url(#head-${stile.marker})`, 'data-marker': stile.marker }, g);

    const sigla = traLati && edge.call?.kind && SIGLE_CHIAMATA[edge.call.kind];
    const status = String(edge.etichetta || '').match(/^\d{3}\b/)?.[0] || String(edge.call?.label || '').match(/^\d{3}\b/)?.[0];
    // Sulla freccia solo l'essenziale: la scelta di un bivio, lo status di un errore, la chiamata (POST register-verify, 200);
    // cosa passa (payload, body) e il testo intero si leggono cliccando la freccia
    const testo = edge.tipo === 'errore' ? `✕ ${status || 'errore'}`
      : isBivio(from) ? breve(edge.etichetta)
        : edge.call ? chiamataBreve(edge.call)
          : breve(edge.etichetta);
    const stima = (testo.length + (sigla ? sigla.length + 2 : 0)) * 7 + 16;
    const { x: lx, y: ly, ancora } = postoBivio || postoEtichetta(punti, stima);
    const sopra = el('g', { class: `item edge etichetta-freccia${edge.tipo === 'errore' ? ' errore' : ''}`, 'data-i': edge.from, 'data-k': k }, livelloEtichette);
    sopra.addEventListener('click', () => select(edge.from, k));
    let destra = lx;
    if (testo || sigla) {
      const etichetta = el('text', { x: lx, y: ly + 4, 'text-anchor': ancora, fill: edge.tipo === 'errore' ? cv('errore') : cv('text'), 'font-size': 12, 'font-weight': edge.tipo === 'errore' ? 700 : 400 }, sopra);
      if (sigla) {
        const tspan = el('tspan', { fill: stile.color, 'font-weight': 800, 'font-size': 10.5, 'letter-spacing': '.06em' }, etichetta);
        tspan.textContent = `${sigla}${testo ? '  ' : ''}`;
      }
      if (testo) etichetta.appendChild(document.createTextNode(testo));
      const box = etichetta.getBBox();
      etichettePosate.push({ i: -1, x1: box.x - 12, x2: box.x + box.width + 12, y1: box.y - 7, y2: box.y + box.height + 7 });
      el('rect', { class: 'edge-label', x: box.x - 8, y: box.y - 3, width: box.width + 16, height: box.height + 6, rx: 10, stroke: edge.tipo === 'errore' ? cv('errore') : cv('border') }, sopra);
      sopra.appendChild(etichetta);
      destra = box.x + box.width + 8;
    }

    if (edge.tipo === 'persa') {
      const crossX = destra + 18;
      el('path', { d: `M${crossX - 7},${ly - 7} l14,14 M${crossX - 7},${ly + 7} l14,-14`, stroke: cv('lost'), 'stroke-width': 3 }, sopra);
    }
  }

  // RENDER NODO
  function renderNode(svg, node, i) {
    const x = node.x;
    const g = el('g', { class: `item${isBivio(node) ? ' bivio' : ''}`, 'data-i': i }, svg);
    // Un riquadro non selezionato si seleziona e si apre (se è chiuso); si chiude solo cliccandolo quando è già selezionato
    g.addEventListener('click', (e) => {
      if (e.target.closest('a.code-link')) return;
      const giaSelezionato = state.selected === i && state.edge === null;
      if (!giaSelezionato) select(i);
      if (giaSelezionato || !node.open) apriChiudi(i);
    });
    const color = node.inErrore ? cv('errore') : LANES[node.side].stroke;

    // FINE: una pillola con l'esito (es. "Accesso effettuato"); chiude quella parte di flusso.
    // Verde se il flusso riesce, rossa se chiude un ramo di errore (anche quando l'errore viene mostrato bene)
    if (isFine(node)) {
      const esito = node.inErrore ? cv('errore') : cv('ok');
      el('rect', { class: 'terminale', x, y: node.y, width: FINE_W, height: FINE_H, rx: FINE_H / 2, fill: node.inErrore ? 'rgba(255, 107, 94, .14)' : 'rgba(63, 185, 80, .16)', stroke: esito, 'stroke-width': 2 }, g);
      const fo = el('foreignObject', { x: x + 22, y: node.y, width: FINE_W - 44, height: FINE_H }, g);
      const wrap = document.createElementNS(XHTML_NS, 'div');
      wrap.className = `esito${node.inErrore ? ' in-errore' : ''}`;
      wrap.innerHTML = `<span>${node.inErrore ? '&#x2715;' : '&#x2713;'}</span>${fmt(node.action || node.element || 'Fine')}`;
      fo.appendChild(wrap);
      el('circle', { cx: x, cy: node.y, r: 15, fill: cv('bg'), stroke: esito, 'stroke-width': 2 }, g);
      el('text', { x, y: node.y + 4, 'text-anchor': 'middle', fill: esito, 'font-size': 11, 'font-weight': 700 }, g).textContent = `D${node.number}`;
      return;
    }

    // BIVIO: un rombo con la domanda; le frecce che escono dicono le risposte
    if (isBivio(node)) {
      const cx = x + BIVIO_W / 2;
      const cy = node.y + BIVIO_H / 2;
      el('polygon', { class: 'rombo', points: `${cx},${node.y} ${x + BIVIO_W},${cy} ${cx},${node.y + BIVIO_H} ${x},${cy}`, fill: cv('surface'), stroke: color, 'stroke-width': 2 }, g);
      const fo = el('foreignObject', { x: x + BIVIO_W * 0.18, y: node.y + BIVIO_H * 0.2, width: BIVIO_W * 0.64, height: BIVIO_H * 0.6 }, g);
      const wrap = document.createElementNS(XHTML_NS, 'div');
      wrap.className = 'domanda';
      wrap.innerHTML = `<span class="tipo-bivio">BIVIO</span>${fmt(node.domanda || node.action || node.element || '')}`;
      fo.appendChild(wrap);
      el('circle', { cx, cy: node.y, r: 15, fill: cv('bg'), stroke: color, 'stroke-width': 2 }, g);
      el('text', { x: cx, y: node.y + 4, 'text-anchor': 'middle', fill: color, 'font-size': 11, 'font-weight': 700 }, g).textContent = `D${node.number}`;
      return;
    }

    const fo = el('foreignObject', { x, y: node.y, width: NODE_W, height: node.h }, g);
    const wrap = document.createElementNS(XHTML_NS, 'div');
    wrap.style.height = '100%';
    wrap.innerHTML = contenutoNodo(node, node.p);
    fo.appendChild(wrap);

    el('circle', { cx: x, cy: node.y, r: 15, fill: cv('bg'), stroke: color, 'stroke-width': 2 }, g);
    el('text', { x, y: node.y + 4, 'text-anchor': 'middle', fill: color, 'font-size': 11, 'font-weight': 700 }, g).textContent = `D${node.number}`;
  }

  const isShortList = (v) => Array.isArray(v) && v.length <= 4 && v.every((item) => item === null || typeof item !== 'object');
  const leafText = (v) => (v === undefined ? 'undefined' : JSON.stringify(v));

  // Larghezza di un carattere del font monospace: serve ad allineare le note (in font normale) al codice
  const MONO_CH = (() => {
    const probe = document.createElement('span');
    probe.style.cssText = 'position: absolute; visibility: hidden; font: 12.5px ui-monospace, Consolas, monospace';
    probe.textContent = '0'.repeat(20);
    document.body.appendChild(probe);
    const width = probe.getBoundingClientRect().width / 20;
    probe.remove();
    return width;
  })();

  // APPIATTIMENTO PER DIFF
  function flatten(raw, path = '', out = {}) {
    const v = raw === '__undefined__' ? undefined : raw;
    if (isShortList(v)) {
      out[path] = JSON.stringify(v);
    } else if (Array.isArray(v)) {
      out[path] = '[]';
      v.forEach((item, i) => flatten(item, `${path}[${i}]`, out));
    } else if (v && typeof v === 'object') {
      out[path] = '{}';
      Object.entries(v).forEach(([k, item]) => flatten(item, path ? `${path}.${k}` : k, out));
    } else {
      out[path] = leafText(v);
    }
    return out;
  }

  // RENDER OGGETTO
  function renderObject(value, fields, prevFlat = null, showNotes = true) {
    const lines = [];
    const diffClass = (diffPath, current) => {
      if (!prevFlat) return '';
      if (!(diffPath in prevFlat)) return 'added';
      return prevFlat[diffPath] !== current ? 'changed' : '';
    };
    const noted = new Set();
    const noteFor = (path) => {
      if (!(path in fields) || noted.has(path)) return '';
      noted.add(path);
      return fields[path];
    };
    const primitive = (v) => {
      if (typeof v === 'string') return `<span class="s">${esc(JSON.stringify(v))}</span>`;
      if (typeof v === 'number') return `<span class="n">${v}</span>`;
      return `<span class="b">${v}</span>`;
    };

    // path: con [] per le note in fields; diffPath: con [indice] per il confronto col passo precedente
    const walk = (raw, path, diffPath, depth, key, comma) => {
      // JSON non può contenere undefined: nei dati si scrive "__undefined__"
      const v = raw === '__undefined__' ? undefined : raw;
      const pad = '  '.repeat(depth);
      const keyHtml = key !== null ? `<span class="k">${esc(key)}</span>: ` : '';
      const tail = comma ? ',' : '';

      if (isShortList(v)) {
        const cls = diffClass(diffPath, JSON.stringify(v));
        lines.push({ html: `${pad}${keyHtml}[${v.map(primitive).join(', ')}]${tail}`, note: noteFor(path), cls, diffPath });
        return;
      }

      if (Array.isArray(v) || (v && typeof v === 'object')) {
        const isArray = Array.isArray(v);
        const entries = isArray ? v.map((item) => [null, item]) : Object.entries(v);
        const cls = diffClass(diffPath, isArray ? '[]' : '{}');
        lines.push({ html: pad + keyHtml + (isArray ? '[' : '{'), note: noteFor(path), cls, diffPath });
        entries.forEach(([k, item], idx) => {
          const childPath = isArray ? `${path}[]` : (path ? `${path}.${k}` : k);
          const childDiffPath = isArray ? `${diffPath}[${idx}]` : (diffPath ? `${diffPath}.${k}` : k);
          walk(item, childPath, childDiffPath, depth + 1, k, idx < entries.length - 1);
        });
        lines.push({ html: pad + (isArray ? ']' : '}') + tail, note: '', cls: cls === 'added' ? 'added' : '' });
        return;
      }

      const cls = diffClass(diffPath, leafText(v));
      lines.push({ html: pad + keyHtml + primitive(v) + tail, note: noteFor(path), cls, diffPath });
    };

    walk(value, '', '', 0, null, false);

    if (prevFlat) {
      const currentFlat = flatten(value);
      const removed = Object.keys(prevFlat).filter((p) => p && !(p in currentFlat));
      removed
        .filter((p) => !removed.some((other) => other !== p && (p.startsWith(`${other}.`) || p.startsWith(`${other}[`))))
        .forEach((p) => lines.push({ html: `${esc(p)}: ${esc(prevFlat[p])}`, note: 'rimosso', cls: 'removed' }));
      lines.forEach((l) => {
        if (l.cls === 'changed' && !l.note) l.note = `prima: ${prevFlat[l.diffPath]}`;
      });
    }

    return lines
      .map((l) => {
        const indent = l.html.match(/^ */)[0];
        const note = showNotes && l.note
          ? `<div class="row"><span class="note" style="padding-left: calc(12px + ${indent.length * MONO_CH}px)">${esc(l.note)}</span></div>`
          : '';
        return `${note}<div class="row ${l.cls || ''}"><span class="code">${l.html}</span></div>`;
      })
      .join('');
  }

  // RENDER OGGETTI TRACCIATI
  function renderTrackedCard(tracked) {
    const header = `<h2>${fmt(tracked.name)}</h2>`;
    if (state.selected === null) return `<div class="tracked-card">${header}</div>`;

    let current;
    let previous;
    let changedAt = -1;
    let hasCurrent = false;
    let hasPrevious = false;
    for (let j = 0; j <= state.selected; j += 1) {
      const states = FLOW.nodes[j].state;
      if (!states || !(tracked.id in states)) continue;
      if (hasCurrent) {
        previous = current;
        hasPrevious = true;
      }
      current = states[tracked.id];
      hasCurrent = true;
      changedAt = j;
    }

    if (!hasCurrent) return `<div class="tracked-card">${header}</div>`;

    const prevFlat = changedAt === state.selected && hasPrevious ? flatten(previous) : null;
    return `
      <div class="tracked-card">
        ${header}
        <div class="obj stacked">${renderObject(current, {}, prevFlat, false)}</div>
      </div>`;
  }

  function renderTracked() {
    const box = document.getElementById('tracked');
    const list = [].concat(FLOW.tracked || []);
    document.querySelector('main').classList.toggle('senza-oggetti', !list.length);
      if (!list.length) return;
    box.hidden = false;

    box.innerHTML = `
      <div class="diff-legend"><span><i class="mark added"></i>aggiunto</span><span><i class="mark changed"></i>cambiato</span><span><i class="mark removed"></i>rimosso</span></div>
      ${list.map(renderTrackedCard).join('')}`;
  }

  // RIEPILOGO
  // Si vede all'apertura e cliccando fuori: obiettivo, problema, cosa fare e file coinvolti
  function fileCoinvolti() {
    const perPercorso = new Map();
    FLOW.nodes.forEach((node) => {
      const chiave = node.path || node.file;
      if (!perPercorso.has(chiave)) perPercorso.set(chiave, { file: node.file, path: node.path, punti: [] });
      perPercorso.get(chiave).punti.push(`D${node.number}`);
    });
    return [...perPercorso.values()].map((f) => ({ ...f, role: f.punti.join(', ') }));
  }

  function riepilogoHtml() {
    const o = FLOW.overview || {};
    const files = o.files || fileCoinvolti();
    const sezione = (titolo, testo) => (testo ? `<h3>${titolo}</h3><p class="explanation">${fmt(testo)}</p>` : '');
    return `
      <span class="panel-tag">RIEPILOGO</span>
      <h2>${esc(FLOW.title)}</h2>
      ${(FLOW.avvisi || []).length ? `<div class="avvisi-mappa"><h3>&#x26A0; Avvisi · ${FLOW.avvisi.length}</h3><p class="route">La sala ha confrontato la mappa con il codice e qui qualcosa non torna: controlla questi punti prima di fidarti.</p><ul>${FLOW.avvisi.map((a) => `<li>${fmt(a)}</li>`).join('')}</ul></div>` : ''}
      ${sezione('Obiettivo', o.goal)}
      ${sezione('Problema', o.problem)}
      ${sezione('Cosa fare', o.todo)}
      <h3>File coinvolti</h3>
      <ul class="files">${files.map((f) => `<li>${codeLink(f, 1, `<b>${esc(f.file)}</b>`)}${f.role ? ` <span class="route">· ${fmt(f.role)}</span>` : ''}</li>`).join('')}</ul>
      ${(o.notes || []).length ? `<h3>Da sapere</h3><ul class="files">${o.notes.map((n) => `<li>${fmt(n)}</li>`).join('')}</ul>` : ''}
      <div class="azioni-mappa">
        <button type="button" data-azione="cartella" title="Apre la cartella con il file della mappa selezionato">Apri cartella</button>
        <button type="button" data-azione="elimina" title="Cancella il file della mappa dal PC">Elimina mappa</button>
      </div>`;
  }

  // RENDER PANNELLO
  const CALL_LABELS = {
    http: 'Chiamata HTTP al server',
    socket: 'Messaggio socket',
    navigation: 'Navigazione verso un\'altra schermata',
    function: 'Chiamata di funzione',
    event: 'Evento',
    storage: 'Lettura o scrittura nella memoria del dispositivo',
    process: 'Avvio di un altro programma',
  };

  function oggettoHtml(node) {
    const hasPayload = node.payload !== null && node.payload !== undefined;
    return hasPayload
      ? `<div class="obj stacked">${renderObject(node.payload, node.fields || {})}</div>`
      : `<p class="hint">${node.payloadName ? `${esc(node.payloadName)}: nessun oggetto` : 'Non passa nessun oggetto.'}</p>`;
  }

  // PANNELLO FRECCIA
  // Che tipo di passaggio è (chiamata HTTP, navigazione, funzione…) e cosa trasporta
  const NOMI_USCITA = { ok: 'Strada giusta', errore: 'Strada di errore', alternativa: 'Strada alternativa', persa: 'Non arriva' };

  function renderEdgePanel(panel) {
    const edge = FLOW.edges[state.edge];
    const from = FLOW.nodes[edge.from];
    const to = FLOW.nodes[edge.to];
    const call = edge.call;
    const dentro = from.side === 'FRONTEND' ? 'dentro l\'app' : 'dentro il server';
    const tipo = call
      ? (CALL_LABELS[call.kind] || call.kind)
      : (from.side !== to.side ? 'Passaggio tra app e server' : `Passaggio ${dentro}`);
    const uscita = NOMI_USCITA[edge.tipo];

    panel.innerHTML = `
      <span class="panel-tag ${from.side}">${from.side}</span> &rarr; <span class="panel-tag ${to.side}">${to.side}</span>
      <h2>D${from.number} &rarr; D${to.number}</h2>
      <p class="route">${esc(from.element || from.file)} &rarr; ${esc(to.element || to.file)}${edge.tipo === 'persa' ? ' — <b style="color: var(--lost)">non arriva</b>' : ''}</p>
      ${uscita ? `<p><span class="call-kind uscita-${edge.tipo}">${uscita}</span>${edge.etichetta ? ` ${fmt(edge.etichetta)}` : ''}</p>` : ''}
      ${edge.riga && from.path ? `<p class="route">Parte da ${linkPercorso(from.path, edge.riga, `<code>${esc(from.file || from.path.split('/').pop())}:${edge.riga}</code>`)}</p>` : ''}
      <h3>Cosa succede su questa freccia</h3>
      <p><span class="call-kind">${esc(tipo)}</span></p>
      ${call?.label ? `<p><code>${highlight(call.label)}</code></p>` : ''}
      ${call?.note ? `<p class="explanation">${fmt(call.note)}</p>` : ''}
      ${call ? '' : '<p class="hint">Per questa freccia la mappa non indica una chiamata: il dato passa e basta.</p>'}
      <h3>Cosa passa · ${esc(edge.payloadName || 'oggetto')}</h3>
      ${oggettoHtml(edge)}`;
  }

  function renderPanel() {
    const panel = document.getElementById('panel');

    if (state.selected === null) {
      panel.innerHTML = riepilogoHtml();
      return;
    }

    if (state.edge !== null) {
      renderEdgePanel(panel);
      return;
    }

    const node = FLOW.nodes[state.selected];
    const uscite = FLOW.edges.filter((e) => e.from === state.selected);
    const hasPayload = node.payload !== null && node.payload !== undefined;
    const destination = uscite.length
      ? uscite.map((e) => {
        const to = FLOW.nodes[e.to];
        const etichetta = NOMI_USCITA[e.tipo] && e.tipo !== 'persa' ? `<span class="call-kind uscita-${e.tipo}">${e.etichetta ? esc(e.etichetta) : NOMI_USCITA[e.tipo]}</span> ` : '';
        return `<p class="route">${etichetta}passa a: <span class="panel-tag ${to.side}">${to.side}</span> D${to.number} ${esc(to.element || to.file)}${e.tipo === 'persa' ? ' — <b style="color: var(--lost)">non arriva</b>' : ''}</p>`;
      }).join('')
      : '<p class="route">ultimo passo di questo flusso</p>';

    const section = (title, text) => (text ? `<h3>${title}</h3><p class="explanation">${fmt(text)}</p>` : '');
    const terms = Object.entries(node.terms || {});
    const termsHtml = terms.length
      ? `<h3>Termini</h3><dl class="terms">${terms.map(([term, meaning]) => `<dt>${fmt(term)}</dt><dd>${fmt(meaning)}</dd>`).join('')}</dl>`
      : '';

    panel.innerHTML = `
      <span class="panel-tag ${node.side}">${node.side}</span>
      <h2>D${node.number}. ${codeLink(node, node.line, esc(node.element || node.file))}${node.element ? ` ${codeLink(node, 1, `<span class="route">${esc(node.file)}</span>`)}` : ''}</h2>
      ${section('Cosa succede fisicamente', node.physical)}
      ${section('Spiegazione semplice', node.simple)}
      ${section('Cosa fa', node.does || node.explanation)}
      ${section('A cosa serve', node.purpose)}
      ${section('Riceve', node.receives)}
      ${section('Restituisce', node.returns)}
      <h3>${hasPayload ? `Cosa passa al passo successivo · ${esc(node.payloadName || 'oggetto')}` : 'Cosa passa al passo successivo'}</h3>
      ${destination}
      ${oggettoHtml(node)}
      ${termsHtml}`;
  }

  // SELEZIONE E NAVIGAZIONE
  // Con una freccia selezionata, state.edge è il suo indice in FLOW.edges e state.selected il passo da cui esce
  function applicaSelezione() {
    const i = state.selected;
    document.querySelectorAll('.item').forEach((g) => {
      const gi = Number(g.dataset.i);
      const isEdge = g.classList.contains('edge');
      const isSelected = i !== null && (isEdge ? state.edge !== null && Number(g.dataset.k) === state.edge : gi === i && state.edge === null);
      g.classList.toggle('sel', isSelected);
      g.classList.toggle('dim', state.stepMode && i !== null && gi > i);
      const edge = g.querySelector('.edge-path');
      if (edge) edge.setAttribute('marker-end', `url(#head-${isSelected ? 'sel' : edge.dataset.marker})`);
    });
  }

  function select(i, freccia = null) {
    state.selected = i;
    state.edge = i === null ? null : freccia;
    applicaSelezione();
    renderPanel();
    renderTracked();
  }

  function move(delta) {
    const current = state.selected === null ? -1 : state.selected;
    const next = Math.min(Math.max(current + delta, 0), FLOW.nodes.length - 1);
    select(next);
    document.querySelector(`.item[data-i="${next}"] foreignObject`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('title').textContent = FLOW.title;
  document.getElementById('subtitle').textContent = FLOW.subtitle || '';
  // Cliccando fuori da riquadri e frecce torna il riepilogo
  document.getElementById('diagram').addEventListener('click', (e) => {
    if (!e.target.closest('.item, #tracked')) select(null);
  });
  document.getElementById('mode').addEventListener('click', (e) => {
    state.stepMode = !state.stepMode;
    e.currentTarget.setAttribute('aria-pressed', state.stepMode);
    select(state.selected, state.edge);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      move(1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      move(-1);
    }
    if (e.key === 'Escape') select(null);
  });

  misuraAltezze();
  renderDiagram();
  renderPanel();
  renderTracked();

  // Apertura diretta su un passo: file.html#D3 (o #passo-3)
  const fromHash = location.hash.match(/^#(?:D|passo-)(\d+)$/i);
  if (fromHash) {
    const target = Number(fromHash[1]) - 1;
    if (target >= 0 && target < FLOW.nodes.length) select(target);
  }
</script>
<script>
  // NAVIGAZIONE MAPPA
  // Trascinando la mappa si scorre; con i pulsanti − + o Ctrl + rotella si ingrandisce e si riduce
  (() => {
    const area = document.querySelector('#diagram');
    const MIN = 0.4;
    const MAX = 2.5;
    const PASSO = 1.2;
    const SOGLIA = 4;
    let zoom = 1;
    let trascinato = false;

    function impostaZoom(valore, cx, cy) {
      const nuovo = Math.min(MAX, Math.max(MIN, valore));
      const box = area.getBoundingClientRect();
      const px = (cx ?? box.left + box.width / 2) - box.left;
      const py = (cy ?? box.top + box.height / 2) - box.top;
      // Il bordo vuoto del foglio non si ingrandisce: si toglie prima del calcolo e si rimette dopo
      const { bordoX, bordoY } = bordoFoglio();
      const fx = (area.scrollLeft + px - bordoX) / zoom;
      const fy = (area.scrollTop + py - bordoY) / zoom;
      zoom = nuovo;
      area.style.setProperty('--zoom', zoom);
      // Il punto sotto il puntatore resta fermo mentre la mappa cambia dimensione
      area.scrollLeft = fx * zoom + bordoX - px;
      area.scrollTop = fy * zoom + bordoY - py;
    }

    // All'apertura la mappa sta al centro in orizzontale e con l'inizio in alto
    function centra() {
      const svg = area.querySelector('svg');
      if (!svg) return;
      const { bordoX, bordoY } = bordoFoglio();
      area.scrollLeft = bordoX + (svg.getBoundingClientRect().width - area.clientWidth) / 2;
      area.scrollTop = bordoY - 16;
    }

    // BORDO DEL FOGLIO
    // Distanza tra l'inizio dell'area scorrevole e il foglio, misurata a schermo (il margine CSS è alterato dallo zoom)
    function bordoFoglio() {
      const svg = area.querySelector('svg');
      if (!svg) return { bordoX: 0, bordoY: 0 };
      const a = area.getBoundingClientRect();
      const s = svg.getBoundingClientRect();
      return { bordoX: s.left - a.left + area.scrollLeft, bordoY: s.top - a.top + area.scrollTop };
    }
    requestAnimationFrame(centra);

    area.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      impostaZoom(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });

    // TRASCINAMENTO MAPPA
    // Sotto la soglia è un clic (seleziona); oltre, la mappa segue il puntatore e il clic finale viene ignorato
    area.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('a, button, input, textarea')) return;
      trascinato = false;
      const x0 = e.clientX;
      const y0 = e.clientY;
      const sl = area.scrollLeft;
      const st = area.scrollTop;
      let preso = false;

      const muovi = (ev) => {
        if (!preso && Math.hypot(ev.clientX - x0, ev.clientY - y0) < SOGLIA) return;
        if (!preso) {
          preso = true;
          area.setPointerCapture(e.pointerId);
          area.classList.add('panning');
        }
        area.scrollLeft = sl - (ev.clientX - x0);
        area.scrollTop = st - (ev.clientY - y0);
      };
      const lascia = () => {
        area.removeEventListener('pointermove', muovi);
        area.classList.remove('panning');
        trascinato = preso;
      };
      area.addEventListener('pointermove', muovi);
      area.addEventListener('pointerup', lascia, { once: true });
      area.addEventListener('pointercancel', lascia, { once: true });
    });
    area.addEventListener('click', (e) => {
      if (!trascinato) return;
      trascinato = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);
  })();

  // SEZIONI APRIBILI
  // Ogni titolo del pannello di destra apre e chiude la sua sezione; una sezione chiusa resta chiusa anche cambiando selezione
  (() => {
    const panel = document.getElementById('panel');
    const chiuse = new Set();

    function rendiApribili() {
      panel.querySelectorAll(':scope > h3').forEach((h3) => {
        const sez = document.createElement('section');
        sez.className = 'sez';
        h3.before(sez);
        let nodo = h3;
        while (nodo && !(nodo !== h3 && (nodo.tagName === 'H3' || nodo.matches('.howto, .azioni-mappa')))) {
          const dopo = nodo.nextElementSibling;
          sez.appendChild(nodo);
          nodo = dopo;
        }
        const titolo = h3.textContent.split('·')[0].trim();
        sez.classList.toggle('chiusa', chiuse.has(titolo));
        h3.addEventListener('click', () => {
          const chiusa = sez.classList.toggle('chiusa');
          if (chiusa) chiuse.add(titolo);
          else chiuse.delete(titolo);
        });
      });
    }

    // Il pannello viene riscritto a ogni selezione: le sezioni si ricreano ogni volta
    new MutationObserver(() => {
      if (panel.querySelector(':scope > h3')) rendiApribili();
    }).observe(panel, { childList: true });
    rendiApribili();
  })();
</script>
<script>
  // Cosa la chat sa della mappa: i dati (senza posizioni e configurazione) e il passo selezionato
  const MAPPA_CHAT = {
    tipo: 'dati',
    dati: FLOW,
    // Gli indizi non vanno al Claude della chat: potrebbe svelare il punto prima che l'utente lo chieda
    mappa: () => ({ ...FLOW, chat: undefined, indizi: undefined, edges: undefined, nodes: FLOW.nodes.map(({ x, y, riga, sectionY, h, hOpen, hClosed, p, open, ...node }) => node) }),
    trova: (punto) => {
      const i = Number(String(punto).replace(/^D/i, '')) - 1;
      return [...document.querySelectorAll(`.item[data-i="${i}"]`)].find((g) => g.querySelector('foreignObject'));
    },
    selezione: () => {
      const node = FLOW.nodes[state.selected];
      if (!node) return null;
      if (state.edge !== null) {
        const edge = FLOW.edges[state.edge];
        return `freccia D${FLOW.nodes[edge.from].number} → D${FLOW.nodes[edge.to].number}${edge.etichetta ? ` [${edge.etichetta}]` : ''}${edge.call?.label ? ` (${edge.call.label})` : ''}`;
      }
      return `D${node.number} · ${node.element || node.file}${node.element ? ` (${node.file})` : ''}`;
    },
  };
</script>
<script>
  // CHAT DELLA MAPPA
  // Le domande vanno al server locale (~/.claude/shared/chat-mappa-server.js), che le passa a claude -p in sola lettura.
  (() => {
    const CONFIG = MAPPA_CHAT.dati.chat || {};
    const SERVER = `http://127.0.0.1:${CONFIG.port || 4517}`;
    const AVVIO = 'node "$HOME/.claude/shared/chat-mappa-server.js" --sfondo';
    const MAX_STORIA = 10;
    const storia = [];
    const $ = (id) => document.getElementById(id);
    let inAttesa = false;

    const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');

    // FORMATTAZIONE RISPOSTA
    // Markdown essenziale: blocchi di codice, `codice`, **grassetto**, elenchi puntati, paragrafi.
    function paragrafo(testo) {
      let html = '';
      let lista = [];
      const chiudiLista = () => {
        if (lista.length) html += `<ul>${lista.join('')}</ul>`;
        lista = [];
      };
      testo.split('\n').forEach((riga) => {
        const punto = riga.match(/^\s*[-*] (.*)/);
        if (punto) return lista.push(`<li>${inline(punto[1])}</li>`);
        chiudiLista();
        html += `${html && !html.endsWith('</ul>') ? '<br>' : ''}${inline(riga)}`;
      });
      chiudiLista();
      return `<div class="par">${html}</div>`;
    }

    const markdown = (testo) => esc(testo)
      .split(/```[\w-]*\n?([\s\S]*?)```/)
      .map((parte, i) => (i % 2
        ? `<pre><code>${parte.replace(/\n$/, '')}</code></pre>`
        : parte.split(/\n{2,}/).filter((p) => p.trim()).map(paragrafo).join('')))
      .join('');

    // CONSUMI
    // Token usati da Claude, restituiti dal server della chat: numeri veri, non stime
    const formatoToken = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1).replace('.', ',')}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
    const testoToken = (token, cache) => `<b class="tok-num">${formatoToken(token)}</b>${cache ? ` + <b class="tok-cache">${formatoToken(cache)}</b> da cache` : ''}`;
    const AIUTO_CONSUMI = 'Token di oggi, da mezzanotte (00:00) alle 23:59. I token da cache pesano molto meno.';

    function aggiungi(classe, html, contesto) {
      const msg = document.createElement('div');
      msg.className = `msg ${classe}`;
      msg.innerHTML = (contesto ? `<span class="ctx">su ${esc(contesto)}</span>` : '') + html;
      $('chat-log').appendChild(msg);
      $('chat-log').scrollTop = $('chat-log').scrollHeight;
      return msg;
    }


    function serverSpento() {
      const msg = aggiungi('errore', `La chat non risponde: il server locale è spento. Avvialo da un terminale con<br><code>${esc(AVVIO)}</code><br><button type="button">Copia comando</button>`);
      msg.querySelector('button').addEventListener('click', async () => {
        if (await copyText(AVVIO)) showToast('Comando copiato: incollalo in un terminale e riprova');
      });
    }

    // STATO SERVER
    async function controllaServer() {
      const dot = document.querySelector('#chat-open .dot');
      try {
        const res = await fetch(`${SERVER}/stato`);
        dot.classList.toggle('off', !res.ok);
      } catch {
        dot.classList.add('off');
      }
    }

    // CONTESTO TOLTO
    // La X vale finché non cambia la selezione: un clic qualsiasi sulla mappa non lo riaccende
    let tolto = false;
    let toltoSu = null;
    const senzaContesto = () => tolto && toltoSu === MAPPA_CHAT.selezione();

    function aggiornaContesto() {
      const selezione = MAPPA_CHAT.selezione();
      if (tolto && toltoSu !== selezione) tolto = false;
      const togli = '<button type="button" id="chat-ctx-togli" title="Non mandare a Claude né la selezione né la mappa">&#x2715;</button>';
      $('chat-ctx').classList.toggle('vuoto', tolto);
      $('chat-ctx').innerHTML = tolto ? '&nbsp;'
        : (selezione
          ? `Domanda su <b>${esc(selezione)}</b>`
          : 'Nessun elemento selezionato: la domanda riguarda tutta la mappa') + togli;
    }

    $('chat-ctx').addEventListener('click', (e) => {
      if (e.target.id !== 'chat-ctx-togli') return;
      tolto = true;
      toltoSu = MAPPA_CHAT.selezione();
      aggiornaContesto();
    });

    // ALTEZZA INPUT
    // Prima si azzera, altrimenti scrollHeight non cala quando cancelli righe
    function adattaInput() {
      const input = $('chat-input');
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight + input.offsetHeight - input.clientHeight}px`;
    }

    // INVIO DOMANDA
    async function invia(e) {
      e.preventDefault();
      const domanda = $('chat-input').value.trim();
      if (!domanda || inAttesa) return;
      if (!CONFIG.token || !CONFIG.project) {
        aggiungi('errore', 'Chat non configurata: in questa mappa mancano <code>chat.token</code> e <code>chat.project</code>. Chiedi a Claude di rigenerarla.');
        return;
      }

      const vuoto = senzaContesto();
      const selezione = vuoto ? null : MAPPA_CHAT.selezione();
      aggiungi('utente', paragrafo(esc(domanda)), selezione);
      $('chat-input').value = '';
      adattaInput();
      inAttesa = true;
      $('chat-send').disabled = true;
      $('chat-open').classList.add('pensa');
      const inizio = Date.now();
      const attesa = aggiungi('info', 'Sto pensando…');
      const timer = setInterval(() => {
        attesa.textContent = `Sto pensando… ${Math.round((Date.now() - inizio) / 1000)} s`;
      }, 1000);

      try {
        const res = await fetch(`${SERVER}/chiedi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: CONFIG.token,
            project: CONFIG.project,
            tipo: MAPPA_CHAT.tipo,
            titolo: MAPPA_CHAT.dati.title,
            mappa: vuoto ? '' : JSON.stringify(MAPPA_CHAT.mappa()),
            selezione,
            senzaContesto: vuoto,
            storia: storia.slice(-MAX_STORIA),
            domanda,
            modalita: $('chat-modo').value,
          }),
        });
        const corpo = await res.json();
        if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
        storia.push({ ruolo: 'utente', testo: selezione ? `[su ${selezione}] ${domanda}` : domanda }, { ruolo: 'claude', testo: corpo.risposta });
        aggiungi('claude', markdown(corpo.risposta));
        if (corpo.consumo) {
          const c = corpo.consumo;
          const t = corpo.giornata?.perFunzione?.['chat-mappa'];
          const totale = t ? `<span><span class="tok-chi">Chat delle mappe</span> · oggi: ${testoToken(t.token, t.cache)}</span>` : '';
          aggiungi('consumo', `<details><summary>TOKEN</summary><div class="dati"><span><span class="tok-chi">Questa risposta</span>: ${testoToken(c.input + c.scritti + c.output, c.cache)}</span>${totale}</div></details>`).title = AIUTO_CONSUMI;
        }
        if ($('chat').hidden) document.querySelector('#chat-open .dot').classList.add('pronta');
      } catch (err) {
        if (err instanceof TypeError) serverSpento();
        else aggiungi('errore', esc(err.message));
      } finally {
        clearInterval(timer);
        attesa.remove();
        inAttesa = false;
        $('chat-send').disabled = false;
        $('chat-open').classList.remove('pensa');
        controllaServer();
      }
    }

    // INDIZI
    // Graduali (prima la zona, poi il punto) e preparati dalla skill: dicono dove guardare, mai cosa cambiare
    const INDIZI = Array.isArray(MAPPA_CHAT.dati.indizi) ? MAPPA_CHAT.dati.indizi : [];
    let indiziUsati = 0;

    let luceAttiva = null;
    let ultimoIndizio = null;

    function illumina(indizio) {
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      const trovati = indizio.punti.map(MAPPA_CHAT.trova).filter(Boolean);
      trovati.forEach((el) => el.classList.add('luce'));
      if (trovati.length === 1) trovati[0].classList.add('luce-zoom');
      document.body.classList.add('con-indizio');
      return trovati;
    }

    function spegniLuce() {
      luceAttiva = null;
      document.querySelectorAll('.luce').forEach((el) => el.classList.remove('luce', 'luce-zoom'));
      document.body.classList.remove('con-indizio');
      $('riaccendi').hidden = !ultimoIndizio;
    }

    // LUCE DELL'INDIZIO
    // Si spegne cliccando fuori dai punti illuminati (la chat non conta); la lampadina in basso a destra la riaccende
    document.body.insertAdjacentHTML('beforeend', '<button type="button" id="riaccendi" title="Riaccendi l&#39;ultimo indizio" aria-label="Riaccendi l&#39;ultimo indizio" hidden>&#x1F4A1;</button>');
    $('riaccendi').addEventListener('click', () => ultimoIndizio && accendiLuce(ultimoIndizio));
    document.addEventListener('click', (e) => {
      // Un bottone della chat che si toglie da solo (es. "Sì, mostramelo") non è più nella pagina: non conta come clic fuori
      if (!luceAttiva || !e.target.isConnected || e.target.closest('#chat, #chat-open, #riaccendi, .luce')) return;
      spegniLuce();
    });

    // La mappa dati si ridisegna quando apri un riquadro: la luce va riaccesa sui riquadri nuovi
    document.addEventListener('mappa-ridisegnata', () => {
      if (luceAttiva) illumina(luceAttiva);
    });

    function accendiLuce(indizio) {
      luceAttiva = indizio;
      ultimoIndizio = indizio;
      $('riaccendi').hidden = true;
      const trovati = illumina(indizio);
      if (!trovati.length) return;
      // Nella mappa struttura si scorre il telefono intero: scorrere dentro lo schermo simulato lo sposterebbe
      (trovati[0].closest('.frame') || trovati[0]).scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
      setTimeout(() => liberaVista(trovati), 600);
    }

    // Se la chat copre i punti illuminati, si sposta sul lato opposto della finestra
    function liberaVista(trovati) {
      const chat = $('chat');
      if (chat.hidden) return;
      const c = chat.getBoundingClientRect();
      const coperto = trovati.some((el) => {
        const r = el.getBoundingClientRect();
        return r.left < c.right && r.right > c.left && r.top < c.bottom && r.bottom > c.top;
      });
      if (!coperto) return;
      const aDestra = c.left + c.width / 2 < window.innerWidth / 2;
      Object.assign(chat.style, {
        left: `${aDestra ? window.innerWidth - c.width - MARGINE : MARGINE}px`,
        top: `${c.top}px`,
        bottom: 'auto',
      });
      tieniDentro(chat);
      mascotteSottoChat();
    }

    function mostraIndizio(i) {
      const indizio = INDIZI[i];
      const tipo = indizio.punti.length > 1 ? 'zona' : 'punto';
      const msg = aggiungi('suggerimento', `<div class="par"><b>&#x1F4A1; Indizio ${i + 1} di ${INDIZI.length} · ${tipo}: ${esc(indizio.punti.join(', '))}</b><br>${inline(esc(indizio.testo))}</div><button type="button" data-rivedi>&#x1F4A1; Illumina di nuovo</button> <button type="button" data-spegni>Spegni la luce</button>`);
      msg.querySelector('[data-rivedi]').addEventListener('click', () => accendiLuce(indizio));
      msg.querySelector('[data-spegni]').addEventListener('click', spegniLuce);
      accendiLuce(indizio);
    }

    function chiediIndizio() {
      if ($('chat-log').querySelector('[data-conferma]')) return;
      if (indiziUsati >= INDIZI.length) {
        aggiungi('info', 'Indizi finiti: da qui il ragionamento è tuo. La soluzione la do solo se la chiedi esplicitamente nella chat di Claude Code.');
        return;
      }
      const n = indiziUsati + 1;
      const msg = aggiungi('suggerimento', `<div class="par" data-conferma>Vuoi l'indizio ${n} di ${INDIZI.length}? ${n === 1 ? 'Ti illumino la zona in cui guardare.' : 'Ti illumino il punto preciso.'} Non ti dirò cosa cambiare.</div><button type="button" data-si>Sì, mostramelo</button> <button type="button" data-no>No, ci provo ancora</button>`);
      msg.querySelector('[data-si]').addEventListener('click', () => {
        msg.remove();
        mostraIndizio(indiziUsati);
        indiziUsati += 1;
      }, { once: true });
      msg.querySelector('[data-no]').addEventListener('click', () => msg.remove(), { once: true });
    }

    $('chat-hint').hidden = INDIZI.length === 0;
    $('chat-hint').addEventListener('click', chiediIndizio);

    // AZIONI SULLA MAPPA
    // Apri cartella ed elimina passano dal server locale: la pagina da sola non può toccare i file
    const FILE_MAPPA = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1');
    let daConfermare = null;

    async function azioneMappa(azione) {
      const res = await fetch(`${SERVER}/${azione}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: CONFIG.token, file: FILE_MAPPA }),
      });
      const corpo = await res.json();
      if (!res.ok) throw new Error(corpo.errore || `errore ${res.status}`);
    }

    // Eliminare chiede un secondo clic entro 4 secondi
    $('panel').addEventListener('click', async (e) => {
      const bottone = e.target.closest('[data-azione]');
      if (!bottone) return;
      if (!CONFIG.token) {
        showToast('Questa mappa non è collegata al server locale: chiedi a Claude di rigenerarla');
        return;
      }
      const azione = bottone.dataset.azione;
      if (azione === 'elimina' && daConfermare !== bottone) {
        daConfermare = bottone;
        bottone.textContent = 'Sicuro? Clicca di nuovo';
        bottone.classList.add('pericolo');
        setTimeout(() => {
          if (daConfermare !== bottone) return;
          daConfermare = null;
          bottone.textContent = 'Elimina mappa';
          bottone.classList.remove('pericolo');
        }, 4000);
        return;
      }
      try {
        await azioneMappa(azione);
        if (azione === 'elimina') document.body.innerHTML = '<p class="eliminata">Mappa eliminata dal PC. Puoi chiudere questa scheda.</p>';
      } catch (err) {
        showToast(err instanceof TypeError ? `Il server locale è spento: avvialo con <code>${esc(AVVIO)}</code>` : esc(err.message));
      }
    });

    // MASCOTTE
    // Ogni carattere è un pixel: D contorno, P arancione, L riflesso, W bianco occhio, K pupilla e bocca, R guance
    const SPRITE = [
      '..DDDDDDDD..',
      '.DPPPPPPPPD.',
      'DPLLPPPPPPPD',
      'DPLPWWPPWWPD',
      'DPPPWKPPWKPD',
      'DPPPWKPPWKPD',
      'DPRPPPPPPRPD',
      'DPPPPKKKPPPD',
      '.DPPPPPPPPD.',
      '..DPDDDDDD..',
      '..DD........',
      '.DD.........',
    ];
    const PIXEL = { D: '#5c2414', P: '#d97757', L: '#f5c4ad', W: '#ffffff', K: '#2b130b', R: '#f9a8a0' };
    const pixel = (x, y, c) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PIXEL[c]}"/>`;
    // Sotto occhi e bocca va il colore del corpo: si vede quando cambia espressione
    const mobile = (x, y, c) => (y >= 3 && y <= 5 && 'WK'.includes(c)) || (y === 7 && c === 'K');
    const corpo = SPRITE.flatMap((riga, y) => [...riga].map((c, x) => (PIXEL[c] ? pixel(x, y, mobile(x, y, c) ? 'P' : c) : ''))).join('');
    const bocca = `<g class="bocca">${[5, 6, 7].map((x) => pixel(x, 7, 'K')).join('')}</g>`;
    // Occhi sgranati 3×3 con la pupilla al centro e bocca spalancata con la lingua
    const PAURA = [
      ...[3, 7].flatMap((x0) => [2, 3, 4].flatMap((y) => [0, 1, 2].map((dx) => [x0 + dx, y, y === 3 && dx === 1 ? 'K' : 'W']))),
      [5, 6, 'K'], [6, 6, 'K'], [7, 6, 'K'], [5, 7, 'K'], [6, 7, 'R'], [7, 7, 'K'], [5, 8, 'K'], [6, 8, 'K'], [7, 8, 'K'],
    ];
    const paura = `<g class="paura">${PAURA.map(([x, y, c]) => pixel(x, y, c)).join('')}</g>`;
    const occhio = (x0) => `<g class="eye">${[3, 4, 5].flatMap((y) => [x0, x0 + 1].map((x) => pixel(x, y, SPRITE[y][x]))).join('')}</g>`;
    // SPIRALE A PIXEL
    // Spirale 7×7 a mezzi pixel (3,5×3,5 pixel) centrata sul centro dell'occhio normale (x 5 e 9, y 4,5), così gira sul posto; ogni fotogramma la ruota di 90° in senso orario
    const SPIRALE = ['KKKKKKK', 'WWWWWWK', 'KKKKKWK', 'KWWWKWK', 'KWKKKWK', 'KWWWWWK', 'KKKKKKK'];
    const ruota = (x, y, volte) => (volte ? ruota(SPIRALE.length - 1 - y, x, volte - 1) : [x, y]);
    const mezzo = (x, y) => `<rect x="${x}" y="${y}" width=".5" height=".5" fill="${PIXEL.K}"/>`;
    const fondo = (x0, y0) => `<rect x="${x0}" y="${y0}" width="3.5" height="3.5" fill="${PIXEL.W}"/>`;
    const fotogramma = (x0, y0, volte) => SPIRALE.flatMap((riga, y) => [...riga].map((c, x) => {
      if (c !== 'K') return '';
      const [rx, ry] = ruota(x, y, volte);
      return mezzo(x0 + rx / 2, y0 + ry / 2);
    })).join('');
    const ipno = (centro) => { const x0 = centro - 1.75; const y0 = 2.75; return `<g class="ipno">${fondo(x0, y0)}${[0, 1, 2, 3].map((volte) => `<g class="giro" style="animation-delay: ${volte * 0.15}s">${fotogramma(x0, y0, volte)}</g>`).join('')}</g>`; };
    // DECORAZIONI DELLE MODALITÀ
    // Pixel fuori dal corpo (la tela va da -2 a 15 in orizzontale e da -4 a 11 in verticale): ognuna si vede solo nella sua modalità
    const COLORI_ACCESSORI = { o: '#141312', g: '#9b968a', A: '#a7afb8', a: '#5f6670', L: '#3d6fb6', P: '#f4f2ec', N: '#22252b', n: '#454b55', Y: '#f2c14e', K: '#2b130b', C: '#4b5563', T: '#2bb3a3', t: '#8fe3d8', S: '#111111', s: '#6b7280', M: '#f4f2ec', m: '#c9c4b8', B: '#6b3e26', V: '#e6e6e6' };
    const punti = (colore, coppie) => coppie.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${COLORI_ACCESSORI[colore]}"/>`).join('');
    const intervallo = (da, a, y) => Array.from({ length: a - da + 1 }, (_, i) => [da + i, y]);
    // Gli occhi sono larghi 2 pixel e distano 2 pixel: una montatura a pixel interi li coprirebbe, quindi è a linee sottili
    const OCCHIALI = `<g class="occhiali" fill="none" stroke="#2b130b" stroke-width=".35"><rect x="3.55" y="2.6" width="2.9" height="3.8" rx=".5"/><rect x="7.55" y="2.6" width="2.9" height="3.8" rx=".5"/><path d="M6.45 3.6h1.1M3.55 3.4h-1.3M10.45 3.4h1.3"/></g>`;
    const ACCESSORI = [
      // Insegnante: occhiali dorati e un libro aperto in mano, con la piega al centro
      `<g class="acc acc-insegnante"><g class="viso">${OCCHIALI}</g>${punti('P', [[11, 7], [12, 7], [14, 7], [15, 7], [11, 8], [12, 8], [14, 8], [15, 8], [11, 9], [12, 9], [14, 9], [15, 9]])}${punti('g', [[13, 7], [13, 8], [13, 9]])}${punti('m', [[12, 8], [15, 8]])}${punti('L', intervallo(11, 15, 10))}</g>`,
      // Traduttore: cuffie da interprete e microfono a lato, con il bordo scuro per staccarlo dal corpo
      `<g class="acc acc-traduttore">${punti('C', [...intervallo(3, 8, -2), [1, -1], [2, -1], [9, -1], [10, -1], [0, 0], [11, 0], [-1, 1], [12, 1], [-1, 2], [12, 2]])}${punti('T', [[-2, 3], [-2, 4], [-2, 5], [-1, 4], [-1, 5], [-1, 6], [-2, 6], [13, 3], [13, 4], [13, 5], [13, 6], [12, 4], [12, 5], [12, 6]])}${punti('t', [[-1, 3], [12, 3]])}${punti('o', [[-2, 7], [-1, 7], [-3, 8], [-3, 9], [0, 8], [0, 9]])}${punti('s', [[-2, 8], [-1, 8], [-2, 9], [-1, 9]])}${punti('V', [[-2, 8]])}${punti('N', [[-2, 10], [-1, 10], [-2, 11]])}</g>`,
      // Senior developer: occhiali da sole e un portatile davanti, visto dal dorso argentato con il logo
      `<g class="acc acc-senior"><g class="viso">${punti('S', [...intervallo(2, 10, 3), [3, 4], [4, 4], [5, 4], [7, 4], [8, 4], [9, 4], [4, 5], [8, 5]])}${punti('s', [[3, 3], [7, 3]])}</g>${punti('A', [...intervallo(11, 15, 5), [11, 6], [15, 6], [11, 7], [15, 7], ...intervallo(11, 15, 8)])}${punti('A', [...intervallo(12, 14, 6), ...intervallo(12, 14, 7)])}${punti('V', [[13, 6]])}${punti('a', intervallo(10, 15, 9))}${punti('n', intervallo(10, 15, 10))}</g>`,
    ].join('');
    // Stelline che compaiono intorno quando cambi modalità
    const stellina = (x, y) => punti('Y', [[x, y], [x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]);
    const SCINTILLE = `<g class="scintille">${stellina(-1, -2)}${stellina(14, -1)}${stellina(-1, 9)}${stellina(15, 6)}</g>`;
    $('chat-open').insertAdjacentHTML('afterbegin', `<svg class="sprite" viewBox="-2 -4 18 16" aria-hidden="true">${corpo}${occhio(4)}${occhio(8)}${bocca}${ipno(5)}${ipno(9)}${paura}${ACCESSORI}${SCINTILLE}</svg>`);

    // TRASCINAMENTO
    // Chat e mascotte sono incollate: la chat sta sempre sopra la mascotte e chi viene spostato si porta dietro l'altro
    const MARGINE = 8;
    const STACCO = 6;
    const SOGLIA = 4;

    const sposta = (el, left, top) => Object.assign(el.style, { left: `${left}px`, top: `${top}px`, bottom: 'auto' });

    function tieniDentro(el) {
      if (!el.style.top || el.hidden) return;
      const box = el.getBoundingClientRect();
      sposta(
        el,
        Math.min(Math.max(box.left, MARGINE), window.innerWidth - box.width - MARGINE),
        Math.min(Math.max(box.top, MARGINE), window.innerHeight - box.height - MARGINE),
      );
    }

    // La chat si mette sopra la mascotte; se sopra non c'è spazio scendono insieme
    function chatSopraMascotte() {
      const chat = $('chat');
      if (chat.hidden) return;
      const omino = $('chat-open').getBoundingClientRect();
      const left = Math.min(Math.max(omino.left, MARGINE), window.innerWidth - chat.offsetWidth - MARGINE);
      const top = Math.max(MARGINE, omino.top - chat.offsetHeight - STACCO);
      sposta(chat, left, top);
      sposta($('chat-open'), left, top + chat.offsetHeight + STACCO);
    }

    // La mascotte si mette sotto la chat; se sotto non c'è spazio salgono insieme
    function mascotteSottoChat() {
      const chat = $('chat');
      if (chat.hidden || !chat.style.top) return;
      const box = chat.getBoundingClientRect();
      const omino = $('chat-open');
      const sfora = box.bottom + STACCO + omino.offsetHeight - (window.innerHeight - MARGINE);
      const top = Math.max(MARGINE, box.top - Math.max(0, sfora));
      sposta(chat, box.left, top);
      sposta(omino, box.left, top + chat.offsetHeight + STACCO);
    }

    function rendiTrascinabile(el, maniglia, { mentreSposti, quandoLasci }) {
      maniglia.addEventListener('pointerdown', (e) => {
        const bottone = e.target.closest('button');
        if (e.button !== 0 || (bottone && bottone !== maniglia) || e.target.closest('select')) return;
        const box = el.getBoundingClientRect();
        const dx = e.clientX - box.left;
        const dy = e.clientY - box.top;
        let mosso = false;
        maniglia.setPointerCapture(e.pointerId);

        // Sotto la soglia è un clic, non un trascinamento
        const muovi = (ev) => {
          if (!mosso && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < SOGLIA) return;
          if (!mosso) {
            mosso = true;
            el.classList.add('dragging');
          }
          sposta(el, ev.clientX - dx, ev.clientY - dy);
          tieniDentro(el);
          mentreSposti();
        };
        const lascia = () => {
          maniglia.removeEventListener('pointermove', muovi);
          el.classList.remove('dragging');
          if (mosso) quandoLasci?.();
        };
        maniglia.addEventListener('pointermove', muovi);
        maniglia.addEventListener('pointerup', lascia, { once: true });
        maniglia.addEventListener('pointercancel', lascia, { once: true });
      });
    }

    // Dopo un trascinamento il browser manda comunque un clic: va ignorato
    let ignoraClic = false;
    $('chat-open').addEventListener('pointerdown', () => {
      ignoraClic = false;
    });
    rendiTrascinabile($('chat-open'), $('chat-open'), {
      mentreSposti: chatSopraMascotte,
      quandoLasci: () => {
        ignoraClic = true;
      },
    });
    rendiTrascinabile($('chat'), $('chat').querySelector('.chat-head'), { mentreSposti: mascotteSottoChat });
    $('chat').querySelector('.chat-head').addEventListener('dblclick', (e) => {
      if (e.target.closest('button')) return;
      Object.assign($('chat').style, { width: '', height: '' });
      chatSopraMascotte();
    });
    new ResizeObserver(mascotteSottoChat).observe($('chat'));
    window.addEventListener('resize', () => {
      tieniDentro($('chat-open'));
      chatSopraMascotte();
    });

    // APERTURA E COMANDI
    $('chat-open').addEventListener('click', () => {
      if (ignoraClic) {
        ignoraClic = false;
        return;
      }
      $('chat').hidden = !$('chat').hidden;
      if ($('chat').hidden) return;
      document.querySelector('#chat-open .dot').classList.remove('pronta');
      chatSopraMascotte();
      aggiornaContesto();
      controllaServer();
      $('chat-input').focus();
    });
    $('chat-close').addEventListener('click', () => {
      $('chat').hidden = true;
    });
    $('chat-clear').addEventListener('click', () => {
      storia.length = 0;
      $('chat-log').innerHTML = '';
    });
    $('chat-form').addEventListener('submit', invia);
    $('chat-input').addEventListener('input', adattaInput);
    // La modalità scelta resta anche nelle prossime pagine
    try {
      $('chat-modo').value = localStorage.getItem('chattino.modo') || 'normale';
    } catch {}
    if (!$('chat-modo').value) $('chat-modo').value = 'normale';
    // CAMBIO DECORAZIONI
    // Chattino salta e brilla; a metà salto si cambia d'abito, così il cambio non si vede
    let timerCambio;
    function cambiaDecorazioni(modo) {
      const omino = $('chat-open');
      clearTimeout(timerCambio);
      omino.classList.remove('cambia');
      void omino.offsetWidth;
      omino.classList.add('cambia');
      timerCambio = setTimeout(() => {
        omino.dataset.modo = modo;
        timerCambio = setTimeout(() => omino.classList.remove('cambia'), 400);
      }, 300);
    }
    $('chat-open').dataset.modo = $('chat-modo').value;
    $('chat-modo').addEventListener('change', () => {
      try {
        localStorage.setItem('chattino.modo', $('chat-modo').value);
      } catch {}
      cambiaDecorazioni($('chat-modo').value);
    });
    // I tasti scritti nella chat non devono muovere la selezione della mappa
    $('chat').addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') $('chat').hidden = true;
      if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-input') invia(e);
    });
    document.addEventListener('click', aggiornaContesto);
    document.addEventListener('keyup', aggiornaContesto);

    controllaServer();
  })();
</script>
</body>
</html>
