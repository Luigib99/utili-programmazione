<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramma flusso</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --fe: #3b82f6;
    --fe-bg: #0f2547;
    --be: #facc15;
    --be-bg: #3a3008;
    --lost: #f85149;
    --errore: #ff6b5e;
    --ok: #3fb950;
    --accent: #ffffff;
    --syn-var: #79c0ff;
    --syn-string: #a5d6ff;
    --syn-number: #ffa657;
    --syn-literal: #ff7b72;
    --syn-function: #d2a8ff;
    --syn-type: #56d4dd;
    --syn-file: #8b949e;
    --chat: #d97757;
    --chat-bg: #3d2219;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: 0;
    font-size: 18px;
  }

  .subtitle {
    margin: 2px 0 0;
    color: var(--muted);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    color: var(--muted);
    font-size: 12px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .swatch {
    width: 14px;
    height: 14px;
    border: 2px solid;
    border-radius: 3px;
  }

  .swatch-line {
    width: 22px;
    height: 0;
    border-top: 2px solid var(--muted);
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }

  button:hover {
    border-color: var(--muted);
  }

  button[aria-pressed="true"] {
    border-color: var(--accent);
  }

  main {
    display: grid;
    --col-sx: var(--larghezza-sinistra, 330px);
    --div-sx: 16px;
    --col-dx: var(--larghezza-pannello, 440px);
    --div-dx: 16px;
    grid-template-columns: var(--col-sx) var(--div-sx) minmax(0, 1fr) var(--div-dx) var(--col-dx);
    height: calc(100vh - 74px);
  }

  /* La mappa occupa quello che l'header lascia libero: l'header va a capo e cambia altezza, un valore fisso farebbe scorrere la pagina */
  @media (min-width: 901px) {
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    main {
      flex: 1;
      min-height: 0;
      height: auto;
      grid-template-rows: minmax(0, 1fr);
    }
  }

  #diagram {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    overflow: auto;
    padding: 16px;
  }

  #diagram {
    cursor: grab;
  }

  #diagram.panning {
    cursor: grabbing;
    user-select: none;
  }

  #diagram svg {
    display: block;
    flex: none;
  }

  /* Le due colonne laterali hanno posto fisso nella griglia: nascoste, la loro colonna va a 0 */
  #tracked, #riduci-sx { grid-column: 1; grid-row: 1; }
  #divisore-sx { grid-column: 2; grid-row: 1; }
  #diagram { grid-column: 3; grid-row: 1; }
  #divisore { grid-column: 4; grid-row: 1; }
  #panel, #riduci-dx { grid-column: 5; grid-row: 1; }

  /* TRATTINO PER RIDURRE: in alto a destra della colonna; ridotta, la colonna diventa una striscia con il tasto per riaprirla */
  .riduci {
    z-index: 2;
    align-self: start;
    justify-self: end;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin: 10px 10px 0 0;
    padding: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
  }

  .riduci:hover { color: var(--text); border-color: var(--muted); }

  .riduci .segno::before { content: ""; display: block; width: 10px; height: 2px; background: currentColor; }
  .riduci .nome { display: none; }

  main.senza-pannello #riduci-dx,
  main.senza-sinistra #riduci-sx {
    align-self: stretch;
    justify-self: stretch;
    flex-direction: column;
    justify-content: flex-start;
    gap: 14px;
    width: auto;
    height: auto;
    margin: 0;
    padding-top: 12px;
    border-radius: 0;
    border-width: 0 1px;
    background: var(--surface);
  }

  main.senza-pannello #riduci-dx .segno::before,
  main.senza-sinistra #riduci-sx .segno::before {
    width: 9px;
    height: 9px;
    background: none;
    border: 2px solid currentColor;
    border-radius: 2px;
  }

  main.senza-pannello #riduci-dx .nome,
  main.senza-sinistra #riduci-sx .nome {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    writing-mode: vertical-rl;
  }

  #tracked { padding-top: 44px !important; }

  #tracked {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: auto;
    padding: 16px;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }

  #tracked[hidden] {
    display: none;
  }

  .tracked-card {
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .tracked-card h2 {
    margin: 0;
    font-size: 15px;
  }

  .tracked-card .obj {
    margin-top: 10px;
  }

  .diff-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 0 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 4px;
    border-radius: 2px;
  }

  .mark.added,
  .obj .row.added > span {
    background: rgba(46, 160, 67, .28);
  }

  .mark.changed,
  .obj .row.changed > span {
    background: rgba(210, 153, 34, .3);
  }

  .mark.removed,
  .obj .row.removed > span {
    background: rgba(248, 81, 73, .25);
  }

  .obj .row.removed .code {
    text-decoration: line-through;
  }

  /* Una sola colonna: il commento sta sopra la riga che commenta */
  .obj.stacked {
    grid-template-columns: minmax(max-content, 1fr);
  }

  /* width 0 + min-width 100%: il commento va a capo invece di allargare la colonna */
  .obj .row > .note {
    width: 0;
    min-width: 100%;
    padding: 4px 12px 0;
    color: var(--muted);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11.5px;
    white-space: pre-wrap;
  }

/* PANNELLO DI DESTRA: largo quanto lo trascini; con "Dettagli" spento resta solo il diagramma */
  .divisore {
    position: relative;
    cursor: col-resize;
    touch-action: none;
  }

  .divisore::after {
    content: "";
    position: absolute;
    inset: 0 7px;
    border-radius: 2px;
    transition: background .15s;
  }

  .divisore:hover::after,
  .divisore.attivo::after {
    background: var(--muted);
  }

  main.senza-pannello {
    --col-dx: 34px;
    --div-dx: 0px;
  }

  main.senza-sinistra {
    --col-sx: 34px;
    --div-sx: 0px;
  }

  main.senza-oggetti {
    --col-sx: 0px;
    --div-sx: 0px;
  }

  main.senza-pannello #divisore,
  main.senza-pannello #panel,
  main.senza-sinistra #divisore-sx,
  main.senza-sinistra #tracked,
  main.senza-oggetti #divisore-sx,
  main.senza-oggetti #tracked {
    display: none;
  }

  main.senza-oggetti #riduci-sx {
    display: none;
  }

  #panel {
    overflow: auto;
    padding: 44px 20px 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }

  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      height: auto;
    }

    .divisore {
      display: none;
    }

    #tracked, #diagram, #panel {
      grid-column: auto;
      grid-row: auto;
    }

    .riduci {
      display: none !important;
    }

    #panel {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  svg text {
    font-family: inherit;
  }

  .item {
    cursor: pointer;
    transition: opacity .15s;
  }

  .item.dim {
    opacity: .15;
  }

  .node {
    width: 100%;
    height: 100%;
    padding: 8px 14px;
    border: 2px solid;
    border-radius: 10px;
    overflow: hidden;
  }

  .node.FRONTEND {
    background: var(--fe-bg);
    border-color: var(--fe);
  }

  .node.BACKEND {
    background: var(--be-bg);
    border-color: var(--be);
  }

  .item:hover .node {
    filter: brightness(1.25);
  }

  .item.sel .node {
    border-color: var(--accent);
  }

  .node .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
  }

  .node.FRONTEND .tag {
    color: var(--fe);
  }

  .node.BACKEND .tag {
    color: var(--be);
  }

  /* Passo raggiunto da una freccia di errore: si riconosce a colpo d'occhio */
  .node.in-errore {
    background: rgba(255, 107, 94, .12);
    border-color: var(--errore);
  }

  .node.in-errore .tag {
    color: var(--errore);
  }

  /* Funzione e file sulla stessa riga, stesso stile: se non ci stanno la riga finisce con "…" invece di andare a capo */
  .node .title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 14px;
    font-weight: 700;
  }

  .node .sep {
    margin: 0 6px;
    color: var(--muted);
  }

  a.code-link {
    min-width: 0;
    color: inherit;
    text-decoration: none;
  }

  a.code-link:hover {
    text-decoration: underline;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 10;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-size: 13px;
    text-align: center;
    transform: translateX(-50%);
  }

  #toast[hidden] {
    display: none;
  }

  #toast code {
    color: var(--syn-file);
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  /* Riquadro chiuso: frase semplice in grigio; aperto: versione tecnica */
  .node .breve {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .node .passi {
    margin: 6px 0 0;
    padding-left: 16px;
    font-size: 12.5px;
    line-height: 1.45;
  }

  .node .passi li {
    margin-bottom: 3px;
  }

  .node .passa {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
  }

  .node .toggle {
    float: right;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0;
  }

  .call-kind {
    display: inline-block;
    padding: 2px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-weight: 600;
  }

  .call-kind.uscita-ok { border-color: var(--ok); color: var(--ok); }
  .call-kind.uscita-errore { border-color: var(--errore); color: var(--errore); }
  .call-kind.uscita-alternativa { border-style: dashed; color: var(--muted); }

  /* BIVIO: rombo con la domanda al centro; le risposte sono sulle frecce che escono */
  .item.sel .terminale {
    stroke: var(--accent);
    stroke-width: 3;
  }

  .esito.in-errore { color: var(--errore); }

  .esito {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--ok);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
  }

  .item.sel .rombo {
    stroke: var(--accent);
    stroke-width: 3;
  }

  .domanda {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
  }

  .domanda .tipo-bivio {
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .12em;
  }

  .edge.errore .edge-label { stroke: var(--errore); }

  .swatch-rombo {
    width: 12px;
    height: 12px;
    border: 2px solid var(--muted);
    transform: rotate(45deg) scale(.8);
  }

  /* Il bordo vuoto per trascinare oltre i lati sta nel margine del foglio, non nel padding dell'area:
     un padding da 50vw renderebbe l'area più larga della sua colonna e farebbe scorrere tutta la pagina.
     Il margine è diviso per lo zoom perché lo zoom lo ingrandirebbe insieme al foglio */
  #diagram > svg {
    zoom: var(--zoom, 1);
    flex: none;
    margin: calc(50vh / var(--zoom, 1)) calc(50vw / var(--zoom, 1));
  }

  #diagram {
    padding: 0 !important;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .node .action {
    margin-top: 2px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
  }

  .edge-label {
    fill: var(--surface-2);
    stroke: var(--border);
  }

  .item.sel .edge-path {
    stroke: var(--accent);
    stroke-width: 3;
  }

  .panel-tag {
    display: inline-block;
    padding: 1px 8px;
    border: 1px solid;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }

  .panel-tag.FRONTEND {
    color: var(--fe);
    border-color: var(--fe);
  }

  .panel-tag.BACKEND {
    color: var(--be);
    border-color: var(--be);
  }

  #panel h2 {
    margin: 10px 0 4px;
    font-size: 17px;
  }

  #panel h3 {
    margin: 20px 0 8px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .route {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .explanation {
    margin: 0;
  }

  /* Colori del codice nei testi: stessi token dell'oggetto (.obj) */
  code .tk-var {
    color: var(--syn-var);
  }

  code .tk-string {
    color: var(--syn-string);
  }

  code .tk-number {
    color: var(--syn-number);
  }

  code .tk-literal {
    color: var(--syn-literal);
  }

  code .tk-function {
    color: var(--syn-function);
  }

  code .tk-type {
    color: var(--syn-type);
  }

  code .tk-file {
    color: var(--syn-file);
  }

  #panel code,
  .node code {
    padding: 0 4px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 12.5px ui-monospace, Consolas, monospace;
  }

  .terms {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    margin: 0;
    font-size: 13px;
  }

  .terms dt {
    font-weight: 600;
  }

  .terms dd {
    margin: 0;
    color: var(--muted);
  }

  .obj {
    display: grid;
    grid-template-columns: max-content minmax(120px, 1fr);
    overflow-x: auto;
    margin-top: 10px;
    padding: 12px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace;
  }

  .obj .row {
    display: contents;
  }

  .obj .code {
    padding: 2px 12px;
    white-space: pre;
  }

  .obj .row > .c {
    padding: 2px 12px 2px 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .obj .row:hover > span {
    background: var(--surface-2);
  }

  .obj .k {
    color: var(--syn-var);
  }

  .obj .s {
    color: var(--syn-string);
  }

  .obj .n {
    color: var(--syn-number);
  }

  .obj .b {
    color: var(--syn-literal);
  }

  .obj .c {
    color: #7ee787;
  }

  /* RIEPILOGO nel pannello di destra */
  .files {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
  }

  .files li {
    margin-bottom: 4px;
  }

  .howto {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .howto summary {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }

  /* Azioni sul file della mappa, in fondo al riepilogo */
  /* AVVISI: incongruenze tra mappa e codice trovate dalla sala dopo la generazione */
  .avvisi-mappa {
    margin: 14px 0;
    padding: 10px 14px;
    border: 1px solid #d29922;
    border-radius: 8px;
    background: rgba(210, 153, 34, .1);
  }

  .avvisi-mappa h3 { margin-top: 0; color: #e3b341; }
  .avvisi-mappa ul { margin: 6px 0 0; padding-left: 18px; }

  .azioni-mappa {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .azioni-mappa .pericolo {
    border-color: #f85149;
    color: #ffa198;
  }

  .eliminata {
    margin: 48px;
    color: var(--muted);
    font-size: 15px;
  }

  /* Sezioni del pannello di destra: il titolo le apre e le chiude */
  .sez > h3 {
    cursor: pointer;
    user-select: none;
  }

  .sez > h3::before {
    content: "▾";
    display: inline-block;
    width: 14px;
    transition: transform .15s;
  }

  .sez.chiusa > h3::before {
    transform: rotate(-90deg);
  }

  .sez.chiusa > :not(h3) {
    display: none;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
  }

  kbd {
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
  }
  /* CHAT DELLA MAPPA */
  /* Mascotte in pixel art: fluttua, sbatte gli occhi e saltella mentre aspetta la risposta */
  #chat-open {
    position: fixed;
    bottom: 14px;
    left: 18px;
    z-index: 21;
    width: 72px;
    height: 82px;
    padding: 0;
    background: none;
    border: 0;
  }

  #chat-open:hover {
    border: 0;
  }

  #chat-open,
  #chat-open .sprite {
    cursor: grab;
    touch-action: none;
  }

  #chat-open .sprite {
    display: block;
    width: 72px;
    height: 64px;
    margin: 0 auto;
    image-rendering: pixelated;
    shape-rendering: crispEdges;
    filter: drop-shadow(0 0 6px rgba(217, 119, 87, .6));
    animation: chat-float 2.6s ease-in-out infinite;
  }

  #chat-open:hover .sprite {
    animation: chat-float 2.6s ease-in-out infinite, chat-wiggle .4s ease-in-out 2;
  }

  #chat-open.pensa .sprite {
    animation: chat-hop .5s ease-in-out infinite;
  }

  #chat-open::after {
    content: "";
    display: block;
    width: 30px;
    height: 6px;
    margin: 6px auto 0;
    background: rgba(0, 0, 0, .55);
    border-radius: 50%;
    animation: chat-shadow 2.6s ease-in-out infinite;
  }

  #chat-open .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: chat-blink 4.5s infinite;
  }

  @keyframes chat-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes chat-shadow {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50% { transform: scaleX(.7); opacity: .5; }
  }

  @keyframes chat-wiggle {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -8deg; }
    75% { rotate: 8deg; }
  }

  @keyframes chat-hop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes chat-blink {

  <div id="divisore" class="divisore" title="Trascina per allargare o stringere il pannello · doppio clic per la larghezza iniziale"></div>

<script>
  // COLONNE LATERALI
  // Sinistra (oggetti seguiti) e destra (dettagli) si comportano allo stesso modo: si allargano trascinando il bordo
  // (doppio clic: larghezza iniziale) e si chiudono del tutto con il loro tasto in alto; le scelte restano nel browser
  (() => {
    const main = document.querySelector('main');
    const leggi = (chiave) => {
      try {
        return localStorage.getItem(chiave);
      } catch {
        return null;
      }
    };
    const scrivi = (chiave, valore) => {
      try {
        localStorage.setItem(chiave, valore);
      } catch {}
    };
    const COLONNE = [
      { tasto: 'riduci-dx', divisore: 'divisore', classe: 'senza-pannello', variabile: '--larghezza-pannello', chiave: 'mappa.pannello', misura: (x) => window.innerWidth - x },
      { tasto: 'riduci-sx', divisore: 'divisore-sx', classe: 'senza-sinistra', variabile: '--larghezza-sinistra', chiave: 'mappa.sinistra', misura: (x) => x - main.getBoundingClientRect().left },
    ];

    COLONNE.forEach((c) => {
      const tasto = document.getElementById(c.tasto);
      const divisore = document.getElementById(c.divisore);
      if (!tasto || !divisore) return;
      const allarga = (px) => {
        const larghezza = Math.round(Math.min(Math.max(px, 220), window.innerWidth * 0.6));
        main.style.setProperty(c.variabile, `${larghezza}px`);
        return larghezza;
      };
      const mostra = (visibile) => {
        main.classList.toggle(c.classe, !visibile);
        tasto.title = visibile ? 'Riduci' : 'Allarga';
        scrivi(c.chiave, visibile ? 'si' : 'no');
        window.dispatchEvent(new Event('resize'));
      };

      if (Number(leggi(`${c.chiave}.larghezza`))) allarga(Number(leggi(`${c.chiave}.larghezza`)));
      mostra(leggi(c.chiave) !== 'no');
      tasto.addEventListener('click', () => mostra(main.classList.contains(c.classe)));

      divisore.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        divisore.setPointerCapture(e.pointerId);
        divisore.classList.add('attivo');
        const sposta = (ev) => allarga(c.misura(ev.clientX));
        const lascia = (ev) => {
          divisore.removeEventListener('pointermove', sposta);
          divisore.removeEventListener('pointerup', lascia);
          divisore.classList.remove('attivo');
          scrivi(`${c.chiave}.larghezza`, String(allarga(c.misura(ev.clientX))));
          window.dispatchEvent(new Event('resize'));
        };
        divisore.addEventListener('pointermove', sposta);
        divisore.addEventListener('pointerup', lascia);
      });
      divisore.addEventListener('dblclick', () => {
        main.style.removeProperty(c.variabile);
        scrivi(`${c.chiave}.larghezza`, '');
        window.dispatchEvent(new Event('resize'));
      });
    });
  })();
</script>
